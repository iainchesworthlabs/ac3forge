# Windows leg of the CI lane partitions plan's reusable-workflow split
# (docs/ci-lanes.md) - the three Windows matrix.include entries
# _build.yml's `build` job used to carry (windows-msvc, windows-llvm,
# windows-msvc-arm64) plus windows-only follow-on steps (Crucible checks,
# the NSIS/Crucible packaging asserts), moved out so `_build.yml` can gate
# this whole platform on `run_windows` with a plain job-level `if:` -
# something it could not do while these legs were matrix entries of one
# job spanning three OSes (a job's `if:` cannot see the `matrix` context;
# see docs/ci-lanes.md's "What's gated today" for how that was confirmed).
#
# Called only from _build.yml, which still owns check-runners and
# toolchain-versions and forwards their outputs here as plain inputs -
# `needs:` cannot cross a workflow_call boundary the way it can between two
# jobs in the same file. Every step below is otherwise byte-for-byte the
# same as it was inline in _build.yml's `build` job: same names, same
# `if:` conditions (with `matrix.*`/`needs.toolchain-versions.outputs.*`
# rewritten to this workflow's own `matrix.*`/`inputs.*`, since those still
# exist here, just sourced differently), same run: bodies, same comments.
name: Reusable Build (Windows)

on:
  workflow_call:
    inputs:
      do_package:
        description: "Package every packageable leg (best-effort), not just windows-msvc. See _build.yml's own input of the same name."
        type: boolean
        default: false
      version_tag:
        type: string
        default: ""
      fetch_depth:
        type: number
        default: 1
      persist_quality_trend:
        type: boolean
        default: false
      llvm_version:
        description: "needs.toolchain-versions.outputs.llvm_version, at the _build.yml call site."
        type: string
        required: true
      llvm_windows_version:
        description: "needs.toolchain-versions.outputs.llvm_windows_version, at the _build.yml call site."
        type: string
        required: true
      msvc_toolset:
        type: string
        required: true
      cmake_min:
        type: string
        required: true
      qt_version:
        type: string
        required: true
      vcpkg_commit:
        type: string
        required: true
      windows_runner_1:
        description: "needs.check-runners.outputs.windows_runner_1, at the _build.yml call site (windows-msvc's runner-label JSON array)."
        type: string
        required: true
      windows_runner_2:
        description: "needs.check-runners.outputs.windows_runner_2 (windows-llvm's runner-label JSON array)."
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    # Fork PRs never reach self-hosted (check-runners' own fork-PR branch
    # already forces hosted labels for them) - this is belt-and-braces so a
    # gap in that logic can't silently hand a fork PR a self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(matrix.runner) }}
    # On a push to main, a leg on a GitHub-hosted runner keeps only the newest
    # main commit's run - docs/ci-lanes.md, "Only the newest main commit runs
    # the hosted jobs". That is the arm64 leg, plus any leg decide-runner sent
    # to its hosted fallback; its self-hosted labels always include
    # "self-hosted". Self-hosted legs and every other event get a group of
    # their own run, so they run for every commit as before.
    concurrency:
      group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(matrix.runner, 'self-hosted') && format('windows-main-{0}', matrix.name) || format('windows-run-{0}-{1}', github.run_id, matrix.name) }}
      cancel-in-progress: false
    # A backstop against GitHub's own 360-minute default: the macos-llvm
    # leg's first-ever GUI run hung in the Test step and silently consumed
    # the full 6 hours before being force-cancelled (see
    # apps/gui/tests/CMakeLists.txt's QSG_RENDER_LOOP comment for the
    # hypothesis and the per-test TIMEOUT that now also bounds that specific
    # case). This is deliberately generous - the slowest leg observed so far
    # (windows-llvm, packaging included on windows-msvc) is ~22 minutes - so
    # it should never fire for a legitimately slow-but-working run, only for
    # a genuine hang anywhere in the job, known or not-yet-known.
    timeout-minutes: 90
    # A failing experimental leg annotates the run but does not fail it.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows MSVC"
            runner: ${{ inputs.windows_runner_1 }}
            preset: windows-msvc
            # Declared once, here, so `matrix.experimental` in continue-on-error
            # above resolves against a property the matrix actually defines -
            # without it every leg silently reads null and actionlint reports the
            # reference as undefined. Every other leg is non-experimental by
            # omission (the `|| false` fallback); a leg that IS experimental sets
            # this to true and continue-on-error keeps it out of CI Status.
            experimental: false
            # VS 2026 Build Tools / MSVC 14.5x, from the aka.ms/vs/18/stable
            # channel. Pinned by channel, not exact version: the runner image
            # ships whatever 18.x is current, and the assert step below fails
            # loudly if that ever stops being a 14.5x toolset.
            msvc: true
            packageable: true
            release_package: true
            gold_reference: true
            # AC3Forge Crucible (WASAPI loopback tap/UX12, apps/crucible): built and
            # tested on both Windows legs, packaged on this one (the Package
            # step's own condition already singles out windows-msvc), as its
            # own archive - see cmake/Packaging.cmake's crucible component. The
            # null-sink driver is NOT built on this leg: it needs the WDK,
            # which the self-hosted fleet lacks, so it has its own
            # GitHub-hosted job (windows-driver, below) that builds it from
            # the WDK NuGet packages. Still test-signed only, so it stays out
            # of the package until the EV certificate lands (Phase 6).
            crucible: true

          - name: "Windows LLVM (clang-cl)"
            runner: ${{ inputs.windows_runner_2 }}
            preset: windows-llvm
            msvc: true          # clang-cl targets the MSVC ABI: same headers, same libs
            llvm: true
            packageable: true
            gold_reference: true
            # Built and tested here too - clang-cl is stricter than MSVC about
            # several things the demo's Qt and WASAPI code touches - but not
            # packaged: this leg carries no release_package (see the Package
            # step's condition).
            crucible: true

          # ARM64 - GitHub's hosted windows-11-vs2026-arm runner (Windows ARM64 / reach builds). Real
          # ARM64 hardware, not emulation. Deliberately NOT routed through
          # check-runners' self-hosted/hosted fan-out (the windows_runner_1/2
          # outputs the two legs above use) - that logic is sized for exactly
          # those two existing x64 Windows legs, and there is no self-hosted
          # ARM64 Windows capacity to fan out to; the literal runner label is
          # used directly instead.
          #
          # experimental: true, the same promotion path macos-llvm and
          # build-android both went through (see this file's own header) -
          # this leg's first real runs are exactly what confirms or corrects
          # the toolchain/vcvarsall/Qt/ffmpeg choices made without hosted-
          # runner access at authoring time. Delete this line once a run has
          # gone green for real.
          #
          # msvc_arch: arm64 threads through to the "Setup MSVC environment"
          # step, which otherwise always loads the x64 developer environment
          # (see .github/actions/setup-msvc-env/action.yml) - every other
          # matrix.msvc leg omits it and gets the action's own x64 default.
          #
          # No gui: true, unlike every other packageable leg. At authoring
          # time, Qt's only Windows ARM64 kit for the pinned 6.9.3
          # (win64_msvc2022_arm64_cross_compiled) is a cross-compile kit that
          # expects a paired win64_msvc2022_64 install for its host tools, and
          # aqtinstall has a documented CI bug against exactly that
          # combination (qtpaths.bat pointing at the wrong x64 setup) - real
          # complexity this leg's native-ARM64-host build doesn't need to
          # take on for a first pass. CMakePresets.json's windows-msvc-arm64
          # preset defaults AC3FORGE_BUILD_GUI off for exactly this reason
          # (see its own description) - the same "Qt kit not assumed present"
          # shape linux-gcc/linux-llvm/macos-llvm already use below, not a new
          # pattern. See docs/platforms/windows.md's ARM64 section.
          #
          # gold_reference: true - choco's ffmpeg package is x64-only, so this
          # leg installs BtbN's static win-arm64 ffmpeg build instead (see the
          # dedicated install step below).
          #
          # release_package: true, not just packageable: a genuinely new
          # architecture earns its own canonical release artifact, the same
          # precedent linux-gcc-arm64 already set sitting next to linux-gcc -
          # not a redundant same-arch compiler variant like windows-llvm
          # above (which stays non-canonical: no release_package there).
          - name: "Windows MSVC (arm64)"
            runner: '["windows-11-vs2026-arm"]'
            preset: windows-msvc-arm64
            experimental: true
            msvc: true
            msvc_arch: arm64
            packageable: true
            release_package: true
            gold_reference: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}

      # The Windows runner image ships an LLVM, but not necessarily the pinned
      # one. Install the official build straight from the llvm-project release,
      # pinned via llvm_windows_version to the same point release the Ubuntu
      # 26.04 archive carries (see toolchain-versions.json's own comment), so
      # both LLVM legs are on one version. Chocolatey is deliberately avoided:
      # its llvm package tracks whatever is newest and would drift off the pin.
      #
      # Checks the installed version before downloading anything: GitHub-hosted
      # windows-latest ships an older LLVM major (currently 20.x against our
      # pinned 22.x - see actions/runner-images' Windows software list) so it
      # never matches and always installs, but a self-hosted runner's own
      # Packer template now bakes this exact major in (see ci-runners'
      # scripts/windows/03-llvm-toolchain.ps1) and a prior job on that same
      # long-lived box may already have installed it too - either way, a
      # match means this step can skip the ~10+ minute download+install
      # outright. The comparison is MAJOR-ONLY, not the full
      # llvm_windows_version point release: the point release exists solely
      # to pin a concrete llvm-project GitHub Release asset to download (see
      # toolchain-versions.json's own comment), not to police an
      # already-installed toolchain down to the patch - clang 22.1.1 and
      # 22.1.3 are the same ABI/language surface this project builds against,
      # so treating a patch-level difference as "wrong" just forces a
      # pointless reinstall on self-hosted boxes every time the pin ticks a
      # point release (the build-time assert down in build-leg/action.yml
      # already only checks the major, for the same reason). A mismatched
      # major (wrong major, or nothing installed) renames any existing
      # C:\Program Files\LLVM out of the way first - a rename, not a delete,
      # since deleting the tree has hung in its own right (see this step's
      # git history) - so the installer always writes into a fresh directory
      # rather than over a *different* version, which left stale compiler-rt
      # builtins/libs behind that silently broke linking far downstream
      # (iainchesworthlabs/ci-runners#9, on a long-lived self-hosted runner
      # after a toolchain bump). The rename has to take the old tree's
      # uninstall entry with it - see the run block's ROOT CAUSE comment for
      # the hang that entry caused on every GitHub-hosted runner.
      - name: Install LLVM ${{ inputs.llvm_version }} (Windows)
        id: install_llvm
        if: matrix.llvm && runner.os == 'Windows'
        # ci-runners#26: this step has repeatedly hung for ~90 minutes (both
        # self-hosted and windows-latest) with no progress, only ever caught
        # by the whole job's 90-minute backstop above - which means one
        # occurrence burns the entire job budget instead of failing fast.
        # ~15-16 min is the worst historically-observed *legitimate* cost
        # (before the progress-bar fix below existed); 20 min leaves headroom
        # over that while still cutting a genuine hang to a fraction of 90.
        timeout-minutes: 20
        # Windows PowerShell (always present on self-hosted + GitHub-hosted), NOT
        # pwsh/PowerShell 7 which the self-hosted runner image does not ship -
        # same reasoning as ./.github/actions/setup-msvc-env. GitHub-hosted
        # windows-latest ships pwsh too, which is why this only surfaced once a
        # job actually landed on a self-hosted Windows runner.
        shell: powershell
        env:
          LLVM_WINDOWS_VERSION: ${{ inputs.llvm_windows_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          # DIAGNOSTIC (ci-runners#26): the 2026-09-16/17 hosted-runner hang
          # left a rename-fallback directory timestamped over a week before
          # this job ran - on a runner that should be a fresh VM. Not proof
          # of VM reuse: it's equally consistent with this VM's clock not
          # having finished NTP sync yet this early in its own boot sequence
          # (Defender's own event log from the same run was mid-startup too:
          # cycling LoadingEngine -> ServiceStartedSuccessfully repeatedly,
          # not a settled "protection is off" state). Actual OS uptime
          # settles which: seconds/minutes since boot supports "still
          # settling"; hours/days would instead mean the VM really is being
          # reused. Logged unconditionally, not just on failure, so we get a
          # baseline from healthy runs too, not only hung ones.
          try {
            $os = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
            $bootTime = $os.LastBootUpTime
            $wallClockNow = Get-Date
            Write-Host "VM boot time: $($bootTime.ToString('u')) - wall clock now: $($wallClockNow.ToString('u')) - uptime: $($wallClockNow - $bootTime)"
          } catch {
            Write-Host "Could not read boot time ($_)"
          }
          # winget is preferred where present (GitHub-hosted runners have it;
          # self-hosted only once ci-runners provisions it via Chocolatey,
          # 05-choco-packages.ps1), with the direct Invoke-WebRequest + NSIS
          # '/S' install kept as the fallback. Both run the same installer
          # (winget-pkgs' LLVM.LLVM manifest has the same SHA256, NSIS under
          # the hood, no InstallerSwitches override), so winget is different
          # orchestration, not a different binary. Neither hangs once the
          # orphaned uninstall entry is gone (see ROOT CAUSE below). Still
          # timed and polled either way, never a bare call, so anything new
          # that stalls shows up in the log instead of as a silent timeout.
          # DIAGNOSTIC (ci-runners#26): a top-15-by-CPU snapshot from a prior
          # occurrence showed nothing installer-related, but that only
          # covers the top 15 by CPU - a near-zero-CPU child process (an
          # NSIS-chained sub-installer, a vcredist, anything winget or NSIS
          # spawned) could be sitting just outside that window the whole
          # time. Walk direct children + grandchildren by PID instead of
          # trusting a CPU-sorted top-N. Uses Win32_Process's own -Filter
          # (server-side) rather than fetching the full process list and
          # filtering client-side with a recursive walk - an earlier draft
          # of this that did an unbounded recursive BFS over the full list
          # hung for 20+ seconds even against a single already-known PID
          # with zero children, almost certainly PID-reuse turning
          # coincidental ParentProcessId matches into runaway expansion.
          # Bounded to two levels on purpose, not full recursion - measured
          # locally at <1s either way (0.3s single-PID filter, 0.7-1s for a
          # real parent+child pair), fast enough to run on every 30s poll.
          function Get-ProcessTree {
            param([int]$RootId)
            $result = @(Get-CimInstance Win32_Process -Filter "ProcessId=$RootId" -ErrorAction SilentlyContinue)
            $children = @(Get-CimInstance Win32_Process -Filter "ParentProcessId=$RootId" -ErrorAction SilentlyContinue)
            $result += $children
            foreach ($c in $children) {
              $result += @(Get-CimInstance Win32_Process -Filter "ParentProcessId=$($c.ProcessId)" -ErrorAction SilentlyContinue)
            }
            return $result
          }

          # DIAGNOSTIC (ci-runners#26): a 2026-09-22 occurrence (ac3forge#796,
          # job 106819480284) showed the process tree/network/thread-state
          # diagnostics above earning their keep - winget itself now works
          # (see the source-agreements fix elsewhere in this step's git
          # history) and successfully launches the real NSIS child
          # (LLVM-*-win64.exe), which then sits at 0% CPU with zero network
          # activity for the rest of the timeout. The thread-wait signature
          # (sustained Wait/EventPairLow - an LPC-to-csrss wait associated
          # with window-message handling, not I/O or a lock) points at that
          # NSIS installer having created a window - a wizard page, or a
          # MessageBox - that nothing can dismiss on a non-interactive
          # desktop despite /S. A known NSIS failure class: a script branch
          # not gated on ${If} ${Silent} still shows a page/MessageBox.
          # PowerShell has no built-in cmdlet for "every window a process
          # owns" (Get-Process's own MainWindowTitle can miss a MessageBox
          # that isn't registered as the process's main window - confirmed
          # by testing: it worked in one local test but is not guaranteed),
          # so this P/Invokes user32's EnumWindows directly. #32770 is the
          # well-known Win32 class name for a standard dialog box/MessageBox
          # - that specific ClassName appearing here would be the smoking
          # gun. Verified locally against a real MessageBox in a separate
          # process before writing this into the step (found it correctly:
          # title, "#32770" class, Visible=True, alongside the unrelated
          # hidden helper windows every process has).
          # A here-string would be the natural way to write this, but its
          # closing delimiter must sit at column 0 in this shell (Windows
          # PowerShell 5.1, not pwsh) while GitHub's own YAML block scalar
          # requires every line at or above this block's indentation -
          # confirmed the hard way (actionlint: "could not find expected
          # ':'" at the dedented `using System;` line, since column 0 ends
          # the YAML block early). One single-quoted line instead - C# does
          # not care about line breaks, so this compiles identically to a
          # normal multi-line source file, just less readable in the raw
          # workflow (see this comment's own git history for that version).
          $windowEnumeratorSrc = 'using System; using System.Text; using System.Collections.Generic; using System.Runtime.InteropServices; public class WindowEnumerator { public class WindowInfo { public long Handle; public string Title; public string ClassName; public bool Visible; } private delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam); [DllImport("user32.dll")] private static extern bool EnumWindows(EnumWindowsProc lpEnumFunc, IntPtr lParam); [DllImport("user32.dll", CharSet = CharSet.Auto)] private static extern int GetWindowText(IntPtr hWnd, StringBuilder lpString, int nMaxCount); [DllImport("user32.dll")] private static extern int GetClassName(IntPtr hWnd, StringBuilder lpClassName, int nMaxCount); [DllImport("user32.dll")] private static extern bool IsWindowVisible(IntPtr hWnd); [DllImport("user32.dll")] private static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint lpdwProcessId); public static List<WindowInfo> GetWindowsForProcess(uint processId) { var result = new List<WindowInfo>(); EnumWindows((hWnd, lParam) => { uint pid; GetWindowThreadProcessId(hWnd, out pid); if (pid == processId) { var sbTitle = new StringBuilder(256); GetWindowText(hWnd, sbTitle, sbTitle.Capacity); var sbClass = new StringBuilder(256); GetClassName(hWnd, sbClass, sbClass.Capacity); result.Add(new WindowInfo { Handle = hWnd.ToInt64(), Title = sbTitle.ToString(), ClassName = sbClass.ToString(), Visible = IsWindowVisible(hWnd) }); } return true; }, IntPtr.Zero); return result; } }'
          try {
            Add-Type -TypeDefinition $windowEnumeratorSrc -Language CSharp
          } catch {
            Write-Host "::warning::Could not compile window enumerator ($_) - window snapshots will be unavailable"
          }

          function Invoke-TimedProcess {
            param([string]$FilePath, [string[]]$ArgumentList, [string]$Label, [string]$WatchDir)
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $FilePath -ArgumentList $ArgumentList -NoNewWindow -PassThru
            # Open the process handle while the process is still alive.
            # Without it, a Start-Process -PassThru object reads ExitCode as
            # $null once the process has exited, so every `$code -ne 0` below
            # saw a failure - the "exited: code=" with no number that earlier
            # occurrences logged.
            $null = $p.Handle
            $lastMpCpu = (Get-Process MsMpEng -ErrorAction SilentlyContinue | Select-Object -ExpandProperty CPU)
            while (-not $p.WaitForExit(30000)) {
              $mpCpu = (Get-Process MsMpEng -ErrorAction SilentlyContinue | Select-Object -ExpandProperty CPU)
              $mpDelta = if ($null -ne $mpCpu -and $null -ne $lastMpCpu) { [math]::Round($mpCpu - $lastMpCpu, 1) } else { 'n/a' }
              $lastMpCpu = $mpCpu
              $fileInfo = ''
              if ($WatchDir -and (Test-Path $WatchDir)) {
                $fileCount = (Get-ChildItem -Path $WatchDir -Recurse -File -ErrorAction SilentlyContinue | Measure-Object).Count
                $fileInfo = " files_under=$fileCount"
              }
              Write-Host "[$($sw.Elapsed.ToString('mm\:ss'))] $Label still running (pid $($p.Id))$fileInfo MsMpEng_cpu_delta=${mpDelta}s"

              try {
                $tree = Get-ProcessTree -RootId $p.Id
                Write-Host "  process tree:"
                ($tree | Select-Object ProcessId, ParentProcessId, Name | Format-Table -AutoSize | Out-String -Width 300).Trim() | Write-Host
                $treePids = @($tree.ProcessId)
                $conns = Get-NetTCPConnection -ErrorAction SilentlyContinue | Where-Object { $treePids -contains $_.OwningProcess }
                if ($conns) {
                  Write-Host "  network connections:"
                  ($conns | Select-Object LocalPort, RemoteAddress, RemotePort, State, OwningProcess | Format-Table -AutoSize | Out-String -Width 300).Trim() | Write-Host
                } else {
                  Write-Host "  network connections: none"
                }
                if ('WindowEnumerator' -as [type]) {
                  $windows = foreach ($treePid in $treePids) { [WindowEnumerator]::GetWindowsForProcess([uint32]$treePid) }
                  if ($windows) {
                    Write-Host "  windows owned by this tree:"
                    ($windows | Select-Object Handle, Title, ClassName, Visible | Format-Table -AutoSize | Out-String -Width 300).Trim() | Write-Host
                  } else {
                    Write-Host "  windows owned by this tree: none"
                  }
                }
              } catch {
                Write-Host "  process tree/network/window snapshot failed: $_"
              }
              try {
                $proc = Get-Process -Id $p.Id -ErrorAction Stop
                $waits = $proc.Threads | ForEach-Object {
                  $state = $_.ThreadState
                  if ($state -eq 'Wait') { try { "Wait/$($_.WaitReason)" } catch { "Wait/?" } } else { "$state" }
                } | Group-Object | Select-Object Name, Count
                Write-Host "  thread states: $(($waits | ForEach-Object { "$($_.Name)=$($_.Count)" }) -join ', ')"
              } catch {
                Write-Host "  thread states unavailable: $_"
              }
            }
            Write-Host "[$($sw.Elapsed.ToString('mm\:ss'))] $Label exited: code=$($p.ExitCode)"
            return $p.ExitCode
          }

          # Best-effort, kept from the previous approach: harmless if
          # realtime protection turns out to be off (as observed on the
          # 2026-09-16/17 hang - see this step's git history), still cheap
          # insurance on a runner where it's on.
          try {
            Add-MpPreference -ExclusionPath "$env:ProgramFiles\LLVM", $env:RUNNER_TEMP, $env:TEMP -ErrorAction Stop
          } catch {
            Write-Host "::warning::Could not add Defender exclusion for LLVM ($_) - continuing without it"
          }
          try {
            $mpStatus = Get-MpComputerStatus -ErrorAction Stop
            Write-Host "Defender: AntivirusEnabled=$($mpStatus.AntivirusEnabled) RealTimeProtectionEnabled=$($mpStatus.RealTimeProtectionEnabled) engine=$($mpStatus.AMEngineVersion)"
          } catch {
            Write-Host "Defender: Get-MpComputerStatus unavailable ($_)"
          }

          $version = $env:LLVM_WINDOWS_VERSION
          $pinnedMajor = $version.Split('.')[0]
          $llvmDir = "$env:ProgramFiles\LLVM"
          $clangCl = "$llvmDir\bin\clang-cl.exe"

          $alreadyCurrent = $false
          if (Test-Path $clangCl) {
            # Collect ALL of clang-cl's output before taking the first line -
            # see this step's git history (PR #473) for why an early-
            # terminated pipeline here previously poisoned $LASTEXITCODE.
            $verOutput = & $clangCl --version 2>&1
            $verLine = $verOutput | Select-Object -First 1
            if ($verLine -match 'version (\d+)\.' -and $matches[1] -eq $pinnedMajor) {
              $alreadyCurrent = $true
            }
          }

          if ($alreadyCurrent) {
            Write-Host "LLVM $($matches[1]).x already installed at $clangCl (pinned major $pinnedMajor) - skipping install"
          } else {
            if (Test-Path $llvmDir) {
              $staleName = "LLVM.stale-$([guid]::NewGuid().ToString('N').Substring(0,8))"
              Write-Host "Existing LLVM install is not major $pinnedMajor - renaming out of the way ($staleName) before installing $version"
              $renameSw = [System.Diagnostics.Stopwatch]::StartNew()
              Rename-Item -Path $llvmDir -NewName $staleName
              Write-Host "Rename completed in $([math]::Round($renameSw.Elapsed.TotalMilliseconds)) ms"
            }
            # ROOT CAUSE (ci-runners#26), proven on a GitHub-hosted
            # windows-latest VM by a probe run (36003021348, 2026-09-24): the
            # renamed tree's Add/Remove Programs entry still names
            # $llvmDir\Uninstall.exe. LLVM's installer is CPack's NSIS
            # template with CPACK_NSIS_ENABLE_UNINSTALL_BEFORE_INSTALL, so its
            # .onInit runs that uninstaller first, finds nothing there, and
            # shows an "Uninstall failed." MessageBox (read off the dialog by
            # the probe) that has no /SD default - /S displays it anyway, and
            # on a headless runner nothing ever clicks OK, so every hosted
            # install sat there until the step timeout. With the orphaned
            # entry removed, the same probe installed 22.1.2 in 67 s. The
            # hosted image's entry is in the 32-bit view (the installer is a
            # 32-bit NSIS exe); both views are checked. `winget uninstall`
            # never cleared it: an NSIS uninstaller copies itself to %TEMP%
            # and returns at once, so winget reported success with the real
            # uninstall still running, and the rename that followed pulled
            # the tree out from under it.
            foreach ($root in 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall') {
              if (-not (Test-Path $root)) {
                continue
              }
              foreach ($key in Get-ChildItem -Path $root -ErrorAction SilentlyContinue) {
                $uninstall = (Get-ItemProperty -Path $key.PSPath -ErrorAction SilentlyContinue).UninstallString
                if ($uninstall -and $uninstall -like "*$llvmDir\Uninstall.exe*" -and -not (Test-Path "$llvmDir\Uninstall.exe")) {
                  Write-Host "Removing orphaned uninstall entry $($key.Name) ($uninstall)"
                  Remove-Item -Path $key.PSPath -Recurse -Force
                }
              }
            }
            $winget = Get-Command winget -ErrorAction SilentlyContinue
            if ($winget) {
              Write-Host "winget found ($($winget.Source)) - using it"
              # The `msstore` source goes first, best-effort: an earlier
              # occurrence (ac3forge#796, job 106687216920) caught winget
              # blocked on that source's unaccepted terms prompt with no
              # console to answer it (0x8a150042 "Error reading input in
              # prompt"). Nothing here installs from it, so removing it
              # means no winget call can reach that prompt, and
              # --accept-source-agreements/--disable-interactivity below turn
              # any other prompt into a fast error instead of a wait.
              try {
                winget source remove --name msstore 2>&1 | Out-String | Write-Host
              } catch {
                Write-Host "::warning::Could not remove msstore winget source ($_) - continuing without it"
              }
              # --force: winget's own --help - "By default, install command
              # will check package installed status and try to perform an
              # upgrade if applicable. Override with --force to perform a
              # direct install." Its detection is registry-based, and the
              # cleanup above only drops entries pointing at $llvmDir, so
              # this stays as the guarantee of a plain install.
              $code = Invoke-TimedProcess -FilePath 'winget' -ArgumentList @('install', '--id', 'LLVM.LLVM', '--exact', '--version', $version, '--silent', '--force', '--accept-source-agreements', '--accept-package-agreements', '--disable-interactivity') -Label 'winget install' -WatchDir $llvmDir
              if ($code -ne 0) {
                throw "winget install exited with code $code"
              }
            } else {
              Write-Host "winget not found - falling back to direct NSIS install"
              # Invoke-WebRequest renders a progress bar by default, and
              # updating it in a non-interactive CI console turns into the
              # dominant cost of the download - see this step's git history
              # (PR #673) for the 10-vs-36-minute measurement.
              $ProgressPreference = 'SilentlyContinue'
              $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/LLVM-$version-win64.exe"
              $exe = Join-Path $env:RUNNER_TEMP "LLVM-$version-win64.exe"
              $dlSw = [System.Diagnostics.Stopwatch]::StartNew()
              Invoke-WebRequest -Uri $url -OutFile $exe
              Write-Host "[$($dlSw.Elapsed.ToString('mm\:ss'))] download complete: $((Get-Item $exe).Length) bytes"
              $code = Invoke-TimedProcess -FilePath $exe -ArgumentList @('/S') -Label 'NSIS install' -WatchDir $llvmDir
              if ($code -ne 0) {
                throw "LLVM installer exited with code $code"
              }
            }
          }

          # Neither winget nor the NSIS '/S' install adds this to PATH.
          "$llvmDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # Belt and braces for the $LASTEXITCODE propagation above: nothing
          # after the probe re-runs a native command, so make the step's
          # success explicit rather than inheriting whatever the last native
          # invocation happened to leave behind.
          exit 0

      # DIAGNOSTIC (ci-runners#26, temporary - delete this whole step once
      # the hang is confirmed fixed or we know what to look for instead):
      # only fires when the step above actually fails or times out, since a
      # hung self-hosted VM normally recycles - and a hosted one is simply
      # discarded - before anyone can look at it by hand. Best-effort: a
      # failure in here should never mask the real failure above.
      - name: Diagnose LLVM install timeout (Windows)
        # always() is required here, not optional: GitHub silently ANDs an
        # implicit success() onto any `if:` that doesn't itself call
        # always()/failure()/cancelled() as a function - a plain
        # `steps.x.outcome == 'failure'` string comparison does NOT count,
        # so without always() this step silently never runs once the step
        # above fails. Confirmed the hard way: this exact bug cost the
        # 2026-09-16/17 hang's forensics (step showed completed/skipped).
        if: always() && runner.os == 'Windows' && (steps.install_llvm.outcome == 'failure' || steps.install_llvm.outcome == 'cancelled')
        shell: powershell
        timeout-minutes: 3
        continue-on-error: true
        run: |
          Write-Host "=== Recent Windows Defender operational events ==="
          Get-WinEvent -LogName 'Microsoft-Windows-Windows Defender/Operational' -MaxEvents 100 -ErrorAction SilentlyContinue |
            Select-Object TimeCreated, Id, LevelDisplayName, Message |
            Format-List | Out-String -Width 300 | Write-Host

          Write-Host "=== Top CPU processes ==="
          Get-Process | Sort-Object CPU -Descending | Select-Object -First 15 Name, Id, CPU, Handles, WorkingSet |
            Format-Table -AutoSize | Out-String -Width 300 | Write-Host

          Write-Host "=== LLVM install dir state ==="
          $llvmDir = "$env:ProgramFiles\LLVM"
          if (Test-Path $llvmDir) {
            $count = (Get-ChildItem -Path $llvmDir -Recurse -File -ErrorAction SilentlyContinue | Measure-Object).Count
            Write-Host "files under ${llvmDir}: $count"
          } else {
            Write-Host "${llvmDir} does not exist"
          }
          Get-ChildItem -Path "$env:ProgramFiles" -Filter 'LLVM*' -ErrorAction SilentlyContinue |
            Select-Object Name, LastWriteTime | Format-Table -AutoSize | Out-String -Width 300 | Write-Host

      - name: Install ffmpeg (Windows)
        if: matrix.gold_reference && runner.os == 'Windows' && matrix.preset != 'windows-msvc-arm64'
        shell: bash
        run: choco install ffmpeg -y --no-progress --requirechecksums

      # choco's ffmpeg package is x64-only (Chocolatey packages here are
      # typically x64 binaries) - there is no arm64 equivalent to install the
      # same way. BtbN/FFmpeg-Builds publishes static win-arm64 GPL builds
      # instead; the n8.1 release build is used rather than the "master" one
      # for the same reason choco's package tracks an actual FFmpeg release
      # rather than a git snapshot. The zip's ffmpeg.exe is nested under a
      # versioned subfolder that drifts between builds, so this searches for
      # it instead of hardcoding that path.
      #
      # PINNED to a dated autobuild tag, not the rolling "latest" one this
      # used to fetch. BtbN republishes "latest" every day, so the binary
      # underneath it changes with no commit here - which is exactly how this
      # leg went red: main passed on 2026-09-21 and every run from 2026-09-23
      # failed identically, on unrelated branches, with ac3cli's own 2,183
      # tests all passing and the gate's FFmpeg step ([2] ac3: FFmpeg strict
      # decode) dying on a segfault (exit 139). Nothing in this repository
      # changed the download; the file behind the URL did. autobuild-2026-09-
      # 20-13-11 is the build "latest" resolved to when this leg last passed.
      # A dated tag's asset is immutable, so this can only change by editing
      # this line - which is the point.
      - name: Install ffmpeg (Windows ARM64)
        if: matrix.gold_reference && matrix.preset == 'windows-msvc-arm64'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # See the LLVM (Windows) step's leading comment - default progress-bar
          # rendering can dominate an Invoke-WebRequest download's wall time in
          # a non-interactive CI console.
          $ProgressPreference = 'SilentlyContinue'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg-winarm64.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'ffmpeg-winarm64'
          Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-20-13-11/ffmpeg-n8.1.2-267-gb2f422d306-winarm64-gpl-8.1.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest
          $exe = Get-ChildItem -Path $dest -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          if (-not $exe) {
              throw "ffmpeg.exe not found anywhere under $dest after extracting $zip"
          }
          Write-Host "Found ffmpeg.exe at $($exe.FullName)"
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # DR7: makensis is what turns the NSIS block in cmake/Packaging.cmake
      # from a graceful, silent no-op into a real installer. Installed fresh
      # here rather than baked into the ci-runners Packer image, same
      # reasoning as ffmpeg/Ninja above - see
      # docs/ci-self-hosted-runners.md's "Measuring whether it's actually
      # worth it": nothing is pre-baked onto the self-hosted image without
      # data justifying it, and there is none for NSIS specifically yet.
      # Scoped to the same condition as the Package step below (only
      # windows-msvc packages on Windows today) so a leg that never runs
      # cpack doesn't pay for an installer it won't use.
      #
      # PowerShell, not bash: both GitHub-hosted windows-latest AND (per a
      # real CI run) this fleet's self-hosted runners already carry NSIS -
      # `choco install nsis` reports "already installed" and exits without
      # running the shim-creation step a fresh install would, so makensis
      # was on disk but never on PATH, and find_program(makensis) still
      # missed it (confirmed empirically: cpack packaged ZIP-only with the
      # cmake/Packaging.cmake warning firing, even though choco reported
      # success). Probing both Program Files roots and appending to
      # GITHUB_PATH explicitly - rather than assuming choco's shim exists -
      # is what actually fixes that, on a fresh runner or an already-primed
      # one alike.
      - name: Install NSIS (Windows)
        if: matrix.packageable && (matrix.preset == 'windows-msvc' || (inputs.do_package && matrix.release_package)) && runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis -y --no-progress --requirechecksums
          $nsisDir = @(
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS'),
            (Join-Path $env:ProgramFiles 'NSIS')
          ) | Where-Object { Test-Path (Join-Path $_ 'makensis.exe') } | Select-Object -First 1
          if (-not $nsisDir) {
            throw "makensis.exe not found under Program Files after 'choco install nsis' - the package layout may have changed."
          }
          Write-Host "Adding $nsisDir to PATH"
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # cl.exe, INCLUDE and LIB are not on the default PATH, and Ninja does not
      # set them up itself (unlike MSBuild). clang-cl needs them too.
      - name: Setup MSVC environment
        if: matrix.msvc
        uses: ./.github/actions/setup-msvc-env
        with:
          arch: ${{ matrix.msvc_arch || 'x64' }}

      # Unconditional here (the original step's `if: !matrix.container` is
      # always true on this platform - no Windows leg ever sets `container`,
      # unlike _ci-linux.yml's own copy of this step, where it still matters).
      - name: Install Ninja
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS)   brew install ninja ;;
            Windows) choco install ninja -y --no-progress --requirechecksums ;;
          esac

      # AC3FORGE_BUILD_GUI is ON only on the two Windows presets (see
      # CMakePresets.json), and cmake/FindQt6.cmake only widens
      # CMAKE_PREFIX_PATH to LOCAL install roots (C:/Qt/6.x/msvc2022_64, and
      # so on) - it has no notion of a CI runner, so a Windows leg with no
      # Qt kit on the image at all would fail at find_package(Qt6 ...)
      # without this. clang-cl (windows-llvm) targets the MSVC ABI, so it
      # shares this same msvc2022_64 kit with windows-msvc rather than
      # needing its own. Version pinned to the exact kit already verified
      # locally (see docs/building.md's Verified configuration table); the
      # pinned action itself is CountdownSolver's own precedent
      # (R:\CountdownSolver\.github\workflows\release.yml), the other
      # project sharing this same "prebuilt Qt, never vcpkg" convention.
      # windows-msvc-arm64 is excluded: no gui: true on that leg (see its
      # matrix comment above), so there is no Qt kit to install for it here.
      #
      # modules: the AC3Forge Crucible's room is drawn with Qt Quick 3D,
      # which is not part of the base kit (aqtinstall calls it qtquick3d, and
      # its own shader tooling qtshadertools - both present in the local
      # C:/Qt/6.8.3/msvc2022_64 kit this pin matches). apps/crucible/
      # CMakeLists.txt treats Quick3D as optional and skips the 3D view with a
      # warning when it is absent, so without these the packaged window would
      # quietly ship with a 2D-only room and the ctest suite would exercise
      # the skipped path instead of the real one.
      # install-qt-action v4.4.0 (bumped from v4.3.1 by #952) added its own
      # "is this action built" bootstrap check ahead of anything else the
      # composite action does, including its own internal setup-python sub-
      # step (see the "Install Qt (prebuilt)" step below) - that check shells
      # out to a bare `python` unconditionally. This fleet's self-hosted
      # Windows runners never put a bare `python` on PATH the way a
      # GitHub-hosted runner's own image does (confirmed against a real CI
      # run: "python: command not found", nothing to do with the MSVC
      # environment loaded just above - the same failure hits both the MSVC
      # and clang-cl legs identically). Providing one explicitly here, before
      # install-qt-action ever runs, is the fix; setup-python: false below
      # then skips that action's own internal, now-redundant copy of this
      # same step, mirroring _build.yml's identical fix for the same
      # v4.4.0 change on the Linux AppImage leg (see its own "Install Qt
      # (prebuilt)" step's comment).
      #
      # Neither actions/setup-python nor choco's own python package can be
      # trusted here: this fleet's runners are persistent, reused machines,
      # not fresh-per-job GitHub-hosted images, and BOTH installers have now
      # failed outright on one with an "already there in some form the
      # installer does not like" signature - actions/setup-python's "Error
      # happened during Python installation" after cleaning up a previous
      # run's leftover registry entries, then choco's own MSI error 1603
      # ("the same version is already installed") on the very next attempt,
      # STILL failing identically a third time even behind a probe for an
      # existing python.exe on disk (there was none - the stale state choco
      # trips on lives in the Windows Installer database, not anywhere a
      # filesystem probe would find it). The one thing that actually avoids
      # an installer-database conflict on a reused machine is not touching
      # an installer at all: python.org's own embeddable package is a plain
      # zip, extracted fresh into $RUNNER_TEMP (job-scoped, never reused
      # across runs unlike Program Files or the registry) every time - same
      # download-and-extract shape as the ARM64 ffmpeg step above, for the
      # identical reason (no installer on this leg's PATH to run one with).
      # This bootstrap check only ever needs a python capable of running a
      # few lines of pathlib - nothing here needs pip or the full install -
      # but setup-python: false does not stop install-qt-action reaching for
      # pip anyway, later, on whatever python it finds on PATH: its own
      # aqtinstall step still runs `python -m pip install setuptools py7zr`
      # (the py7zrversion/aqtversion inputs below), unconditionally, to get
      # aqtinstall itself. Confirmed against a real CI run: that call failed
      # with "No module named pip" against this exact python.exe - the site
      # module fix above makes the bootstrap check's bare exit() work, but
      # site has nothing to do with pip being present at all. python.org's
      # embeddable zip ships neither pip nor ensurepip's bundled wheels (its
      # own docs name get-pip.py as the fix), so bootstrap it the documented
      # way rather than assuming enabling site was ever going to cover this
      # too. The step itself lives in .github/actions/setup-embeddable-python,
      # shared with msvc-analysis.yml, which kept the choco install after this
      # leg moved off it and whose nightly then failed on "python: command not
      # found".
      - name: Setup Python (for install-qt-action)
        if: runner.os == 'Windows' && matrix.preset != 'windows-msvc-arm64'
        uses: ./.github/actions/setup-embeddable-python

      - name: Install Qt (prebuilt)
        if: runner.os == 'Windows' && matrix.preset != 'windows-msvc-arm64'
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: ${{ inputs.qt_version }}
          modules: qtquick3d qtshadertools
          cache: true
          setup-python: false

      # CMakePresets.json declares the project's real minimum (cmakeMinimumRequired);
      # this asserts the RUNNER actually meets it rather than letting a stale image
      # fail later with a confusing "unknown preset field" error. gcc/llvm/msvc are
      # asserted the same way, all against the pins toolchain-versions resolved
      # above - see docs/ci-self-hosted-runners.md.
      # ---------------------------------------------------------------------
      # Configure / build / test
      # ---------------------------------------------------------------------
      # Toolchain assert, vcpkg setup, Configure (presets carry generator,
      # compiler, Release, AC3FORGE_BUILD_GUI=OFF - `cmake --preset
      # config-<leg>` locally reproduces this exactly except for the
      # QT_ROOT_DIR/-DAC3FORGE_BUILD_GUI overrides the action bolts on),
      # Build (-k 0, warnings-as-errors) and Test - extracted into
      # ./.github/actions/build-leg (docs/ci-lanes.md, CI lane partitions
      # plan) so splitting this file into one reusable workflow per platform
      # does not duplicate the sequence into each of them. See that action's
      # own header and step comments for what each piece does and why;
      # nothing about what runs or in what order changed by moving it there -
      # composite action steps execute in this same job/workspace.
      - uses: ./.github/actions/build-leg
        with:
          preset: ${{ matrix.preset }}
          # No Windows leg sets matrix.gui (AC3FORGE_BUILD_GUI is ON by
          # default on both Windows presets - see CMakePresets.json), so
          # this is always effectively "false" here, same as
          # `${{ matrix.gui }}` used to evaluate on this platform.
          gui: "false"
          crucible: ${{ matrix.crucible }}
          version-tag: ${{ inputs.version_tag }}
          # No Windows leg needs a GCC version to assert - see build-leg's
          # own toolchain-assert step, which only reads this inside its
          # linux-gcc*/case branch.
          gcc-version: ""
          llvm-version: ${{ inputs.llvm_version }}
          msvc-toolset: ${{ inputs.msvc_toolset }}
          cmake-min: ${{ inputs.cmake_min }}
          vcpkg-commit: ${{ inputs.vcpkg_commit }}

      # The window is optional in CMake (Qt6 QUIET, and Quick3D optional
      # inside that), which is right for a source build on a machine with no
      # Qt kit and wrong here: this leg installed the kit on purpose, so a
      # skipped ac3crucible or a 2D-only room means that install broke rather
      # than a deliberate choice - the same "failing loudly beats degrading
      # quietly" reasoning as the NSIS assert further down.
      # The same drift check the GUI catalogues get further down, for
      # Crucible's six. It runs here and not on a Linux leg because
      # ac3crucible_lupdate exists only where Crucible is configured, and the
      # matrix build tree carries Crucible on Windows alone - Linux builds it
      # in a pass of its own with its own tree.
      #
      # windows-msvc and not both Windows legs: one is enough to catch a
      # source string changed without regenerating, and the llvm leg already
      # carries the coverage gate.
      - name: Check the Crucible translations are up to date
        if: matrix.crucible && matrix.preset == 'windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "build/config-${{ matrix.preset }}" --target ac3crucible_lupdate
          git diff --exit-code -- apps/crucible/translations || {
            echo "::error::a qsTr() string changed without regenerating the catalogues -           build the ac3crucible_lupdate target and commit apps/crucible/translations"
            exit 1
          }

      # The same drift check for Hearth's six (apps/hearth/ui/translations).
      # Every Windows leg builds ac3hearth, so it needs no matrix flag, and it
      # runs on windows-msvc alone for the reason given above. It is here
      # rather than beside the GUI's on Linux GCC because this leg's lupdate
      # is the Qt pinned in .github/toolchain-versions.json, whereas the
      # Linux legs run whichever lupdate Ubuntu's archive ships. A check that
      # compares generated files should only move when this repository moves
      # its pin.
      #
      # -I drops every hunk made only of <location .../> lines. Those record
      # the line each string sits on, so without it this would fail any
      # change that adds or removes a line above a qsTr(); the GUI and
      # Crucible checks compare every line, and nine commits since
      # 2026-08-27 changed nothing in those catalogues but locations. A
      # string added, removed or reworded without regenerating still fails
      # here. The locations are rewritten whenever the target runs, so they
      # catch up at the next regeneration.
      - name: Check the Hearth translations are up to date
        if: matrix.preset == 'windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "build/config-${{ matrix.preset }}" --target ac3hearth_lupdate
          git diff --exit-code -I '^[[:space:]]*<location filename="[^"]*" line="[0-9]+"/>' \
            -- apps/hearth/ui/translations || {
            echo "::error::a qsTr() string changed without regenerating the catalogues - build the ac3hearth_lupdate target and commit apps/hearth/ui/translations"
            exit 1
          }

      - name: Assert the AC3Forge Crucible was built
        # Windows and macOS, which are the two platforms whose matrix build
        # tree carries Crucible; on Linux that tree deliberately has none
        # (see the Configure step above), and the dedicated Linux pass makes
        # its own assertions in its own tree.
        #
        # This matters more on macOS than anywhere else. That half has never
        # been compiled by anyone - it was written without a Mac - so a leg
        # that quietly built no window would be the difference between "it
        # compiles" and "nobody checked", and the whole macOS claim rests on
        # the first of those.
        if: matrix.crucible && (runner.os == 'Windows' || runner.os == 'macOS')
        shell: bash
        run: |
          set -euo pipefail
          build="build/config-${{ matrix.preset }}"
          suffix=''
          [ "$RUNNER_OS" = "Windows" ] && suffix='.exe'
          # ac3crucible is a MACOSX_BUNDLE target (apps/crucible/CMakeLists.txt),
          # so on macOS the product is bin/ac3crucible.app/Contents/MacOS/
          # ac3crucible and there is no plain file at bin/ac3crucible. Its two
          # companions are not bundles - ac3crucible-run is a plain
          # add_executable, and qt_add_executable does not set MACOSX_BUNDLE -
          # so only this one needs the longer path. The ac3gui smoke test
          # further down branches the same way for the same reason.
          window="$build/bin/ac3crucible$suffix"
          if [ "$RUNNER_OS" = "macOS" ]; then
            window="$build/bin/ac3crucible.app/Contents/MacOS/ac3crucible"
          fi
          missing=0
          if [ ! -f "$window" ]; then
            echo "::error::$window was not built - was Qt6 found? Check the configure log's warnings."
            missing=1
          fi
          for exe in ac3crucible-run ac3crucible_qmltests; do
            if [ ! -f "$build/bin/$exe$suffix" ]; then
              echo "::error::$exe$suffix was not built - was Qt6 found? Check the configure log's warnings."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          # Quick3D resolves through find_package, so the cache is where its
          # presence is recorded; a build without it still links, which is
          # exactly why this is asserted rather than assumed.
          if ! grep -q '^Qt6Quick3D_DIR' "$build/CMakeCache.txt"; then
            echo "::error::Qt Quick 3D was not found, so the room's 3D view is missing from this build - the 'Install Qt (prebuilt)' step's modules list is what provides it"
            exit 1
          fi
          ls -1 "$window" "$build/bin/ac3crucible-run$suffix"

      # The AC3Forge Crucible's coverage floor - what ci.yml's `coverage` job
      # is for the library, for the one first-party tree that job cannot see.
      #
      # It cannot see it for the reason its own header gives about apps/gui:
      # instrumenting a Qt application needs a Qt kit on the instrumented leg,
      # and no Linux leg installs one. Crucible is worse off than apps/gui
      # there, because more of it lives behind Qt - the window, its controller,
      # and the Qt Quick suites that are the ONLY thing driving the Linux
      # platform seams (tests/crucible/platform_services_stub.cpp is what the
      # Catch2 binary links). So the figure is taken where the kit already is.
      #
      # One extra pass inside this leg rather than a job of its own, the same
      # shape as the ALSA fallback and the Linux Crucible pass below: what it
      # needs is a different BUILD of what this leg already has - clang-cl,
      # the pinned LLVM (llvm-profdata and llvm-cov ship in the same install,
      # at the C:\Program Files\LLVM the script defaults to) and the Qt kit
      # with Quick3D - rather than a different machine. On this fleet the
      # scarce resource is a queue slot and not a core (see
      # docs/ci-self-hosted-runners.md), so a second tree inside a leg that
      # is already running costs less than a job waiting for a runner.
      #
      # windows-llvm and not windows-msvc: config-windows-llvm-coverage is a
      # clang-cl preset (-fprofile-instr-generate/-fcoverage-mapping) and MSVC
      # has no counterpart llvm-cov could read. It roughly doubles this leg's
      # build time, which is the price of the gate; the alternative was a
      # number nothing checked.
      #
      # tools/checks/coverage_crucible.ps1 runs the `crucible` and
      # `crucible-ui` labels itself under LLVM_PROFILE_FILE, merges the
      # profiles, gates apps/crucible's line and branch figures against the
      # floors in its own header, and prints a per-file breakdown under them.
      # It is shared verbatim with a local run (docs/crucible/design/promotion.md),
      # so CI and a developer machine cannot drift onto different thresholds -
      # the same rule coverage_report.sh follows for the library.
      #
      # Windows PowerShell, not pwsh: the self-hosted fleet's Windows image
      # does not ship PowerShell 7 (see the LLVM install step's own note).
      - name: Crucible coverage floor (Windows, clang-cl)
        if: matrix.crucible && matrix.preset == 'windows-llvm'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The same -DCMAKE_PREFIX_PATH the Configure step above bolts onto
          # every Windows leg, for the reason it gives: install-qt-action puts
          # the kit under a runner-specific QT_ROOT_DIR that
          # cmake/FindQt6.cmake's local search roots (C:/Qt/6.x/msvc2022_64
          # and friends) do not cover, so the preset alone finds no Qt6 here.
          # Without it this configure does not degrade into a smaller number -
          # it fails outright, because AC3FORGE_BUILD_GUI is ON for every
          # windows-llvm preset (CMakePresets.json) and apps/gui/CMakeLists.txt
          # asks for Qt6 REQUIRED.
          #
          # Asserted rather than assumed: an empty QT_ROOT_DIR would pass an
          # empty prefix path and leave find_package to whatever kit happened
          # to be on the image, which is a measurement of a different build
          # from the one this leg tested.
          if (-not $env:QT_ROOT_DIR) {
            throw "QT_ROOT_DIR is not set - did the 'Install Qt (prebuilt)' step run on this leg?"
          }
          cmake --preset config-windows-llvm-coverage "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw "the instrumented configure failed ($LASTEXITCODE)" }
          cmake --build --preset build-windows-llvm-coverage
          if ($LASTEXITCODE -ne 0) { throw "the instrumented build failed ($LASTEXITCODE)" }
          .\tools\checks\coverage_crucible.ps1 -BuildDir build\config-windows-llvm-coverage
          if ($LASTEXITCODE -ne 0) { throw "the Crucible coverage gate failed ($LASTEXITCODE)" }

      # The gold-reference correctness gate (the L3 FFmpeg-oracle + a
      # lightweight L4 SNR check from the project's original validation-
      # pyramid design, now docs/verification.md). Proven on macOS alone
      # first; now every leg has it except linux-llvm-asan-ubsan, which
      # stays diagnostic-only (same reasoning as its `packageable` exclusion
      # below - a sanitizer build's job is catching memory/UB errors, not
      # re-proving codec correctness a plain build already did).
      #
      # Extracted into ./.github/actions/gold-reference-gate alongside
      # build-leg above, for the same reason (docs/ci-lanes.md). Unlike
      # build-leg this call still carries its own `if:` here - the action
      # has no notion of matrix.gold_reference, so the caller still decides
      # whether to run it at all, the same way the setup-msvc-env call above
      # stays gated on `matrix.msvc`.
      - name: Gold reference gate
        if: matrix.gold_reference
        uses: ./.github/actions/gold-reference-gate
        with:
          preset: ${{ matrix.preset }}
          persist-quality-trend: ${{ inputs.persist_quality_trend }}

      # Handed off to the quality-trend job below, which runs once (not once
      # per leg) after every gold_reference leg has passed - see that job's
      # own header comment for why it is a separate job rather than each leg
      # pushing its own commit.
      - name: Upload gold-reference results
        if: matrix.gold_reference && inputs.persist_quality_trend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gold-reference-${{ matrix.preset }}
          path: ${{ runner.temp }}/gold-reference-results/*.json
          if-no-files-found: error

      # Packaging. windows-msvc always packages, on every push, as a
      # continuous smoke test of the packaging path itself. For a real
      # release (do_package set, from release.yml), only one leg per
      # OS/arch actually packages as the release's own canonical artifact -
      # `release_package: true` on windows-msvc, linux-gcc and
      # linux-gcc-arm64 - rather than every packageable leg. A release ships
      # one canonical build per platform for people to download, not a build
      # per compiler-toolchain leg: windows-llvm and linux-llvm exist to
      # catch compiler-specific bugs in CI, which they still do in full
      # (build+test, unchanged) - packaging them too would just be two
      # redundant, unlabelled-as-to-which-is-canonical zips per OS with
      # nothing to tell a downloader apart. A packaging failure on a
      # release_package leg blocks like any other leg's would, rather than
      # being absorbed by continue-on-error. linux-llvm-asan-ubsan is never
      # packaged at all (not `packageable` - see the matrix entry): there is
      # no pack-linux-llvm-asan-ubsan preset, a sanitizer-instrumented debug
      # build is a diagnostic tool, not something to ship.
      #
      # macOS (DR8) is neither of the two shapes above any more: macos-llvm
      # and macos-llvm-x64 are each `packageable` but never `release_package`
      # - a release doesn't want either leg's own single-arch .dmg as "the"
      # macOS package now that a universal one exists. They still package on
      # every ORDINARY push (the windows-msvc-style continuous smoke test,
      # extended to both of them - useful as an independent per-arch check
      # that packaging itself still works), just never on a do_package
      # release run, where they instead run the install-tree steps below for
      # package-macos-universal to lipo-merge, and that job uploads the
      # actual release artifact.
      #
      # cpack reuses the same build/config-<leg> tree the Configure and Build
      # steps above already produced - pack-<leg> points at the same
      # config-<leg> configurePreset - so this proves the packaging path
      # against the exact build that was just tested, not a separate one.
      - name: Package
        if: >-
          matrix.packageable &&
          (matrix.preset == 'windows-msvc' ||
           (inputs.do_package && matrix.release_package) ||
           ((matrix.preset == 'macos-llvm' || matrix.preset == 'macos-llvm-x64') && !inputs.do_package))
        shell: bash
        # CPack's own NSIS generator writes makensis's real error to
        # NSISOutput.log rather than this step's own stdout/stderr (its own
        # "Please check ... for errors" message is the only trace here
        # otherwise) - same reasoning as setup-msvc-env's "re-run unsuppressed
        # so the banner/error reaches the log" for vcvars64.bat.
        run: |
          cpack --preset pack-${{ matrix.preset }} || {
            status=$?
            log="packages/_CPack_Packages/win64/NSIS/NSISOutput.log"
            if [ -f "$log" ]; then
              echo "::group::NSISOutput.log"
              cat "$log"
              echo "::endgroup::"
            fi
            exit "$status"
          }

      # DR7: the whole point of installing makensis above is that its
      # absence stops being silent. cmake/Packaging.cmake's find_program()
      # gate degrades to a ZIP-only package with just a message(WARNING ...)
      # rather than failing cpack outright - the right behaviour for a local
      # dev build without NSIS installed, the wrong one here, where makensis
      # was just installed on purpose and a missing .exe means that install
      # broke rather than a deliberate choice. Failing loudly on this leg is
      # what keeps DR7 fixed instead of quietly regressing the same way
      # again - see docs/releasing.md#winget-manifest.
      - name: Assert the NSIS installer was produced (Windows)
        if: matrix.packageable && (matrix.preset == 'windows-msvc' || (inputs.do_package && matrix.release_package)) && runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          exes=(packages/*.exe)
          if [ ${#exes[@]} -eq 0 ]; then
            echo "::error::cpack produced no NSIS installer (.exe) - makensis is missing or cmake/Packaging.cmake's find_program() gate silently dropped NSIS again. Check the 'Install NSIS (Windows)' step and the configure log's warnings above."
            exit 1
          fi

      # The demo's own archive (cmake/Packaging.cmake's crucible component).
      # Without this the component could stop being packaged - a stale
      # CPACK_COMPONENTS_ALL, a rename, the option not reaching cpack - and
      # the only symptom would be a release quietly missing an asset.
      - name: Assert the AC3Forge Crucible was packaged (Windows)
        if: matrix.crucible && matrix.release_package && (matrix.preset == 'windows-msvc' || inputs.do_package)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(packages/ac3forge-crucible-*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::cpack produced no ac3forge-crucible-*.zip - the crucible component did not reach CPACK_COMPONENTS_ALL (cmake/Packaging.cmake) or its install rules produced nothing (apps/crucible/CMakeLists.txt)."
            ls -1 packages/ || true
            exit 1
          fi
          printf 'packaged: %s\n' "${zips[@]}"
          # A plausible archive with no Qt beside the window is the real
          # failure mode here, not an empty one - see the script's own header.
          python tools/ci/check_crucible_package.py "${zips[0]}"

      # Hearth's own archive (cmake/Packaging.cmake's hearth component,
      # apps/hearth/ui/CMakeLists.txt's install rules, phase A7). Guarded by
      # matrix.release_package alone, not matrix.crucible above: Hearth
      # builds and packages on every Windows leg (AC3FORGE_BUILD_HEARTH,
      # root CMakeLists.txt, defaults ON), windows-msvc-arm64 included,
      # where Crucible does not.
      - name: Assert the AC3Forge Hearth was packaged (Windows)
        if: matrix.release_package && (matrix.preset == 'windows-msvc' || inputs.do_package)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(packages/ac3forge-hearth-*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::cpack produced no ac3forge-hearth-*.zip - the hearth component did not reach CPACK_COMPONENTS_ALL (cmake/Packaging.cmake) or its install rules produced nothing (apps/hearth/ui/CMakeLists.txt)."
            ls -1 packages/ || true
            exit 1
          fi
          printf 'packaged: %s\n' "${zips[@]}"
          # The same failure mode as Crucible's own step above: a plausible
          # archive with no Qt beside the window - see the script's own header.
          python tools/ci/check_hearth_package.py "${zips[0]}"

      - name: Upload package artifacts
        if: >-
          matrix.packageable &&
          (matrix.preset == 'windows-msvc' ||
           (inputs.do_package && matrix.release_package) ||
           ((matrix.preset == 'macos-llvm' || matrix.preset == 'macos-llvm-x64') && !inputs.do_package))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.preset }}
          # An explicit extension allowlist, not packages/* - CPack leaves its
          # per-generator staging tree behind under packages/_CPack_Packages/
          # (never cleaned up; this is normal CPack behaviour, not a bug
          # here), and a bare packages/* glob matches that directory too.
          # DragNDrop's staging tree in particular contains a symlink to
          # /Applications for the drag-to-install UX - upload-artifact
          # dereferences symlinks by default, so on a macOS runner that walks
          # straight into the real /Applications (Xcode's framework tree is
          # notorious for symlink cycles) and OOMs the upload step's Node
          # process trying to archive it. See actions/upload-artifact#619 and
          # #590. Restricting the glob to real package files and their
          # checksums - the same extensions github-release's own glob looks
          # for - sidesteps the staging tree entirely rather than trying to
          # outrun it with excludes.
          path: |
            packages/*.zip
            packages/*.zip.sha512
            packages/*.tar.gz
            packages/*.tar.gz.sha512
            packages/*.deb
            packages/*.deb.sha512
            packages/*.rpm
            packages/*.rpm.sha512
            packages/*.exe
            packages/*.exe.sha512
            packages/*.dmg
            packages/*.dmg.sha512
          if-no-files-found: error

