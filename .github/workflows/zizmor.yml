# Static analysis of the workflow YAML itself (script injection via
# untrusted inputs, overly-broad permissions, unpinned actions, etc.) -
# complements CodeQL/OSV-Scanner, which only look at application/dependency
# code, not the CI pipeline that builds and releases it.
#
# Visible-only (continue-on-error on the scan step): findings land in the
# Security > Code scanning tab but don't block merges. dependency-review.yml
# is this repo's one blocking check - see .github/branch-protection.md.
# Modelled on CountdownSolver's .github/workflows/zizmor.yml.
name: Zizmor

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "50 3 * * 1"
  workflow_dispatch:

env:
  ZIZMOR_VERSION: "1.27.0"

permissions: {}

concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Analyze workflows
    runs-on: ubuntu-latest
    # vars.PAUSE_NONESSENTIAL_CI: a temporary, reversible-by-variable pause on
    # non-required PR-time checks during a merge-queue drain, freeing hosted
    # runner concurrency for the checks that actually gate merging (see
    # .github/branch-protection.md's required list, which this is not on).
    # push:main/schedule/workflow_dispatch runs are untouched. Clear/remove
    # the variable to revert - no code change needed.
    if: github.event_name != 'pull_request' || vars.PAUSE_NONESSENTIAL_CI != 'true'
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run zizmor
        # continue-on-error: findings should surface in the Security tab, not
        # turn every workflow-touching PR red.
        continue-on-error: true
        run: uvx "zizmor@${ZIZMOR_VERSION}" --format=sarif . > results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif
          category: zizmor
