# CodeQL static analysis across every language in this repository, run
# nightly against main.
#
# Trigger: one schedule at 02:17 UTC, plus workflow_dispatch. No push,
# pull_request or merge_group trigger: code-analysis engines in this repo run
# once a night on refs/heads/main, and only the jobs that build, run or
# measure the codec's output stay on ci.yml's per-PR/per-queue-entry path.
# A schedule run analyses the default branch's latest commit, which is the
# ref that refreshes main's Security > Code scanning baseline, so dropping
# push:main loses nothing. docs/ci-self-hosted-runners.md "Nightly analysis
# window" has the cron table this slot sits in, alongside msvc-analysis.yml
# and the other repo that shares the runner fleet.
#
# Surfacing: codeql-action/analyze does not fail on findings, and nothing
# reliably notifies anyone about a new alert on the default branch (GitHub's
# documented code-scanning notifications cover alert assignment), so a
# finding from a nightly would otherwise sit in the Security tab until
# someone opened it. The `surface` job at the bottom queries the code-scanning API
# for CodeQL alerts on refs/heads/main created since the previous nightly and
# fails on any; that failure, or an analyze failure, opens or refreshes one
# `nightly-analysis` issue through .github/actions/report-nightly-failure.
#
# The C++ leg is modelled on CountdownSolver's .github/workflows/codeql.yml
# (same CMake+vcpkg shape, same gitflow model) - build-mode: manual,
# library+CLI only, no Qt app: the GUI adds nothing CodeQL needs to see and
# config-linux-gcc already defaults AC3FORGE_BUILD_GUI off (see
# CMakePresets.json), so this is the same build ci.yml's static-analysis
# (clang-tidy) job already proves clean.
#
# The other two legs (roadmap VX14) cover code the C++ leg never saw: ~30
# Python files (the oracles and CI gates under tools/, plus the python/
# binding package) and apps/wasm/demo.js. They take build-mode: none -
# nothing needs compiling for CodeQL to extract them - and so run straight on
# the hosted runner without this workflow's container, GCC install or vcpkg
# step, which is why the steps below are conditioned on the language rather
# than split into a second workflow.
#
# java-kotlin is deliberately NOT in the matrix, and that is a measured
# result, not an oversight. It was added alongside the other two and
# dispatched on this branch (run 32637028120, 2026-08-23); CodeQL 2.26.3
# reported "Detected 11 Kotlin files in your project that could not be
# processed without a build" and ended the job as a configuration error.
# CodeQL's Kotlin extractor has no buildless mode - apps/android is 100%
# Kotlin, so build-mode: none extracts nothing at all. The alternatives are
# autobuild or manual, both of which mean standing up the full Android
# toolchain this workflow otherwise has no use for: JDK 17, the pinned NDK,
# Gradle and the object-signing key material, all of which _build.yml's
# android job already provisions over several minutes. That is a
# disproportionate cost for eight thin bridge/UI files, and the right shape
# for it is a CodeQL step inside that existing job rather than a fifth leg
# here - left as follow-up work rather than shipped as a permanently red
# matrix entry.
#
# Complements platform-macros (no-#ifdef rule), static-analysis (clang-tidy)
# and script-lint (ruff/shellcheck/actionlint) in ci.yml: those catch
# style/portability issues, CodeQL finds actual security-relevant defects
# (buffer overflow, use-after-free, tainted data flow) and publishes them to
# Security > Code scanning.
name: CodeQL

on:
  schedule:
    # Nightly against main - see docs/ci-self-hosted-runners.md "Nightly
    # analysis window": ac3forge owns 02:00-03:15 UTC on the shared fleet,
    # aqualink-automate owns ~04:00. Off-minute per GitHub's own advice.
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  # One nightly at a time; a manual dispatch queues behind a running nightly
  # rather than cancelling it (an analysis that never finishes uploads nothing).
  group: codeql-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Single source of truth for the vcpkg pin below - see
  # docs/ci-self-hosted-runners.md and _toolchain-versions.yml's own header.
  toolchain-versions:
    uses: ./.github/workflows/_toolchain-versions.yml
    permissions:
      contents: read
      actions: read
    secrets:
      ORG_RUNNERS_TOKEN: ${{ secrets.ORG_RUNNERS_TOKEN }}

  # Same self-hosted/GitHub-hosted routing ci.yml's check-runner gives its
  # single-leg jobs (see docs/ci-self-hosted-runners.md). The C++ analyze
  # leg is a full tracer build inside the same pinned ubuntu:26.04
  # container the CI matrix uses, so it runs identically on either pool;
  # the interpreted legs are seconds long either way. At 02:17 the fleet is
  # normally idle, so `auto` lands every leg on self-hosted whenever a Linux
  # runner is online. The job itself is control-plane, routed by
  # vars.CONTROL_RUNNER_JSON with the same delete-the-variable kill switch as
  # ci.yml's check-runner. No fork-PR pin here: with no pull_request trigger,
  # decide-runner only ever runs from a checkout of a ref in this repository
  # (main on the schedule, whichever branch a workflow_dispatch names), never
  # from a fork.
  check-runner:
    name: Check self-hosted runner availability
    runs-on: ${{ fromJSON(vars.CONTROL_RUNNER_JSON || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      actions: read
    outputs:
      runner: ${{ steps.decide.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: decide
        uses: ./.github/actions/decide-runner
        with:
          os-label: Linux
          hosted-json: '["ubuntu-latest"]'
          mode: ${{ vars.RUNNER_LINUX_MODE || 'auto' }}
          org-token: ${{ secrets.ORG_RUNNERS_TOKEN }}

  # `display`, not `language`, in the job name, and "C++" spelled as it was
  # before this became a matrix. No ruleset selects these check names any
  # more (nothing here reports on a PR), but the rendered name is what the
  # run history filters by and the `category` on the analyze step is what
  # the Security > Code scanning alert history is keyed by - keep both
  # stable. Adding a leg is free; renaming one splits its history.
  analyze:
    name: Analyze (${{ matrix.display }})
    needs: [toolchain-versions, check-runner]
    runs-on: ${{ fromJSON(needs.check-runner.outputs.runner) }}
    # C++ leg 8.6 min median on the fleet (2026-09-04); the interpreted legs
    # are seconds. A hung run would otherwise hold a Linux fleet slot for
    # GitHub's 360-minute default, into aqualink-automate's 04:00 window.
    # Unmeasured on ubuntu-latest (the fallback when no Linux runner is
    # online) - raise this if a hosted run trips it.
    timeout-minutes: 45
    # Empty for every interpreted leg, so only the C++ one pays for the pinned
    # ubuntu:26.04 image (and the bootstrap/toolchain/vcpkg steps that follow).
    container: ${{ matrix.container }}
    permissions:
      security-events: write
      contents: read
    strategy:
      # One language's extractor failing should not hide the others' results.
      fail-fast: false
      matrix:
        include:
          - language: cpp
            display: C++
            build-mode: manual
            container: ubuntu:26.04
          - language: python
            display: Python
            build-mode: none
            container: ""
          - language: javascript-typescript
            display: JavaScript
            build-mode: none
            container: ""
    steps:
      # Before checkout: the bare ubuntu image has no git, and actions/checkout
      # silently degrades to a REST tarball download without it. Also installs
      # what the toolchain script assumes is present (lsb_release,
      # add-apt-repository, curl+gnupg) - the same package list ci.yml's
      # static-analysis job uses. No libasound2-dev: this build never enables
      # AC3FORGE_BUILD_GUI, and the ALSA backend is optional, auto-detected,
      # and irrelevant to what CodeQL is scanning for here.
      - name: Bootstrap container
        if: matrix.container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates cmake curl git gnupg lsb-release \
            ninja-build pkg-config software-properties-common tar unzip wget zip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GCC 16
        if: matrix.language == 'cpp'
        run: bash .github/toolchain/02-gcc-toolchain.sh

      - uses: ./.github/actions/setup-vcpkg
        if: matrix.language == 'cpp'
        with:
          vcpkg-commit: ${{ needs.toolchain-versions.outputs.vcpkg_commit }}

      # CodeQL's TypeScript extraction shells out to `node` (first needed
      # when js/'s .ts sources landed with UX5). The GitHub-hosted image
      # ships Node; the self-hosted fleet image does not - and since #466
      # this leg runs bare on whichever pool check-runner picks, so pin
      # Node explicitly on the one leg that needs it rather than routing
      # the leg away (the follow-the-toolchain rule from
      # docs/ci-self-hosted-runners.md).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.language == 'javascript-typescript'
        with:
          node-version: "24"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Path filtering only - see the file's own header.
          config-file: ./.github/codeql/codeql-config.yml
          # security-and-quality layers CodeQL's maintainability/reliability
          # queries on top of the default security set - the same
          # deterministic rule layer GitHub's paid Code Quality product runs,
          # which doesn't cover C++ (and isn't available on this org's plan)
          # anyway, so this suite is how this repo gets that analysis. Not
          # adopted a priori: a measured dispatch run on this codebase first
          # (2026-08-22, the same discipline as .clang-tidy's curation)
          # showed 179 rules and ZERO findings against the default suite's
          # 58 rules / zero - the suite starts from a clean baseline, so any
          # future finding is new signal, not inherited noise.
          #
          # The same suite is used for Python and JavaScript, but that
          # measurement does NOT transfer - it was taken against the C++
          # extractor's rule set. Both were dispatched on this branch before
          # landing (run 32637028120, 2026-08-23) and completed clean, so
          # they start from the same zero-findings baseline the C++ leg does.
          queries: security-and-quality

      - name: Configure
        if: matrix.language == 'cpp'
        run: cmake --preset config-linux-gcc

      - name: Build
        if: matrix.language == 'cpp'
        run: cmake --build --preset build-linux-gcc -- -k 0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:${{ matrix.language }}"

  # Turns "a new CodeQL alert appeared on main" into something a person sees
  # the next morning. codeql-action/analyze never fails on findings and
  # GitHub does not notify on new default-branch alerts, so this job asks
  # the code-scanning API for CodeQL alerts on refs/heads/main created inside
  # the last nightly window and fails if there are any; that failure, or the
  # analyze matrix failing, is handed to the shared report-nightly-failure
  # action, which opens (or comments on) one `nightly-analysis` issue for
  # this engine. `!cancelled()` rather than `always()`: an analyze failure is
  # still reported rather than skipped past, but a run someone cancelled by
  # hand does not open an issue over it. analyze keeps codeql-action's
  # default wait-for-processing: true, so the alerts exist by the time this
  # runs. The query is pinned to refs/heads/main, the ref the schedule
  # analyses; a workflow_dispatch from another branch uploads against that
  # branch and this job does not see it, so the alert-to-issue path can only
  # be exercised on main.
  surface:
    name: Surface findings
    needs: analyze
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(vars.CONTROL_RUNNER_JSON || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      security-events: read
      issues: write
    env:
      TOOL: CodeQL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail on code-scanning alerts created since the last nightly
        env:
          GH_TOKEN: ${{ github.token }}
          # Nightly cadence plus an hour of slack for a late-starting run.
          # The 25 h window overlaps the previous run by about an hour, so an
          # alert from night N is listed again on night N+1 while it stays
          # open - a second comment on the same issue, not a second finding.
          WINDOW_HOURS: "25"
        shell: bash
        run: |
          set -euo pipefail
          since="$(date -u -d "-${WINDOW_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)"
          # The alerts endpoint has no created-since filter: ask for the
          # newest first and filter client-side. One page of 100 bounds the
          # call; more than 100 new alerts in one night would be truncated,
          # which is acceptable for a "did anything new appear" signal.
          gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&ref=refs/heads/main&tool_name=${TOOL}&sort=created&direction=desc&per_page=100" \
            --jq ".[] | select(.created_at > \"${since}\") | \"\\(.number)\\t\\(.rule.id)\\t\\(.most_recent_instance.location.path):\\(.most_recent_instance.location.start_line)\\t\\(.html_url)\"" \
            > new-alerts.tsv
          count="$(wc -l < new-alerts.tsv | tr -d '[:space:]')"
          if [ "${count}" -gt 0 ]; then
            echo "::error::${count} new ${TOOL} alert(s) on main since ${since}:"
            cat new-alerts.tsv
            exit 1
          fi
          echo "No new ${TOOL} alerts on main since ${since}."

      - uses: ./.github/actions/report-nightly-failure
        if: failure() || needs.analyze.result != 'success'
        with:
          engine: ${{ env.TOOL }}
          detail: "New CodeQL alerts on main since the previous nightly, or the analysis itself failed. See the run log, then Security > Code scanning filtered to refs/heads/main and tool CodeQL."
