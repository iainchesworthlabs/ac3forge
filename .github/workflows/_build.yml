# Reusable configure/build/test workflow — the single definition of how ac3forge
# is built and tested on each platform. Called by ci.yml (do_package defaults
# false: only windows-msvc packages, continuously, as a packaging smoke test)
# and by release.yml (do_package: true: the release_package legs — one
# canonical leg per OS/arch — package, and a packaging failure there blocks
# the release). macOS (DR8) is the one platform that no longer fits that
# "one release_package leg" shape: neither macos-llvm nor macos-llvm-x64
# carries release_package any more — package-macos-universal, a separate job
# below, lipo-merges their two single-arch install trees into one universal
# binary and packages THAT as the release's canonical macOS artifact instead.
# Modelled on an earlier project's _build.yml.
#
# ---------------------------------------------------------------------------
# On `experimental: true`
# ---------------------------------------------------------------------------
# Every leg but one is proven green now (exact test counts per leg drift as
# features land - see ci.yml's own status comment rather than trusting a
# number repeated here; the sanitizer leg also runs the codec-matrix script's
# full layout/tool/atmos sweep) and required. macos-llvm-x64 (DR8) is the
# latest promoted: brand new, on a runner label (macos-15-intel) nothing here
# had used before, it went three consecutive real, hosted-runner runs (two
# release dry runs plus its own required PR CI) at real gold-reference SNR
# numbers (67.80/67.82/67.76 dB, matching the x86 baseline every other
# non-arm64 leg reports) before this line came off - not just "it compiled."
# macos-llvm itself was promoted the same way earlier: its first-ever real
# run surfaced a genuine, fully-understood issue (Homebrew's unpinned LLVM
# formula flagging Catch2's __COUNTER__ usage under -Wc2y-extensions - see
# cmake/CompilerWarnings.cmake), fixed in one commit, followed by two
# consecutive clean runs including the gold-reference gate
# (tools/checks/verify_gold_reference.sh). windows-msvc-arm64 (a separate
# DR8 half, Windows ARM64, unrelated to this file's own macOS work) is the
# one leg still experimental, on its own runner label (windows-11-arm)
# nothing here had used before it either - same bar, not yet met. See the
# table in ci.yml.
#
# Experimental legs run with continue-on-error, which reports their real
# status without making the default branch red on every push. As each one is
# fixed, delete its `experimental: true` line; the leg then blocks like the
# others do. That one-line change is the whole promotion process.
name: Reusable Build

on:
  workflow_call:
    inputs:
      do_package:
        description: "Package every packageable matrix leg (best-effort), not just windows-msvc. Set by release.yml."
        type: boolean
        default: false
      version_tag:
        description: "Resolved v* tag, threaded into configure as DERIVED_VERSION_OVERRIDE so the build stamps it deterministically. Empty in CI -> `git describe` (see GitVersionDerivation.cmake)."
        type: string
        default: ""
      fetch_depth:
        description: "checkout fetch-depth (0 for releases so `git describe`/cut-from-main see full history + tags; 1 for ordinary CI, which accepts the 0.0.0-dev fallback)."
        type: number
        default: 1
      persist_quality_trend:
        description: >-
          After the gold-reference gate passes on every leg, append this run's SNR results to the
          quality-history branch (see docs/quality-trend.md). Computed and set by ci.yml only for
          direct pushes to main - never for a PR, so unmerged work never pollutes the
          trend - and left false by release.yml's call, which is tag-triggered, not a push at
          all. A plain boolean input rather than this job re-deriving
          github.event_name/github.ref itself: those reflect the reusable workflow's own call
          context, and computing the condition once at the unambiguous caller site is simpler
          than relying on exactly how that context propagates through workflow_call.
        type: boolean
        default: false
      quality_trend_branch:
        description: "github.ref_name at the call site, for the same reason as persist_quality_trend above. Empty when persist_quality_trend is false."
        type: string
        default: ""
      publish_conformance_vectors:
        description: >-
          Run the conformance-vector generator's determinism check and upload the bundle as an
          artifact for release.yml to attach (roadmap VX20, docs/conformance-vectors.md). The
          generator itself runs on the linux-gcc leg either way - see that step's own comment;
          this input only adds the second, verifying pass and the upload. Set by release.yml.
        type: boolean
        default: false
    secrets:
      ATMOS_SIGNING_KEY:
        description: "EMDF object-signing key, base64-encoded. When set (passed by BOTH ci.yml and release.yml), build-android decodes it into the app's bundled signing.key asset so the DEBUG APK - which is a never-uploaded smoke test - signs Atmos objects at runtime. The asset is deleted again before any release step, and the staged release APK is asserted key-free, so a published .apk is always the safe unsigned bed51 app. Unset -> no asset is written at all. An APK that does carry the asset IS the key and must never be distributed."
        required: false
      ANDROID_KEYSTORE_BASE64:
        description: "Release keystore, base64-encoded. Passed by release.yml only; unset on ci.yml's call, which never sets do_package for a release APK anyway. See build-android's own comment for why the app still builds fine without it."
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      ORG_RUNNERS_TOKEN:
        description: >-
          Optional org-scoped PAT/App token with "Self-hosted runners: read" on
          iainchesworthlabs, letting check-runners see runners registered at the org level
          (see iainchesworthlabs/ci-runners) rather than just this repo's own runner list.
          Unset -> that half of the live check is skipped, not an error; the repo-level
          check alone still works once a runner is registered directly against this repo.
        required: false

permissions:
  contents: read

jobs:
  # Decides, per OS and per leg, whether each of the plain Windows/Linux legs
  # below should build on a self-hosted runner or fall back to GitHub-hosted -
  # fanning legs across BOTH pools in the same run rather than an all-or-
  # nothing choice for the whole OS. See docs/ci-self-hosted-runners.md for
  # the full design; the short version:
  #   - a fork PR never gets a self-hosted label, full stop - untrusted code
  #     must never land on a persistent runner, no live check needed.
  #   - vars.RUNNER_LINUX_MODE / RUNNER_WINDOWS_MODE (`auto` default,
  #     `self-hosted`, or `github-hosted`) let a forced mode skip the live
  #     check entirely - an explicit override is trusted outright.
  #   - `auto` counts this repo's own registered runners (works today, empty
  #     until a runner is actually registered against ac3forge) and, if the
  #     optional ORG_RUNNERS_TOKEN secret is set, the iainchesworthlabs org's
  #     runners too (what actually matters once the org migration in
  #     iainchesworthlabs/ci-runners lands - see that repo for the fleet
  #     itself, which this workflow only consumes, never provisions), then
  #     hands self-hosted to as many legs as there are currently idle
  #     self-hosted runners and GitHub-hosted to the overflow - so a run
  #     lands on self-hosted where it can and GitHub-hosted where it can't,
  #     never queuing one leg behind another's use of the same shared pool.
  # Any API failure degrades to GitHub-hosted rather than failing the job -
  # this check being unavailable is never a reason to block CI.
  check-runners:
    name: Check self-hosted runner availability
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      linux_runner_1: ${{ steps.decide.outputs.linux_runner_1 }}
      linux_runner_2: ${{ steps.decide.outputs.linux_runner_2 }}
      linux_runner_3: ${{ steps.decide.outputs.linux_runner_3 }}
      linux_runner_4: ${{ steps.decide.outputs.linux_runner_4 }}
      windows_runner_1: ${{ steps.decide.outputs.windows_runner_1 }}
      windows_runner_2: ${{ steps.decide.outputs.windows_runner_2 }}
    steps:
      - name: Decide runner labels per OS
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          ORG_TOKEN: ${{ secrets.ORG_RUNNERS_TOKEN }}
          REPO: ${{ github.repository }}
          ORG: iainchesworthlabs
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          LINUX_MODE: ${{ vars.RUNNER_LINUX_MODE || 'auto' }}
          WINDOWS_MODE: ${{ vars.RUNNER_WINDOWS_MODE || 'auto' }}
        shell: bash
        run: |
          set -uo pipefail
          HOSTED_LINUX='["ubuntu-latest"]'
          HOSTED_WINDOWS='["windows-latest"]'
          SELF_LINUX='["self-hosted","Linux","X64"]'
          SELF_WINDOWS='["self-hosted","Windows","X64"]'
          # One check-runners call covers every plain Linux/Windows leg in
          # the build matrix below - four Linux (GCC, LLVM, LLVM ASan+UBSan,
          # LLVM TSan) and two Windows (MSVC, LLVM) today. Bump these, and
          # add a matching numbered output above and matrix.runner reference
          # below, if a leg is added or removed.
          LINUX_LEGS=4
          WINDOWS_LEGS=2

          # Untrusted fork-PR code never touches self-hosted infra - decided
          # here, before either mode override or the live check even run.
          if [ "$IS_FORK_PR" = "true" ]; then
            for i in $(seq 1 "$LINUX_LEGS"); do echo "linux_runner_$i=$HOSTED_LINUX" >> "$GITHUB_OUTPUT"; done
            for i in $(seq 1 "$WINDOWS_LEGS"); do echo "windows_runner_$i=$HOSTED_WINDOWS" >> "$GITHUB_OUTPUT"; done
            echo "Fork PR - every leg stays on GitHub-hosted runners."
            exit 0
          fi

          # Online, idle self-hosted runners carrying both "self-hosted" and
          # $2 (the OS label), summed across repo-level and (if ORG_TOKEN is
          # set) org-level runner lists - the two are always disjoint under
          # this org's model (a runner is registered at one scope or the
          # other, never both), so summing them can't double-count. The
          # count, not just whether it's non-zero, is what lets legs fan out
          # across self-hosted before overflowing onto GitHub-hosted. Never
          # fails the job: a missing/errored API response (e.g. no runner
          # registered against this repo yet, or ORG_TOKEN unset) just counts
          # as zero.
          runner_idle_count() {
            local scope="$1" os_label="$2" json count
            json="$(gh api "$scope/actions/runners" --jq '.runners' 2>/dev/null)" || { echo 0; return; }
            count="$(printf '%s' "$json" | jq "[.[] | select(.status==\"online\" and .busy==false and any(.labels[]; .name==\"self-hosted\") and any(.labels[]; .name==\"$os_label\"))] | length" 2>/dev/null)" || { echo 0; return; }
            echo "${count:-0}"
          }

          # Emits $5 lines, one runner-label set per leg: self-hosted for as
          # many legs as there are currently idle self-hosted runners
          # (capped at $5), GitHub-hosted for the rest. E.g. one idle
          # self-hosted Linux runner and two Linux legs sends leg 1 to
          # self-hosted and fans leg 2 out to GitHub-hosted immediately,
          # rather than queuing it behind whatever's already busy on the
          # self-hosted pool.
          decide_labels_for_os() {
            local mode="$1" os_label="$2" hosted="$3" self_hosted="$4" leg_count="$5"
            local idle=0
            case "$mode" in
              self-hosted)   idle="$leg_count" ;;
              github-hosted) idle=0 ;;
              *)
                idle="$(runner_idle_count "repos/$REPO" "$os_label")"
                if [ -n "${ORG_TOKEN:-}" ]; then
                  idle=$((idle + $(GH_TOKEN="$ORG_TOKEN" runner_idle_count "orgs/$ORG" "$os_label")))
                fi
                ;;
            esac
            local i
            for i in $(seq 1 "$leg_count"); do
              if [ "$i" -le "$idle" ]; then printf '%s\n' "$self_hosted"; else printf '%s\n' "$hosted"; fi
            done
          }

          # Assigns and logs one OS's legs: $7 is the output-name prefix
          # (e.g. "linux_runner" -> linux_runner_1, linux_runner_2, ...).
          assign_and_log() {
            local os_name="$1" mode="$2" os_label="$3" hosted="$4" self_hosted="$5" leg_count="$6" out_prefix="$7"
            local i=1 label
            while IFS= read -r label; do
              echo "${out_prefix}_${i}=$label" >> "$GITHUB_OUTPUT"
              echo "$os_name leg $i (mode=$mode) -> $label"
              i=$((i + 1))
            done < <(decide_labels_for_os "$mode" "$os_label" "$hosted" "$self_hosted" "$leg_count")
          }

          assign_and_log "Linux" "$LINUX_MODE" "Linux" "$HOSTED_LINUX" "$SELF_LINUX" "$LINUX_LEGS" "linux_runner"
          assign_and_log "Windows" "$WINDOWS_MODE" "Windows" "$HOSTED_WINDOWS" "$SELF_WINDOWS" "$WINDOWS_LEGS" "windows_runner"

  # Single source of truth for the tool-version pins the "Report and assert
  # toolchain versions" step below (and the setup-vcpkg/install-qt-action
  # steps) check the runner against - see docs/ci-self-hosted-runners.md and
  # _toolchain-versions.yml's own header.
  toolchain-versions:
    uses: ./.github/workflows/_toolchain-versions.yml
    permissions:
      contents: read
      actions: read
    secrets:
      ORG_RUNNERS_TOKEN: ${{ secrets.ORG_RUNNERS_TOKEN }}

  build:
    name: ${{ matrix.name }}
    needs: [check-runners, toolchain-versions]
    # Fork PRs never reach self-hosted (check-runners' own fork-PR branch
    # already forces hosted labels for them) - this is belt-and-braces so a
    # gap in that logic can't silently hand a fork PR a self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(matrix.runner) }}
    # A backstop against GitHub's own 360-minute default: the macos-llvm
    # leg's first-ever GUI run hung in the Test step and silently consumed
    # the full 6 hours before being force-cancelled (see
    # apps/gui/tests/CMakeLists.txt's QSG_RENDER_LOOP comment for the
    # hypothesis and the per-test TIMEOUT that now also bounds that specific
    # case). This is deliberately generous - the slowest leg observed so far
    # (windows-llvm, packaging included on windows-msvc) is ~22 minutes - so
    # it should never fire for a legitimately slow-but-working run, only for
    # a genuine hang anywhere in the job, known or not-yet-known.
    timeout-minutes: 90

    # Ubuntu 26.04 for the Linux legs, where the distro archive carries
    # gcc-16 (universe component - 02-gcc-toolchain.sh enables it) and LLVM 22
    # outright. This is a pin, not a convenience: on ubuntu-latest (24.04 at
    # the time of writing) the LLVM script has to fall back to apt.llvm.org,
    # whose noble repo is missing clang-tidy-22, lld-22 and libc++-22-dev, so
    # the install fails before a single file is compiled.
    # Pinning the container also stops a runner-image bump silently changing
    # the compiler under the matrix. Empty for the Windows/macOS legs, which
    # run directly on the host runner.
    container: ${{ matrix.container }}
    # A failing experimental leg annotates the run but does not fail it.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows MSVC"
            runner: ${{ needs.check-runners.outputs.windows_runner_1 }}
            preset: windows-msvc
            # Declared once, here, so `matrix.experimental` in continue-on-error
            # above resolves against a property the matrix actually defines -
            # without it every leg silently reads null and actionlint reports the
            # reference as undefined. Every other leg is non-experimental by
            # omission (the `|| false` fallback); a leg that IS experimental sets
            # this to true and continue-on-error keeps it out of CI Status.
            experimental: false
            # VS 2026 Build Tools / MSVC 14.5x, from the aka.ms/vs/18/stable
            # channel. Pinned by channel, not exact version: the runner image
            # ships whatever 18.x is current, and the assert step below fails
            # loudly if that ever stops being a 14.5x toolset.
            msvc: true
            packageable: true
            release_package: true
            gold_reference: true

          - name: "Windows LLVM (clang-cl)"
            runner: ${{ needs.check-runners.outputs.windows_runner_2 }}
            preset: windows-llvm
            msvc: true          # clang-cl targets the MSVC ABI: same headers, same libs
            llvm: true
            packageable: true
            gold_reference: true

          # ARM64 - GitHub's hosted windows-11-arm runner (roadmap DR8). Real
          # ARM64 hardware, not emulation. Deliberately NOT routed through
          # check-runners' self-hosted/hosted fan-out (the windows_runner_1/2
          # outputs the two legs above use) - that logic is sized for exactly
          # those two existing x64 Windows legs, and there is no self-hosted
          # ARM64 Windows capacity to fan out to; the literal runner label is
          # used directly instead.
          #
          # experimental: true, the same promotion path macos-llvm and
          # build-android both went through (see this file's own header) -
          # this leg's first real runs are exactly what confirms or corrects
          # the toolchain/vcvarsall/Qt/ffmpeg choices made without hosted-
          # runner access at authoring time. Delete this line once a run has
          # gone green for real.
          #
          # msvc_arch: arm64 threads through to the "Setup MSVC environment"
          # step, which otherwise always loads the x64 developer environment
          # (see .github/actions/setup-msvc-env/action.yml) - every other
          # matrix.msvc leg omits it and gets the action's own x64 default.
          #
          # No gui: true, unlike every other packageable leg. At authoring
          # time, Qt's only Windows ARM64 kit for the pinned 6.8.3
          # (win64_msvc2022_arm64_cross_compiled) is a cross-compile kit that
          # expects a paired win64_msvc2022_64 install for its host tools, and
          # aqtinstall has a documented CI bug against exactly that
          # combination (qtpaths.bat pointing at the wrong x64 setup) - real
          # complexity this leg's native-ARM64-host build doesn't need to
          # take on for a first pass. CMakePresets.json's windows-msvc-arm64
          # preset defaults AC3FORGE_BUILD_GUI off for exactly this reason
          # (see its own description) - the same "Qt kit not assumed present"
          # shape linux-gcc/linux-llvm/macos-llvm already use below, not a new
          # pattern. See docs/platforms/windows.md's ARM64 section.
          #
          # gold_reference: true - choco's ffmpeg package is x64-only, so this
          # leg installs BtbN's static win-arm64 ffmpeg build instead (see the
          # dedicated install step below).
          #
          # release_package: true, not just packageable: a genuinely new
          # architecture earns its own canonical release artifact, the same
          # precedent linux-gcc-arm64 already set sitting next to linux-gcc -
          # not a redundant same-arch compiler variant like windows-llvm
          # above (which stays non-canonical: no release_package there).
          - name: "Windows MSVC (arm64)"
            runner: '["windows-11-arm"]'
            preset: windows-msvc-arm64
            experimental: true
            msvc: true
            msvc_arch: arm64
            packageable: true
            release_package: true
            gold_reference: true

          # gui: true builds ac3gui too (the linux-gcc/linux-llvm presets
          # otherwise default AC3FORGE_BUILD_GUI off - see the preset's own
          # description in CMakePresets.json) and smoke-tests it headlessly
          # after Test, below. alsa_fallback: true additionally builds and
          # tests the no-ALSA fallback (see the step at the end). Both are
          # carried by this leg alone rather than doubled on linux-llvm too:
          # neither switch (Qt present/absent, ALSA present/absent) differs
          # between compilers, so paying for either twice would buy nothing.
          - name: "Linux GCC"
            runner: ${{ needs.check-runners.outputs.linux_runner_1 }}
            container: ubuntu:26.04
            preset: linux-gcc
            gcc: true
            gui: true
            packageable: true
            release_package: true
            alsa_fallback: true
            gold_reference: true
            conformance_vectors: true

          - name: "Linux LLVM (clang)"
            runner: ${{ needs.check-runners.outputs.linux_runner_2 }}
            container: ubuntu:26.04
            preset: linux-llvm
            llvm: true
            gui: true
            packageable: true
            gold_reference: true

          # arm64 - Raspberry Pi 4/5 and any other aarch64 Debian/Ubuntu
          # target (see docs/platforms/raspberry-pi.md). Real ARM hardware via
          # GitHub's hosted ubuntu-24.04-arm runner label, not QEMU emulation -
          # the same ubuntu:26.04 container image as the x64 legs, which pulls
          # its arm64 variant automatically on an arm64 runner. Otherwise the
          # same shape as linux-gcc/linux-llvm above, including which leg
          # carries alsa_fallback (compiler and architecture both don't affect
          # that switch - see linux-gcc's own comment).
          - name: "Linux GCC (arm64)"
            runner: '["ubuntu-24.04-arm"]'
            container: ubuntu:26.04
            preset: linux-gcc-arm64
            gcc: true
            gui: true
            packageable: true
            release_package: true
            alsa_fallback: true
            gold_reference: true

          - name: "Linux LLVM (arm64)"
            runner: '["ubuntu-24.04-arm"]'
            container: ubuntu:26.04
            preset: linux-llvm-arm64
            llvm: true
            gui: true
            packageable: true
            gold_reference: true

          # AddressSanitizer + UndefinedBehaviorSanitizer (cmake/Sanitizers.cmake),
          # -fno-sanitize-recover=all so a violation fails the job outright. Shares
          # the Linux LLVM container/toolchain; `sanitizer: true` additionally runs
          # the codec-matrix step below, since ctest's 200+ cases alone do not
          # reach every layout/tool/atmos code path a sanitizer needs to see
          # execute to be worth anything.
          #
          # Not `packageable`: there is no pack-linux-llvm-asan-ubsan preset
          # and there should not be one - a sanitizer-instrumented debug build
          # is a diagnostic tool, not something to ship.
          - name: "Linux LLVM ASan+UBSan"
            runner: ${{ needs.check-runners.outputs.linux_runner_3 }}
            container: ubuntu:26.04
            preset: linux-llvm-asan-ubsan
            llvm: true
            sanitizer: true

          # ThreadSanitizer (roadmap VX16). A DIFFERENT question from the
          # ASan+UBSan leg above, not a duplicate of it: ASan/UBSan ask
          # whether one thread's memory and arithmetic are sound, TSan asks
          # whether two threads agree on who owns what - and no other gate in
          # this repository can see a data race at all. src/audio is a
          # lock-free SPSC ring, a silence watchdog and a clock-drift servo
          # shared between a real-time callback thread and the encoder
          # thread, which is exactly the shape where a missing
          # acquire/release is both easy to write and invisible until it
          # corrupts audio on someone else's machine.
          #
          # Its test preset runs `-L concurrency` rather than the whole
          # suite (CMakePresets.json's test-linux-llvm-tsan filter): TSan's
          # shadow memory makes every test several times slower, and the
          # other ~600 cases are single-threaded codec maths where it has
          # nothing to report. That keeps this leg to about the cost of a
          # build rather than a second full matrix entry - the ctest run
          # itself was 7 seconds over 36 tests when this landed.
          #
          # No `sanitizer: true`: that flag means the codec-matrix step, and
          # driving every layout/tool combination through ac3cli is an
          # ASan/UBSan errand. Not `gold_reference` or `packageable` either,
          # same reasoning as the ASan+UBSan leg's own comment above.
          - name: "Linux LLVM TSan"
            runner: ${{ needs.check-runners.outputs.linux_runner_4 }}
            container: ubuntu:26.04
            preset: linux-llvm-tsan
            llvm: true

          # No Mac is available to the project locally, so CI remains the only
          # place this is exercised - proven green (build+test+gold-reference
          # gate) as of the CI run that landed this comment; see _build.yml's
          # own header for how that happened. llvm: true pulls in the Homebrew
          # LLVM install step below - without it,
          # cmake/toolchains/macos.llvm.toolchain.cmake's find_program still
          # succeeds (its NAMES list falls back to plain "clang", which
          # resolves to Apple's system clang via HINTS/PATH), so a bare
          # runner would not fail to configure - it would silently build with
          # whatever AppleClang Xcode ships instead of the Homebrew LLVM
          # every other leg's pinned equivalent aims for.
          #
          # gui: true builds ac3gui here too, same meaning as the Linux gui:
          # true legs above: CMakePresets.json's macos-llvm preset defaults
          # AC3FORGE_BUILD_GUI off for the same "Qt kit not assumed present"
          # reason as Linux, not because ac3gui cannot be built on macOS -
          # cmake/FindQt6.cmake already carries Homebrew's Qt6 prefixes
          # (/opt/homebrew/opt/qt, /opt/homebrew/opt/qt6) and
          # apps/gui/CMakeLists.txt's APPLE branch (MACOSX_BUNDLE,
          # qt_generate_deploy_qml_app_script under `if(WIN32 OR APPLE)`) was
          # already written for this, just never exercised. "Install Qt6
          # (macOS GUI)" below installs Homebrew's "qt" formula, which bundles
          # qtdeclarative (and so qmlcachegen) the same way the Linux apt
          # packages do. cmake/Packaging.cmake's DragNDrop generator needs no
          # change either - it already packages whatever install() rules ran,
          # ac3gui's included, once AC3FORGE_BUILD_GUI is ON.
          #
          # No release_package any more (DR8): this leg's own cpack .dmg is
          # arm64-only and no longer what a release ships as "the" macOS
          # package - package-macos-universal below lipo-merges this leg's
          # install tree with macos-llvm-x64's into one universal binary and
          # that job packages and uploads the canonical release artifact
          # instead. This leg still packages on every ordinary push
          # (packageable stays true, and the Package/Upload steps below now
          # special-case both macOS legs the same way windows-msvc always
          # has) as its own single-arch smoke test of the packaging path -
          # just not as a release artifact any more. mac_arch feeds the
          # per-arch artifact name the do_package-only install/upload steps
          # below use, so package-macos-universal can download each leg's
          # tree by exact name.
          - name: "macOS LLVM (Homebrew)"
            runner: '["macos-latest"]'
            preset: macos-llvm
            mac_arch: arm64
            llvm: true
            gui: true
            packageable: true
            gold_reference: true

          # x86_64 half of DR8's macOS universal binaries. macos-15-intel is
          # real native Intel hardware (confirmed against
          # docs.github.com/en/actions/reference/runners/github-hosted-runners
          # directly, not assumed), free for public repos - so this is a real
          # build, not a cross-compile or Rosetta emulation. Same toolchain
          # file, same Homebrew install steps, same reasoning as the arm64 leg
          # above throughout this job; only the preset/triplet (x64-macos-llvm)
          # and runner label differ.
          #
          # No longer experimental: three consecutive real, hosted-runner runs
          # went green on this brand-new macos-15-intel label before this line
          # came off - the v0.0.0-alpha.1 and v0.0.0-alpha.2 release dry runs
          # and this feature branch's own required PR CI - each with a real
          # gold-reference pass (67.80/67.82/67.76 dB, matching the x86
          # baseline every other non-arm64 leg reports), not just "it
          # compiled." Same promotion process macos-llvm and build-android
          # went through before it - see this file's own header.
          - name: "macOS LLVM x64 (Homebrew, Intel)"
            runner: '["macos-15-intel"]'
            preset: macos-llvm-x64
            mac_arch: x64
            llvm: true
            gui: true
            packageable: true
            gold_reference: true

    steps:
      # Before checkout: the bare ubuntu image has no git, and actions/checkout
      # silently degrades to a REST tarball download without it. Also installs
      # what the toolchain scripts assume is present (lsb_release,
      # add-apt-repository, curl+gnupg for the apt.llvm.org key path).
      #
      # libasound2-dev is the ALSA backend's only dependency, and the reason it
      # is here rather than left out is that its ABSENCE is not a build
      # failure: src/audio/CMakeLists.txt would fall back to the no-op
      # posix/ directory and CI would go green having compiled none of
      # src/audio/src/backend/alsa/. The alsa_fallback step at the end covers
      # the other half of that switch on purpose.
      - name: Bootstrap container
        if: matrix.container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates cmake curl file git gnupg libasound2-dev lsb-release \
            ninja-build pkg-config rpm software-properties-common tar unzip wget zip

      # Qt is a prebuilt dependency (cmake/FindQt6.cmake), never a vcpkg port -
      # see that file's own header. qt6-declarative-dev-tools/qt6-base-dev-tools
      # pull in qmlcachegen and the other build-time QML tooling
      # qt_add_qml_module needs; without them the GUI configure step fails
      # rather than quietly building without AOT-compiled QML.
      - name: Install Qt6 (Linux GUI)
        if: matrix.gui && runner.os == 'Linux'
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y -qq --no-install-recommends \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-declarative-dev-tools

      # Homebrew's "qt" formula is the umbrella Qt6 package (unlike apt's
      # split qt6-base-dev/qt6-declarative-dev): one install pulls in
      # QtDeclarative/QtQuick and their build-time tooling (qmlcachegen)
      # alongside QtCore/QtGui, so there is no second "-dev-tools" formula to
      # add the way there is on Linux. cmake/FindQt6.cmake already searches
      # /opt/homebrew/opt/qt and /opt/homebrew/opt/qt6 (Apple Silicon's
      # Homebrew prefix, which is what macos-latest runners are), so no
      # -DAC3FORGE_QT_ROOT/CMAKE_PREFIX_PATH override is needed here the way
      # Windows' prebuilt-kit install does.
      - name: Install Qt6 (macOS GUI)
        if: matrix.gui && runner.os == 'macOS'
        run: brew install qt

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}

      # ---------------------------------------------------------------------
      # Toolchains
      # ---------------------------------------------------------------------
      # gcc-16 and LLVM 22, from the scripts the org-shared runner fleet repo,
      # iainchesworthlabs/ci-runners, uses to build its own images, copied
      # verbatim. On the pinned 26.04 container both take
      # the distribution-archive path and neither fallback runs. Each script
      # asserts its own resulting version and exits non-zero on drift.
      # `sudo` is absent in the container (already root) and required on the
      # host runners, hence the probe rather than a hardcoded prefix.
      - name: Install GCC 16
        if: matrix.gcc
        run: |
          set -eu
          if command -v sudo >/dev/null 2>&1; then sudo -E bash .github/toolchain/02-gcc-toolchain.sh
          else bash .github/toolchain/02-gcc-toolchain.sh; fi

      - name: Install LLVM ${{ needs.toolchain-versions.outputs.llvm_version }}
        if: matrix.llvm && runner.os == 'Linux'
        run: |
          set -eu
          if command -v sudo >/dev/null 2>&1; then sudo -E bash .github/toolchain/03-llvm-toolchain.sh
          else bash .github/toolchain/03-llvm-toolchain.sh; fi

      # The Windows runner image ships an LLVM, but not necessarily the pinned
      # one. Install the official build straight from the llvm-project release,
      # pinned via llvm_windows_version to the same point release the Ubuntu
      # 26.04 archive carries (see toolchain-versions.json's own comment), so
      # both LLVM legs are on one version. Chocolatey is deliberately avoided:
      # its llvm package tracks whatever is newest and would drift off the pin.
      - name: Install LLVM ${{ needs.toolchain-versions.outputs.llvm_version }} (Windows)
        if: matrix.llvm && runner.os == 'Windows'
        # Windows PowerShell (always present on self-hosted + GitHub-hosted), NOT
        # pwsh/PowerShell 7 which the self-hosted runner image does not ship -
        # same reasoning as ./.github/actions/setup-msvc-env. GitHub-hosted
        # windows-latest ships pwsh too, which is why this only surfaced once a
        # job actually landed on a self-hosted Windows runner.
        shell: powershell
        env:
          LLVM_WINDOWS_VERSION: ${{ needs.toolchain-versions.outputs.llvm_windows_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:LLVM_WINDOWS_VERSION
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/LLVM-$version-win64.exe"
          $exe = Join-Path $env:RUNNER_TEMP "LLVM-$version-win64.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          # NSIS installer; /S is a silent install into the default location.
          Start-Process -FilePath $exe -ArgumentList '/S' -Wait -NoNewWindow
          "$env:ProgramFiles\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Homebrew's core "llvm" formula has no versioned sibling the way
      # apt.llvm.org or the official win64 installer do (there is no "llvm@21"
      # to pin against), so unlike the Linux/Windows LLVM steps above this
      # cannot pin an exact build - it installs whatever is current and reports
      # it via the assert step below. macos.llvm.toolchain.cmake's HINTS
      # already cover Homebrew's install prefix (/opt/homebrew/opt/llvm on
      # Apple Silicon, which is what macos-latest runners are), so this alone
      # is enough for find_program to pick it over Apple's system clang -
      # PATH is exported too so plain `c++`/`clang++` invocations (the assert
      # step, ad-hoc debugging) see the same compiler CMake configures with.
      - name: Install LLVM (macOS)
        if: matrix.llvm && runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install llvm
          llvm_prefix="$(brew --prefix llvm)"
          echo "${llvm_prefix}/bin" >> "$GITHUB_PATH"

      # ffmpeg is the gold-reference gate's decode oracle (see
      # tools/checks/verify_gold_reference.sh). Proven first on macOS alone (the
      # newest, least-trusted leg); gold_reference now covers every packaged
      # leg except linux-llvm-asan-ubsan, which stays a diagnostic-only build
      # (see that matrix entry's own comment) but still needs it: the codec
      # matrix step below (matrix.sanitizer) runs tools/ci/run_codec_matrix.sh,
      # which also uses ffmpeg as its independent oracle regardless of the
      # gold-reference gate being skipped on this leg.
      - name: Install ffmpeg (Linux)
        if: (matrix.gold_reference || matrix.sanitizer) && runner.os == 'Linux'
        run: apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Install ffmpeg (Windows)
        if: matrix.gold_reference && runner.os == 'Windows' && matrix.preset != 'windows-msvc-arm64'
        shell: bash
        run: choco install ffmpeg -y --no-progress --requirechecksums

      # choco's ffmpeg package is x64-only (Chocolatey packages here are
      # typically x64 binaries) - there is no arm64 equivalent to install the
      # same way. BtbN/FFmpeg-Builds publishes static win-arm64 GPL builds
      # instead (confirmed for real - see the release page's asset list under
      # the "latest" tag); the n8.1 release build is used rather than the
      # "master" one for the same reason choco's package tracks an actual
      # FFmpeg release rather than a git snapshot. The zip's ffmpeg.exe is
      # nested under a versioned subfolder that can drift between builds, so
      # this searches for it instead of hardcoding that path.
      - name: Install ffmpeg (Windows ARM64)
        if: matrix.gold_reference && matrix.preset == 'windows-msvc-arm64'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg-winarm64.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'ffmpeg-winarm64'
          Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-winarm64-gpl-8.1.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest
          $exe = Get-ChildItem -Path $dest -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          if (-not $exe) {
              throw "ffmpeg.exe not found anywhere under $dest after extracting $zip"
          }
          Write-Host "Found ffmpeg.exe at $($exe.FullName)"
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install ffmpeg (macOS)
        if: matrix.gold_reference && runner.os == 'macOS'
        run: brew install ffmpeg

      # DR7: makensis is what turns the NSIS block in cmake/Packaging.cmake
      # from a graceful, silent no-op into a real installer. Installed fresh
      # here rather than baked into the ci-runners Packer image, same
      # reasoning as ffmpeg/Ninja above - see
      # docs/ci-self-hosted-runners.md's "Measuring whether it's actually
      # worth it": nothing is pre-baked onto the self-hosted image without
      # data justifying it, and there is none for NSIS specifically yet.
      # Scoped to the same condition as the Package step below (only
      # windows-msvc packages on Windows today) so a leg that never runs
      # cpack doesn't pay for an installer it won't use.
      #
      # PowerShell, not bash: both GitHub-hosted windows-latest AND (per a
      # real CI run) this fleet's self-hosted runners already carry NSIS -
      # `choco install nsis` reports "already installed" and exits without
      # running the shim-creation step a fresh install would, so makensis
      # was on disk but never on PATH, and find_program(makensis) still
      # missed it (confirmed empirically: cpack packaged ZIP-only with the
      # cmake/Packaging.cmake warning firing, even though choco reported
      # success). Probing both Program Files roots and appending to
      # GITHUB_PATH explicitly - rather than assuming choco's shim exists -
      # is what actually fixes that, on a fresh runner or an already-primed
      # one alike.
      - name: Install NSIS (Windows)
        if: matrix.packageable && (matrix.preset == 'windows-msvc' || (inputs.do_package && matrix.release_package)) && runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis -y --no-progress --requirechecksums
          $nsisDir = @(
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS'),
            (Join-Path $env:ProgramFiles 'NSIS')
          ) | Where-Object { Test-Path (Join-Path $_ 'makensis.exe') } | Select-Object -First 1
          if (-not $nsisDir) {
            throw "makensis.exe not found under Program Files after 'choco install nsis' - the package layout may have changed."
          }
          Write-Host "Adding $nsisDir to PATH"
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # cl.exe, INCLUDE and LIB are not on the default PATH, and Ninja does not
      # set them up itself (unlike MSBuild). clang-cl needs them too.
      - name: Setup MSVC environment
        if: matrix.msvc
        uses: ./.github/actions/setup-msvc-env
        with:
          arch: ${{ matrix.msvc_arch || 'x64' }}

      - name: Install Ninja
        if: ${{ !matrix.container }}
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS)   brew install ninja ;;
            Windows) choco install ninja -y --no-progress --requirechecksums ;;
          esac

      # AC3FORGE_BUILD_GUI is ON only on the two Windows presets (see
      # CMakePresets.json), and cmake/FindQt6.cmake only widens
      # CMAKE_PREFIX_PATH to LOCAL install roots (C:/Qt/6.x/msvc2022_64, and
      # so on) - it has no notion of a CI runner, so a Windows leg with no
      # Qt kit on the image at all would fail at find_package(Qt6 ...)
      # without this. clang-cl (windows-llvm) targets the MSVC ABI, so it
      # shares this same msvc2022_64 kit with windows-msvc rather than
      # needing its own. Version pinned to the exact kit already verified
      # locally (see docs/building.md's Verified configuration table); the
      # pinned action itself is CountdownSolver's own precedent
      # (R:\CountdownSolver\.github\workflows\release.yml), the other
      # project sharing this same "prebuilt Qt, never vcpkg" convention.
      # windows-msvc-arm64 is excluded: no gui: true on that leg (see its
      # matrix comment above), so there is no Qt kit to install for it here.
      - name: Install Qt (prebuilt)
        if: runner.os == 'Windows' && matrix.preset != 'windows-msvc-arm64'
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ needs.toolchain-versions.outputs.qt_version }}
          cache: true

      # CMakePresets.json declares the project's real minimum (cmakeMinimumRequired);
      # this asserts the RUNNER actually meets it rather than letting a stale image
      # fail later with a confusing "unknown preset field" error. gcc/llvm/msvc are
      # asserted the same way, all against the pins toolchain-versions resolved
      # above - see docs/ci-self-hosted-runners.md.
      - name: Report and assert toolchain versions
        shell: bash
        env:
          GCC_VERSION: ${{ needs.toolchain-versions.outputs.gcc_version }}
          LLVM_VERSION: ${{ needs.toolchain-versions.outputs.llvm_version }}
          MSVC_TOOLSET: ${{ needs.toolchain-versions.outputs.msvc_toolset }}
          CMAKE_MIN: ${{ needs.toolchain-versions.outputs.cmake_min }}
        run: |
          set -euo pipefail
          cmake --version
          ninja --version
          # Let CMake do its own version comparison rather than parsing it in sh.
          # Unquoted heredoc so $CMAKE_MIN expands - \$CMAKE_VERSION stays escaped
          # so it's still CMake's own variable, not a (unset) shell one.
          cat > "${RUNNER_TEMP}/assert-cmake-version.cmake" <<EOF
          if(CMAKE_VERSION VERSION_LESS ${CMAKE_MIN})
            message(FATAL_ERROR "CMake \${CMAKE_VERSION} is too old; ac3forge needs >= ${CMAKE_MIN}")
          endif()
          EOF
          cmake -P "${RUNNER_TEMP}/assert-cmake-version.cmake"
          case "${{ matrix.preset }}" in
            linux-gcc|linux-gcc-arm64)
                          g++ --version | head -1
                          g++ --version | head -1 | grep -q " ${GCC_VERSION}\." || { echo "::error::expected g++ ${GCC_VERSION}"; exit 1; } ;;
            linux-llvm|linux-llvm-arm64|linux-llvm-asan-ubsan)
                          clang++ --version | head -1
                          clang++ --version | head -1 | grep -qE "version ${LLVM_VERSION}\." || { echo "::error::expected clang ${LLVM_VERSION}"; exit 1; } ;;
            windows-llvm) clang-cl --version | head -1
                          clang-cl --version | head -1 | grep -qE "version ${LLVM_VERSION}\." || { echo "::error::expected clang-cl ${LLVM_VERSION}"; exit 1; } ;;
            windows-msvc)
                          echo "MSVC toolset: ${VCToolsVersion:-unknown}"
                          case "${VCToolsVersion:-}" in
                            ${MSVC_TOOLSET}*) ;;
                            *) echo "::error::expected an MSVC ${MSVC_TOOLSET}x toolset, got '${VCToolsVersion:-unset}'"; exit 1 ;;
                          esac ;;
            # Report-only, unlike windows-msvc above - confirmed empirically on
            # a real windows-11-arm run (2026-08-26): the hosted ARM64 image
            # ships an older VS Build Tools generation (14.44.35207, VS2022
            # ~17.14) than windows-latest's x64 image (14.5x, "VS 2026"/18.x),
            # so the ${MSVC_TOOLSET} pin - resolved against the x64 image - does
            # not hold here. The two runner images are maintained on separate
            # GitHub-side update cadences; asserting they stay in lockstep
            # isn't realistic yet. Same shape as macos-llvm's own case arm
            # below, and the same reasoning: report whatever toolset this
            # runner actually has rather than failing a leg still proving out
            # its own baseline. Revisit once GitHub's ARM64 image catches up -
            # or drops far enough behind to need its own pin.
            windows-msvc-arm64)
                          echo "MSVC toolset: ${VCToolsVersion:-unknown}" ;;
            # No hard version assert here unlike the other LLVM legs: Homebrew's
            # llvm formula has no versioned pin to check against (see the
            # install step's own comment), so this reports whatever it finds
            # rather than failing a leg that's still proving out its baseline.
            # Same for macos-llvm-x64 - identical toolchain install step, just
            # a different CPU architecture underneath.
            macos-llvm|macos-llvm-x64) c++ --version | head -1 ;;
          esac

      - uses: ./.github/actions/setup-vcpkg
        with:
          vcpkg-commit: ${{ needs.toolchain-versions.outputs.vcpkg_commit }}

      # ---------------------------------------------------------------------
      # Configure / build / test
      # ---------------------------------------------------------------------
      # The presets carry everything: generator, compiler, Release, and
      # AC3FORGE_BUILD_GUI=OFF. The toolchain-preset system splits each leg into
      # config-/build-/test-<leg> (the bare <leg> is a hidden fragment), so the
      # matrix value is the suffix and each step names its own prefix. Running
      # `cmake --preset config-<leg>` locally reproduces CI exactly - EXCEPT
      # for two overrides bolted on here:
      #   - -DCMAKE_PREFIX_PATH on Windows: install-qt-action installs into a
      #     runner-specific path (QT_ROOT_DIR) that cmake/FindQt6.cmake's
      #     local search roots do not cover, so it has to be passed in
      #     explicitly rather than relying on auto-detection the way a local
      #     build does.
      #   - -DAC3FORGE_BUILD_GUI=ON on the `gui: true` Linux and macOS legs,
      #     which default the GUI off (see CMakePresets.json) so a machine
      #     that hasn't installed Qt still builds everything else.
      - name: Configure
        shell: bash
        # VERSION_TAG_INPUT goes through env:, not straight into the script
        # text, for the same reason release.yml's resolve-version job does -
        # inputs.version_tag is attacker-reachable via workflow_dispatch and
        # substituted directly it would be shell CODE, not data (zizmor:
        # template-injection). Empty by default (ordinary CI): GitVersionDerivation.cmake
        # then falls through to `git describe`, which finds nothing on this
        # leg's shallow checkout and stamps 0.0.0-dev - expected, see the
        # `fetch_depth` input's description above.
        env:
          VERSION_TAG_INPUT: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail
          extra_args=()
          # QT_ROOT_DIR is only set when the "Install Qt (prebuilt)" step ran
          # (every Windows leg except windows-msvc-arm64, which has no Qt kit
          # to point at - see that step's own comment) - guarded rather than
          # unconditional on "$RUNNER_OS" = "Windows" alone, because
          # referencing an unset variable under this script's `set -u` would
          # otherwise fail the Configure step outright on that leg.
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "${QT_ROOT_DIR:-}" ]; then
            extra_args+=(-DCMAKE_PREFIX_PATH="$QT_ROOT_DIR")
          fi
          if [ "${{ matrix.gui }}" = "true" ]; then
            extra_args+=(-DAC3FORGE_BUILD_GUI=ON)
          fi
          if [ -n "$VERSION_TAG_INPUT" ]; then
            extra_args+=(-DDERIVED_VERSION_OVERRIDE="$VERSION_TAG_INPUT")
          fi
          # Not "${extra_args[@]}" unguarded: macOS's /bin/bash is stuck on
          # 3.2 (GPLv2 was the last version Apple could ship), and 3.2's
          # `set -u` treats expanding a zero-element array as an unbound
          # variable - fixed upstream in bash 4.4, but not on this runner.
          # ${#extra_args[@]} (a length, not an element expansion) does not
          # trip the same bug on either version.
          if [ ${#extra_args[@]} -eq 0 ]; then
            cmake --preset config-${{ matrix.preset }}
          else
            cmake --preset config-${{ matrix.preset }} "${extra_args[@]}"
          fi

      # -k 0 so a first-time port sees every diagnostic in one run rather than
      # one-per-push. Warnings are errors on every compiler
      # (cmake/CompilerWarnings.cmake) and CI does not relax that.
      - name: Build
        shell: bash
        run: cmake --build --preset build-${{ matrix.preset }} -- -k 0

      # AC3FORGE_REQUIRE_AVX2 turns tests/core/test_simd_kernels.cpp's [avx2]
      # probe case from a loud skip into a hard failure - only safe to set on
      # a leg pinned to `runner: '["ubuntu-latest"]'` above rather than the
      # dynamic self-hosted/GitHub-hosted `matrix.runner` most legs use,
      # since self-hosted CPU features aren't documented anywhere in this
      # repo (see src/forge/src/internal/cpu/cpu_features.hpp) but GitHub's
      # own hosted Linux runners are AVX2-capable. This guarantees at least
      # one leg per PR where "the AVX2 path actually ran and passed" is
      # asserted, not just possible.
      - name: Test
        shell: bash
        env:
          AC3FORGE_REQUIRE_AVX2: ${{ matrix.preset == 'linux-llvm-asan-ubsan' && '1' || '' }}
        run: ctest --preset test-${{ matrix.preset }}

      # The gold-reference correctness gate (the L3 FFmpeg-oracle + a
      # lightweight L4 SNR check from the project's original validation-
      # pyramid design, now docs/verification.md - wired into CI for the
      # first time here; see tools/checks/verify_gold_reference.sh's own header).
      # Proven on
      # macOS alone first; now every leg has it except linux-llvm-asan-ubsan,
      # which stays diagnostic-only (same reasoning as its `packageable`
      # exclusion below - a sanitizer build's job is catching memory/UB
      # errors, not re-proving codec correctness a plain build already did).
      - name: Gold reference gate
        if: matrix.gold_reference
        shell: bash
        env:
          # See tools/checks/verify_gold_reference.sh's own comment: set, this asks
          # compare_wav.py to also write a structured per-codec result here,
          # which the "Upload gold-reference results" step below picks up.
          # Unset (persist_quality_trend false, e.g. every PR run) the gate
          # behaves exactly as it did before this existed - no extra files,
          # no extra step running.
          RESULTS_JSON_DIR: ${{ inputs.persist_quality_trend && format('{0}/gold-reference-results', runner.temp) || '' }}
        run: |
          set -euo pipefail
          bin="build/config-${{ matrix.preset }}/bin/ac3cli"
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="${bin}.exe"
          fi
          bash tools/checks/verify_gold_reference.sh "$bin"

      # The same gate a second time, on the spec's own direct transform
      # evaluations instead of the fast paths (roadmap VX10). 0.9.0 flipped
      # both transform defaults, and from then until this step existed every
      # CI gate that touched a real stream ran in performance mode: the
      # normative §8.2.3.2 forward MDCT and §7.9.4 step-3 inverse - the oracle
      # every fast path is validated against - were covered only by
      # transform-level unit tests. A change to either fast path could take
      # its own reference with it and no end-to-end gate would notice.
      #
      # One leg, not all seven: mode=reference changes the arithmetic inside
      # the transforms, not anything platform-specific, so paying for it on
      # every leg would buy nothing. linux-gcc is the leg with the broadest
      # coverage elsewhere (GUI, the ALSA fallback) and is a required check.
      # Its labels are suffixed (see the script's own TRANSFORM_MODE comment),
      # so its per-check JSON results sit beside the performance-mode run's in
      # the same artifact rather than overwriting them.
      - name: Gold reference gate (mode=reference)
        if: matrix.gold_reference && matrix.preset == 'linux-gcc'
        shell: bash
        env:
          TRANSFORM_MODE: reference
          RESULTS_JSON_DIR: ${{ inputs.persist_quality_trend && format('{0}/gold-reference-results', runner.temp) || '' }}
        run: bash tools/checks/verify_gold_reference.sh "build/config-${{ matrix.preset }}/bin/ac3cli"

      # Handed off to the quality-trend job below, which runs once (not once
      # per leg) after every gold_reference leg has passed - see that job's
      # own header comment for why it is a separate job rather than each leg
      # pushing its own commit.
      - name: Upload gold-reference results
        if: matrix.gold_reference && inputs.persist_quality_trend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gold-reference-${{ matrix.preset }}
          path: ${{ runner.temp }}/gold-reference-results/*.json
          if-no-files-found: error

      # ctest above already covers the codec; this covers the one thing it
      # can't - that ac3gui actually starts, loads its QML, and drives a real
      # encode through the Qt event loop. offscreen needs no display, so it
      # runs the same in this container as it does on a workstation. See
      # docs/building.md's Linux section for why the qmlshapesplugin /
      # labsmodelsplugin / qmlfolderlistmodelplugin CMake warnings during
      # Configure, above, don't affect this.
      - name: Smoke test ac3gui (headless)
        if: matrix.gui
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        # apps/gui/CMakeLists.txt sets MACOSX_BUNDLE ON unconditionally, but it
        # is a no-op everywhere except APPLE, where it moves the built
        # executable to bin/ac3gui.app/Contents/MacOS/ac3gui instead of plain
        # bin/ac3gui - the property Linux never sets and Windows doesn't need
        # (WIN32_EXECUTABLE controls the console-vs-GUI subsystem there, not
        # where the .exe lands).
        #
        # QSG_RENDER_LOOP=basic and the perl-alarm wrapper are both macOS-only
        # and both about the same hang the "Test" step hit on this leg's
        # first-ever GUI run (see apps/gui/tests/CMakeLists.txt's identical
        # QSG_RENDER_LOOP comment for the render-loop-deadlock hypothesis).
        # ac3gui --smoke drives the same QQmlApplicationEngine/QQuickWindow
        # path ac3gui_qmltests does, so it is at equal risk and had no bound
        # of its own - a hang here would silently eat the rest of this leg's
        # 6-hour job ceiling exactly like the Test step did. `perl` (not
        # `timeout`, which macOS's BSD userland doesn't ship) is on every
        # macOS runner image by default.
        run: |
          set -euo pipefail
          bin="build/config-${{ matrix.preset }}/bin/ac3gui"
          if [ "$RUNNER_OS" = "macOS" ]; then
            bin="build/config-${{ matrix.preset }}/bin/ac3gui.app/Contents/MacOS/ac3gui"
            export QSG_RENDER_LOOP=basic
          fi
          smoke_args=(--smoke
            fuzz/seeds/fuzz_wav_read/roundtrip-stereo.wav
            "${RUNNER_TEMP}/ac3gui-smoke.ac3"
            "${RUNNER_TEMP}/ac3gui-smoke.png")
          if [ "$RUNNER_OS" = "macOS" ]; then
            perl -e 'alarm shift; exec @ARGV' 120 "$bin" "${smoke_args[@]}"
          else
            "$bin" "${smoke_args[@]}"
          fi

      # Sanitizers only catch what actually executes. ctest's cases exercise
      # encoder/decoder logic in isolation; this drives the real CLI across
      # every layout, every Annex E tool token, both Atmos container modes and
      # the metadata options, so the sanitizer sees code paths a unit test
      # would not reach on its own. ASAN_OPTIONS/UBSAN_OPTIONS mirror what the
      # ctest preset already sets for the Test step above.
      #
      # AC3FORGE_CROSS_TIER_CHECK runs this same matrix twice more, under
      # AC3FORGE_SIMD_TIER=sse2 then =avx2, byte-diffing the two output
      # trees (see run_codec_matrix.sh's own header comment) - gated the
      # same way AC3FORGE_REQUIRE_AVX2 is above, to the one leg pinned to a
      # GitHub-hosted (therefore AVX2-capable) runner rather than the
      # dynamic self-hosted/GitHub-hosted labels most legs use.
      - name: Codec matrix (sanitizer build)
        if: matrix.sanitizer
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
          AC3FORGE_CROSS_TIER_CHECK: ${{ matrix.preset == 'linux-llvm-asan-ubsan' && '1' || '0' }}
        run: bash tools/ci/run_codec_matrix.sh "build/config-${{ matrix.preset }}/bin/ac3cli"

      # Roadmap VX20: the conformance vector set - one stream per coding tool,
      # layout and sample rate this encoder can produce, each with the PCM it
      # was encoded from and the expected decode hashes, published as a
      # release asset so another decoder implementer has something concrete to
      # test against (docs/conformance-vectors.md).
      #
      # It runs on EVERY call, not just a release, deliberately: the generator
      # drives real ac3cli command lines, and an option rename would otherwise
      # rot it silently until the next tag - by which point the fix is
      # blocking a release rather than a pull request. The release-only extra
      # is --check-determinism, which regenerates the whole bundle a second
      # time and fails if a single hash moved; that doubles the runtime, which
      # is worth paying once per release and not once per push.
      #
      # One leg only. Encoded output is not bit-identical across compilers or
      # architectures yet (docs/building.md; roadmap VX11/VX12), so a second
      # leg's bundle would differ from this one's for no useful reason - the
      # manifest records the toolchain that built it either way. linux-gcc is
      # the leg that carries it because it is the x86-64 reference toolchain
      # and already a release_package leg.
      #
      # python3 is not in the container bootstrap: nothing else in this job
      # needs it.
      - name: Install python3 (conformance vectors)
        if: matrix.conformance_vectors
        run: apt-get install -y -qq --no-install-recommends python3

      - name: Generate conformance vectors
        if: matrix.conformance_vectors
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
          PUBLISH: ${{ inputs.publish_conformance_vectors }}
        run: |
          set -euo pipefail
          cli="build/config-${PRESET}/bin/ac3cli"
          version="$("$cli" --version | head -1 | awk '{print $NF}')"
          extra=""
          if [ "$PUBLISH" = "true" ]; then
            extra="--check-determinism --archive"
          fi
          # Word-split on purpose: $extra is either empty or two flags.
          # shellcheck disable=SC2086
          python3 tools/generators/gen_conformance_vectors.py --cli "$cli" --out "dist/ac3forge-conformance-vectors-${version}" $extra

      - name: Upload conformance vectors
        if: matrix.conformance_vectors && inputs.publish_conformance_vectors
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-vectors
          path: dist/*.tar.gz
          if-no-files-found: error

      # The other side of the ALSA switch: a Linux machine without libasound's
      # development headers must still configure, build and pass everything,
      # falling back to src/audio/src/backend/posix/ - that is the whole point
      # of the dependency being optional, and it is a claim that rots silently
      # unless something checks it.
      #
      # CMAKE_DISABLE_FIND_PACKAGE_ALSA rather than -DAC3FORGE_WITH_ALSA=OFF,
      # because OFF skips find_package() altogether: this way the AUTO path
      # runs and genuinely fails to find ALSA, which is what a machine missing
      # the package actually does. The assertion afterwards is the point of the
      # step - without it a mistake that quietly built the ALSA backend anyway
      # would still go green.
      - name: Configure, build and test without ALSA
        if: matrix.alsa_fallback
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset config-${{ matrix.preset }} -B build/no-alsa \
            -DCMAKE_DISABLE_FIND_PACKAGE_ALSA=TRUE 2>&1 | tee /tmp/no-alsa-configure.log
          grep -q 'Audio backend  : posix' /tmp/no-alsa-configure.log || {
            echo "::error::ALSA was disabled but the build did not fall back to the posix backend"
            exit 1
          }
          cmake --build build/no-alsa -- -k 0
          ctest --test-dir build/no-alsa

      # Proves BUILD_SHARED_LIBS=ON actually works before it ships in a real
      # release: ac3::forge_shared/matroska::matroska_shared existing and
      # configuring cleanly (already exercised by every leg's normal
      # config-<preset> build, since both variants are always built
      # regardless of BUILD_SHARED_LIBS - see src/forge/CMakeLists.txt) is not
      # the same claim as every in-tree consumer actually linking and
      # running against the real .so - ac3cli/ac3tests/every example,
      # including mux_mkv, the one that needs libmatroska.so alongside
      # libac3forge.so. On linux-llvm only, the same "one extra pass inside
      # an existing leg, not a new matrix entry" shape as the ALSA fallback
      # step above - confirmed locally in WSL2 Ubuntu before landing here,
      # not assumed: 304/304 tests passed, and `ldd bin/ac3cli` showed both
      # .so files resolved via the build tree's own automatic RPATH, with
      # nothing here needing to place them next to the executable the way
      # examples/CMakeLists.txt's Windows-only DLL-copy step does.
      #
      # -LE Performance: this pass's own job is "does it link and run
      # correctly as a shared library", not "is it still real-time under
      # PIC/indirect-symbol codegen" - a materially different, never-promised
      # performance bar the plain linux-llvm pass (same leg, run just before
      # this one, static by default - the configuration every real consumer
      # actually ships) already enforces. Confirmed for real on a shared
      # GitHub Actions runner: the Atmos/JOC encoder measured a consistent
      # ~79ms/frame here (encode_frame under PIC + hidden-visibility indirect
      # calls) against the plain pass's real-time budget, comfortably inside
      # the WSL2 measurement above's own margin - a genuine, repeatable
      # characteristic of this configuration, not runner noise, and not a
      # regression in the codec itself.
      - name: Configure, build and test with BUILD_SHARED_LIBS=ON
        if: matrix.preset == 'linux-llvm'
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset config-linux-llvm-shared
          cmake --build build/config-linux-llvm-shared -- -k 0
          ctest --preset test-linux-llvm-shared -LE Performance

      # Packaging. windows-msvc always packages, on every push, as a
      # continuous smoke test of the packaging path itself. For a real
      # release (do_package set, from release.yml), only one leg per
      # OS/arch actually packages as the release's own canonical artifact -
      # `release_package: true` on windows-msvc, linux-gcc and
      # linux-gcc-arm64 - rather than every packageable leg. A release ships
      # one canonical build per platform for people to download, not a build
      # per compiler-toolchain leg: windows-llvm and linux-llvm exist to
      # catch compiler-specific bugs in CI, which they still do in full
      # (build+test, unchanged) - packaging them too would just be two
      # redundant, unlabelled-as-to-which-is-canonical zips per OS with
      # nothing to tell a downloader apart. A packaging failure on a
      # release_package leg blocks like any other leg's would, rather than
      # being absorbed by continue-on-error. linux-llvm-asan-ubsan is never
      # packaged at all (not `packageable` - see the matrix entry): there is
      # no pack-linux-llvm-asan-ubsan preset, a sanitizer-instrumented debug
      # build is a diagnostic tool, not something to ship.
      #
      # macOS (DR8) is neither of the two shapes above any more: macos-llvm
      # and macos-llvm-x64 are each `packageable` but never `release_package`
      # - a release doesn't want either leg's own single-arch .dmg as "the"
      # macOS package now that a universal one exists. They still package on
      # every ORDINARY push (the windows-msvc-style continuous smoke test,
      # extended to both of them - useful as an independent per-arch check
      # that packaging itself still works), just never on a do_package
      # release run, where they instead run the install-tree steps below for
      # package-macos-universal to lipo-merge, and that job uploads the
      # actual release artifact.
      #
      # cpack reuses the same build/config-<leg> tree the Configure and Build
      # steps above already produced - pack-<leg> points at the same
      # config-<leg> configurePreset - so this proves the packaging path
      # against the exact build that was just tested, not a separate one.
      - name: Package
        if: >-
          matrix.packageable &&
          (matrix.preset == 'windows-msvc' ||
           (inputs.do_package && matrix.release_package) ||
           ((matrix.preset == 'macos-llvm' || matrix.preset == 'macos-llvm-x64') && !inputs.do_package))
        shell: bash
        run: cpack --preset pack-${{ matrix.preset }}

      # DR7: the whole point of installing makensis above is that its
      # absence stops being silent. cmake/Packaging.cmake's find_program()
      # gate degrades to a ZIP-only package with just a message(WARNING ...)
      # rather than failing cpack outright - the right behaviour for a local
      # dev build without NSIS installed, the wrong one here, where makensis
      # was just installed on purpose and a missing .exe means that install
      # broke rather than a deliberate choice. Failing loudly on this leg is
      # what keeps DR7 fixed instead of quietly regressing the same way
      # again - see docs/releasing.md#winget-manifest.
      - name: Assert the NSIS installer was produced (Windows)
        if: matrix.packageable && (matrix.preset == 'windows-msvc' || (inputs.do_package && matrix.release_package)) && runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          exes=(packages/*.exe)
          if [ ${#exes[@]} -eq 0 ]; then
            echo "::error::cpack produced no NSIS installer (.exe) - makensis is missing or cmake/Packaging.cmake's find_program() gate silently dropped NSIS again. Check the 'Install NSIS (Windows)' step and the configure log's warnings above."
            exit 1
          fi

      - name: Upload package artifacts
        if: >-
          matrix.packageable &&
          (matrix.preset == 'windows-msvc' ||
           (inputs.do_package && matrix.release_package) ||
           ((matrix.preset == 'macos-llvm' || matrix.preset == 'macos-llvm-x64') && !inputs.do_package))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.preset }}
          # An explicit extension allowlist, not packages/* - CPack leaves its
          # per-generator staging tree behind under packages/_CPack_Packages/
          # (never cleaned up; this is normal CPack behaviour, not a bug
          # here), and a bare packages/* glob matches that directory too.
          # DragNDrop's staging tree in particular contains a symlink to
          # /Applications for the drag-to-install UX - upload-artifact
          # dereferences symlinks by default, so on a macOS runner that walks
          # straight into the real /Applications (Xcode's framework tree is
          # notorious for symlink cycles) and OOMs the upload step's Node
          # process trying to archive it. See actions/upload-artifact#619 and
          # #590. Restricting the glob to real package files and their
          # checksums - the same extensions github-release's own glob looks
          # for - sidesteps the staging tree entirely rather than trying to
          # outrun it with excludes.
          path: |
            packages/*.zip
            packages/*.zip.sha512
            packages/*.tar.gz
            packages/*.tar.gz.sha512
            packages/*.deb
            packages/*.deb.sha512
            packages/*.rpm
            packages/*.rpm.sha512
            packages/*.exe
            packages/*.exe.sha512
            packages/*.dmg
            packages/*.dmg.sha512
          if-no-files-found: error

      # Feeds package-macos-universal below: a plain `cmake --install` of just
      # the runtime component (ac3cli/ac3gui, plus the man page/completions -
      # see cmake/InstallLibrary.cmake's COMPONENT split), not a cpack
      # invocation - that job lipo-merges this leg's tree against
      # macos-llvm(-x64)'s counterpart into one universal bundle rather than
      # either leg shipping its own single-arch .dmg as the release's macOS
      # package (see the matrix entries' own comments). Gated on
      # inputs.do_package so an ordinary push never pays for a second install
      # pass on top of the one ctest already exercised against this same
      # build tree.
      #
      # apps/gui/CMakeLists.txt's qt_generate_deploy_qml_app_script()
      # install(SCRIPT) needed an explicit COMPONENT runtime added for this
      # to actually pick up Qt's own copied Frameworks/PlugIns/QML - an
      # install(SCRIPT) with no COMPONENT only runs during a FULL install,
      # never a component-filtered one like this (confirmed against CMake's
      # own install(SCRIPT) documentation), and every packaging path
      # exercised before this one always did a full install (cpack's
      # CPACK_MONOLITHIC_INSTALL for DragNDrop, and the archive/DEB/RPM
      # generators, which install every requested component in the same
      # pass) - so the gap never showed up until something asked for
      # --component runtime on its own.
      - name: Install runtime component (macOS universal merge)
        if: (matrix.preset == 'macos-llvm' || matrix.preset == 'macos-llvm-x64') && inputs.do_package
        shell: bash
        run: cmake --install "build/config-${{ matrix.preset }}" --prefix stage --component runtime

      - name: Upload install tree (macOS universal merge)
        if: (matrix.preset == 'macos-llvm' || matrix.preset == 'macos-llvm-x64') && inputs.do_package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-install-runtime-${{ matrix.mac_arch }}
          path: stage/
          if-no-files-found: error

      # Nice-to-have companion to the runtime tree above: the library SDK
      # (headers, static archives, CMake package config, the versioned
      # .dylib - see cmake/InstallLibrary.cmake) for package-macos-universal
      # to attempt merging into a universal `ac3forge-dev-*` archive too.
      # cmake --install takes one --component per invocation, so this is two
      # calls into the same prefix rather than one. Best-effort: if this
      # step or the merge job's own dev-archive half fails, the runtime .dmg
      # above is unaffected - see that job's own comment.
      - name: Install library components (macOS universal merge, dev archive)
        if: (matrix.preset == 'macos-llvm' || matrix.preset == 'macos-llvm-x64') && inputs.do_package
        shell: bash
        run: |
          set -euo pipefail
          cmake --install "build/config-${{ matrix.preset }}" --prefix stage-dev --component library
          cmake --install "build/config-${{ matrix.preset }}" --prefix stage-dev --component libruntime

      - name: Upload dev install tree (macOS universal merge)
        if: (matrix.preset == 'macos-llvm' || matrix.preset == 'macos-llvm-x64') && inputs.do_package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-install-dev-${{ matrix.mac_arch }}
          path: stage-dev/
          if-no-files-found: error

  # DR8: merges macos-llvm's arm64 install tree with macos-llvm-x64's x86_64
  # one (both plain `cmake --install --component runtime`, uploaded above)
  # into one universal ac3cli/ac3gui bundle via lipo, then packages it as a
  # DragNDrop .dmg with hdiutil directly - the same call CPack's own
  # DragNDrop generator makes under the hood (see cmake/Packaging.cmake's
  # APPLE branch and cmake/CPackProjectConfig.cmake's CPACK_MONOLITHIC_INSTALL
  # override), just pointed at an already-merged tree CPack itself never
  # built, since CPack has no notion of combining two separate install trees
  # from two separate builds into one package.
  #
  # Needs a macOS runner (any label - lipo/hdiutil are the only tools used,
  # and merging itself has no dependency on which architecture is doing the
  # merging), gated on inputs.do_package the same way every other
  # release-only step in this file is (release.yml's call only - ci.yml never
  # sets it, so this job is skipped, not failed, on every ordinary push/PR).
  # needs: build, not a narrower dependency on just the two macOS matrix
  # entries: GitHub Actions has no way to depend on individual matrix
  # combinations of another job, only the whole job - the same tradeoff
  # quality-trend below already accepts for the same reason (see its own
  # header comment).
  package-macos-universal:
    name: Package macOS universal (arm64 + x86_64)
    needs: build
    if: inputs.do_package
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Download arm64 runtime install tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-install-runtime-arm64
          path: arm64-runtime

      - name: Download x64 runtime install tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-install-runtime-x64
          path: x64-runtime

      # rsync -a first, as the baseline: it copies everything including
      # symlinks (an .app bundle's Frameworks are full of them - e.g.
      # QtCore.framework/QtCore -> Versions/Current/QtCore) and permissions,
      # which a plain `find -type f` walk below deliberately does not touch
      # (find -type f already skips symlinks on its own - they are type l,
      # not f). The loop then overwrites every REGULAR file that exists on
      # both sides with a lipo-merged one; whichever side's copy the rsync
      # baseline left in place for a file unique to x64 stays untouched,
      # which is correct - there is nothing on the other side to merge it
      # against. See the verify step below for what actually proves this
      # produced fat binaries rather than silently reusing one side's thin
      # ones.
      - name: lipo-merge the two runtime install trees
        shell: bash
        run: |
          set -euo pipefail
          rsync -a x64-runtime/ merged/
          merge_failed=0
          while IFS= read -r -d '' f; do
            rel="${f#arm64-runtime/}"
            case "$rel" in
              */_CodeSignature/*)
                # ac3gui.app's Mach-O executables get ad-hoc code-signed at
                # build time (Apple Silicon requires at least an ad-hoc
                # signature to execute at all), which is what produces this
                # bundle-level manifest - it hashes every file in the bundle
                # AS IT STOOD on one architecture's build alone, so it is
                # genuinely different content between the two builds, not a
                # real divergence to fail on. It is also stale on both sides
                # regardless of which one "wins" here, the moment any Mach-O
                # file in the bundle gets lipo-merged below - "Re-sign the
                # merged .app bundle" further down replaces it with a
                # manifest computed against the actual merged content.
                continue
                ;;
            esac
            a="arm64-runtime/$rel"
            x="x64-runtime/$rel"
            m="merged/$rel"
            if [ ! -e "$x" ]; then
              echo "::warning::$rel present in the arm64 tree only - copying through unmerged"
              mkdir -p "$(dirname "$m")"
              cp -p "$a" "$m"
              continue
            fi
            if lipo -info "$a" >/dev/null 2>&1 && lipo -info "$x" >/dev/null 2>&1; then
              lipo -create "$a" "$x" -output "$m"
            elif diff -q "$a" "$x" >/dev/null 2>&1; then
              : # Already byte-identical, and already present via the rsync baseline above.
            else
              echo "::error::$rel is not a Mach-O file on both sides and differs between the arm64 and x64 installs - investigate before shipping"
              merge_failed=1
            fi
          done < <(find arm64-runtime -type f -print0)
          if [ "$merge_failed" -ne 0 ]; then
            echo "::error::one or more files diverged between the two architectures' install trees outside of expected Mach-O differences"
            exit 1
          fi

      # The actual proof this PR asked for: not "the script exited 0", but
      # that the merged binaries really do carry both architectures' code.
      # ac3cli and ac3gui.app's own executable are the two entry points;
      # QtCore is checked too so this also proves the merge over
      # qt_generate_deploy_qml_app_script()'s copied Frameworks, not just
      # this project's own two binaries.
      - name: Verify the merge produced real universal binaries
        shell: bash
        run: |
          set -euo pipefail
          check() {
            echo "== $1 =="
            lipo -info "$1"
            lipo -info "$1" | grep -q 'x86_64' || { echo "::error::$1 is missing an x86_64 slice"; exit 1; }
            lipo -info "$1" | grep -q 'arm64'  || { echo "::error::$1 is missing an arm64 slice"; exit 1; }
          }
          check "merged/bin/ac3cli"
          gui_bin="merged/ac3gui.app/Contents/MacOS/ac3gui"
          if [ -f "$gui_bin" ]; then
            check "$gui_bin"
            qt_core="$(find "merged/ac3gui.app/Contents/Frameworks" -type f -name QtCore 2>/dev/null | head -1)"
            if [ -n "$qt_core" ]; then
              check "$qt_core"
            else
              echo "::warning::no QtCore framework binary found under ac3gui.app/Contents/Frameworks - was AC3FORGE_BUILD_GUI actually ON for both legs?"
            fi
          else
            echo "::warning::no ac3gui.app in the merged tree - CLI-only merge, nothing to verify there"
          fi

      # The merge above skipped ac3gui.app/Contents/_CodeSignature/* rather
      # than fail on it (see that step's own comment) - which leaves the
      # bundle carrying whichever architecture's original signature the
      # rsync baseline happened to copy through, computed against THAT
      # build's file content, not the merged one. codesign --deep walks in
      # and re-signs every nested Mach-O (the merged ac3cli's own signature
      # is untouched by lipo -create - it concatenates already-signed thin
      # slices without altering their bytes, so this is about the bundle-level
      # manifest, not the executables' own embedded signatures) and
      # regenerates _CodeSignature/CodeResources against the real merged
      # tree. "-" (ad-hoc, no certificate) is the only option available -
      # DR6 (real Developer ID signing/notarization) is blocked on
      # certificates this project does not have, same as every other macOS
      # release artifact. Best-effort: codesign failing here would mean
      # Gatekeeper's own signature check on the .app is no better/worse than
      # before this step existed (it already refuses an ad-hoc/unsigned app
      # outright - see the Homebrew Cask's own caveats), so it does not
      # block the must-have .dmg below.
      #
      # Observed for real, not hypothetical: the first proven run
      # (v0.0.0-alpha.2 dry run) hit exactly this fallback - codesign
      # refused with "bundle format is ambiguous (could be app or
      # framework)" on ac3gui.app/Contents/Frameworks/QtQuickControls2.framework,
      # one of Qt's own bundled frameworks, not anything this project
      # controls the layout of. The runtime .dmg still built and shipped
      # from the same run with a merged, lipo-verified ac3cli/ac3gui/QtCore
      # (confirmed via lipo -info in that job's log) - only the bundle-level
      # signature stayed stale. Worth another look if it turns out to matter
      # in practice; not chased further here since there is no real Mac to
      # confirm a fix against, and Gatekeeper blocks this app either way
      # until DR6 lands.
      - name: Re-sign the merged .app bundle (ad-hoc)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "merged/ac3gui.app" ]; then
            echo "no ac3gui.app in the merged tree - nothing to re-sign"
            exit 0
          fi
          if codesign --force --deep --sign - "merged/ac3gui.app"; then
            codesign --verify --deep --strict "merged/ac3gui.app" && echo "codesign: merged ac3gui.app verifies against its own (ad-hoc) signature"
          else
            echo "::warning::ad-hoc re-sign of the merged ac3gui.app failed - shipping it with a stale single-architecture signature instead. Gatekeeper already refuses an unsigned/ad-hoc app outright (see the Homebrew Cask's caveats and DR6), so this does not change what a downloader has to do to run it."
          fi

      # hdiutil, not cpack: CPack's DragNDrop generator only ever packages a
      # tree IT installed from a single build - there is no CPack entry point
      # that packages an arbitrary pre-built directory from two separate
      # builds. cmake/Packaging.cmake's own APPLE branch
      # (list(APPEND CPACK_GENERATOR "DragNDrop")) is a thin wrapper around
      # exactly this hdiutil call for a monolithic install
      # (CPACK_MONOLITHIC_INSTALL, set in cmake/CPackProjectConfig.cmake) -
      # -format UDZO matches CPack's own DragNDrop default compression.
      # Filename matches CPACK_PACKAGE_FILE_NAME
      # (cmake/CPackProjectConfig.cmake: "${CPACK_PACKAGE_NAME}-${MAJOR}.${MINOR}.${PATCH}-${CPACK_SYSTEM_NAME}",
      # CPACK_SYSTEM_NAME plain "Darwin" on APPLE) exactly, so nothing
      # downstream - the Homebrew Cask, docs/releasing.md's published-filename
      # table - needs to change what it expects.
      - name: Package merged tree as a DragNDrop .dmg
        shell: bash
        env:
          VERSION_TAG_INPUT: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail
          version_tag="${VERSION_TAG_INPUT:-v0.0.0-dev}"
          full_version="${version_tag#v}"
          bare_version="${full_version%%-*}"
          dmg="ac3forge-${bare_version}-Darwin.dmg"
          hdiutil create -volname ac3forge -srcfolder merged -ov -format UDZO -o "$dmg"
          shasum -a 512 "$dmg" > "$dmg.sha512"

      # Best-effort dev archive: library+libruntime installed and lipo-merged
      # the same way as the runtime tree above, packaged as a plain .zip
      # (macOS's own CPACK_GENERATOR carries ZIP, not TGZ - see
      # cmake/Packaging.cmake; unlike Linux/Windows, macOS never gets a
      # .tar.gz today). Wrapped in continue-on-error at the step level so a
      # problem here can never take down the runtime .dmg above, which is
      # the must-have half of this job - see docs/releasing.md's "What gets
      # published" for why library/libruntime are a secondary download even
      # on a single-arch build.
      # No if-no-artifact-found here: the pinned SHA below predates that
      # input (confirmed for real - v0.0.0-alpha.2's dry run logged
      # "Unexpected input(s) 'if-no-artifact-found'" and listed the actual
      # supported set, which does not include it). continue-on-error at the
      # step level is what actually keeps a genuinely-missing artifact from
      # failing this job; the next step's own directory check below is what
      # decides "found" vs "missing" either way, so the input was redundant
      # even before this.
      - name: Download arm64/x64 dev install trees
        id: download_dev
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-install-dev-*
          path: dev
          merge-multiple: false

      - name: lipo-merge and package the dev trees
        continue-on-error: true
        shell: bash
        env:
          VERSION_TAG_INPUT: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail
          # continue-on-error above means a failed/missing download does not
          # stop this step from running, so check for the actual directories
          # here rather than trusting the previous step's outcome.
          if [ ! -d dev/macos-install-dev-arm64 ] || [ ! -d dev/macos-install-dev-x64 ]; then
            echo "::warning::one or both dev install trees are missing - skipping the best-effort dev archive (see the runtime .dmg above for the must-have release artifact)"
            exit 0
          fi
          rsync -a dev/macos-install-dev-x64/ merged-dev/
          while IFS= read -r -d '' f; do
            rel="${f#dev/macos-install-dev-arm64/}"
            a="dev/macos-install-dev-arm64/$rel"
            x="dev/macos-install-dev-x64/$rel"
            m="merged-dev/$rel"
            if [ ! -e "$x" ]; then
              mkdir -p "$(dirname "$m")"
              cp -p "$a" "$m"
              continue
            fi
            if lipo -info "$a" >/dev/null 2>&1 && lipo -info "$x" >/dev/null 2>&1; then
              lipo -create "$a" "$x" -output "$m"
            fi
            # Deliberately no divergence check here, unlike the runtime merge
            # above: headers/CMake config are expected to be identical text,
            # and failing the whole (best-effort) dev archive over that would
            # defeat the point of it being best-effort.
          done < <(find dev/macos-install-dev-arm64 -type f -print0)

          version_tag="${VERSION_TAG_INPUT:-v0.0.0-dev}"
          full_version="${version_tag#v}"
          zip_name="ac3forge-dev-${full_version}-Darwin.zip"
          ( cd merged-dev && zip -qry "../${zip_name}" . )
          shasum -a 512 "$zip_name" > "$zip_name.sha512"

      # Named packages-macos-llvm to match the naming convention every other
      # leg's own "Upload package artifacts" step already uses
      # (packages-${{ matrix.preset }} - windows-msvc's is packages-windows-msvc,
      # linux-gcc's is packages-linux-gcc, and so on) - macos-llvm is the name
      # that leg's own artifact would have carried had it still been the
      # release_package leg. release.yml's github-release job downloads every
      # packages-* artifact with merge-multiple: true into one directory and
      # globs for *.dmg/*.zip/etc there (confirmed by reading that step, not
      # assumed) - so this needs no change there at all, and neither macos-llvm
      # nor macos-llvm-x64 uploads under this same name during a do_package
      # run any more (their own Package/Upload steps are conditioned on
      # !inputs.do_package now - see the matrix job's own comment), so there
      # is no collision.
      - name: Upload universal macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-macos-llvm
          path: |
            ac3forge-*-Darwin.dmg
            ac3forge-*-Darwin.dmg.sha512
            ac3forge-dev-*-Darwin.zip
            ac3forge-dev-*-Darwin.zip.sha512
          if-no-files-found: error

  # The Shield app (apps/android): a Gradle/NDK build, not a CMake preset
  # leg, so it is its own job rather than a `build` matrix entry - there is
  # no config-android/build-android/pack-android preset to reuse, and trying
  # to force this into the same matrix shape as the CMake legs above would
  # buy nothing. debug builds every push (this job's own continuous
  # smoke test, same role windows-msvc's always-on Package step plays for
  # the desktop legs - proves the Gradle/CMake/NDK toolchain and every
  # native source file still build); release only builds - and is uploaded -
  # for an actual release (do_package), matching release_package's "only the
  # canonical shipped build" reasoning on the desktop legs.
  #
  # Object signing (the JOC objects a licensed decoder unlocks) is driven solely
  # by whether the ATMOS_SIGNING_KEY secret is set - NOT by do_package, so it
  # applies to every build this job produces, debug or release. When the secret
  # is present (both ci.yml and release.yml forward it), "Materialize Android
  # object-signing key" below decodes it into the app's bundled signing.key
  # asset and the app signs at runtime; when it is absent the step is skipped
  # and every build is the safe, bed51-equivalent unsigned-object app
  # (shield_signing_hook.hpp's signing_available() returns false with no key
  # asset). A signed APK CONTAINS that key and must never be distributed - see
  # docs/concepts/object-signing.md. This is separate from APK signing below.
  #
  # APK signing is separate from the above and optional: the release build
  # is debug-keystore signed unless ANDROID_KEYSTORE_BASE64 and its three
  # companion secrets are provisioned (release.yml's call only - ci.yml's
  # never sets do_package for a release APK, so it never needs them), in
  # which case "Decode release keystore" below makes them available and
  # build.gradle.kts's releaseSigningAvailable picks up the real key
  # instead. See the commands in docs/releasing.md for provisioning one.
  #
  # Promoted (no continue-on-error) the same way macos-llvm was: three
  # consecutive real, hosted-runner runs went green
  # (feature/shield-atmos-platform's own PR #61 and the two Android-focused
  # pushes after it) before this line came off - see this file's header.
  build-android:
    name: Android (Shield)
    runs-on: ubuntu-latest
    # Unset elsewhere in this file's `build` matrix (which sets 90 for the
    # slowest desktop legs, see its own header) - this job had no bound at
    # all before the emulator step below existed. An emulator boot that
    # never completes is the most likely hang in this job now, not the
    # Gradle/CMake build; 45 is generous for boot + connectedDebugAndroidTest
    # without leaving a wedged runner tying up the queue indefinitely.
    timeout-minutes: 45
    permissions:
      contents: read
      # CodeQL's java-kotlin analyze step below uploads SARIF - see the
      # "Initialize CodeQL"/"Perform CodeQL Analysis" steps' own comment for
      # why that leg lives here instead of codeql.yml. ci.yml's build-and-test
      # and release.yml's build-packages both raise this same ceiling on their
      # calls into this reusable workflow, the same override pattern they
      # already use for contents: write/actions: read.
      security-events: write
    env:
      # A step's `if:` cannot read `secrets` directly, only `env` - so the
      # presence check happens once here and the materialize step reads this
      # (the same pattern release.yml's github-release job uses for
      # HAVE_GPG_KEY). Drives whether object signing happens at all: set on any
      # build with the key provisioned, empty otherwise.
      HAVE_ATMOS_KEY: ${{ secrets.ATMOS_SIGNING_KEY != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}

      # apps/android/gradle/wrapper/gradle-wrapper.jar is a committed
      # binary (OpenSSF Scorecard's Binary-Artifacts check, alert #65) - it
      # can't be dropped since gradlew needs it, so this verifies its
      # checksum against Gradle's own known-good release hashes instead.
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # ubuntu-latest ships several Temurin JDKs preinstalled, each with its
      # own JAVA_HOME_<version>_X64 env var (see actions/runner-images) -
      # selecting one this way needs no extra pinned action for a JDK AGP
      # already requires (compileOptions targets 17 - see build.gradle.kts).
      - name: Select JDK 17
        shell: bash
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      # The Android SDK cmdline-tools ship preinstalled on this image
      # (ANDROID_HOME already set), but not necessarily the exact NDK version
      # build.gradle.kts pins (26.1.10909125, see docs/platforms/android.md) -
      # install it explicitly rather than trust whatever the image happens to
      # have cached, the same reasoning every other toolchain step in this
      # workflow already follows. `yes | sdkmanager --licenses` can exit
      # non-zero even after accepting everything (the piped `yes` closes
      # before sdkmanager reads EOF) - a known quirk, not a real failure - so
      # only the actual NDK install below is allowed to fail the job.
      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125"

      # The Shield app signs Atmos objects on-device, so the key has to be in
      # the APK as an asset (src/main/assets/signing.key, gitignored). Runs
      # whenever the ATMOS_SIGNING_KEY secret is set - on ANY build, debug or
      # release, not gated on do_package - so a debug APK signs too when the key
      # is provisioned. Ordinary runs with no secret skip this entirely and the
      # app streams unsigned bed51. The secret is base64 and is written verbatim;
      # shield_signing_hook.cpp's decode_signing_key() base64-decodes it at
      # startup (the same decode the desktop CLI applies), so no `base64 -d` is
      # needed here. The asset lives only on this runner and is gone when it is
      # torn down; $RUNNER_TEMP is not used because the app's build has to find
      # it under src/main/assets to package it. Never uploaded on its own.
      - name: Materialize Android object-signing key
        if: env.HAVE_ATMOS_KEY == 'true'
        env:
          ATMOS_SIGNING_KEY: ${{ secrets.ATMOS_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="apps/android/app/src/main/assets"
          mkdir -p "$asset_dir"
          printf '%s' "$ATMOS_SIGNING_KEY" > "$asset_dir/signing.key"
          echo "Wrote $asset_dir/signing.key ($(wc -c < "$asset_dir/signing.key") base64 chars) - object signing enabled."

      # java-kotlin has no buildless extractor mode (build-mode: none extracts
      # nothing from this 100%-Kotlin app - see codeql.yml's own header for
      # the measured run that found this), so it needs a real Gradle build to
      # trace. This job already pays for JDK 17, the pinned NDK and the
      # signing key material above, and already runs assembleDebug on every
      # push - init before that build, analyze right after, is cheaper than a
      # second Android toolchain standing up its own leg in codeql.yml.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: java-kotlin
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-and-quality

      - name: Build debug APK
        working-directory: apps/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:java-kotlin"

      # Roadmap VX18(b): device-free instrumented coverage for
      # NativeBridge/PassthroughBridge (apps/android/app/src/androidTest/) -
      # nothing before this ran ANY Kotlin-level test, only the C++-side
      # pure logic on the desktop ctest suite (docs/platforms/android.md).
      # GitHub-hosted Linux runners only have KVM acceleration for x86/
      # x86_64 system images, not arm64-v8a under software translation, so
      # this needs an x86_64 debug build - see build.gradle.kts's debug
      # buildType ndk.abiFilters comment for why arm64-v8a is re-listed
      # there rather than dropped.
      - name: Enable KVM group perms for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests (emulator)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          working-directory: apps/android
          disable-animations: true
          # -noaudio: no host audio device to bridge to inside this
          # container/runner anyway, and it makes isDirectPlaybackSupported
          # deterministically false, which is exactly the "no receiver"
          # contract PassthroughBridgeInstrumentedTest/
          # NativeBridgeInstrumentedTest check - real passthrough hardware
          # is docs/platforms/android.md's manual verification, not this.
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio
            -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain

      # SECURITY: the debug build above is the ONLY thing the key asset exists
      # for - a smoke test that the on-device signing path loads and runs, on a
      # never-uploaded APK. The release APK built below IS published, and an APK
      # carrying this asset is key material (.gitignore, shield_signing_hook.hpp,
      # docs/releasing.md and this workflow's own ATMOS_SIGNING_KEY input
      # description all say so). The materialize step above is gated on the
      # secret being set rather than on do_package, so without this removal it
      # also lands in the workspace assembleRelease packages from. Deleting it
      # here, before any release step, is what makes the published APK the safe
      # unsigned bed51 app. Unconditional on purpose - nothing after this point
      # legitimately wants the key.
      - name: Remove the object-signing key before any release build
        shell: bash
        run: |
          set -euo pipefail
          rm -f apps/android/app/src/main/assets/signing.key
          echo "Object-signing key asset removed - the release APK will be unsigned bed51."

      # Only meaningful for a release build with a keystore actually
      # provisioned - release.yml's call passes these four secrets, ci.yml's
      # never does, so this no-ops there the same way GPG signing is off by
      # default in release.yml's own github-release job. Secrets flow in via
      # `env:`, never interpolated straight into the script body, the same
      # pattern release.yml's "Import GPG signing key" step already uses.
      # $RUNNER_TEMP, not the repo workspace: never at risk of an
      # artifact-upload glob picking it up, and gone the moment this runner
      # is torn down regardless.
      - name: Decode release keystore
        if: inputs.do_package
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret provisioned - assembleRelease will fall back to the debug keystore."
            exit 0
          fi
          keystore_path="$RUNNER_TEMP/ac3forge-shield-release.keystore"
          base64 -d <<<"$ANDROID_KEYSTORE_BASE64" > "$keystore_path"
          {
            echo "ANDROID_KEYSTORE_PATH=$keystore_path"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        if: inputs.do_package
        working-directory: apps/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --console=plain

      # Named/versioned and checksummed the same way cpack's own output is
      # (see the desktop legs' Package step above), so this artifact fits the
      # same release-artifacts/*.apk glob release.yml's jobs already use for
      # every other platform's package.
      - name: Stage release APK
        if: inputs.do_package
        shell: bash
        env:
          VERSION_TAG_INPUT: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail
          version="${VERSION_TAG_INPUT:-0.0.0-dev}"
          mkdir -p packages
          cp apps/android/app/build/outputs/apk/release/app-release.apk \
             "packages/ac3forge-shield-${version}.apk"
          ( cd packages && sha512sum "ac3forge-shield-${version}.apk" > "ac3forge-shield-${version}.apk.sha512" )

      # The removal step above is a precaution; THIS is the guard. It inspects
      # the actual bytes about to be published rather than trusting that the
      # step ordering above stayed correct, so any future reordering, a Gradle
      # asset-merge change, or a second materialize step fails the release
      # instead of shipping the key again. Greps the whole entry list, not just
      # assets/, since a merged asset can land under a different prefix.
      - name: Assert the staged APK carries no key material
        if: inputs.do_package
        shell: bash
        env:
          VERSION_TAG_INPUT: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail
          version="${VERSION_TAG_INPUT:-0.0.0-dev}"
          apk="packages/ac3forge-shield-${version}.apk"
          entries="$(unzip -Z1 "$apk")"
          if grep -Eq '(^|/)signing\.key$' <<<"$entries"; then
            echo "::error::$apk contains a signing.key entry - this APK is key material and must not be published."
            grep -E '(^|/)signing\.key$' <<<"$entries"
            exit 1
          fi
          echo "OK: no signing.key entry in $apk ($(wc -l <<<"$entries") entries scanned)."

      - name: Upload package artifacts
        if: inputs.do_package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-android
          path: |
            packages/*.apk
            packages/*.apk.sha512
          if-no-files-found: error

  # The WASM browser decode demo (apps/wasm, roadmap F3): a real CMake
  # preset (config-wasm-emscripten) unlike build-android above, but still its
  # own job rather than a `build` matrix entry, for the same reason
  # build-android's own header gives - this leg has none of the shape that
  # matrix's steps assume (no ctest suite to run, no cpack package to stage,
  # no gold-reference gate), so folding it in would mean threading new `if:`
  # exclusions through most of that job's steps for no benefit. Runs on
  # every push - a continuous smoke test that the Emscripten toolchain and
  # every file it touches still build - the same role build-android's
  # always-on debug APK plays; this job never produces a release artifact of
  # its own the way build-android's release APK does, since the actual
  # published copy is rebuilt fresh by docs.yml's deploy job rather than
  # shipped from here (see that workflow and docs/platforms/wasm.md).
  build-wasm:
    name: WASM (browser decode demo)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}

      - uses: ./.github/actions/setup-emscripten

      - name: Configure
        run: cmake --preset config-wasm-emscripten

      - name: Build
        run: cmake --build build/config-wasm-emscripten

      # Not consumed by docs.yml (see this job's own header) - uploaded
      # purely so a failed/successful build's actual output is inspectable
      # from the Actions run, the same convenience packages-android gets.
      # Unconditional (ahead of the browser test below) so a failing test
      # still leaves the build it tested inspectable.
      - name: Upload demo artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-decode-demo
          path: build/config-wasm-emscripten/bin/wasm_decode_demo
          if-no-files-found: error

      # Roadmap VX18(a): until this, "it compiles" was the only thing any CI
      # leg checked - docs/platforms/wasm.md's "Not yet verified" section
      # recorded decode/playback/render correctness as manual-only,
      # re-checked by eye every time this demo changed. apps/wasm/tests'
      # Playwright harness drives the real Embind API against the bundled
      # fixture and asserts the same real values (channel count, sample
      # rate, object count, duration, a moving object position) that manual
      # verification checked before.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/wasm/tests/package-lock.json

      - name: Install Playwright harness
        working-directory: apps/wasm/tests
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Headless-browser decode test
        working-directory: apps/wasm/tests
        env:
          WASM_DEMO_DIR: ${{ github.workspace }}/build/config-wasm-emscripten/bin/wasm_decode_demo
          CI: "1"
        run: npm test

  # The Rust bindings (rust/, roadmap AP9): a Cargo workspace living in-tree but deliberately
  # never add_subdirectory()'d from the root CMakeLists.txt - see rust/README.md's "why this
  # lives in-tree" section. Its own job for the same reason build-wasm/build-footprint are: none
  # of the `build` matrix's steps apply (no ctest suite, no cpack package, no gold-reference
  # gate) - rust/ac3forge-sys/build.rs drives its own trimmed CMake configure of just
  # ac3::forge_c_shared rather than reusing a desktop preset.
  #
  # Linux-only for this first pass, matching build-wasm/build-footprint each being single-OS
  # too: build.rs links libac3forge_c.so dynamically and copies it next to cargo's own build
  # output (see rust/README.md's "how linking works") - a real CI run on the simplest platform
  # first, before widening to the Windows/macOS legs that approach hasn't been proven on yet.
  #
  # No toolchain-selection step: rustup (preinstalled on this runner image) auto-detects and
  # installs rust/rust-toolchain.toml's pinned channel plus its clippy/rustfmt components the
  # moment `cargo`/`rustup` is invoked from inside rust/ - one canonical version pin, not one
  # duplicated into this file too, the same "no second copy of a version string" reasoning
  # _toolchain-versions.yml's own header states for the C/C++ toolchains.
  build-rust:
    name: Rust bindings (ac3forge-sys, ac3forge)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}

      - name: Install pinned Rust toolchain
        working-directory: rust
        run: rustup show

      - name: cargo build
        working-directory: rust
        run: cargo build --workspace --locked

      - name: cargo test
        working-directory: rust
        run: cargo test --workspace --locked

      - name: cargo clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Mirrors ac3::warnings' project-wide "warnings are errors" stance (clippy above) and
      # .clang-format's "checked in, run it" rule (rustfmt here).
      - name: cargo fmt --check
        working-directory: rust
        run: cargo fmt --check

  # The minimum-footprint decoder profile (roadmap PF7, docs/building.md) built
  # for arm-none-eabi and run on QEMU's mps2-an385 - a Cortex-M3 with no
  # operating system, no filesystem and no hardware floating point. Its own job
  # rather than a `build` matrix entry for the same reason build-wasm is: none
  # of that matrix's steps apply here (no ctest suite, no cpack package, no
  # gold-reference gate, and the profile's own guard refuses the options those
  # steps assume).
  #
  # What it gates on, in tools/checks/run_baremetal_probe.sh: the probe's own
  # verdict (every channel's level against apps/baremetal/fixture.hpp), the
  # linked image size, peak heap, and steady-state allocations per frame. The
  # last of those is a distance-from-zero the profile has not closed - see
  # docs/building.md's gap note - and the ceiling is there so it cannot grow
  # while the gap is open.
  #
  # Runs on every push, like build-wasm: this is the only leg that compiles the
  # codec for a 32-bit target at all, and the first one to do so found three
  # real portability faults that no LP64 leg could have (see the profile's own
  # commit). A leg that only ran before releases would have found them then.
  build-footprint:
    name: Minimum-footprint decoder (arm-none-eabi, QEMU)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    permissions:
      contents: read
    steps:
      # One apt transaction, not several: interleaved apt-get runs on the same
      # dpkg database leave half-configured packages behind, and
      # libstdc++-arm-none-eabi-newlib in that state produces a "cstdio: No
      # such file or directory" that looks like a missing dependency rather
      # than an interrupted install.
      - name: Bootstrap container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends             ca-certificates cmake git ninja-build python3             gcc-arm-none-eabi binutils-arm-none-eabi             libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib             qemu-system-arm

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}

      - name: Report toolchain versions
        run: |
          arm-none-eabi-g++ --version | head -1
          qemu-system-arm --version | head -1

      - name: Build and run the probe under QEMU
        env:
          AC3FORGE_FOOTPRINT_SUMMARY: ${{ runner.temp }}/footprint.txt
        run: ./tools/checks/run_baremetal_probe.sh

      # The footprint table in docs/performance-trend.md is written by hand
      # from these numbers, so keep the run's own copy: a table nobody can
      # check against the run that produced it is a claim, not a measurement.
      - name: Footprint summary
        if: always()
        run: |
          set -eu
          python3 tools/checks/footprint_report.py             --probe "${{ runner.temp }}/footprint.txt"             --elf build/config-arm-none-eabi-minimal/bin/ac3probe             --map build/config-arm-none-eabi-minimal/apps/baremetal/ac3probe.map             --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload footprint artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: footprint-arm-none-eabi
          path: |
            ${{ runner.temp }}/footprint.txt
            build/config-arm-none-eabi-minimal/apps/baremetal/ac3probe.map
          if-no-files-found: warn

  # Persists this run's gold-reference SNR numbers (docs/quality-trend.md) so
  # they outlive the CI run that produced them, instead of only ever living in
  # a log that ages out. One job, not one push per leg: `needs: build` waits
  # for every matrix leg, so this both (a) only runs when the hard gate passed
  # everywhere - a leg failing fails `build` outright, which skips this job by
  # its default `if`, so a broken run's numbers never get recorded - and
  # (b) writes one commit per CI run instead of up to five racing to push at
  # once. gold_reference is not set on linux-llvm-asan-ubsan, so it never
  # contributes an artifact; `download-artifact` only requires that at least
  # the pattern's namespace exist, not every leg specifically.
  #
  # The quality-history branch (not gh-pages) holds the data: `mkdocs
  # gh-deploy` replaces gh-pages' entire tree on every deploy (it is a
  # publish-a-directory-as-a-branch tool, not an incremental one), which would
  # silently wipe anything appended there that mkdocs itself didn't generate.
  # A dedicated branch sidesteps that entirely, and - since this is a public
  # repo - is fetchable client-side from raw.githubusercontent.com with no
  # auth, no API rate limit, and no server: see docs/quality-trend.md's own
  # script. That also decouples data collection (every main push) from the
  # docs site's own publish cadence (also push to main, per docs.yml, but a
  # separate job) - a push's numbers show up on the trend page without
  # waiting on that job to finish.
  quality-trend:
    name: Publish quality trend
    needs: build
    if: inputs.persist_quality_trend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # persist-credentials: false - this checkout is only ever read from
      # (tools/ci/append_quality_history.py, `git show` on this commit); the
      # "Prepare quality-history checkout" step below pushes through its own
      # explicitly-scoped remote instead, so leaving actions/checkout's token
      # persisted in this working tree's git config would just be an unused,
      # avoidable credential sitting around for the rest of the job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download gold-reference results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gold-reference-*
          path: results

      # Plain git over an HTTPS remote carrying the token, mirroring docs.yml's
      # own gh-deploy pattern - not actions/checkout, because that fails
      # outright if `quality-history` does not exist yet (true only on this
      # feature's first-ever run), and there is no built-in "create the branch
      # if missing" input for it.
      - name: Prepare quality-history checkout
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          mkdir -p history
          cd history
          if git ls-remote --exit-code --heads "$remote" quality-history >/dev/null 2>&1; then
            git init -q
            git remote add origin "$remote"
            git fetch -q origin quality-history
            git checkout -q quality-history
          else
            git init -q -b quality-history
            git remote add origin "$remote"
            git commit -q --allow-empty -m "Initialize quality-history branch"
          fi

      - name: Append quality-trend history
        id: append
        shell: bash
        env:
          # Env, not interpolated straight into the script: zizmor's
          # template-injection audit treats a reusable workflow's own
          # `inputs.*` as untrusted regardless of what this particular caller
          # happens to pass - an env var is substituted by the shell, not
          # textually spliced into the script by the runner before bash ever
          # parses it, which is what actually closes the injection risk.
          BRANCH: ${{ inputs.quality_trend_branch }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The commit's own recorded date, not date -u/Date.now() - see
          # append_quality_history.py's own header on why this is passed in
          # rather than read from the clock.
          commit_date="$(git show -s --format=%cI "$COMMIT_SHA")"
          python3 tools/ci/append_quality_history.py \
            --results-dir results \
            --history-dir history \
            --branch "$BRANCH" \
            --commit "$COMMIT_SHA" \
            --commit-date "$commit_date"

      - name: Commit and push quality-history update
        shell: bash
        env:
          BRANCH: ${{ inputs.quality_trend_branch }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd history
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -q -m "Quality trend: ${BRANCH}@${COMMIT_SHA}"
            # Four trend publishers (quality, performance,
            # external-comparison, object-quality) share this one branch and
            # routinely finish within seconds of each other, so losing the
            # push race is an expected outcome rather than an error - it is
            # what "! [rejected] (fetch first)" on main means. Each writes its
            # own data file, so rebasing onto whichever sibling won is
            # conflict-free; only a genuine conflict stops the retry.
            pushed=""
            for attempt in 1 2 3 4 5; do
              if git push -q origin quality-history 2>/dev/null; then
                pushed=yes
                break
              fi
              echo "push rejected (attempt ${attempt}); rebasing onto origin/quality-history"
              git fetch -q origin quality-history
              git rebase -q origin/quality-history
              sleep $(( (RANDOM % 5) + 1 ))
            done
            if [ -z "${pushed}" ]; then
              echo "::error::could not push quality-history after 5 attempts"
              exit 1
            fi
          fi

      # Deliberately after the push above, not instead of the append step
      # failing outright: a hard regression's numbers still need to land in
      # quality-history (docs/quality-trend.md's table/chart is how anyone
      # finds out what happened) even though this run must also end up red.
      # See tools/ci/append_quality_history.py's HARD_REGRESSION_DROP_DB.
      - name: Fail on hard quality regression
        if: steps.append.outputs.hard_regression == 'true'
        shell: bash
        run: |
          echo "::error::A leg/codec dropped more than the hard quality-trend threshold below its trailing average - see the job log above and docs/quality-trend.md for the recorded numbers."
          exit 1
