# Python wheels for the ac3forge PyPI package (roadmap F2, python/) - separate from
# _build.yml/ci.yml's C++ matrix, which knows nothing about Python packaging. Builds via
# cibuildwheel, configured from python/pyproject.toml's own [tool.cibuildwheel] table so a local
# `cibuildwheel python` run matches this workflow exactly rather than drifting from workflow-only
# YAML settings.
#
# The build job runs continuously (every push/PR touching python/**) and always uploads wheels as
# an artifact - "buildable and testable" is checked the same way _build.yml's continuous
# windows-msvc packaging smoke test checks "packageable". Publishing to PyPI is a second job,
# gated on a v* tag push - see docs/releasing.md's "Publishing to PyPI" for how it's provisioned
# (already done; ac3forge is live on PyPI).
name: Python Wheels

on:
  pull_request:
    paths:
      - "python/**"
      - "src/forge/**"
      - "examples/python/**"
      - "CMakeLists.txt"
      - ".github/workflows/wheels.yml"
  push:
    branches: [main]
    paths:
      - "python/**"
      - "src/forge/**"
      - "examples/python/**"
      - "CMakeLists.txt"
      - ".github/workflows/wheels.yml"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Same self-hosted/GitHub-hosted fan-out _build.yml's own Windows/Linux
  # legs get (see docs/ci-self-hosted-runners.md), via the shared
  # decide-runner composite action - this workflow is triggered
  # independently of ci.yml/_build.yml, so it has no access to that job's
  # outputs. macOS stays GitHub-hosted unconditionally: there is no
  # self-hosted macOS capacity, and AWS's Mac instances bill in 24-hour
  # minimum blocks, a poor fit for a ~5-minute job that runs on every push.
  check-runners:
    name: Check self-hosted runner availability
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      windows_runner: ${{ steps.windows.outputs.runner }}
      linux_runner: ${{ steps.linux.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: windows
        uses: ./.github/actions/decide-runner
        with:
          os-label: Windows
          hosted-json: '["windows-latest"]'
          mode: ${{ vars.RUNNER_WINDOWS_MODE || 'auto' }}
          org-token: ${{ secrets.ORG_RUNNERS_TOKEN }}
      - id: linux
        uses: ./.github/actions/decide-runner
        with:
          os-label: Linux
          hosted-json: '["ubuntu-latest"]'
          mode: ${{ vars.RUNNER_LINUX_MODE || 'auto' }}
          org-token: ${{ secrets.ORG_RUNNERS_TOKEN }}

  build:
    name: Build wheels (${{ matrix.name }})
    needs: check-runners
    # Belt-and-braces, same as _build.yml's build job: check-runners' own
    # fork-PR branch already forces hosted labels for a fork PR, so this
    # only matters if a gap ever opened up in that logic.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-latest
            runner: ${{ needs.check-runners.outputs.windows_runner }}
          - name: macos-latest
            runner: '["macos-latest"]'
          - name: ubuntu-latest
            runner: ${{ needs.check-runners.outputs.linux_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # setuptools_scm (python/pyproject.toml's version provider) needs real tag history to
          # derive a real version the same way cmake/GitVersionDerivation.cmake's own `git
          # describe` does on the C++ side - a shallow clone here would build every wheel as an
          # indistinguishable 0.0.0 rather than a real per-commit dev version.
          fetch-depth: 0

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        with:
          package-dir: python

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # A coverage floor for python/ (roadmap VX15), the Python-side counterpart to
  # ci.yml's per-component gcov gate.
  #
  # Its own job rather than folding --cov into [tool.cibuildwheel]'s
  # test-command: that command runs once per interpreter per platform - fifteen
  # times for this matrix - and the answer does not vary between them. One
  # ubuntu wheel, installed and measured once, is the whole signal.
  #
  # What this does and does not measure, stated plainly because the number
  # looks better than it is. python/src/ac3forge/__init__.py is a re-export
  # shim: an import block, a version lookup, and __all__. Nearly all of the
  # binding surface is C++ (python/src/ac3forge_ext/bindings.cpp), which
  # coverage.py cannot see at all - so a high percentage here means "the
  # package imports and its Python-level surface executes", not "the bindings
  # are tested". That is still worth gating: a name dropped from the import
  # list, a broken __version__ lookup, or a module that no longer imports on
  # some interpreter all show up here and nowhere else. The C++ underneath is
  # covered by ci.yml's gate over src/forge, which is where those lines live.
  python-coverage:
    name: Python coverage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The wheel the build job just produced, not a fresh build: this
      # measures what would actually ship, and reuses several minutes of
      # compilation rather than repeating it.
      - name: Download the Linux wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels-ubuntu-latest
          path: wheelhouse

      # A venv rather than a bare pip install, for the same PEP 668 reason as
      # ci.yml's script-lint job. requirements/requirements-pytest.txt is a
      # pip-compile --generate-hashes lock like the other three under
      # requirements/, so pytest, its coverage plugin and the wheel's own numpy
      # dependency are all pinned by hash before the wheel is installed
      # offline on top - see that .in file's header for why numpy is satisfied
      # here rather than left to pip during the wheel install.
      - name: Install the wheel and the pinned test tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .pyvenv
          .pyvenv/bin/python -m pip install --quiet "pip==24.3.1"
          .pyvenv/bin/python -m pip install --quiet --require-hashes \
            -r requirements/requirements-pytest.txt
          # --find-links, not `pip install wheelhouse/*.whl`: cibuildwheel
          # produces one wheel per interpreter (cp310-cp314), so the glob would
          # hand pip five files and four of them are "not a supported wheel on
          # this platform" for whatever Python the runner image ships. Naming
          # the project and pointing pip at the directory lets it pick the one
          # that matches, whichever that turns out to be. --no-index so it can
          # only ever pick from wheelhouse/ - with the index reachable, pip
          # would be free to prefer a released ac3forge from PyPI over the
          # locally built wheel this job exists to measure.
          .pyvenv/bin/python -m pip install --quiet --no-index \
            --find-links wheelhouse ac3forge
          .pyvenv/bin/python -c "import ac3forge; print(ac3forge.__version__)"

      # --cov-fail-under is the gate. The floor is deliberately well under the
      # measurement for the same reason every floor in
      # tools/checks/coverage_report.sh is: it should trip on a real
      # regression, not on ordinary churn. Raise it as python/ grows real
      # Python code rather than leaving the headroom in place indefinitely.
      - name: pytest with a coverage floor
        shell: bash
        run: |
          set -euo pipefail
          .pyvenv/bin/python -m pytest python/tests \
            --cov=ac3forge --cov-report=term-missing --cov-fail-under=85

  # Publishes via PyPI trusted publishing (OIDC) against the `pypi` GitHub environment - both are
  # provisioned; see docs/releasing.md's "Publishing to PyPI". Gated on a v* tag push, same as
  # release.yml; the build job above and its wheel artifacts run on every push regardless.
  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
