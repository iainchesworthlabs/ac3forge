# Diffs the dependency graph on every PR (GitHub Actions used in
# .github/workflows, plus whatever vcpkg.json's manifest contributes to the
# graph) and fails the check if the diff introduces a moderate-or-worse known
# vulnerability. This is the one scanner in this repo's security setup that's
# a required, blocking check - see .github/branch-protection.md. Modelled on
# CountdownSolver's .github/workflows/dependency-review.yml.
name: Dependency Review

on:
  pull_request:
    branches: [ main ]
  # main's merge queue (see .github/branch-protection.md) needs "Scan
  # dependency diff" to actually report on its temporary
  # gh-readonly-queue/... ref - see ci.yml's own merge_group comment for the
  # general reason. actions/dependency-review-action has supported merge_group
  # (diffing against github.event.merge_group.base_sha) since v3.1.0, well
  # below the v5 pin below.
  merge_group:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Scan dependency diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # requirements/requirements-esphome.txt's starlette==0.52.1 (esphome's
          # dashboard dependency), confirmed NOT fixable by pinning forward:
          # platformio (esphome's own embedded-build dependency) hard-caps
          # starlette<0.53,>=0.19, and 0.52.1 is the last 0.x release ever
          # published - the next is 1.0.0, which platformio's own pin refuses.
          # This job only ever runs `esphome config` to validate YAML, never
          # esphome's dashboard, so StaticFiles/request.form() - what these
          # four advisories are actually about - are never exercised. Revisit
          # (drop these four ids) once platformio raises its cap.
          allow-ghsas: |
            GHSA-wqp7-x3pw-xc5r
            GHSA-82w8-qh3p-5jfq
            GHSA-86qp-5c8j-p5mr
            GHSA-x746-7m8f-x49c
