# Scans vcpkg.json against the OSV vulnerability database. Right now that's
# just Catch2 (test-only - see vcpkg.json), but this scales as real runtime
# dependencies get added, since Dependabot has no vcpkg ecosystem the way it
# does npm/pip/github-actions (see .github/dependabot.yml).
#
# Visible-only by design (fail-on-vuln: false): findings land in the
# Security > Code scanning tab, but don't block merges. dependency-review.yml
# is this repo's one blocking dependency check - see
# .github/branch-protection.md. Modelled on CountdownSolver's
# .github/workflows/osv-scanner.yml.
name: OSV-Scanner

on:
  schedule:
    # Daily full-dependency baseline. Dependency Review remains the small,
    # required PR-time gate; this visible-only scan should not consume a
    # hosted slot for every source-only PR.
    - cron: "45 3 * * *"
  workflow_dispatch:

# Deliberately minimal: every job below declares its own full permissions set
# (actions/contents read, security-events write, to upload SARIF), so this
# top-level block is only ever a fallback for a future job that forgets to -
# it should never itself carry security-events: write.
permissions:
  contents: read

concurrency:
  group: osv-scanner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      fail-on-vuln: false
