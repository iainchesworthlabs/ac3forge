# Scans vcpkg.json against the OSV vulnerability database. Right now that's
# just Catch2 (test-only - see vcpkg.json), but this scales as real runtime
# dependencies get added, since Dependabot has no vcpkg ecosystem the way it
# does npm/pip/github-actions (see .github/dependabot.yml).
#
# Visible-only by design (fail-on-vuln: false): findings land in the
# Security > Code scanning tab for both the PR and scheduled scans, but don't
# block merges. dependency-review.yml is this repo's one blocking dependency
# check - see .github/branch-protection.md. Modelled on CountdownSolver's
# .github/workflows/osv-scanner.yml.
name: OSV-Scanner

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly, offset from the other Monday weeklies (zizmor 03:50, scorecard
    # 04:00) so no two land on the runner queue in the same minute. The
    # nightly analysis crons sit earlier, at 02:17 (codeql.yml) and 02:23
    # (msvc-analysis.yml) - see docs/ci-self-hosted-runners.md "Nightly
    # analysis window".
    - cron: "45 3 * * 1"
  workflow_dispatch:

# A newer push to a PR supersedes the older push's scan - nothing reads a
# superseded commit's results, and each one held a GitHub-hosted slot (GitHub
# Free: 20 at a time, org-wide) until it ran; on 2026-09-25 runs for three
# superseded commits of one PR were still queued. Pushes to main share one
# group without cancel-in-progress, so a scan that has started finishes and
# only the newest main commit's waits for a runner (docs/ci-lanes.md, "Only
# the newest main commit runs the hosted jobs"). A scheduled scan or a
# dispatch gets a group of its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.head_ref) || (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'main-push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Deliberately minimal: every job below declares its own full permissions set
# (actions/contents read, security-events write, to upload SARIF), so this
# top-level block is only ever a fallback for a future job that forgets to -
# it should never itself carry security-events: write.
permissions:
  contents: read

jobs:
  scan-pr:
    # vars.PAUSE_NONESSENTIAL_CI: a temporary, reversible-by-variable pause on
    # non-required PR-time checks during a merge-queue drain, freeing hosted
    # runner concurrency for the checks that actually gate merging (see
    # .github/branch-protection.md's required list, which this is not on).
    # scan-scheduled below is untouched, so main still gets this weekly
    # regardless. Clear/remove the variable to revert - no code change needed.
    if: github.event_name == 'pull_request' && vars.PAUSE_NONESSENTIAL_CI != 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      fail-on-vuln: false

  scan-scheduled:
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      fail-on-vuln: false
