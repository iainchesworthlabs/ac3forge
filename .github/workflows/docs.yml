name: Docs

on:
  pull_request:
    branches: [ main ]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements/requirements-docs.in"
      - "requirements/requirements-docs.txt"
      - ".github/workflows/docs.yml"
      # Root files the site includes verbatim via pymdownx.snippets
      # (docs/contributing.md and docs/roadmap.md) - an edit to either must
      # rebuild the site or the published copy goes stale.
      - "CONTRIBUTING.md"
      - "ROADMAP.md"
      # The WASM decode demo the deploy job below rebuilds fresh and embeds
      # at docs/wasm-demo.md - without these, an apps/wasm/ change on
      # main would never trigger a redeploy at all, and the published demo
      # would silently drift from source. src/forge/ is deliberately NOT
      # listed: an ordinary codec change touches it constantly and has no
      # reason to redeploy the docs site on its own; a change that also
      # needs the demo republished goes through apps/wasm/ (or one of
      # the paths below) too.
      - "apps/wasm/**"
      # ac3forge-wasm-decoder (WASM streaming decoder package) - the demo embeds js/dist/
      # alongside the compiled decoder, so a package-only change also has
      # to trigger a redeploy, same reasoning as apps/wasm/** above.
      - "js/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/toolchains/wasm.emscripten.toolchain.cmake"
      - ".github/actions/setup-emscripten/**"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      # What the deploy job runs to fill the sink installer.
      - "tools/hearth/installer_site.py"
      - "tools/hearth/ota.py"
      - "requirements/requirements-docs.in"
      - "requirements/requirements-docs.txt"
      - ".github/workflows/docs.yml"
      - "CONTRIBUTING.md"
      - "ROADMAP.md"
      - "apps/wasm/**"
      # ac3forge-wasm-decoder (WASM streaming decoder package) - the demo embeds js/dist/
      # alongside the compiled decoder, so a package-only change also has
      # to trigger a redeploy, same reasoning as apps/wasm/** above.
      - "js/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/toolchains/wasm.emscripten.toolchain.cmake"
      - ".github/actions/setup-emscripten/**"
  workflow_dispatch: {}

# A newer push to a PR supersedes the older push's docs build - see
# osv-scanner.yml's identical block for why. Pushes to main share one group
# without cancel-in-progress, so a deploy that has started always finishes and
# only the newest main commit's run waits for a runner (docs/ci-lanes.md, "Only
# the newest main commit runs the hosted jobs"). A dispatch gets a group of its
# own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.head_ref) || (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'main-push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build (--strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - run: pip install --require-hashes -r requirements/requirements-docs.txt

      # docs/assets/wasm-decode-demo/ and docs/assets/wasm-encode-demo/ are committed fallbacks for
      # a local `mkdocs build` (and this job's own strict build below) - see the deploy job's
      # "Rebuild WASM demos" step for why the *published* site never depends on either staying in
      # sync. But each demo's page files have no reason to differ from apps/wasm/'s own source at
      # all - they are plain copies (see apps/wasm/CMakeLists.txt's two POST_BUILD steps), not
      # Emscripten output, so nothing here needs the toolchain this job deliberately doesn't
      # install. The genuine build artifacts (each demo's .js/.wasm) have no source-tree
      # counterpart to diff against, so they're not part of this check.
      - name: Check WASM demo fallbacks are in sync with apps/wasm/
        run: |
          set -euo pipefail
          status=0
          for f in index.html demo.js favicon.svg favicon-32.png assets/demo.ec3; do
            if ! cmp -s "apps/wasm/$f" "docs/assets/wasm-decode-demo/$f"; then
              echo "::error file=docs/assets/wasm-decode-demo/$f::Out of sync with apps/wasm/$f - re-copy it (see docs/platforms/wasm.md)."
              status=1
            fi
          done
          for f in index.html app.js; do
            if ! cmp -s "apps/wasm/encode/$f" "docs/assets/wasm-encode-demo/$f"; then
              echo "::error file=docs/assets/wasm-encode-demo/$f::Out of sync with apps/wasm/encode/$f - re-copy it (see docs/platforms/wasm.md)."
              status=1
            fi
          done
          for f in favicon.svg favicon-32.png; do
            if ! cmp -s "apps/wasm/$f" "docs/assets/wasm-encode-demo/$f"; then
              echo "::error file=docs/assets/wasm-encode-demo/$f::Out of sync with apps/wasm/$f - re-copy it (see docs/platforms/wasm.md)."
              status=1
            fi
          done
          for f in index.html app.js; do
            if ! cmp -s "apps/wasm/atmos/$f" "docs/assets/wasm-encode-demo/atmos/$f"; then
              echo "::error file=docs/assets/wasm-encode-demo/atmos/$f::Out of sync with apps/wasm/atmos/$f - re-copy it (see docs/platforms/wasm.md)."
              status=1
            fi
          done
          exit "$status"

      - run: mkdocs build --strict

      # Advisory only: Material for MkDocs is in maintenance mode and its own maintainers'
      # answer to what replaces it is Zensical (github.com/zensical/zensical), not MkDocs 2.0 -
      # see requirements/requirements-docs.in's comment above the zensical pin. This step builds
      # this same site tree with it on every docs-touching PR so a real migration decision has
      # real, current evidence behind it, without depending on an immature (pre-1.0) tool for a
      # required check or changing what the deploy job below actually publishes.
      - name: Build with Zensical (canary, non-blocking)
        continue-on-error: true
        run: zensical build --strict

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # persist-credentials: false - mkdocs gh-deploy below pushes to the
      # gh-pages branch through its own explicitly-scoped remote instead (see
      # "Configure git for gh-deploy"), mirroring _build.yml's quality-trend
      # job. Leaving actions/checkout's token persisted in this working
      # tree's git config for the whole job would just be an unused,
      # avoidable credential sitting around.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - run: pip install --require-hashes -r requirements/requirements-docs.txt

      # Rebuilds both WASM demos (apps/wasm, WASM browser demo and UX6) fresh and
      # overwrites the committed docs/assets/wasm-{decode,encode}-demo/ copies
      # before `mkdocs gh-deploy` runs its own `mkdocs build` internally - so
      # what actually gets published always reflects current source, not
      # whatever happened to be committed. The committed copies stay in the
      # tree as a working fallback for local `mkdocs build` (and this job's
      # own `build` dependency above, which never installs Emscripten) - see
      # docs/wasm-demo.md, docs/wasm-encode-demo.md and docs/platforms/wasm.md
      # for the full reasoning. ninja-build isn't assumed present on this
      # job's runner the way _build.yml's Linux legs can assume it (this
      # workflow never otherwise touches a C++ toolchain), so it's installed
      # explicitly here rather than trusted.
      - name: Install Ninja
        run: |
          attempt=1
          until sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ninja-build
          do
            echo "::warning title=apt-get::attempt $attempt of 3 failed"
            [ "$attempt" -lt 3 ] || exit 1
            attempt=$((attempt + 1))
            sleep 30
          done

      - uses: ./.github/actions/setup-emscripten

      # ac3forge-wasm-decoder (WASM streaming decoder package, js/) has to be built before the
      # Emscripten rebuild below, which copies js/dist/ alongside the
      # compiled decoder into the directory that overwrites docs/assets/
      # wasm-decode-demo/ - the demo is a consumer of the package (see
      # docs/platforms/wasm.md), so its build output has to exist first.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Build ac3forge-wasm-decoder package
        working-directory: js
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Rebuild WASM demos
        run: |
          set -euo pipefail
          cmake --preset config-wasm-emscripten
          cmake --build build/config-wasm-emscripten
          mkdir -p build/config-wasm-emscripten/bin/wasm_decode_demo/package
          cp -r js/dist/. build/config-wasm-emscripten/bin/wasm_decode_demo/package/
          rm -rf docs/assets/wasm-decode-demo docs/assets/wasm-encode-demo
          mkdir -p docs/assets/wasm-decode-demo docs/assets/wasm-encode-demo
          cp -r build/config-wasm-emscripten/bin/wasm_decode_demo/. docs/assets/wasm-decode-demo/
          cp -r build/config-wasm-emscripten/bin/wasm_encode_demo/. docs/assets/wasm-encode-demo/

      # The Hearth sink installer (docs/hearth/sink-installer.md,
      # planning/esp32-ota.md O9) flashes a board from the browser with ESP Web
      # Tools. The site serves its own copy rather than a CDN's, so a reader's
      # browser loads nothing from a third party on the page that writes their
      # board's flash: the npm tarball, pinned to a version and to the
      # integrity npm published for it, unpacked into the page's assets.
      - name: Put ESP Web Tools into the sink installer
        env:
          ESP_WEB_TOOLS_VERSION: "10.4.0"
          ESP_WEB_TOOLS_INTEGRITY: "sha512-3pwkeFFm5Fj7UQo8SJNYK5RXrtNCpq6X9QoI6bMT4GBZWgrJqjn0YvM9ihG74BtMoSFYXfmDtkehuxe50PTMPQ=="
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          ( cd "$work" && npm pack "esp-web-tools@$ESP_WEB_TOOLS_VERSION" --silent >/dev/null )
          tarball="$work/esp-web-tools-$ESP_WEB_TOOLS_VERSION.tgz"
          actual="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          if [ "$actual" != "$ESP_WEB_TOOLS_INTEGRITY" ]; then
            echo "::error::esp-web-tools $ESP_WEB_TOOLS_VERSION is not the tarball its pinned integrity names"
            exit 1
          fi
          tar -xzf "$tarball" -C "$work" package/dist/web package/LICENSE
          mkdir -p docs/assets/sink-installer/esp-web-tools
          cp -r "$work/package/dist/web/." docs/assets/sink-installer/esp-web-tools/
          cp "$work/package/LICENSE" docs/assets/sink-installer/esp-web-tools/LICENSE

      # And the newest release's sink firmware beside it: a page cannot fetch
      # GitHub release assets, which carry no CORS headers.
      # tools/hearth/installer_site.py checks each image's parts against the
      # release's manifest and SHA512SUMS, and writes ESP Web Tools' manifest
      # for each. Before any release publishes sink firmware it writes an empty
      # index, and the page says so; anything else it cannot do fails the
      # deploy. release.yml dispatches this workflow once a release is up.
      - name: Put the newest release's sink firmware into the installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/hearth/installer_site.py --release latest --out docs/assets/sink-installer

      - name: Configure git for gh-deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

      - run: mkdocs gh-deploy --force --clean
