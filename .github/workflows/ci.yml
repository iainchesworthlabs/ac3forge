# ac3forge post-merge verification: the full matrix, run on main after a merge.
#
# Pull requests and merge-queue entries are gated by pr-gate.yml, which is small
# and fast. This workflow is what proves main. It runs on every push to main but
# never more than one at a time (see `concurrency` below), so a burst of merges
# is verified as one batch, and main-health.yml names the merges in it when it
# fails. docs/ci-agentic.md has the design; docs/ci-lanes.md still describes the
# lane partitions this file uses.
#
# ---------------------------------------------------------------------------
# Matrix status
# ---------------------------------------------------------------------------
# A point-in-time record, not a standing guarantee - each leg's latest run is
# the authority, so re-check there rather than trusting a row here. Exact
# test counts per leg drift as features land (the same counts-drift note
# _build.yml's header carries), so no count is stated here: read the ctest
# summary in the leg's own log. Every leg listed here is required and has
# real GitHub Actions runs behind it (see _build.yml's header for how the
# last of them, macos-llvm, got there). The code-analysis engines are not
# in this table: clang-tidy, CodeQL and MSVC PREfast run nightly against
# main in their own workflows and none of them feeds CI Status - see
# docs/ci-self-hosted-runners.md "Nightly analysis window".
#
#   leg                     status    notes
#   ----------------------  --------  ------------------------------------------
#   windows-msvc            GREEN
#   windows-llvm            GREEN     fixed a qsizetype-to-int narrowing in
#                                     encoder_controller.cpp that -Wconversion
#                                     rejects under clang-cl (MSVC's /W4 has
#                                     no equivalent check)
#   linux-gcc               GREEN     GUI and ALSA both on, plus the same
#                                     leg's no-ALSA-fallback step
#   linux-llvm              GREEN     GUI and ALSA both on
#   linux-llvm-asan-ubsan   GREEN     leak detection on. Still CLI-only by
#                                     design, to keep a Qt kit out of the
#                                     sanitizer leg's install time - see
#                                     _build.yml. Also runs the codec-matrix
#                                     script's full layout/tool/atmos sweep
#   coverage                GREEN     per-component line/branch gates over all
#                                     nine library components (src/ac3 92.2%
#                                     line / 84.1% branch on the 2026-08-20
#                                     WSL2 calibration run - no hosted run of
#                                     the per-component gate recorded here
#                                     yet; src/audio measured genuinely thin,
#                                     src/capi's own thin spot closed the same
#                                     day when tests/capi/test_capi.cpp gained its
#                                     E-AC-3 half) - the floors and the full
#                                     measured table live in
#                                     tools/checks/coverage_report.sh
#   macos-llvm              GREEN     real GitHub Actions runs - this project
#                                     has no Mac. Its first-ever run hit one
#                                     genuine, fully-understood issue
#                                     (Homebrew's unpinned llvm formula
#                                     flagging Catch2's __COUNTER__ under
#                                     -Wc2y-extensions - see
#                                     cmake/CompilerWarnings.cmake), fixed in
#                                     one commit, then two consecutive clean
#                                     runs. No longer experimental. GUI now
#                                     on too, same opt-in shape as the Linux
#                                     legs - Qt from Homebrew's qt formula at
#                                     first, switched to the official kit via
#                                     install-qt-action once that was found to
#                                     ship packaged .app bundles with dangling
#                                     Homebrew-Cellar symlinks in place of
#                                     their QML plugins (see _ci-macos.yml).
#   macos-llvm-x64          GREEN     DR8: real GitHub Actions runs on
#                                     macos-15-intel, native Intel hardware,
#                                     not Rosetta. Went three consecutive
#                                     clean runs (build+test+gold-reference)
#                                     before promotion, same bar macos-llvm
#                                     was held to. Merged with macos-llvm's
#                                     arm64 build into one universal .dmg by
#                                     _build.yml's package-macos-universal
#                                     job on a real release.
#
# ---------------------------------------------------------------------------
# Gold-reference correctness gate (added alongside the macos-llvm promotion)
# ---------------------------------------------------------------------------
# The project's original validation-pyramid design (now docs/verification.md)
# called for L3 (FFmpeg-oracle strict decode, every commit) and L4
# (perceptual SNR) from the start; neither was ever wired into any CI leg
# until now. tools/checks/verify_gold_reference.sh
# encodes a fixed checked-in 5.1 WAV (tests/golden/audio/reference_51.wav),
# strict-decodes it with FFmpeg, decodes it with ac3cli's own decoder, and
# asserts they agree via tools/checks/compare_wav.py's delay-compensated SNR (>=
# 30 dB gate). Runs on every leg except linux-llvm-asan-ubsan (diagnostic-
# only, same reasoning as its `packageable` exclusion). Real numbers from the
# CI run that landed this: 67.84/67.82 dB on Windows and Linux, 61.81/61.82
# dB on macOS, comfortably clear of the threshold on every leg. That gap is
# 6.02 dB - exactly one AC-3 exponent step - and the arm64 legs added later
# land on the same offset, which ruled out this comment's original
# explanation (Homebrew LLVM's libm vs. glibc's/MSVC's): a libm cannot
# explain three legs across two different C libraries agreeing to the
# decimal. The next hypothesis, floating-point contraction into FMA (a base
# ARMv8-A instruction, absent from baseline x86-64), was tested directly by
# pinning -ffp-contract=off project-wide (SIMD kernels) - and DISPROVEN: every
# arm64 leg still measures ~61.8 dB with the flag on, unchanged from before it
# existed. Architecture-specific libm sin/cos in the transform twiddle tables
# was the next hypothesis and is ALSO disproven (cross-platform bitstream reproducibility): every
# std::cos/std::sin call the twiddle-table construction makes is bit-identical
# between native x86-64 and a real aarch64 cross-build (GCC 16, the same
# -ffp-contract=off flag, the aarch64-neon SIMD kernel) run under qemu-user -
# and that build's own gold-reference-gate numbers, not just its twiddle
# tables, are bit-identical to x86-64's, not the ~61.8 dB every real arm64/
# macOS CI leg measures. So the gap does not reproduce under any standards-
# conformant aarch64 execution this project can construct without the real
# hardware CI already has - which points at either the specific NATIVE
# aarch64 compiler package GitHub's hosted arm64/macOS runners use (as
# opposed to a Debian cross-compiler package, the only kind available to
# reproduce this without that hardware) or a genuine real-silicon FP
# behaviour qemu's IEEE-754-conformant emulation does not reproduce. See
# docs/building.md's "Floating-point contraction" for the full measurement.
# The gate stays SNR-based for its own three checks; a separate cross-
# platform bitstream-hash gate (tools/checks/check_cross_platform_hash.py,
# also cross-platform bitstream reproducibility) now pins the ENCODED bytes of every gold-reference stream per
# kernel/mode so this specific gap - resolved or not - cannot silently
# change without CI noticing.
#
# Update (DR8): macos-llvm-x64, the x86_64-on-macOS leg added alongside
# macos-llvm for the macOS universal-binary work, is a genuinely new data
# point on the OS-vs-architecture question above - same OS and Homebrew
# LLVM/Qt stack as macos-llvm, x86_64 instead of arm64. It measures
# 67.80/67.82/67.76 dB across its first three real runs, matching the x86
# baseline every non-arm64 leg reports, not macos-llvm's ~61.8 dB. That rules
# out an OS-specific contributor: the same OS/toolchain now sits on both
# sides of the split, differing only by CPU architecture. See cross-platform reproducibility notes below for the fuller note; the underlying mechanism itself is still
# open.
#
# Qt Quick Test harness: apps/gui/tests/ adds ac3gui_qml_tests_*, one real
# ctest entry per tst_*.qml suite (label "gui") that Quick-Test-drives the
# actual EncoderController singleton and Main.qml shell, registered only
# when AC3FORGE_BUILD_GUI is ON - so it rides the existing GUI axis rather
# than adding a new one, and the existing `ctest --preset test-<leg>` step
# picks it up with zero changes to this file or _build.yml.
#
# ALSA-conditional tests (tests/audio/backend/alsa/, see tests/CMakeLists.txt)
# register only when AC3FORGE_WITH_ALSA finds libasound, which is why a
# no-ALSA fallback run reports fewer tests than the same leg's full run - a
# configuration difference, not tests going missing.
#
# What none of this covers: real audio hardware. WSL2 has no sound devices and
# no kernel sound modules, and neither does a GitHub runner, so the ALSA
# backend is verified headless only. See docs/building.md#linux-audio.
#
# macos-llvm is no longer experimental (see _build.yml's own header for how
# that happened) - it blocks like every other leg now, no continue-on-error.
name: CI

on:
  # Main, after a merge. Pull requests and merge-queue entries are gated by
  # pr-gate.yml instead: this matrix is ten-odd runner-hours, and running it
  # for every push to every pull request, then again in the queue, then again
  # on main, was three validations of the same change - 51% of the compute in
  # the four days before this changed went into runs that were cancelled.
  #
  # This run is the "t2" tier (docs/ci-agentic.md, "The tiers"): the build legs
  # and lanes a merge can break, and none of the slow ones. What it leaves out
  # runs in the nightly run below.
  push:
    branches: [ main ]
  # The nightly run: every build leg with every extra pass, and every lane,
  # including the ones the run after a merge leaves out (the sanitizers,
  # coverage, the ABI gate, FFmpeg Validate, the wheels, Android, WASM, Rust,
  # the AppImage, macOS x64). It is wanted at about 19:47 UTC, which is 05:47 in
  # Sydney and Melbourne, when merges are rare. GitHub starts this repository's
  # scheduled workflows four to six and a half hours after their cron time
  # (CodeQL, Fuzz, Interop and the others, measured over the two weeks to
  # 2026-09-29), so the cron is 6.5 hours earlier than that. When the delay
  # changes, move the cron by the difference. main-health.yml judges the run
  # against its own last green run.
  schedule:
    - cron: '17 13 * * *'
  # A branch that wants the full matrix before it merges (a change to ESP-IDF,
  # Android, WASM, the sanitizers) asks for it: `gh workflow run ci.yml --ref
  # <branch>`. A dispatch forces every lane on (see the `changes` job).
  #
  # `legs` narrows a dispatch to exactly the build legs it names, by preset:
  # `gh workflow run ci.yml --ref <branch> -f legs=linux-gcc,windows-msvc` runs
  # those two builds and nothing else, which is what to ask for when a change
  # touches only how those legs are built. The presets are in
  # .github/ci/legs.jsonc. A full run holds a dozen or more hosted runners for
  # the better part of an hour, and the pull-request gate waits behind them.
  workflow_dispatch:
    inputs:
      tier:
        description: "Which legs of the build matrix run: all (the default) or t2, the ones the run on main runs after a merge, without their nightly-only passes. With `legs`, t2 runs those legs as the run after a merge would."
        type: choice
        options: [ all, t2 ]
        default: all
      legs:
        description: "Only these build legs, comma-separated presets (linux-gcc,windows-msvc). Nothing else runs. Empty runs the full matrix."
        type: string
        default: ""

concurrency:
  # Main is verified single-flight. One run executes and at most one waits, and
  # the waiting place goes to the newest push (cancel-in-progress: false leaves
  # the running one alone; GitHub replaces the pending one). A burst of merges
  # therefore costs one run per finished run, not one per merge, and the batch
  # grows with the load: idle, every merge is verified alone; busy, the newest
  # commit's run covers everything merged before it. main-health.yml reads the
  # `verified` ref this run advances to name the merges a failure could be
  # blamed on. Every other event (a dispatch on a branch) is one run per ref and
  # cancels its own superseded run.
  group: ${{ github.event_name == 'push' && 'ci-main' || format('ci-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  # Same self-hosted/GitHub-hosted fan-out the nightly analysis workflows'
  # check-runner jobs get (see docs/ci-self-hosted-runners.md), via the shared
  # decide-runner composite action - covers this workflow's own cheap,
  # container-free jobs below (`changes` and the core lane's jobs), while the
  # heavier container-based jobs ride _build.yml's own check-runners fan-out
  # via build-and-test. The cheap static checks that used to sit here (lint,
  # packaging, fixture corpus, quarantine) moved to _static.yml, called from
  # pr-gate.yml. Fork-PR safety is handled entirely inside decide-runner
  # itself, so the jobs below don't each need their own belt-and-braces `if`
  # the way msvc-analysis.yml's single self-hosted-eligible job does.
  check-runner:
    name: Check self-hosted runner availability
    # Control-plane job: routed by vars.CONTROL_RUNNER_JSON (delete the
    # variable to send it back to ubuntu-latest - see
    # _toolchain-versions.yml's jobs comment for the full rationale). This
    # 9-second job deciding where the real work runs is worthless if it
    # itself queues for hours behind saturated hosted runners - observed
    # 2026-08-28. Fork PRs stay on GitHub-hosted unconditionally: this job
    # checks out the fork's merge ref and runs ./.github/actions/decide-runner
    # FROM that checkout, i.e. fork-controlled code.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && fromJSON('["ubuntu-latest"]') || fromJSON(vars.CONTROL_RUNNER_JSON || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      actions: read
    outputs:
      runner: ${{ steps.decide.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: decide
        uses: ./.github/actions/decide-runner
        with:
          os-label: Linux
          hosted-json: '["ubuntu-latest"]'
          mode: ${{ vars.RUNNER_LINUX_MODE || 'auto' }}
          org-token: ${{ secrets.ORG_RUNNERS_TOKEN }}

  # Single source of truth for the tool-version pins several jobs below need
  # for their own direct setup-vcpkg call (build-and-test gets its copy from
  # _build.yml's own internal job of the same name instead) - see
  # docs/ci-self-hosted-runners.md and _toolchain-versions.yml's own header.
  toolchain-versions:
    uses: ./.github/workflows/_toolchain-versions.yml
    permissions:
      contents: read
      actions: read
    secrets:
      ORG_RUNNERS_TOKEN: ${{ secrets.ORG_RUNNERS_TOKEN }}

  # Classify the change so a docs-only edit skips the split platform builds. This
  # is a job rather than a workflow-level paths-ignore on purpose: a filtered-out
  # workflow never runs, so the required "CI Status" check below would sit
  # pending forever and block the PR. Gating the heavy job instead keeps the
  # gate reporting. Conservative - anything not clearly docs counts as code.
  #
  # Also runs tools/ci/classify_changes.py and exposes its per-lane outputs
  # (core, windows, linux, ...) alongside `code` - see docs/ci-lanes.md.
  # These outputs gate the core reusable workflow, split platform workflows,
  # platform satellites and package workflows below.
  changes:
    name: Detect changes
    # Routed through check-runner like the other cheap gate jobs. This job
    # calls `gh api` directly, which briefly broke on self-hosted ("gh:
    # command not found" on tf-gh-linux-runner-11, reverted in #459) - the
    # fleet image now ships the GitHub CLI (ci-runners#12, deployed
    # 2026-08-28), so that constraint is gone. Routing matters here more
    # than for the other cheap jobs: everything heavy needs this job's
    # output, so when the hosted queue is saturated an ubuntu-latest
    # `changes` stalls the whole run behind it.
    needs: check-runner
    runs-on: ${{ fromJSON(needs.check-runner.outputs.runner) }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
      # Lane booleans from tools/ci/classify_changes.py. They gate the reusable
      # workflows and satellites below; docs/ci-lanes.md maps each output to
      # the work it controls.
      core: ${{ steps.detect.outputs.core }}
      windows: ${{ steps.detect.outputs.windows }}
      linux: ${{ steps.detect.outputs.linux }}
      macos: ${{ steps.detect.outputs.macos }}
      android: ${{ steps.detect.outputs.android }}
      wasm: ${{ steps.detect.outputs.wasm }}
      esp: ${{ steps.detect.outputs.esp }}
      rust: ${{ steps.detect.outputs.rust }}
      python: ${{ steps.detect.outputs.python }}
      npm: ${{ steps.detect.outputs.npm }}
      ci_self: ${{ steps.detect.outputs.ci_self }}
      docs: ${{ steps.detect.outputs.docs }}
      # t2 for the run after a merge, all for the nightly run and a dispatch (or the
      # tier the dispatch asked for). Passed to _build.yml and _ci-core.yml.
      tier: ${{ steps.detect.outputs.tier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Classify changed files
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          # zizmor (template-injection): github.ref, like every other
          # attacker-reachable-shaped context value in this script, goes
          # through env: rather than straight into the run: text - same
          # reasoning as VERSION_TAG_INPUT in
          # .github/actions/build-leg/action.yml's Configure step.
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LEGS: ${{ inputs.legs }}
          INPUT_TIER: ${{ inputs.tier }}
        shell: bash
        run: |
          set -euo pipefail
          docs_re='^(docs/|LICENSE$|mkdocs\.yml$|requirements/requirements-docs\.(in|txt)$|\.github/workflows/docs\.yml$|.*\.md$)'

          # Which legs of the build matrix run. The run after a merge runs the ones a
          # merge can break; the nightly run and a dispatch run all of them unless the
          # dispatch asked for less (docs/ci-agentic.md, "The tiers").
          tier=all
          if [ "$EVENT_NAME" = "push" ]; then
            tier=t2
          elif [ -n "${INPUT_TIER:-}" ]; then
            tier="$INPUT_TIER"
          fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "tier=$tier"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            # Everything merged since the last commit a full run proved. This run is
            # batched, so it can stand for several merges, and this is the range
            # main-health.yml blames a failure on. With no `verified` ref yet, or a
            # range GitHub lists only in part, the list stays empty and every lane runs.
            files=""
            # gh prints a failed request's JSON body on stdout, so the exit status
            # decides, not whether anything was printed.
            if verified="$(gh api "repos/$REPO/git/ref/heads/verified" --jq .object.sha 2>/dev/null)" \
                && [ "${#verified}" -eq 40 ]; then
              if files="$(gh api --paginate "repos/$REPO/compare/$verified...$SHA" --jq '.files[].filename' 2>/dev/null)"; then
                if [ "$(printf '%s\n' "$files" | grep -c .)" -ge 3000 ]; then files=""; fi
                echo "Range since verified ${verified:0:8}: $(printf '%s\n' "$files" | grep -c .) file(s)"
              else
                files=""
                echo "Could not list the range since verified ${verified:0:8}; every lane runs."
              fi
            else
              echo "No verified ref yet."
            fi
          else
            before='${{ github.event.before }}'
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              files=$(gh api "repos/$REPO/commits/${{ github.sha }}" --jq '.files[].filename')
            else
              files=$(gh api "repos/$REPO/compare/$before...${{ github.sha }}" --jq '.files[].filename')
            fi
          fi

          # No file list (a manual dispatch, an API hiccup) means build, not skip.
          force_lanes=false
          if [ -z "$files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No file list available; assuming code changed."
            force_lanes=true
          else
            code=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              if ! echo "$f" | grep -qE "$docs_re"; then
                echo "  code: $f"
                code=true
              fi
            done <<< "$files"
            # Someone asked for this run, or it is the nightly run. A head commit that
            # only touched docs is no reason to build nothing.
            if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "schedule" ]; then code=true; fi
            echo "code=$code" >> "$GITHUB_OUTPUT"
            echo "code=$code"
          fi

          # A queue entry has no single PR diff to read lanes from, and the queue
          # exists to catch what one PR's own lane subset could not see, so it forces
          # every lane on, same as an empty file list above. See classify_changes.py's
          # own header. So do the nightly run, which exists to run everything the run
          # after a merge did not, and a manual dispatch, which is how a branch asks
          # for the legs a pull_request run defers to the merge queue (see
          # build-and-test's run_macos below): it gets its head commit's files, which
          # would otherwise pick lanes from one commit's diff. The run after a merge
          # does not force: it runs the lanes the merges since `verified` touched.
          if [ "$EVENT_NAME" = "merge_group" ] || [ "$EVENT_NAME" = "workflow_dispatch" ] || \
             [ "$EVENT_NAME" = "schedule" ]; then
            force_lanes=true
          fi

          classify_args=()
          if [ "$force_lanes" = true ]; then
            classify_args+=(--force-all)
          fi
          # The run after a merge runs a satellite lane (Android, WASM, ESP-IDF, Rust,
          # wheels, npm) only for a change in its own tree; a core change reaches them
          # in the nightly run.
          if [ "$tier" = t2 ]; then
            classify_args+=(--satellites-direct)
          fi
          if [ -n "${LEGS:-}" ]; then
            # A dispatch that names exact build legs runs those and nothing else:
            # every lane is off but the platforms the legs are on. A preset that
            # is not in .github/ci/legs.jsonc stops the run here, with the list.
            python3 tools/ci/plan_legs.py --lanes >> "$GITHUB_OUTPUT"
          else
            echo "$files" | python3 tools/ci/classify_changes.py "${classify_args[@]}" >> "$GITHUB_OUTPUT"
          fi

  # CI lane partitions plan (docs/ci-lanes.md): coverage, the ADM module
  # build, the PR-time performance/memory comparisons and gates, the ABI
  # gate, FFmpeg-oracle validation and its two quality-trend persisters all
  # moved into _ci-core.yml - see that file's own header for the full list
  # and for why persist-performance-trend/performance-trend-arm64 did NOT
  # move with them. Gated on the `core` lane, not `code`: none of these jobs
  # test anything platform-specific, so a PR confined to one platform lane
  # no longer pays for any of them - the first real use `run_core` gets.
  core:
    name: Core checks
    needs: [changes, toolchain-versions, check-runner]
    if: needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/_ci-core.yml
    # Ceiling for _ci-core.yml's two persist-*-trend jobs, which need
    # contents: write to push to the quality-history branch - same reasoning
    # as build-and-test's identical override just below (a callee job's own
    # `permissions:` can only narrow what the caller grants here, never
    # widen it).
    permissions:
      contents: write
    with:
      runner: ${{ needs.check-runner.outputs.runner }}
      vcpkg_commit: ${{ needs.toolchain-versions.outputs.vcpkg_commit }}
      llvm_version: ${{ needs.toolchain-versions.outputs.llvm_version }}
      tier: ${{ needs.changes.outputs.tier }}

  # CI lane partitions plan (docs/ci-lanes.md), fold-satellites phase:
  # wheels.yml/npm.yml/esp-component.yml were each triggered independently
  # (their own pull_request/push with a paths: filter), so a Python-only or
  # npm-only regression never touched CI Status - the workflow ran, could go
  # red, and blocked nothing, the same silent-non-required trap
  # branch-protection.md's own history already records for other checks.
  # Calling them here, gated on the matching lane, makes them required
  # through CI Status like every other lane below; each workflow's own
  # `push: tags: v*` trigger (release publishing) is untouched and cannot
  # overlap with this call - see wheels.yml's own comment on its `on:` block.
  #
  # Not on a pull_request run: the wheel matrix is five GitHub-hosted runners
  # (two of them macOS), and it waits for the merge queue instead - see
  # build-and-test's run_macos comment below for why and how a branch can
  # still ask for it.
  wheels:
    name: Python wheels
    needs: changes
    if: needs.changes.outputs.python == 'true' && github.event_name != 'pull_request'
    uses: ./.github/workflows/wheels.yml
    # Ceiling for every job wheels.yml declares, not just the ones this call
    # path actually reaches: GitHub validates a called workflow's nested
    # jobs' permissions against what the caller grants here statically, at
    # parse time, regardless of whether a job's own `if:` would skip it at
    # runtime - confirmed the hard way (a real "is only allowed 'actions:
    # none'"/"'id-token: none'" validation failure on this exact call).
    # actions: read is check-runners' decide-runner call; id-token: write is
    # publish's OIDC token request, unreachable here since `github.ref` is
    # never a tag on this call path, but still declared inside wheels.yml and
    # still checked against this ceiling either way.
    permissions:
      contents: read
      actions: read
      id-token: write
    secrets:
      ORG_RUNNERS_TOKEN: ${{ secrets.ORG_RUNNERS_TOKEN }}

  npm:
    name: npm package
    needs: changes
    # Not on a pull_request run: GitHub-hosted, so it waits for the merge
    # queue instead - see build-and-test's run_android comment below.
    if: needs.changes.outputs.npm == 'true' && github.event_name != 'pull_request'
    uses: ./.github/workflows/npm.yml
    # Ceiling for npm.yml's publish job (id-token: write) - same reasoning as
    # the wheels call above; publish is unreachable here (disarmed except on
    # workflow_dispatch, see docs/releasing.md) but its declared permission
    # still has to fit inside what this call grants.
    permissions:
      contents: read
      id-token: write

  esp-component:
    name: ESP-IDF component
    needs: changes
    # Not on a pull_request run, like npm above. build-and-test's run_esp
    # stays on: the ESP32 QEMU legs it gates run on the self-hosted fleet.
    if: needs.changes.outputs.esp == 'true' && github.event_name != 'pull_request'
    uses: ./.github/workflows/esp-component.yml

  build-and-test:
    name: Build & Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/_build.yml
    # contents: write is only actually used by _build.yml's quality-trend job
    # (persist_quality_trend gates it to direct main pushes below);
    # actions: read is only actually used by check-runners, to list this
    # repo's (and optionally iainchesworthlabs org's) self-hosted runners -
    # see docs/ci-self-hosted-runners.md. No security-events here since
    # 2026-09: the java-kotlin CodeQL scan that needed it left build-android
    # for codeql.yml's nightly matrix, and nothing in that reusable workflow
    # uploads SARIF any more. Every other job in it keeps the workflow-level
    # `contents: read` it already declares - a callee job's own
    # `permissions:` can only narrow what the caller grants here, never widen
    # it, so this is the one place that ceiling has to be raised.
    permissions:
      contents: write
      actions: read
    with:
      # Computed here, not inside _build.yml: github.event_name/github.ref
      # reflect the reusable workflow's own call context once inside it, and
      # this caller site is the unambiguous place to ask "is this a direct
      # push to main" - see persist_quality_trend's own
      # description in _build.yml.
      persist_quality_trend: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
      quality_trend_branch: ${{ github.ref_name }}
      # CI lane partitions (docs/ci-lanes.md): the `changes` job's own
      # per-lane outputs, `== 'true'` the same way every other job in this
      # file compares one of its string outputs (see `code` above it). Only
      # windows/linux/macos gate their split platform workflow plus satellites;
      # android/wasm/esp/rust gate their platform jobs. See _build.yml's input
      # comments for the exact mapping.
      run_core: ${{ needs.changes.outputs.core == 'true' }}
      run_windows: ${{ needs.changes.outputs.windows == 'true' }}
      run_linux: ${{ needs.changes.outputs.linux == 'true' }}
      # macOS and the Rust bindings (three GitHub-hosted runners, one of them
      # macOS) skip pull_request runs and run in the merge queue, on main and
      # on a dispatch - as does the wheels call above. GitHub Free runs 20
      # hosted jobs at a time org-wide, and a PR push with every lane set
      # used to ask for about 25 of them; on 2026-09-25 about 400 sat
      # queued, some for over five hours, holding every PR's CI Status back.
      # The merge queue still runs all of them against the exact merge
      # commit before anything lands. A branch that wants them sooner can
      # dispatch CI on itself (`gh workflow run ci.yml --ref <branch>`),
      # which forces every lane on (see the changes job).
      run_macos: ${{ needs.changes.outputs.macos == 'true' && github.event_name != 'pull_request' }}
      # Android, WASM and the device web page skip pull_request runs too, as
      # do the AppImage (_build.yml's linux-appimage), npm and the ESP-IDF
      # component. All run on ubuntu-latest, and with the legs above
      # deferred, PR pushes alone still held the hosted queue at about 2.4
      # hours on 2026-09-25, most of it these jobs. They run in the merge
      # queue, on main and on a dispatch, like the legs above. A PR merged
      # past the queue gets them only from main's run afterwards.
      run_android: ${{ needs.changes.outputs.android == 'true' && github.event_name != 'pull_request' }}
      run_wasm: ${{ needs.changes.outputs.wasm == 'true' && github.event_name != 'pull_request' }}
      run_esp: ${{ needs.changes.outputs.esp == 'true' }}
      run_rust: ${{ needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request' }}
      # Which legs of .github/ci/legs.jsonc the platform builds run: the `changes`
      # job's tier (t2 after a merge, all otherwise unless a dispatch asked for less),
      # or exactly the legs a dispatch named.
      tier: ${{ needs.changes.outputs.tier }}
      legs: ${{ inputs.legs }}
    secrets:
      # Forward the Atmos object-signing key so build-android bundles it and the
      # Shield app signs whenever the secret is set - on ordinary CI builds too,
      # not only releases. Absent (or on a fork PR, where secrets don't flow) it
      # resolves empty and the build stays the safe unsigned bed51 app. Only
      # this one secret is forwarded here; the APK-keystore secrets stay on
      # release.yml's call, which is the only path that packages a release APK.
      ATMOS_SIGNING_KEY: ${{ secrets.ATMOS_SIGNING_KEY }}
      # Optional; see _build.yml's own description of this secret. Absent
      # today (no such repo secret is provisioned yet) resolves empty, which
      # check-runners already treats as "skip the org-level check".
      ORG_RUNNERS_TOKEN: ${{ secrets.ORG_RUNNERS_TOKEN }}

  # Persists this run's encoder throughput numbers (docs/performance-trend.md)
  # so they outlive the CI log that produced them - the trend-tracking half of
  # the performance suite, alongside tests/performance/test_performance.cpp's
  # ac3perf (a hard, absolute real-time gate that runs on every push/PR as
  # part of build-and-test's own ctest, not here). This job answers a softer
  # question on top of that gate: is throughput drifting slower over time even
  # while ac3perf keeps passing. It records two granularities per run:
  # ac3bench's whole-frame ms/frame (gating at the +100% tier, below) and
  # ac3kernelbench's per-kernel ns/call (never gating - see
  # tools/ci/append_kernel_history.py for why), so a whole-frame drift can be
  # attributed to the kernel that caused it without re-running a profiler.
  #
  # One leg (linux-gcc), not the whole matrix: unlike the gold-reference SNR
  # numbers (genuinely cross-platform floating-point comparisons worth seeing
  # side by side), a timing trend's value is in comparing one consistent
  # runner against its own history over time, not in comparing GitHub's
  # runner classes against each other. Self-contained here rather than added
  # to _build.yml's matrix, so this stays a small, independently-readable
  # job instead of one more thing threaded through that file's per-leg logic.
  #
  # Reuses the quality-history branch (a different file - see
  # tools/ci/append_performance_history.py) rather than a new branch, for the
  # same reasons quality-trend already uses a dedicated branch instead of
  # gh-pages: incremental, no publish-cadence coupling, fetchable client-side
  # with no auth.
  persist-performance-trend:
    name: Publish performance trend
    needs: [build-and-test, toolchain-versions, performance-trend-arm64]
    # Explicit results under !cancelled() instead of the implicit success():
    # build-and-test reads "cancelled" whenever one of its GitHub-hosted legs
    # gave way to a newer main run (docs/ci-lanes.md, "Only the newest main
    # commit runs the hosted jobs"), which says nothing about the Linux build
    # this job measures. A real failure there still skips the publish.
    #
    # No newest-main-only group here or on performance-trend-arm64, though
    # both are GitHub-hosted: each records this commit's own point in the
    # trend and takes a few minutes. Both also start only once build-and-test
    # finishes, so an older commit's run can reach them after a newer one's,
    # and a shared group hands the waiting place to the latest arrival, not
    # to the newest commit.
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.toolchain-versions.result == 'success'
      && needs.performance-trend-arm64.result == 'success'
      && (needs.build-and-test.result == 'success' || needs.build-and-test.result == 'cancelled') }}
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    permissions:
      contents: write
    steps:
      - name: Bootstrap container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          attempt=1
          until apt-get update -qq && apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates cmake curl git gnupg lsb-release \
            ninja-build pkg-config software-properties-common tar unzip wget zip
          do
            echo "::warning title=apt-get::attempt $attempt of 3 failed"
            [ "$attempt" -lt 3 ] || exit 1
            attempt=$((attempt + 1))
            sleep 30
          done

      # persist-credentials: false - this checkout is only ever read from
      # (ac3bench's build, `git show` on this commit); the "Prepare
      # quality-history checkout" step below pushes through its own
      # explicitly-scoped remote instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GCC 16
        run: bash .github/toolchain/02-gcc-toolchain.sh

      - uses: ./.github/actions/setup-vcpkg
        with:
          vcpkg-commit: ${{ needs.toolchain-versions.outputs.vcpkg_commit }}

      - name: Configure
        run: cmake --preset config-linux-gcc

      - name: Build ac3bench, ac3kernelbench and ac3membench
        run: cmake --build --preset build-linux-gcc --target ac3bench ac3kernelbench ac3membench -- -k 0

      # Three repetitions, not one. append_performance_history.py reduces them
      # to a single record per workload by taking the FASTEST run and recording
      # the spread beside it (see its load_leg_results docstring for why the
      # minimum rather than the mean). Until this, the number written into the
      # permanent history was a single unrepeated sample - a weaker signal than
      # the PR-time comparison feeding into the very same merge already used,
      # which is min-of-3 interleaved. The trailing-mean regression tiers were
      # being fed the noisier of the two numbers.
      #
      # Cheap: ac3bench is 200 frames per workload and takes seconds, against a
      # job that has already paid for a container, a GCC install, a vcpkg setup
      # and a full build.
      - name: Run ac3bench (repeated)
        env:
          BENCH_RUNS: "3"
        run: |
          set -euo pipefail
          mkdir -p results/performance-linux-gcc
          for i in $(seq 1 "$BENCH_RUNS"); do
            build/config-linux-gcc/bin/ac3bench \
              --json-out "results/performance-linux-gcc/bench$i.json"
          done

      # What the numbers were measured ON. ms/frame is hardware-relative in a
      # way the quality series' dB is not, so a hosted-image bump or a
      # differently-specced runner otherwise shows up as an unattributable step
      # in the trend that nobody can distinguish from a code change. Recorded
      # only - nothing compares against it.
      - name: Capture the measurement environment
        shell: bash
        env:
          LEG_DIR: results/performance-linux-gcc
        run: bash .github/scripts/capture-bench-environment.sh

      # A separate results tree from ac3bench's on purpose:
      # append_performance_history.py globs every *.json under its legs and
      # requires ac3bench's schema, so the two producers' outputs must never
      # share a directory - see append_kernel_history.py's load_leg_results.
      - name: Run ac3kernelbench
        run: |
          set -euo pipefail
          mkdir -p kernel-results/kernels-linux-gcc
          build/config-linux-gcc/bin/ac3kernelbench --json-out kernel-results/kernels-linux-gcc/kernels.json

      # Third results tree, same reasoning as the kernel one above: each
      # append script globs every *.json under its legs and requires its own
      # producer's schema.
      - name: Run ac3membench
        run: |
          set -euo pipefail
          mkdir -p memory-results/memory-linux-gcc
          build/config-linux-gcc/bin/ac3membench --json-out memory-results/memory-linux-gcc/membench.json

      # The arm64 leg's measurements, produced by the job below on hardware this
      # one cannot execute. Unpacked as a SIBLING of this job's own
      # results/performance-linux-gcc, because append_performance_history.py
      # takes one leg per subdirectory (leg = the name with "performance-"
      # stripped) - so two directories become two series with no schema change
      # and no second commit to quality-history.
      #
      # `continue-on-error` on the download alone: a missing arm64 artifact
      # must not cost the x86 series its record for that commit. The append
      # step below simply sees one leg instead of two.
      - name: Download the arm64 measurements
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: performance-linux-gcc-arm64
          path: results/performance-linux-gcc-arm64

      # Same mechanic as quality-trend's own step in _build.yml (plain git
      # over an HTTPS remote carrying the token, not actions/checkout, which
      # fails outright if quality-history does not exist yet).
      - name: Prepare quality-history checkout
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          mkdir -p history
          cd history
          if git ls-remote --exit-code --heads "$remote" quality-history >/dev/null 2>&1; then
            git init -q
            git remote add origin "$remote"
            git fetch -q origin quality-history
            git checkout -q quality-history
          else
            git init -q -b quality-history
            git remote add origin "$remote"
            git commit -q --allow-empty -m "Initialize quality-history branch"
          fi

      - name: Append performance-trend history
        id: append
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          commit_date="$(git show -s --format=%cI "$COMMIT_SHA")"
          python3 tools/ci/append_performance_history.py \
            --results-dir results \
            --history-dir history \
            --branch "$BRANCH" \
            --commit "$COMMIT_SHA" \
            --commit-date "$commit_date"

      # Its own step (and script) rather than more legs in the one above:
      # the kernel series is deliberately non-gating - both regression tiers
      # are ::warning:: annotations and there is no hard_regression output -
      # so keeping it out of the `append` step keeps that step's output
      # contract (which the fail-on-hard-regression step below keys off)
      # about the whole-frame series only.
      - name: Append kernel-trend history
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          commit_date="$(git show -s --format=%cI "$COMMIT_SHA")"
          python3 tools/ci/append_kernel_history.py \
            --results-dir kernel-results \
            --history-dir history \
            --branch "$BRANCH" \
            --commit "$COMMIT_SHA" \
            --commit-date "$commit_date"

      # Gates like the whole-frame series (its own hard_regression output,
      # keyed off by its own fail step below), unlike the never-gating
      # kernel series - ac3membench's counts are near-deterministic for a
      # fixed workload, so its hard tier carries none of the runner-noise
      # risk that keeps the kernel series advisory.
      - name: Append memory-trend history
        id: append_memory
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          commit_date="$(git show -s --format=%cI "$COMMIT_SHA")"
          python3 tools/ci/append_memory_history.py \
            --results-dir memory-results \
            --history-dir history \
            --branch "$BRANCH" \
            --commit "$COMMIT_SHA" \
            --commit-date "$commit_date"

      # Renders the newest figures as shields.io endpoint JSON for the README's
      # badge row. Runs HERE, in the job that already commits to
      # quality-history, rather than as a job of its own: that branch has two
      # writers already (_build.yml's quality-trend and this one) and a third
      # would be a third chance to race on it.
      #
      # After the appends above, so the speed and memory badges describe the
      # records this run just wrote. The accuracy badge reads whatever the
      # quality-trend job last pushed, which can be one run behind on a commit
      # whose quality leg finished after this one - acceptable for a summary,
      # and the trend pages carry the exact number one click away.
      - name: Render the measurement badges
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 tools/ci/write_measurement_badges.py \
            --history-dir history \
            --branch "$BRANCH"

      - name: Commit and push performance-history update
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd history
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -q -m "Performance trend: ${BRANCH}@${COMMIT_SHA}"
            # Four trend publishers (quality, performance,
            # external-comparison, object-quality) share this one branch and
            # routinely finish within seconds of each other, so losing the
            # push race is an expected outcome rather than an error - it is
            # what "! [rejected] (fetch first)" on main means. Each writes its
            # own data file, so rebasing onto whichever SIBLING won is
            # conflict-free. Rebasing onto another run of THIS publisher is
            # not: both runs add records to the end of the same file, which is
            # what failed main's quality trend on 2026-09-18 (run
            # 35317914064). resolve_history_conflict.py keeps both runs'
            # records and writes the derived window again; anything it cannot
            # account for it refuses, and this step then fails as it used to.
            pushed=""
            for attempt in 1 2 3 4 5; do
              if git push -q origin quality-history 2>/dev/null; then
                pushed=yes
                break
              fi
              echo "push rejected (attempt ${attempt}); rebasing onto origin/quality-history"
              git fetch -q origin quality-history
              if ! git rebase -q origin/quality-history; then
                python3 "${GITHUB_WORKSPACE}/tools/ci/resolve_history_conflict.py"
                GIT_EDITOR=true git rebase --continue
              fi
              sleep $(( (RANDOM % 5) + 1 ))
            done
            if [ -z "${pushed}" ]; then
              echo "::error::could not push quality-history after 5 attempts"
              exit 1
            fi
          fi

      # Deliberately after the push above, not instead of the append step
      # failing outright - see append_performance_history.py's own
      # HARD_REGRESSION_SLOWDOWN_FRACTION and append_quality_history.py's
      # identical reasoning for its own hard-regression step.
      - name: Fail on hard performance regression
        if: steps.append.outputs.hard_regression == 'true'
        shell: bash
        run: |
          echo "::error::A leg/config ran at least twice as slow as its trailing average - see the job log above and docs/performance-trend.md for the recorded numbers."
          exit 1

      # `always() &&` so a hard memory regression is still reported when the
      # performance step above already failed the job - without it, a failed
      # earlier step would silently skip this one.
      - name: Fail on hard memory regression
        if: always() && steps.append_memory.outputs.hard_regression == 'true'
        shell: bash
        run: |
          echo "::error::A workload's heap churn at least doubled against its trailing average (or it leaked past the absolute threshold) - see the job log above and docs/performance-trend.md's memory tables for the recorded numbers."
          exit 1

  # A SECOND ac3bench series, on arm64 (PR-time performance comparison).
  #
  # ms/frame was measured on exactly one platform - x86-64, GCC, one hosted
  # image - so the trend could only ever answer "did this get slower on that
  # machine". This project hand-vectorises: fast-MDCT, the radix-4 FFT kernel,
  # the QMF filterbank. A change tuned against AVX that pessimises NEON is
  # invisible to a single-ISA series, and it is exactly the kind of change
  # this repository makes.
  #
  # WHY ARM64 AND NOT WINDOWS. Windows is the more obvious second platform and
  # is deliberately not it: those legs run on the self-hosted fleet, where
  # docs/performance-trend.md's own guidance is to compare PAIRED ratios
  # rather than absolute times because a co-tenant build can move a number by
  # more than any regression this would catch. A trend series is absolute by
  # construction, so it needs a runner whose timings mean something on their
  # own. ubuntu-24.04-arm is GitHub-hosted, the same class of machine as the
  # x86 series' ubuntu-latest, and differs in the one dimension worth adding.
  #
  # Mirrors _build.yml's linux-gcc-arm64 leg exactly - same runner label, same
  # ubuntu:26.04 container, same GCC 16 script, same preset - so this measures
  # a binary built the way that platform's binaries are actually built.
  #
  # Uploads rather than appends. Only ONE job may write to quality-history:
  # two jobs committing to the same branch race, and this repository has hit
  # that race before. persist-performance-trend downloads this artifact and
  # records both legs in its single existing commit.
  performance-trend-arm64:
    name: Publish performance trend (arm64 measurements)
    needs: [build-and-test, toolchain-versions]
    # Same explicit-results condition as persist-performance-trend's, for the
    # same reason: a GitHub-hosted leg giving way to a newer main run leaves
    # build-and-test "cancelled", not failed. No concurrency group either -
    # see persist-performance-trend's comment.
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.toolchain-versions.result == 'success'
      && (needs.build-and-test.result == 'success' || needs.build-and-test.result == 'cancelled') }}
    runs-on: ubuntu-24.04-arm
    container: ubuntu:26.04
    env:
      BENCH_RUNS: "3"
      LEG_DIR: results/performance-linux-gcc-arm64
    steps:
      - name: Bootstrap container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          attempt=1
          until apt-get update -qq && apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates cmake curl git gnupg lsb-release \
            ninja-build pkg-config software-properties-common tar unzip wget zip
          do
            echo "::warning title=apt-get::attempt $attempt of 3 failed"
            [ "$attempt" -lt 3 ] || exit 1
            attempt=$((attempt + 1))
            sleep 30
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GCC 16
        run: bash .github/toolchain/02-gcc-toolchain.sh

      - uses: ./.github/actions/setup-vcpkg
        with:
          vcpkg-commit: ${{ needs.toolchain-versions.outputs.vcpkg_commit }}

      - name: Configure
        run: cmake --preset config-linux-gcc-arm64

      # ac3bench only. The x86 job also runs ac3kernelbench and ac3membench;
      # neither is added here yet, because a kernel series and a heap series
      # each want their own thresholds calibrated against this platform and
      # that is a separate exercise from establishing the whole-frame one.
      - name: Build ac3bench
        run: cmake --build --preset build-linux-gcc-arm64 --target ac3bench -- -k 0

      - name: Run ac3bench (repeated)
        run: |
          set -euo pipefail
          mkdir -p "$LEG_DIR"
          for i in $(seq 1 "$BENCH_RUNS"); do
            build/config-linux-gcc-arm64/bin/ac3bench --json-out "$LEG_DIR/bench$i.json"
          done

      - name: Capture the measurement environment
        shell: bash
        run: bash .github/scripts/capture-bench-environment.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-linux-gcc-arm64
          path: results/performance-linux-gcc-arm64
          retention-days: 7

  # The one verdict for this run. It is not a required check: branch protection
  # points at pr-gate.yml's `CI Status`, and this one is named differently so the
  # two can never be confused on a commit that both ran on (a dispatch on a
  # branch, or main itself). main-health.yml reads this run's conclusion after
  # it completes. Adding or renaming a matrix leg still needs no change
  # elsewhere. Experimental legs cannot reach it: continue-on-error means the
  # reusable workflow reports success even when one of them fails.
  ci-status:
    name: Verify Status
    if: always()
    needs: [ changes, core, wheels, npm, esp-component, build-and-test, persist-performance-trend ]
    # Control-plane job, same vars.CONTROL_RUNNER_JSON routing and kill
    # switch as check-runner above. This is the required check every PR
    # waits on LAST - when the hosted pool is saturated, a run whose every
    # real job passed still reported nothing for hours because this
    # seconds-long aggregator was queued behind build legs (PR #447,
    # 2026-08-28). No checkout, no untrusted code - the fork guard is
    # consistency, not necessity.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && fromJSON('["ubuntu-latest"]') || fromJSON(vars.CONTROL_RUNNER_JSON || '["ubuntu-latest"]') }}
    steps:
      - name: Gate on required job results
        shell: bash
        env:
          R_CHANGES: ${{ needs.changes.result }}
          # CI lane partitions (docs/ci-lanes.md): coverage/adm-validate/
          # ffmpeg-validate/both persist-*-trend
          # jobs now live inside _ci-core.yml, called as the `core` job
          # above - each one's own result comes back through that reusable
          # workflow's own
          # workflow_call.outputs (needs.core.outputs.<x>), not
          # needs.<job>.result, since those jobs are no longer direct
          # siblings of this one. 'skipped' still reads as a pass below,
          # same as before the move - `core` itself is 'skipped' whole on a
          # non-core-lane PR (see its own `if:`), and each output then comes
          # back empty, which the loop's failure/cancelled check already
          # treats as a pass.
          R_COVERAGE: ${{ needs.core.outputs.coverage_result }}
          R_ADM: ${{ needs.core.outputs.adm_result }}
          R_HEARTH: ${{ needs.core.outputs.hearth_result }}
          R_BUILD: ${{ needs.build-and-test.result }}
          R_FFMPEG: ${{ needs.core.outputs.ffmpeg_result }}
          # 'skipped' on every PR and every push off main (its own
          # `if`) - a pass, not a failure, same as R_COVERAGE above.
          R_PERF_TREND: ${{ needs.persist-performance-trend.result }}
          R_EXT_TREND: ${{ needs.core.outputs.persist_external_trend_result }}
          R_OBJ_TREND: ${{ needs.core.outputs.persist_object_trend_result }}
          # 'skipped' on any PR/push outside their own lane (python/npm/esp),
          # which is a pass - fold-satellites phase (docs/ci-lanes.md). Each
          # workflow's own release-publish trigger is untouched and unrelated
          # to this result.
          R_WHEELS: ${{ needs.wheels.result }}
          R_NPM: ${{ needs.npm.result }}
          R_ESP_COMPONENT: ${{ needs.esp-component.result }}
          # For the superseded-main check below: on a push to main, a
          # GitHub-hosted job gives way to a newer main run's (docs/ci-lanes.md,
          # "Only the newest main commit runs the hosted jobs"), and a
          # "cancelled" from a job that carries one is expected once main has
          # moved past this commit. The script's newest_only list names them.
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          fail=0
          superseded=false
          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            tip="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.sha" \
              "https://api.github.com/repos/$REPO/commits/main" || true)"
            if [ -n "$tip" ] && [ "$tip" != "$SHA" ]; then
              superseded=true
              echo "main has moved on to ${tip:0:8}; a 'cancelled' below from a job with GitHub-hosted legs is one that gave way to the newer run."
            fi
          fi
          for pair in "changes:$R_CHANGES" \
                      "coverage:$R_COVERAGE" \
                      "adm-validate:$R_ADM" \
                      "hearth-validate:$R_HEARTH" \
                      "build-and-test:$R_BUILD" "ffmpeg-validate:$R_FFMPEG" \
                      "persist-performance-trend:$R_PERF_TREND" \
                      "persist-external-comparison-trend:$R_EXT_TREND" \
                      "persist-object-quality-trend:$R_OBJ_TREND" \
                      "wheels:$R_WHEELS" "npm:$R_NPM" \
                      "esp-component:$R_ESP_COMPONENT"; do
            job="${pair%%:*}"; result="${pair#*:}"
            echo "  $job: $result"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              # The jobs that carry GitHub-hosted legs with a newest-main-only
              # group. coverage and the core validate jobs report through step
              # outputs instead, which come back empty when a job never starts.
              case "$job" in
                build-and-test|wheels|npm|esp-component) newest_only=true ;;
                *) newest_only=false ;;
              esac
              if [ "$result" = "cancelled" ] && [ "$superseded" = true ] && [ "$newest_only" = true ]; then
                echo "::notice::$job reported 'cancelled' on a main commit a newer merge has superseded - accepted."
                continue
              fi
              echo "::error::$job reported '$result'."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "CI failed - see the failing job(s) above."
            exit 1
          fi
          echo "All required CI jobs passed or were skipped."
