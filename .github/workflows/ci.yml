# ac3forge CI.
#
# ---------------------------------------------------------------------------
# Matrix status
# ---------------------------------------------------------------------------
# A point-in-time record, not a standing guarantee - each leg's latest run is
# the authority, so re-check there rather than trusting a row here. Exact
# test counts per leg drift as features land (the same counts-drift note
# _build.yml's header carries), so no count is stated here: read the ctest
# summary in the leg's own log. Every leg is required and has real GitHub
# Actions runs behind it (see _build.yml's header for how the last of them,
# macos-llvm, got there).
#
#   leg                     status    notes
#   ----------------------  --------  ------------------------------------------
#   windows-msvc            GREEN
#   windows-llvm            GREEN     fixed a qsizetype-to-int narrowing in
#                                     encoder_controller.cpp that -Wconversion
#                                     rejects under clang-cl (MSVC's /W4 has
#                                     no equivalent check)
#   linux-gcc               GREEN     GUI and ALSA both on, plus the same
#                                     leg's no-ALSA-fallback step
#   linux-llvm              GREEN     GUI and ALSA both on
#   linux-llvm-asan-ubsan   GREEN     leak detection on. Still CLI-only by
#                                     design, to keep a Qt kit out of the
#                                     sanitizer leg's install time - see
#                                     _build.yml. Also runs the codec-matrix
#                                     script's full layout/tool/atmos sweep
#   static-analysis (tidy)  GREEN     .clang-tidy's curated set, clean baseline
#   coverage                GREEN     per-component line/branch gates over all
#                                     nine library components (src/forge 92.2%
#                                     line / 84.1% branch on the 2026-08-20
#                                     WSL2 calibration run - no hosted run of
#                                     the per-component gate recorded here
#                                     yet; src/audio measured genuinely thin,
#                                     src/capi's own thin spot closed the same
#                                     day when tests/capi/test_capi.cpp gained its
#                                     E-AC-3 half) - the floors and the full
#                                     measured table live in
#                                     tools/checks/coverage_report.sh
#   macos-llvm              GREEN     real GitHub Actions runs - this project
#                                     has no Mac. Its first-ever run hit one
#                                     genuine, fully-understood issue
#                                     (Homebrew's unpinned llvm formula
#                                     flagging Catch2's __COUNTER__ under
#                                     -Wc2y-extensions - see
#                                     cmake/CompilerWarnings.cmake), fixed in
#                                     one commit, then two consecutive clean
#                                     runs. No longer experimental. GUI now
#                                     on too (Homebrew's qt formula), same
#                                     opt-in shape as the Linux legs.
#   macos-llvm-x64          GREEN     DR8: real GitHub Actions runs on
#                                     macos-15-intel, native Intel hardware,
#                                     not Rosetta. Went three consecutive
#                                     clean runs (build+test+gold-reference)
#                                     before promotion, same bar macos-llvm
#                                     was held to. Merged with macos-llvm's
#                                     arm64 build into one universal .dmg by
#                                     _build.yml's package-macos-universal
#                                     job on a real release.
#
# ---------------------------------------------------------------------------
# Gold-reference correctness gate (added alongside the macos-llvm promotion)
# ---------------------------------------------------------------------------
# The project's original validation-pyramid design (now docs/verification.md)
# called for L3 (FFmpeg-oracle strict decode, every commit) and L4
# (perceptual SNR) from the start; neither was ever wired into any CI leg
# until now. tools/checks/verify_gold_reference.sh
# encodes a fixed checked-in 5.1 WAV (tests/golden/audio/reference_51.wav),
# strict-decodes it with FFmpeg, decodes it with ac3cli's own decoder, and
# asserts they agree via tools/checks/compare_wav.py's delay-compensated SNR (>=
# 30 dB gate). Runs on every leg except linux-llvm-asan-ubsan (diagnostic-
# only, same reasoning as its `packageable` exclusion). Real numbers from the
# CI run that landed this: 67.84/67.82 dB on Windows and Linux, 61.81/61.82
# dB on macOS, comfortably clear of the threshold on every leg. That gap is
# 6.02 dB - exactly one AC-3 exponent step - and the arm64 legs added later
# land on the same offset, which ruled out this comment's original
# explanation (Homebrew LLVM's libm vs. glibc's/MSVC's): a libm cannot
# explain three legs across two different C libraries agreeing to the
# decimal. The next hypothesis, floating-point contraction into FMA (a base
# ARMv8-A instruction, absent from baseline x86-64), was tested directly by
# pinning -ffp-contract=off project-wide (roadmap PF5) - and DISPROVEN: every
# arm64 leg still measures ~61.8 dB with the flag on, unchanged from before it
# existed. Architecture-specific libm sin/cos in the transform twiddle tables
# was the next hypothesis and is ALSO disproven (roadmap VX11): every
# std::cos/std::sin call the twiddle-table construction makes is bit-identical
# between native x86-64 and a real aarch64 cross-build (GCC 16, the same
# -ffp-contract=off flag, the aarch64-neon SIMD kernel) run under qemu-user -
# and that build's own gold-reference-gate numbers, not just its twiddle
# tables, are bit-identical to x86-64's, not the ~61.8 dB every real arm64/
# macOS CI leg measures. So the gap does not reproduce under any standards-
# conformant aarch64 execution this project can construct without the real
# hardware CI already has - which points at either the specific NATIVE
# aarch64 compiler package GitHub's hosted arm64/macOS runners use (as
# opposed to a Debian cross-compiler package, the only kind available to
# reproduce this without that hardware) or a genuine real-silicon FP
# behaviour qemu's IEEE-754-conformant emulation does not reproduce. See
# docs/building.md's "Floating-point contraction" for the full measurement.
# The gate stays SNR-based for its own three checks; a separate cross-
# platform bitstream-hash gate (tools/checks/check_cross_platform_hash.py,
# also VX11) now pins the ENCODED bytes of every gold-reference stream per
# kernel/mode so this specific gap - resolved or not - cannot silently
# change without CI noticing.
#
# Update (DR8): macos-llvm-x64, the x86_64-on-macOS leg added alongside
# macos-llvm for the macOS universal-binary work, is a genuinely new data
# point on the OS-vs-architecture question above - same OS and Homebrew
# LLVM/Qt stack as macos-llvm, x86_64 instead of arm64. It measures
# 67.80/67.82/67.76 dB across its first three real runs, matching the x86
# baseline every non-arm64 leg reports, not macos-llvm's ~61.8 dB. That rules
# out an OS-specific contributor: the same OS/toolchain now sits on both
# sides of the split, differing only by CPU architecture. See ROADMAP.md's
# VX11 entry for the fuller note; the underlying mechanism itself is still
# open.
#
# Qt Quick Test harness: apps/gui/tests/ adds ac3gui_qml_tests_*, one real
# ctest entry per tst_*.qml suite (label "gui") that Quick-Test-drives the
# actual EncoderController singleton and Main.qml shell, registered only
# when AC3FORGE_BUILD_GUI is ON - so it rides the existing GUI axis rather
# than adding a new one, and the existing `ctest --preset test-<leg>` step
# picks it up with zero changes to this file or _build.yml.
#
# ALSA-conditional tests (tests/backend/alsa/, see tests/CMakeLists.txt)
# register only when AC3FORGE_WITH_ALSA finds libasound, which is why a
# no-ALSA fallback run reports fewer tests than the same leg's full run - a
# configuration difference, not tests going missing.
#
# What none of this covers: real audio hardware. WSL2 has no sound devices and
# no kernel sound modules, and neither does a GitHub runner, so the ALSA
# backend is verified headless only. See docs/building.md#linux-audio.
#
# macos-llvm is no longer experimental (see _build.yml's own header for how
# that happened) - it blocks like every other leg now, no continue-on-error.
name: CI

on:
  # Only the long-lived branches build on push; the work happens on topic
  # branches whose pull_request run covers them, so a WIP push does not also run
  # the matrix.
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # main's merge queue (see .github/branch-protection.md) tests each queue
  # entry on a temporary gh-readonly-queue/... ref before it merges - GitHub
  # only runs workflows that explicitly opt into this event on that ref, so
  # without it "Branch Name"/"CI Status" (both required checks) would simply
  # never report and every queue entry would sit until it times out. `changes`
  # below already treats a non-pull_request event generically (falls back to
  # the before/sha compare), and `branch-name` already treats any non-PR
  # event as a pass-by-skip (see its own `if`) - both behaviours already
  # exist for the plain `push` case above, merge_group needs no special-casing
  # beyond receiving the trigger.
  merge_group:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  # PR runs cancel their own superseded pushes (head_ref-keyed, cancel true) -
  # that's the WIP-churn case this exists for. Push runs on main are
  # SHA-keyed instead: every merge gets its own group, so a fast run of merges
  # can never cancel an earlier merge's still-running gold-reference gate and
  # quality-history append (see docs/quality-trend.md) before it finishes.
  # Branch-name-keyed cancellation silently dropped exactly that data in
  # practice - confirmed via `gh run list`, e.g. PR #35's push run was
  # cancelled outright by PR #36 landing a second later.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Enforce trunk-based branch naming on every PR. A topic branch is
  # <type>/<name> where type is feature or bugfix - every topic branch (hotfix
  # included) merges straight to main, so there is no separate release/hotfix/
  # support vocabulary to allow. main itself is accepted as a PR head for the
  # rare revert-by-PR case, and dependabot/** is accepted because Dependabot's
  # branch names are not configurable. Required on main, so a misnamed branch
  # cannot merge.
  branch-name:
    name: Branch Name
    needs: check-runner
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(needs.check-runner.outputs.runner) }}
    steps:
      - name: Validate head branch name
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REF" == "main" ]]; then
            echo "Core branch '$HEAD_REF' - allowed."
            exit 0
          fi
          if [[ "$HEAD_REF" == dependabot/* ]]; then
            echo "Dependabot branch '$HEAD_REF' - allowed (names are not configurable)."
            exit 0
          fi
          pattern='^(feature|bugfix)/[a-z0-9._-]+$'
          if [[ "$HEAD_REF" =~ $pattern ]]; then
            echo "Branch '$HEAD_REF' conforms to <type>/<name>."
            exit 0
          fi
          echo "::error title=Invalid branch name::'$HEAD_REF' must be <type>/<name> where <type> is feature or bugfix (for example feature/eac3-decoder). See CONTRIBUTING.md."
          exit 1

  # The RE-derived EMDF signer is quarantined to a local branch and must never
  # reach a public remote (it embeds a key extracted from Dolby's binary). The
  # .gitignore keeps it from being staged; this makes doubly sure by failing if
  # the directory ever appears in a tracked tree on main.
  no-quarantine:
    name: No Quarantine On Main
    needs: check-runner
    runs-on: ${{ fromJSON(needs.check-runner.outputs.runner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert src/quarantine is absent
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch src/quarantine >/dev/null 2>&1; then
            echo "::error::src/quarantine is tracked here; it must never leave its local branch."
            exit 1
          fi
          echo "No quarantined signer in the tree."

  # Same self-hosted/GitHub-hosted fan-out MSVC Code Analysis's own
  # check-runner gets (see docs/ci-self-hosted-runners.md), via the shared
  # decide-runner composite action - covers this workflow's own cheap,
  # container-free jobs below (everything except platform-macros, which
  # needs pwsh and the self-hosted Linux image's shell is unverified, and
  # the heavier container-based jobs, which already ride _build.yml's own
  # check-runners fan-out via build-and-test). Fork-PR safety is handled
  # entirely inside decide-runner itself, so the jobs below don't each need
  # their own belt-and-braces `if` the way msvc-analysis.yml's single
  # self-hosted-eligible job does.
  check-runner:
    name: Check self-hosted runner availability
    # Control-plane job: routed by vars.CONTROL_RUNNER_JSON (delete the
    # variable to send it back to ubuntu-latest - see
    # _toolchain-versions.yml's jobs comment for the full rationale). This
    # 9-second job deciding where the real work runs is worthless if it
    # itself queues for hours behind saturated hosted runners - observed
    # 2026-08-28. Fork PRs stay on GitHub-hosted unconditionally: this job
    # checks out the fork's merge ref and runs ./.github/actions/decide-runner
    # FROM that checkout, i.e. fork-controlled code.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && fromJSON('["ubuntu-latest"]') || fromJSON(vars.CONTROL_RUNNER_JSON || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      actions: read
    outputs:
      runner: ${{ steps.decide.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: decide
        uses: ./.github/actions/decide-runner
        with:
          os-label: Linux
          hosted-json: '["ubuntu-latest"]'
          mode: ${{ vars.RUNNER_LINUX_MODE || 'auto' }}
          org-token: ${{ secrets.ORG_RUNNERS_TOKEN }}

  # Single source of truth for the tool-version pins several jobs below need
  # for their own direct setup-vcpkg call (build-and-test gets its copy from
  # _build.yml's own internal job of the same name instead) - see
  # docs/ci-self-hosted-runners.md and _toolchain-versions.yml's own header.
  toolchain-versions:
    uses: ./.github/workflows/_toolchain-versions.yml
    permissions:
      contents: read
      actions: read
    secrets:
      ORG_RUNNERS_TOKEN: ${{ secrets.ORG_RUNNERS_TOKEN }}

  # Classify the change so a docs-only edit skips a five-platform matrix. This
  # is a job rather than a workflow-level paths-ignore on purpose: a filtered-out
  # workflow never runs, so the required "CI Status" check below would sit
  # pending forever and block the PR. Gating the heavy job instead keeps the
  # gate reporting. Conservative - anything not clearly docs counts as code.
  changes:
    name: Detect changes
    # Routed through check-runner like the other cheap gate jobs. This job
    # calls `gh api` directly, which briefly broke on self-hosted ("gh:
    # command not found" on tf-gh-linux-runner-11, reverted in #459) - the
    # fleet image now ships the GitHub CLI (ci-runners#12, deployed
    # 2026-08-28), so that constraint is gone. Routing matters here more
    # than for the other cheap jobs: everything heavy needs this job's
    # output, so when the hosted queue is saturated an ubuntu-latest
    # `changes` stalls the whole run behind it.
    needs: check-runner
    runs-on: ${{ fromJSON(needs.check-runner.outputs.runner) }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Classify changed files
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          docs_re='^(docs/|LICENSE$|mkdocs\.yml$|requirements/requirements-docs\.(in|txt)$|\.github/workflows/docs\.yml$|.*\.md$)'

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          else
            before='${{ github.event.before }}'
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              files=$(gh api "repos/$REPO/commits/${{ github.sha }}" --jq '.files[].filename')
            else
              files=$(gh api "repos/$REPO/compare/$before...${{ github.sha }}" --jq '.files[].filename')
            fi
          fi

          # No file list (a manual dispatch, an API hiccup) means build, not skip.
          if [ -z "$files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No file list available; assuming code changed."
            exit 0
          fi

          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! echo "$f" | grep -qE "$docs_re"; then
              echo "  code: $f"
              code=true
            fi
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"

  # The no-#ifdef rule. Cheap, fast, and deliberately ungated by `changes` so a
  # violation is reported even while the porting legs are still red.
  platform-macros:
    name: Platform Macros
    # Stays GitHub-hosted, deliberately: check_platform_macros.ps1 needs
    # pwsh, which the hosted Ubuntu image ships and the fleet's Linux image
    # does not - confirmed live ("pwsh: command not found" on
    # tf-gh-linux-runner-08 when this was briefly routed, 2026-08-28). Route
    # it only if/when ci-runners bakes PowerShell into the Linux template -
    # same follow-the-toolchain rule as build-wasm/android/rust in
    # _build.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for preprocessor conditionals in src/
        shell: pwsh
        run: ./tools/checks/check_platform_macros.ps1 -Root $PWD

  # Internal consistency of packaging/ (vcpkg port, Homebrew, winget, Conan), plus a
  # latest-tag advisory (roadmap DR2) - see the script's own header for the split
  # between the two and why only the first one fails the job. fetch-depth: 0, unlike
  # platform-macros above: the advisory half needs `git describe --tags` to see the
  # repository's tags, which a shallow (depth-1) clone would hide, silently disabling
  # it in CI while it kept working from a normal local checkout.
  packaging-consistency:
    name: Packaging Consistency
    needs: check-runner
    runs-on: ${{ fromJSON(needs.check-runner.outputs.runner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check packaging manifests are internally consistent
        shell: bash
        run: bash tools/checks/check_packaging_versions.sh -r "$PWD"

  # Every published quality series is measured against tests/golden/audio/,
  # and its points are only comparable to each other because the material
  # under them never moved. A regenerated fixture is close to invisible - it
  # still decodes, still has the right duration and channel count, still
  # produces a plausible SNR - and simply puts a step in every series that
  # reads as an encoder change. This hashes each fixture against
  # tests/golden/audio/corpus.json so that becomes a failing check instead of
  # a mystery on a trend page months later.
  #
  # Its own job rather than a step on ffmpeg-validate: stdlib-only, no build,
  # no container, seconds to run, and it should still report on a
  # docs-or-fixtures-only change where `changes.outputs.code` is false and
  # ffmpeg-validate never starts. Same shape and same reasoning as
  # packaging-consistency above.
  fixture-corpus:
    name: Fixture Corpus
    needs: check-runner
    runs-on: ${{ fromJSON(needs.check-runner.outputs.runner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check committed fixtures match the corpus manifest
        run: python3 tools/checks/check_corpus.py

  # ruff, shellcheck and actionlint over the non-C++ half of the tree (roadmap
  # VX14). Same shape as platform-macros and packaging-consistency above:
  # cheap, fast, and deliberately ungated by `changes` so a script edit is
  # reported even while a heavier leg is red.
  #
  # This is not ordinary lint hygiene here. The ~30 Python files under tools/
  # ARE this project's oracles and gates - quality_race.py's SNR floors,
  # fuzz_encoder_space.py, compare_wav.py, the four trend appenders,
  # check_matrix_coverage.py - so a swallowed subprocess failure or a closure
  # capturing a loop variable in one of them turns a CI check green without
  # checking anything, and nothing downstream would ever notice. Every rule in
  # ruff.toml's curated set was picked with that in mind; see its header.
  #
  # A separate job from static-analysis (clang-tidy) rather than another step
  # inside it: that one needs a container bootstrap, a GCC install, vcpkg and a
  # complete build before it parses its first TU. This one needs a checkout and
  # a pip install. Keeping them apart means a broken oracle script is reported
  # in about a minute instead of behind the slowest job on the critical path.
  #
  # zizmor.yml already covers workflow *security* (injectable expressions,
  # over-broad permissions, unpinned actions); actionlint covers workflow
  # *correctness* (undefined matrix properties, bad `needs`/`if` expressions,
  # invalid runner labels) plus, via -shellcheck below, the shell inside every
  # `run:` block - which no other check in this repo looks at at all.
  script-lint:
    name: Script Lint
    needs: check-runner
    runs-on: ${{ fromJSON(needs.check-runner.outputs.runner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A venv rather than a bare `pip install`: the hosted image's system
      # Python is PEP 668 externally-managed, and --break-system-packages (what
      # the container jobs below use, safely, because their container is thrown
      # away) is the wrong tool on a runner whose Python other steps may still
      # need. requirements/requirements-lint.txt is a pip-compile
      # --generate-hashes lock like requirements-coverage.txt and
      # requirements-ffmpeg-validate.txt, so all three linter versions are
      # pinned by hash and move only when the lock is regenerated.
      - name: Install linters
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .lintvenv
          .lintvenv/bin/python -m pip install --quiet "pip==24.3.1"
          .lintvenv/bin/python -m pip install --quiet --require-hashes \
            -r requirements/requirements-lint.txt
          .lintvenv/bin/ruff --version
          .lintvenv/bin/shellcheck --version | tr '\n' ' '; echo
          .lintvenv/bin/actionlint -version

      # Configuration (rule set, line length, exclusions, and the reasoning for
      # each) lives in ruff.toml at the repository root, shared verbatim with a
      # local `ruff check .`, the same way tools/checks/coverage_report.sh is
      # shared with the coverage job - CI and a developer machine cannot drift
      # onto different rules.
      - name: ruff
        shell: bash
        run: .lintvenv/bin/ruff check --no-cache --output-format=github .

      # The oracles' own unit tests. This job's header explains why the ~30
      # Python files under tools/ get more scrutiny than ordinary scripts -
      # they ARE the gates - and lint alone cannot tell whether a gate still
      # gates. compare_wav.py's suite pins the case that motivated per-channel
      # SNR floors: a single floor low enough for a 5.1 fixture's
      # dither-dominated surrounds leaves the front channels 30-70 dB of room
      # to collapse in without failing anything.
      #
      # stdlib unittest, run with the system python3 rather than .lintvenv:
      # these tests deliberately import nothing that is not in the standard
      # library (same rule the scripts under test follow), so needing the
      # linter venv at all would be a sign one of them had grown a dependency.
      #
      # tools/ci is discovered separately rather than by starting at tools/:
      # unittest only recurses into directories it can import, and neither of
      # these is a package. Reporting what the gates measure is part of the
      # same contract as running them - a badge that disagreed with the page it
      # links to is what put a suite in tools/ci in the first place.
      - name: Oracle unit tests
        shell: bash
        run: |
          set -euo pipefail
          for suite in tools/checks tools/ci; do
            printf '\n=== %s ===\n' "$suite"
            python3 -m unittest discover --start-directory "$suite" --pattern 'test_*.py' --verbose
          done

      # The paths the docs and the CI plumbing name: every relative Markdown
      # link under docs/ and in the root pages, and every docs/, apps/, src/
      # or tools/ literal in the workflows, the CMake modules and the scripts
      # under tools/. A file that moves takes its README row, its workflow
      # step and the comments that cite it along only when someone remembers;
      # this makes forgetting a red job. Shapes it cannot judge (globs,
      # placeholders) are printed as info, never failed - the script's own
      # header has the rules. Its own suite runs in the step above.
      - name: Doc and script paths
        shell: bash
        run: python3 tools/checks/check_doc_paths.py

      # `git ls-files` rather than a hard-coded list of directories: a shell
      # script added anywhere in the tree is then linted the day it lands,
      # instead of silently sitting outside the gate until someone remembers to
      # widen a glob here.
      - name: shellcheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          printf 'shellcheck: %d script(s)\n' "${#scripts[@]}"
          printf '  %s\n' "${scripts[@]}"
          .lintvenv/bin/shellcheck --format=gcc "${scripts[@]}"

      # -shellcheck hands actionlint the same pinned binary the step above uses,
      # so the shell inside every `run:` block is checked too - that integration
      # is where this job's first real finding came from (an `ls | head -1`
      # parse in release.yml's provenance-export step). -pyflakes= disables the
      # other integration outright: it would only see the `python -c` one-liners
      # inside `run:` blocks, and ruff above already covers every real .py file.
      - name: actionlint
        shell: bash
        run: |
          set -euo pipefail
          .lintvenv/bin/actionlint -no-color -oneline \
            -shellcheck .lintvenv/bin/shellcheck -pyflakes=

  # .clang-tidy's own header comment explains the curated check groups and
  # what got excluded from them (and why). A full Build precedes clang-tidy,
  # not just Configure: CMake 3.28's Ninja dependency-scan step (the
  # "Generating CXX dyndep file" lines in a normal build log) writes a
  # per-TU .modmap response file that compile_commands.json's command lines
  # reference, and nothing generates it until ninja actually runs - clang-tidy
  # fails with "no such file or directory" on every TU without this step, even
  # though it is only reading the AST, not linking anything.
  # -warnings-as-errors='*' makes any finding in the curated set fail the job
  # (run-clang-tidy-<version> is the LLVM Python wrapper and takes single-dash
  # arguments, unlike clang-tidy itself): every finding present when this job
  # was added was either fixed or suppressed with a NOLINT and a one-line
  # justification (see the commit that added this job), so a clean baseline
  # is the starting point, not an aspiration. (.clang-tidy now carries
  # WarningsAsErrors: '*' too, so a plain local `clang-tidy` run agrees with
  # this job - the flag here stays as the explicit, self-describing form.)
  #
  # The DEBUG preset, deliberately: analysis builds are diagnostic builds
  # and keep asserts on, same reasoning that exempts the sanitizer leg from
  # performance gating. A Release configure defines NDEBUG, which
  # preprocesses every assert() away before clang-tidy ever parses the TU -
  # so the analyzer never learns the invariants asserts state, and every
  # assert-adjacent finding needed a NOLINT crutch paired with the assert.
  # clang-tidy's findings don't depend on optimization level, only on what
  # the preprocessor kept, so the existing debug preset is the right
  # configuration and no analysis-only preset is needed.
  static-analysis:
    name: Static Analysis (clang-tidy)
    needs: [changes, toolchain-versions, check-runner]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.check-runner.outputs.runner) }}
    container: ubuntu:26.04
    steps:
      - name: Bootstrap container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates cmake curl git gnupg lsb-release \
            ninja-build pkg-config software-properties-common tar unzip wget zip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install LLVM ${{ needs.toolchain-versions.outputs.llvm_version }}
        run: bash .github/toolchain/03-llvm-toolchain.sh

      - uses: ./.github/actions/setup-vcpkg
        with:
          vcpkg-commit: ${{ needs.toolchain-versions.outputs.vcpkg_commit }}

      - name: Configure
        shell: bash
        run: cmake --preset config-linux-llvm-debug

      - name: Build
        shell: bash
        run: cmake --build --preset build-linux-llvm-debug -- -k 0

      - name: clang-tidy
        shell: bash
        env:
          LLVM_VERSION: ${{ needs.toolchain-versions.outputs.llvm_version }}
        run: |
          "run-clang-tidy-${LLVM_VERSION}" -j "$(nproc)" -p build/config-linux-llvm-debug \
            -warnings-as-errors='*' \
            '(src/(forge|matroska|mp4|mpegts)|apps/cli)/.*\.cpp'

  # ac3tests coverage over every library component: src/forge plus audio,
  # signing, matroska, mp4, mpegts, capi, and - via the coverage preset's
  # AC3FORGE_BUILD_ADM=ON with vcpkg's 'adm' feature, the same pair
  # adm-validate passes by hand - ac3adm/admbridge. Originally src/forge only
  # ("the library is what was asked for"); extended once the rest of the
  # library surface existed and was already being EXERCISED by this same
  # suite, just uninstrumented and unreported. apps/cli and apps/gui stay out
  # of scope: they are applications, not the library, and the coverage
  # preset builds neither.
  #
  # config-linux-gcc-coverage (CMakePresets.json) builds just the library
  # components and their test suite - AC3FORGE_BUILD_CLI/EXAMPLES are off
  # there purely to save build time: ac3cli and the example executables
  # would link fine against the instrumented libraries (the gcov runtime
  # propagates to consumers automatically - see cmake/Coverage.cmake), but
  # tools/checks/coverage_report.sh filters the report to the library components,
  # so building them instrumented buys nothing.
  #
  # The gate is PER COMPONENT - a line floor and a branch floor per
  # src/<dir>, not one blended number a small component's regression could
  # hide inside - and lives in tools/checks/coverage_report.sh alongside the
  # measured baseline each floor was calibrated against. src/forge's original
  # 80/70 floor (set a few points under its first hosted run's 81.3/72.0,
  # measured 2026-08-09 while block switching, delta bit allocation, half
  # sample rate and dual mono were still landing) is now 88/78: the suite
  # grew well past the old numbers, and that first calibration's own
  # instruction was to raise the floors as the suite grows rather than leave
  # the headroom in place indefinitely.
  #
  # Calibration provenance: the current floors were set against a WSL2
  # measurement on the same toolchain pins (gcc/gcov 15.2.0, gcovr 8.6).
  # Same-machine comparisons have read a couple of points HIGHER than hosted
  # runs (environment-specific gcov/header-instantiation differences), and
  # the floors' margins already allow for that - re-check against this job's
  # own first hosted run after any recalibration and tighten where the
  # margin proves generous.
  coverage:
    name: Coverage (Linux, GCC)
    needs: [changes, toolchain-versions]
    if: needs.changes.outputs.code == 'true'
    # Stays GitHub-hosted for now - the one leg of the #460 revert that is
    # NOT re-enabled with the rest. Its self-hosted failure ("The runner has
    # received a shutdown signal" 34s in) was a runner-lifecycle kill, not
    # the gh/profile/ASLR class fixed in ci-runners#12/#13, and remains
    # undiagnosed (suspected --replace eviction race in the supervisor's
    # recycle loop). If it is re-routed and the failure recurs, capture
    # `journalctl -u github-runner.service` off the affected VM before the
    # fleet replaces it - that is the missing evidence.
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Bootstrap container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates cmake curl git gnupg libasound2-dev lsb-release \
            ninja-build pkg-config python3-pip software-properties-common tar unzip wget zip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GCC 16
        run: bash .github/toolchain/02-gcc-toolchain.sh

      - uses: ./.github/actions/setup-vcpkg
        with:
          vcpkg-commit: ${{ needs.toolchain-versions.outputs.vcpkg_commit }}

      # ubuntu:26.04's python3-pip enforces PEP 668 (no bare `pip install` at
      # system scope) - --break-system-packages is safe here specifically
      # because this container is thrown away at the end of the job, unlike a
      # real machine where that flag risks the system's own Python tooling.
      # requirements/requirements-coverage.txt is a pip-compile --generate-hashes lock (see
      # its own header for how to regenerate) so this install is hash-pinned.
      - name: Install gcovr
        run: pip install --quiet --break-system-packages --require-hashes -r requirements/requirements-coverage.txt

      - name: Configure
        shell: bash
        run: cmake --preset config-linux-gcc-coverage

      - name: Build
        shell: bash
        run: cmake --build --preset build-linux-gcc-coverage -- -k 0

      # -LE Performance: gcov's per-basic-block instrumentation adds real,
      # measurable overhead - a coverage build has no more business being
      # held to a hard real-time budget than the linux-llvm-asan-ubsan leg
      # does (same reasoning, see that matrix entry's own comment). This
      # job's question is "how much of the library executes", not "how
      # fast" - tests/performance/'s own suite covers the latter on a
      # genuinely optimized build.
      - name: Test
        shell: bash
        run: ctest --preset test-linux-gcc-coverage -LE Performance

      # The gcov extraction, the per-component floors, and the gate itself
      # all live in tools/checks/coverage_report.sh, shared verbatim with local
      # runs (docs/building.md shows the local recipe) so CI and a developer
      # machine cannot drift onto different filters or thresholds. The
      # mdct.cpp suspicious-hits gcov-bug workaround this step used to carry
      # inline moved there with the rest of the gcovr flags.
      #
      # The gate covers apps/cli as well as the nine library components since
      # roadmap VX15 - which is why config-linux-gcc-coverage now builds the
      # CLI, and why the Test step above takes longer than it used to. That
      # table also prints a per-command breakdown below the gate, so a
      # command module sitting at 0% is visible rather than averaged away.
      - name: Coverage report + gate
        shell: bash
        run: bash tools/checks/coverage_report.sh -g gcov-16

      # apps/gui is the one first-party tree with no coverage number at all,
      # and deliberately so (roadmap VX15 called it out as a separate
      # decision): instrumenting its C++ needs a Qt kit on THIS job, and no
      # Linux leg installs one - _build.yml puts Qt only on its `gui: true`
      # matrix entries, which are plain builds. Adding it means either putting
      # Qt on this container or standing up a second instrumented leg, both of
      # which cost real runner time for a tree whose interactive surfaces are
      # already covered by apps/gui/tests' own Qt Quick suite and whose one
      # Qt-free class (RecordingSink) is already in ac3tests. See
      # tools/checks/coverage_report.sh's header for the same note beside the
      # threshold table.

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: build/config-linux-gcc-coverage/coverage*.html

  # ac3adm::ac3adm (src/ac3adm) is opt-in - AC3FORGE_BUILD_ADM defaults OFF, unlike every other
  # library component (see the root CMakeLists.txt's own option() and src/ac3adm/CMakeLists.txt's
  # header comment for why: it is the one module in this repo with a third-party dependency,
  # libadm's Boost header libraries, resolved only via -DVCPKG_MANIFEST_FEATURES=adm). No leg in
  # build-and-test's matrix (_build.yml) ever passes -DAC3FORGE_BUILD_ADM=ON; besides this job,
  # the only other build with it on is the coverage job's instrumented Debug preset, which turns
  # the CLI and examples OFF - so without this job, roadmap B1 phase 3's CLI command and example
  # (see below) would still have zero CI builds, and a change to the module or to its vendored
  # libbw64/libadm pins (src/ac3adm/CMakeLists.txt's GIT_TAG values) would never be exercised at
  # -O2 or under the full default configuration anybody actually installs.
  #
  # A dedicated job rather than an extra pass inside an existing Linux leg (the shape
  # alsa_fallback and BUILD_SHARED_LIBS already use in _build.yml): those legs are already the
  # busiest in the matrix (GUI, ALSA fallback, a second shared-libs configure+build+test pass,
  # the gold-reference gate, packaging), and this module's own dependency footprint - two
  # FetchContent git clones (vendored libbw64/libadm) plus eight vcpkg Boost header packages - is
  # real enough to be worth keeping off that critical path rather than adding to it. A standalone
  # job instead runs in parallel with everything else, the same reasoning static-analysis,
  # coverage and ffmpeg-validate already follow for their own container+toolchain setup.
  #
  # One leg, not the whole matrix - same reasoning as ffmpeg-validate above: this module's own
  # code does not vary by platform/compiler (no #ifdefs anywhere in this repo - see
  # tools/checks/check_platform_macros.ps1), so one Linux leg is enough to catch a real regression.
  # GCC 15, matching one of the two Linux toolchains this module was verified against locally
  # before landing (see the PR that introduced it, branch feature/adm-bw64-parser: Windows MSVC,
  # WSL2 gcc-15, WSL2 clang++-21, all green).
  #
  # AC3FORGE_BUILD_CLI/EXAMPLES stay at their preset default (ON): roadmap B1 phase 3 (the
  # 'atmos-adm' ac3cli command, apps/cli/main.cpp's run_atmos_adm, and examples/encode_adm.cpp) is
  # the first code outside tests/ to link ac3adm::ac3adm/ac3::admbridge at all, so unlike phases 1
  # and 2 (when neither the CLI nor the examples touched this module, hence this job originally
  # turning both off), this job now has to build and run both too or the CLI command and example
  # get zero CI coverage - the same gap this job's own header comment above already exists to close
  # for the library modules themselves. examples/ registers each example as its own ctest case
  # (examples/CMakeLists.txt), so `ctest --preset test-linux-gcc` below already exercises
  # encode_adm's own standalone fixture-driven run alongside adm/test_adm.cpp/admbridge/test_adm_bridge.cpp/
  # test_cli_atmos_adm.cpp (tests/CMakeLists.txt only compiles that last one in when
  # AC3FORGE_BUILD_ADM AND ac3cli are both present, exactly the combination this job now builds).
  # AC3FORGE_BUILD_GUI already defaults OFF on this preset.
  adm-validate:
    name: ADM Module (Linux, GCC)
    needs: [changes, toolchain-versions, check-runner]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.check-runner.outputs.runner) }}
    container: ubuntu:26.04
    steps:
      - name: Bootstrap container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates cmake curl git gnupg lsb-release \
            ninja-build pkg-config software-properties-common tar unzip wget zip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GCC 16
        run: bash .github/toolchain/02-gcc-toolchain.sh

      - uses: ./.github/actions/setup-vcpkg
        with:
          vcpkg-commit: ${{ needs.toolchain-versions.outputs.vcpkg_commit }}
          # Distinct archives-cache key: this is the only job that enables
          # the adm manifest feature and so the only one whose install set
          # includes the 43-port boost tree - see the input's own
          # description in setup-vcpkg/action.yml for why sharing the
          # default key locks boost out of the cache permanently.
          cache-key-suffix: adm

      # Retried, unlike the other Configure steps (so far): this is the job
      # that rebuilds the whole 43-port boost set whenever the shared vcpkg
      # archives cache is cold (the adm manifest feature is the only thing
      # that pulls boost in), and codeload.github.com intermittently answers
      # 400 under parallel-download bursts - which vcpkg treats as
      # non-transient and fatal. One bad download out of ~43 kills the
      # attempt, but every port already built stays in ~/.cache/vcpkg/
      # archives, so an in-job retry resumes from where the last attempt
      # died instead of coin-flipping from zero. Three attempts covered the
      # worst observed run (2026-08-31: attempt 1 died at 31/43 on main).
      - name: Configure
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if cmake --preset config-linux-gcc \
                 -DVCPKG_MANIFEST_FEATURES=adm \
                 -DAC3FORGE_BUILD_ADM=ON; then
              exit 0
            fi
            rm -rf build/config-linux-gcc/CMakeCache.txt
            if [ "$attempt" -lt 3 ]; then
              # Real backoff, not an immediate loop: the 400s are codeload
              # throttling the runner's egress under download bursts (the
              # same tarball URLs answer 200 from an unthrottled client), so
              # a retry two seconds later lands inside the same throttle
              # window and three immediate attempts are effectively one -
              # observed on this PR's own first CI cycle, three failures
              # 2.1s apart on the same tarball. A warm retry costs seconds
              # once the archives hold the already-built ports, so a
              # generous wait is far cheaper than one cold rebuild.
              delay=$(( attempt == 1 ? 30 : 120 ))
              echo "::warning::Configure attempt $attempt failed (codeload throttling?) - waiting ${delay}s, then resuming from the locally-built archives"
              sleep "$delay"
            fi
          done
          echo "::error::Configure failed after 3 attempts"
          exit 1

      - name: Build
        shell: bash
        run: cmake --build --preset build-linux-gcc -- -k 0

      - name: Test
        shell: bash
        run: ctest --preset test-linux-gcc

  build-and-test:
    name: Build & Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/_build.yml
    # contents: write is only actually used by _build.yml's quality-trend job
    # (persist_quality_trend gates it to direct main pushes below);
    # actions: read is only actually used by check-runners, to list this
    # repo's (and optionally iainchesworthlabs org's) self-hosted runners -
    # see docs/ci-self-hosted-runners.md. security-events: write is only
    # actually used by build-android's java-kotlin CodeQL analyze step (see
    # its own comment in _build.yml for why that leg lives there instead of
    # codeql.yml). Every other job in that reusable workflow keeps the
    # workflow-level `contents: read` it already declares - a callee job's own
    # `permissions:` can only narrow what the caller grants here, never widen
    # it, so this is the one place that ceiling has to be raised.
    permissions:
      contents: write
      actions: read
      security-events: write
    with:
      # Computed here, not inside _build.yml: github.event_name/github.ref
      # reflect the reusable workflow's own call context once inside it, and
      # this caller site is the unambiguous place to ask "is this a direct
      # push to main" - see persist_quality_trend's own
      # description in _build.yml.
      persist_quality_trend: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      quality_trend_branch: ${{ github.ref_name }}
    secrets:
      # Forward the Atmos object-signing key so build-android bundles it and the
      # Shield app signs whenever the secret is set - on ordinary CI builds too,
      # not only releases. Absent (or on a fork PR, where secrets don't flow) it
      # resolves empty and the build stays the safe unsigned bed51 app. Only
      # this one secret is forwarded here; the APK-keystore secrets stay on
      # release.yml's call, which is the only path that packages a release APK.
      ATMOS_SIGNING_KEY: ${{ secrets.ATMOS_SIGNING_KEY }}
      # Optional; see _build.yml's own description of this secret. Absent
      # today (no such repo secret is provisioned yet) resolves empty, which
      # check-runners already treats as "skip the org-level check".
      ORG_RUNNERS_TOKEN: ${{ secrets.ORG_RUNNERS_TOKEN }}

  # Persists this run's encoder throughput numbers (docs/performance-trend.md)
  # so they outlive the CI log that produced them - the trend-tracking half of
  # the performance suite, alongside tests/performance/test_performance.cpp's
  # ac3perf (a hard, absolute real-time gate that runs on every push/PR as
  # part of build-and-test's own ctest, not here). This job answers a softer
  # question on top of that gate: is throughput drifting slower over time even
  # while ac3perf keeps passing. It records two granularities per run:
  # ac3bench's whole-frame ms/frame (gating at the +100% tier, below) and
  # ac3kernelbench's per-kernel ns/call (never gating - see
  # tools/ci/append_kernel_history.py for why), so a whole-frame drift can be
  # attributed to the kernel that caused it without re-running a profiler.
  #
  # One leg (linux-gcc), not the whole matrix: unlike the gold-reference SNR
  # numbers (genuinely cross-platform floating-point comparisons worth seeing
  # side by side), a timing trend's value is in comparing one consistent
  # runner against its own history over time, not in comparing GitHub's
  # runner classes against each other. Self-contained here rather than added
  # to _build.yml's matrix, so this stays a small, independently-readable
  # job instead of one more thing threaded through that file's per-leg logic.
  #
  # Reuses the quality-history branch (a different file - see
  # tools/ci/append_performance_history.py) rather than a new branch, for the
  # same reasons quality-trend already uses a dedicated branch instead of
  # gh-pages: incremental, no publish-cadence coupling, fetchable client-side
  # with no auth.
  persist-performance-trend:
    name: Publish performance trend
    needs: [build-and-test, toolchain-versions, performance-trend-arm64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    permissions:
      contents: write
    steps:
      - name: Bootstrap container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates cmake curl git gnupg lsb-release \
            ninja-build pkg-config software-properties-common tar unzip wget zip

      # persist-credentials: false - this checkout is only ever read from
      # (ac3bench's build, `git show` on this commit); the "Prepare
      # quality-history checkout" step below pushes through its own
      # explicitly-scoped remote instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GCC 16
        run: bash .github/toolchain/02-gcc-toolchain.sh

      - uses: ./.github/actions/setup-vcpkg
        with:
          vcpkg-commit: ${{ needs.toolchain-versions.outputs.vcpkg_commit }}

      - name: Configure
        run: cmake --preset config-linux-gcc

      - name: Build ac3bench, ac3kernelbench and ac3membench
        run: cmake --build --preset build-linux-gcc --target ac3bench ac3kernelbench ac3membench -- -k 0

      # Three repetitions, not one. append_performance_history.py reduces them
      # to a single record per workload by taking the FASTEST run and recording
      # the spread beside it (see its load_leg_results docstring for why the
      # minimum rather than the mean). Until this, the number written into the
      # permanent history was a single unrepeated sample - a weaker signal than
      # the PR-time comparison feeding into the very same merge already used,
      # which is min-of-3 interleaved. The trailing-mean regression tiers were
      # being fed the noisier of the two numbers.
      #
      # Cheap: ac3bench is 200 frames per workload and takes seconds, against a
      # job that has already paid for a container, a GCC install, a vcpkg setup
      # and a full build.
      - name: Run ac3bench (repeated)
        env:
          BENCH_RUNS: "3"
        run: |
          set -euo pipefail
          mkdir -p results/performance-linux-gcc
          for i in $(seq 1 "$BENCH_RUNS"); do
            build/config-linux-gcc/bin/ac3bench \
              --json-out "results/performance-linux-gcc/bench$i.json"
          done

      # What the numbers were measured ON. ms/frame is hardware-relative in a
      # way the quality series' dB is not, so a hosted-image bump or a
      # differently-specced runner otherwise shows up as an unattributable step
      # in the trend that nobody can distinguish from a code change. Recorded
      # only - nothing compares against it.
      - name: Capture the measurement environment
        shell: bash
        env:
          LEG_DIR: results/performance-linux-gcc
        run: bash .github/scripts/capture-bench-environment.sh

      # A separate results tree from ac3bench's on purpose:
      # append_performance_history.py globs every *.json under its legs and
      # requires ac3bench's schema, so the two producers' outputs must never
      # share a directory - see append_kernel_history.py's load_leg_results.
      - name: Run ac3kernelbench
        run: |
          set -euo pipefail
          mkdir -p kernel-results/kernels-linux-gcc
          build/config-linux-gcc/bin/ac3kernelbench --json-out kernel-results/kernels-linux-gcc/kernels.json

      # Third results tree, same reasoning as the kernel one above: each
      # append script globs every *.json under its legs and requires its own
      # producer's schema.
      - name: Run ac3membench
        run: |
          set -euo pipefail
          mkdir -p memory-results/memory-linux-gcc
          build/config-linux-gcc/bin/ac3membench --json-out memory-results/memory-linux-gcc/membench.json

      # The arm64 leg's measurements, produced by the job below on hardware this
      # one cannot execute. Unpacked as a SIBLING of this job's own
      # results/performance-linux-gcc, because append_performance_history.py
      # takes one leg per subdirectory (leg = the name with "performance-"
      # stripped) - so two directories become two series with no schema change
      # and no second commit to quality-history.
      #
      # `continue-on-error` on the download alone: a missing arm64 artifact
      # must not cost the x86 series its record for that commit. The append
      # step below simply sees one leg instead of two.
      - name: Download the arm64 measurements
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: performance-linux-gcc-arm64
          path: results/performance-linux-gcc-arm64

      # Same mechanic as quality-trend's own step in _build.yml (plain git
      # over an HTTPS remote carrying the token, not actions/checkout, which
      # fails outright if quality-history does not exist yet).
      - name: Prepare quality-history checkout
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          mkdir -p history
          cd history
          if git ls-remote --exit-code --heads "$remote" quality-history >/dev/null 2>&1; then
            git init -q
            git remote add origin "$remote"
            git fetch -q origin quality-history
            git checkout -q quality-history
          else
            git init -q -b quality-history
            git remote add origin "$remote"
            git commit -q --allow-empty -m "Initialize quality-history branch"
          fi

      - name: Append performance-trend history
        id: append
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          commit_date="$(git show -s --format=%cI "$COMMIT_SHA")"
          python3 tools/ci/append_performance_history.py \
            --results-dir results \
            --history-dir history \
            --branch "$BRANCH" \
            --commit "$COMMIT_SHA" \
            --commit-date "$commit_date"

      # Its own step (and script) rather than more legs in the one above:
      # the kernel series is deliberately non-gating - both regression tiers
      # are ::warning:: annotations and there is no hard_regression output -
      # so keeping it out of the `append` step keeps that step's output
      # contract (which the fail-on-hard-regression step below keys off)
      # about the whole-frame series only.
      - name: Append kernel-trend history
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          commit_date="$(git show -s --format=%cI "$COMMIT_SHA")"
          python3 tools/ci/append_kernel_history.py \
            --results-dir kernel-results \
            --history-dir history \
            --branch "$BRANCH" \
            --commit "$COMMIT_SHA" \
            --commit-date "$commit_date"

      # Gates like the whole-frame series (its own hard_regression output,
      # keyed off by its own fail step below), unlike the never-gating
      # kernel series - ac3membench's counts are near-deterministic for a
      # fixed workload, so its hard tier carries none of the runner-noise
      # risk that keeps the kernel series advisory.
      - name: Append memory-trend history
        id: append_memory
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          commit_date="$(git show -s --format=%cI "$COMMIT_SHA")"
          python3 tools/ci/append_memory_history.py \
            --results-dir memory-results \
            --history-dir history \
            --branch "$BRANCH" \
            --commit "$COMMIT_SHA" \
            --commit-date "$commit_date"

      # Renders the newest figures as shields.io endpoint JSON for the README's
      # badge row. Runs HERE, in the job that already commits to
      # quality-history, rather than as a job of its own: that branch has two
      # writers already (_build.yml's quality-trend and this one) and a third
      # would be a third chance to race on it.
      #
      # After the appends above, so the speed and memory badges describe the
      # records this run just wrote. The accuracy badge reads whatever the
      # quality-trend job last pushed, which can be one run behind on a commit
      # whose quality leg finished after this one - acceptable for a summary,
      # and the trend pages carry the exact number one click away.
      - name: Render the measurement badges
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 tools/ci/write_measurement_badges.py \
            --history-dir history \
            --branch "$BRANCH"

      - name: Commit and push performance-history update
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd history
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -q -m "Performance trend: ${BRANCH}@${COMMIT_SHA}"
            # Four trend publishers (quality, performance,
            # external-comparison, object-quality) share this one branch and
            # routinely finish within seconds of each other, so losing the
            # push race is an expected outcome rather than an error - it is
            # what "! [rejected] (fetch first)" on main means. Each writes its
            # own data file, so rebasing onto whichever sibling won is
            # conflict-free; only a genuine conflict stops the retry.
            pushed=""
            for attempt in 1 2 3 4 5; do
              if git push -q origin quality-history 2>/dev/null; then
                pushed=yes
                break
              fi
              echo "push rejected (attempt ${attempt}); rebasing onto origin/quality-history"
              git fetch -q origin quality-history
              git rebase -q origin/quality-history
              sleep $(( (RANDOM % 5) + 1 ))
            done
            if [ -z "${pushed}" ]; then
              echo "::error::could not push quality-history after 5 attempts"
              exit 1
            fi
          fi

      # Deliberately after the push above, not instead of the append step
      # failing outright - see append_performance_history.py's own
      # HARD_REGRESSION_SLOWDOWN_FRACTION and append_quality_history.py's
      # identical reasoning for its own hard-regression step.
      - name: Fail on hard performance regression
        if: steps.append.outputs.hard_regression == 'true'
        shell: bash
        run: |
          echo "::error::A leg/config ran at least twice as slow as its trailing average - see the job log above and docs/performance-trend.md for the recorded numbers."
          exit 1

      # `always() &&` so a hard memory regression is still reported when the
      # performance step above already failed the job - without it, a failed
      # earlier step would silently skip this one.
      - name: Fail on hard memory regression
        if: always() && steps.append_memory.outputs.hard_regression == 'true'
        shell: bash
        run: |
          echo "::error::A workload's heap churn at least doubled against its trailing average (or it leaked past the absolute threshold) - see the job log above and docs/performance-trend.md's memory tables for the recorded numbers."
          exit 1

  # A SECOND ac3bench series, on arm64 (roadmap VX17).
  #
  # ms/frame was measured on exactly one platform - x86-64, GCC, one hosted
  # image - so the trend could only ever answer "did this get slower on that
  # machine". This project hand-vectorises: fast-MDCT, the radix-4 FFT kernel,
  # the QMF filterbank. A change tuned against AVX that pessimises NEON is
  # invisible to a single-ISA series, and it is exactly the kind of change
  # this repository makes.
  #
  # WHY ARM64 AND NOT WINDOWS. Windows is the more obvious second platform and
  # is deliberately not it: those legs run on the self-hosted fleet, where
  # docs/performance-trend.md's own guidance is to compare PAIRED ratios
  # rather than absolute times because a co-tenant build can move a number by
  # more than any regression this would catch. A trend series is absolute by
  # construction, so it needs a runner whose timings mean something on their
  # own. ubuntu-24.04-arm is GitHub-hosted, the same class of machine as the
  # x86 series' ubuntu-latest, and differs in the one dimension worth adding.
  #
  # Mirrors _build.yml's linux-gcc-arm64 leg exactly - same runner label, same
  # ubuntu:26.04 container, same GCC 16 script, same preset - so this measures
  # a binary built the way that platform's binaries are actually built.
  #
  # Uploads rather than appends. Only ONE job may write to quality-history:
  # two jobs committing to the same branch race, and this repository has hit
  # that race before. persist-performance-trend downloads this artifact and
  # records both legs in its single existing commit.
  performance-trend-arm64:
    name: Publish performance trend (arm64 measurements)
    needs: [build-and-test, toolchain-versions]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    container: ubuntu:26.04
    env:
      BENCH_RUNS: "3"
      LEG_DIR: results/performance-linux-gcc-arm64
    steps:
      - name: Bootstrap container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates cmake curl git gnupg lsb-release \
            ninja-build pkg-config software-properties-common tar unzip wget zip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GCC 16
        run: bash .github/toolchain/02-gcc-toolchain.sh

      - uses: ./.github/actions/setup-vcpkg
        with:
          vcpkg-commit: ${{ needs.toolchain-versions.outputs.vcpkg_commit }}

      - name: Configure
        run: cmake --preset config-linux-gcc-arm64

      # ac3bench only. The x86 job also runs ac3kernelbench and ac3membench;
      # neither is added here yet, because a kernel series and a heap series
      # each want their own thresholds calibrated against this platform and
      # that is a separate exercise from establishing the whole-frame one.
      - name: Build ac3bench
        run: cmake --build --preset build-linux-gcc-arm64 --target ac3bench -- -k 0

      - name: Run ac3bench (repeated)
        run: |
          set -euo pipefail
          mkdir -p "$LEG_DIR"
          for i in $(seq 1 "$BENCH_RUNS"); do
            build/config-linux-gcc-arm64/bin/ac3bench --json-out "$LEG_DIR/bench$i.json"
          done

      - name: Capture the measurement environment
        shell: bash
        run: bash .github/scripts/capture-bench-environment.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-linux-gcc-arm64
          path: results/performance-linux-gcc-arm64
          retention-days: 7

  # Encoder throughput, this PR against its own merge base, on one runner
  # (roadmap VX17).
  #
  # The gap this closes: persist-performance-trend below only runs on pushes to
  # main, so the relative "is this slower than it was" question is not
  # asked until after a PR has merged. The absolute question IS asked on every
  # PR - tests/performance/test_performance.cpp's ac3perf, in every
  # build-and-test leg - but its real-time budget carries enough headroom that
  # a change could double ms/frame and still pass it comfortably. A PR that
  # halved the encoder's speed would therefore go green everywhere and only
  # surface on the trend chart afterwards.
  #
  # Its INFRASTRUCTURE is non-blocking; its HARD VERDICT is not. The split
  # matters, so it is worth being precise about which is which:
  #
  #   - continue-on-error stays. This job builds twice, and a container
  #     bootstrap flake or a vcpkg hiccup in a job nobody asked for must not
  #     block a PR. Everything mechanical here stays advisory.
  #   - The hard tier (100% - the workload takes at least twice as long) now
  #     fails a check, via the hard_regression output and the one-step
  #     performance-gate job below. continue-on-error would swallow an exit
  #     code, which is exactly why the verdict travels as an output instead.
  #   - The soft tier (20%) is unchanged and still advisory. That is where the
  #     runner-noise argument genuinely bites.
  #
  # Why the hard tier is safe to block on, when the soft tier is not: this
  # comparison is PAIRED - same runner, same job, both sides built from the
  # same checkout, timed interleaved with the order alternating, each side
  # reduced by minimum-of-N. Measured run-to-run spread is single-digit
  # percent. A doubling is an order of magnitude outside that.
  #
  # And it already blocked, just later and worse: the identical 100% threshold
  # fails append_performance_history.py on the push to main. The old behaviour
  # was not "a doubling does not fail CI", it was "a doubling fails CI on main
  # after it has merged, for whoever pushes next".
  #
  # Escape hatch is a label, not an admin merge - see performance-gate.
  #
  # Runner budget. This is a new job rather than an addition to an existing
  # leg, and it builds twice, so it is kept as narrow as it can be and still
  # answer the question:
  #   - `--target ac3bench ac3kernelbench` only. Not the library's tests, not
  #     the CLI, not the GUI - the same two binaries persist-performance-trend
  #     builds, and nothing else.
  #   - One container, one GCC install, one vcpkg setup, two builds inside
  #     them. The second configure reuses the first's vcpkg binary cache, so
  #     it costs a compile of this repository's own sources and not of its
  #     dependencies.
  #   - Gated on `changes` like every other heavy job, so a docs-only PR
  #     never starts it.
  #   - PERF_RUNS repetitions per side. Three is the smallest number that
  #     gives compare_performance.py a spread to report alongside each delta,
  #     which is what lets a reader tell a real 25% move from a noisy one;
  #     ac3bench is 200 frames per workload and takes seconds, so the
  #     repetitions are a rounding error next to the two builds.
  performance-compare:
    name: Performance vs merge base
    needs: [changes, toolchain-versions, check-runner]
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.check-runner.outputs.runner) }}
    container: ubuntu:26.04
    continue-on-error: true
    outputs:
      # Read by performance-gate below. Empty when this job was skipped or died
      # before the compare step, both of which that job treats as "no verdict".
      hard_regression: ${{ steps.compare.outputs.hard_regression }}
    env:
      PERF_RUNS: 3
    steps:
      - name: Bootstrap container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates cmake curl git gnupg lsb-release \
            ninja-build pkg-config software-properties-common tar unzip wget zip

      # fetch-depth: 0 so the base commit and its history are in the object
      # store for `git merge-base` and the worktree below - the default shallow
      # clone has neither.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install GCC 16
        run: bash .github/toolchain/02-gcc-toolchain.sh

      - uses: ./.github/actions/setup-vcpkg
        with:
          vcpkg-commit: ${{ needs.toolchain-versions.outputs.vcpkg_commit }}

      - name: Resolve the merge base
        id: base
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          # On a pull_request event the checked-out HEAD is the merge commit,
          # so BASE_SHA is already an ancestor of it and this returns BASE_SHA
          # itself. Asking git rather than trusting that keeps the answer right
          # if GitHub ever hands over a base tip that has moved on.
          merge_base="$(git merge-base "$BASE_SHA" HEAD)"
          echo "sha=$merge_base" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short "$merge_base")" >> "$GITHUB_OUTPUT"
          echo "Merge base: $merge_base"

      - name: Build the benchmarks at this PR's head
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset config-linux-gcc
          cmake --build --preset build-linux-gcc --target ac3bench ac3kernelbench -- -k 0

      # A worktree rather than `git checkout <sha>`: it leaves this checkout
      # (and its build tree, and tools/ci/compare_performance.py, which the
      # base commit may not even have) exactly where they are, and gives the
      # base its own source dir - so CMakePresets.json's
      # ${sourceDir}/build/${presetName} puts the two builds in separate
      # directories with no cache to invalidate between them.
      - name: Build the benchmarks at the merge base
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git worktree add --detach ../base-perf "$BASE_SHA"
          pushd ../base-perf >/dev/null
          cmake --preset config-linux-gcc
          cmake --build --preset build-linux-gcc --target ac3bench ac3kernelbench -- -k 0
          popd >/dev/null

      # BOTH builds finish before EITHER is timed, and the two are then
      # INTERLEAVED rather than run one block each. That ordering IS the
      # measurement, not a detail:
      #
      #   - Timed-right-after-built meant head was timed on a machine still
      #     warm from compiling head, and base on one warm from compiling
      #     base. Building both first puts each binary in the same state.
      #   - A shared runner drifts (thermal, co-tenants, page cache). Run in
      #     blocks, ALL of any drift between the blocks lands on the delta,
      #     indistinguishable from the code change. Alternating spreads it
      #     over both sides instead, where compare_performance.py's
      #     minimum-of-N can reject it.
      #   - The order within a round alternates too, so neither side is
      #     permanently the one running first and paying for whatever the
      #     other left in cache.
      #
      # Same shape as the manual A/B measurements docs/performance-trend.md
      # describes, for the same reason.
      - name: Run both benchmark sets, interleaved
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p perf-results/head perf-results/base
          head_bin=build/config-linux-gcc/bin
          base_bin=../base-perf/build/config-linux-gcc/bin
          for i in $(seq 1 "$PERF_RUNS"); do
            if [ $((i % 2)) -eq 1 ]; then order="head base"; else order="base head"; fi
            for side in $order; do
              if [ "$side" = head ]; then bin="$head_bin"; else bin="$base_bin"; fi
              "$bin/ac3bench" --json-out "perf-results/$side/bench$i.json"
              "$bin/ac3kernelbench" --json-out "perf-results/$side/kernels$i.json"
            done
          done

      - name: Compare and publish the job summary
        id: compare
        shell: bash
        env:
          BASE_SHORT: ${{ steps.base.outputs.short }}
        run: |
          set -euo pipefail
          python3 tools/ci/compare_performance.py \
            --base-dir perf-results/base \
            --head-dir perf-results/head \
            --base-ref "merge base $BASE_SHORT"

  # The blocking half of performance-compare, split out so that job can keep
  # continue-on-error for its builds while its VERDICT still fails a check.
  # Builds nothing, checks out nothing, runs one bash step - there is no
  # infrastructure here to flake and produce a false red.
  #
  # `always()` so a verdict is still enforced when some unrelated job failed;
  # the step itself is what decides, and it passes on anything that is not an
  # explicit `true`. That covers a skipped performance-compare (docs-only PR),
  # a cancelled one, and one that died before the compare step ran - a job
  # that produced no measurement must not fail a PR on a measurement it does
  # not have.
  #
  # The label escape hatch is checked HERE rather than in
  # compare_performance.py so the summary table keeps saying what it measured
  # either way: with the label the hard row is still rendered, still annotated
  # and still visible to a reviewer, it just stops failing the check. Labels
  # are also live - adding one and re-running this seconds-long job is the
  # whole loop, with no rebuild and no new commit.
  performance-gate:
    name: Performance gate
    needs: [performance-compare]
    if: always() && github.event_name == 'pull_request'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && fromJSON('["ubuntu-latest"]') || fromJSON(vars.CONTROL_RUNNER_JSON || '["ubuntu-latest"]') }}
    steps:
      - name: Gate on the hard-tier verdict
        shell: bash
        env:
          VERDICT: ${{ needs.performance-compare.outputs.hard_regression }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'perf-regression-approved') }}
        run: |
          set -euo pipefail
          echo "hard_regression=${VERDICT:-<none>}  perf-regression-approved=$APPROVED"
          if [ "${VERDICT:-}" != "true" ]; then
            echo "No hard performance regression to gate on."
            exit 0
          fi
          if [ "$APPROVED" = "true" ]; then
            echo "::warning title=Hard performance regression (approved)::A workload takes at least twice as long as at the merge base. Allowed through by the 'perf-regression-approved' label - see the Performance vs merge base summary for which workload and by how much."
            exit 0
          fi
          echo "::error title=Hard performance regression::A workload takes at least twice as long as at the merge base. See the 'Performance vs merge base' job summary for which one and by how much. This is the same 100% threshold that fails the trend job on main once merged. If the slowdown is deliberate, label this PR 'perf-regression-approved' and re-run this job."
          exit 1

  # Roadmap AP4: an ABI gate for the shared libraries, over the
  # linux-llvm-shared build. Two independent checks, both against
  # config-linux-llvm-shared (already Debug - has DWARF - and
  # BUILD_SHARED_LIBS=ON):
  #   - abidiff: does this change alter anything abigail can see in the
  #     public interface of a library that already existed at the
  #     comparison point.
  #   - check_abi_symbols.py: does the actual dynamic-symbol export set
  #     (nm -D --defined-only - exactly what CXX_VISIBILITY_PRESET hidden
  #     leaves reachable) still match the checked-in allowlist, catching an
  #     accidentally-exported internal symbol even on a brand first release
  #     with no tag yet to abidiff against.
  #
  # Comparison point. On a pull request this is the PR's own merge base,
  # exactly like performance-compare above and exactly what this job's first
  # bullet claims to answer - "what does this branch do to the ABI" is a
  # question only a merge base can answer. It used to compare against the
  # last release tag, which answers a different question (how far the ABI has
  # moved this cycle) and so reported the whole cycle's accumulated drift on
  # every PR: 806 commits' worth by 2026-08-28, which made the job fail on
  # 100% of open pull requests - including #449, which touched only CI and
  # docs and so could not have changed anything. That release-relative view
  # is still worth having, just not per-PR, so on a push or a tag the
  # comparison point stays the last release tag.
  #
  # Advisory vs enforcing. ABI_ENFORCE below is the single switch, and
  # flipping it to 'true' is the whole of AP1's promotion - the same one-line
  # pattern _build.yml's matrix.experimental flag already documents. Pre-1.0
  # there is no ABI-compatibility promise to enforce (see
  # docs/library/index.md's pimpl/config-growth note), so both checks report
  # into the job summary and leave the job green.
  #
  # This replaces the job-level `continue-on-error: true` that used to serve
  # that purpose, which did not actually do it: continue-on-error keeps a
  # failing job from failing the *workflow run*, but GitHub still reports
  # that job's own check run as `failure`, so the gate showed a red X on
  # every pull request while blocking nothing - no signal, and an active
  # incentive to stop reading CI. It also flattened two very different things
  # into one ignored state: an expected pre-1.0 ABI change and a genuine
  # infrastructure failure (a broken build, a library that did not link)
  # looked identical. With it gone, anything unexpected in this job is red
  # and a policy finding is not.
  #
  # When enforcing, abidiff fails only on ABIDIFF_ABI_INCOMPATIBLE_CHANGE
  # (exit bit 8). A pure addition sets bit 4 alone and passes, which is the
  # policy a library that expects to keep growing after 1.0 wants; bit 1 is
  # abidiff itself erroring and always fails, enforcing or not, because that
  # is a broken check rather than a finding about the code.
  abi-gate:
    name: ABI gate
    needs: [changes, toolchain-versions, check-runner]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.check-runner.outputs.runner) }}
    container: ubuntu:26.04
    env:
      # AP1 promotion: flip to 'true' when the API freeze ships. Nothing
      # else in this job needs to change.
      ABI_ENFORCE: 'false'
    steps:
      - name: Bootstrap container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            abigail-tools build-essential ca-certificates cmake curl git gnupg lsb-release \
            ninja-build pkg-config python3 software-properties-common tar unzip wget zip

      # fetch-depth: 0 so the comparison point (a merge base on a PR, the
      # last release tag otherwise) and its history are in the object store
      # for the worktree below - the default shallow clone has neither.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install LLVM ${{ needs.toolchain-versions.outputs.llvm_version }}
        run: |
          set -eu
          if command -v sudo >/dev/null 2>&1; then sudo -E bash .github/toolchain/03-llvm-toolchain.sh
          else bash .github/toolchain/03-llvm-toolchain.sh; fi

      - uses: ./.github/actions/setup-vcpkg
        with:
          vcpkg-commit: ${{ needs.toolchain-versions.outputs.vcpkg_commit }}

      - name: Resolve the comparison point
        id: base
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # On a pull_request event the checked-out HEAD is the merge
            # commit, so BASE_SHA is already an ancestor of it and this
            # returns BASE_SHA itself. Asking git rather than trusting that
            # keeps the answer right if GitHub ever hands over a base tip
            # that has moved on - same reasoning as performance-compare.
            ref="$(git merge-base "$BASE_SHA" HEAD)"
            {
              echo "skip=false"
              echo "ref=$ref"
              echo "label=merge base $(git rev-parse --short "$ref")"
            } >> "$GITHUB_OUTPUT"
            echo "Comparing HEAD against merge base $ref"
          else
            # Push, tag or manual run: the release-relative view.
            tag="$(git tag -l 'v*' --sort=-v:refname | head -1)"
            if [ -z "$tag" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "No v* tag found yet - nothing to diff against."
            else
              {
                echo "skip=false"
                echo "ref=$tag"
                echo "label=$tag"
              } >> "$GITHUB_OUTPUT"
              echo "Comparing HEAD against $tag"
            fi
          fi

      - name: Build HEAD (config-linux-llvm-shared)
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset config-linux-llvm-shared
          cmake --build build/config-linux-llvm-shared -- -k 0

      # A worktree, exactly like performance-compare's own base build: leaves
      # this checkout's build tree alone and gives the comparison point its
      # own source dir, so config-linux-llvm-shared's ${sourceDir}/build/...
      # path never collides between the two.
      - name: Build the comparison point (config-linux-llvm-shared)
        if: steps.base.outputs.skip == 'false'
        shell: bash
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          set -euo pipefail
          git worktree add --detach ../abi-base "$BASE_REF"
          pushd ../abi-base >/dev/null
          cmake --preset config-linux-llvm-shared
          cmake --build build/config-linux-llvm-shared -- -k 0
          popd >/dev/null

      # Both steps below discover libraries dynamically - `find .../src -name '*.so'` - rather
      # than a hardcoded `for lib in ...` list: this project's own SHARED targets each produce a
      # bare, unversioned libFOO.so symlink (alongside the real, version-suffixed libFOO.so.X.Y.Z)
      # directly in the build tree under src/<component>/, with no install step needed to see it.
      # Scoped to .../src specifically - not the whole build tree - so a FetchContent'd
      # third-party dependency's own .so (e.g. a hypothetical libadm.so, if AC3FORGE_BUILD_ADM
      # were ever turned on for this preset) is never picked up: those build under .../_deps/,
      # a disjoint subtree, and this project never install()s them in their own right regardless.
      # A hardcoded list is exactly what let libac3iab.so go uncovered by both steps below (and
      # unrepresented in tools/ci/abi-allowlist/) from the day ac3iab landed until this fix.
      - name: abidiff each shared library against the comparison point
        if: steps.base.outputs.skip == 'false'
        shell: bash
        env:
          BASE_LABEL: ${{ steps.base.outputs.label }}
        run: |
          set -uo pipefail
          fence='```'
          {
            echo "## ABI diff vs $BASE_LABEL"
            echo
            if [ "$ABI_ENFORCE" != "true" ]; then
              echo "_Advisory: pre-1.0 there is no ABI-compatibility promise to"
              echo "enforce. This reports; it does not fail the build._"
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # tools/ci/abi-suppressions.ini drops the libstdc++/runtime
          # template instantiations that are not part of any ABI this
          # project controls - see that file's header for why they show up
          # in the first place.
          errors=0
          incompatible=0
          changed=0
          mapfile -t libs < <(
            { find build/config-linux-llvm-shared/src -name '*.so' -exec basename {} \;
              find ../abi-base/build/config-linux-llvm-shared/src -name '*.so' -exec basename {} \;
            } 2>/dev/null | sort -u)
          for lib in "${libs[@]}"; do
            head_lib="$(find build/config-linux-llvm-shared/src -name "$lib" -print -quit)"
            base_lib="$(find ../abi-base/build/config-linux-llvm-shared/src -name "$lib" -print -quit)"
            if [ -z "$head_lib" ]; then
              echo "### $lib" >> "$GITHUB_STEP_SUMMARY"
              echo "(not built at HEAD)" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if [ -z "$base_lib" ]; then
              echo "### $lib" >> "$GITHUB_STEP_SUMMARY"
              echo "(not present at $BASE_LABEL - new library)" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            out="$(abidiff --suppressions tools/ci/abi-suppressions.ini \
                     "$base_lib" "$head_lib" 2>&1)" && rc=0 || rc=$?

            # abidiff's exit status is a bitfield: 1 ABIDIFF_ERROR,
            # 4 ABIDIFF_ABI_CHANGE, 8 ABIDIFF_ABI_INCOMPATIBLE_CHANGE.
            if [ "$(( rc & 1 ))" -ne 0 ]; then
              errors=1
              verdict="abidiff errored"
            elif [ "$(( rc & 8 ))" -ne 0 ]; then
              incompatible=1
              verdict="incompatible change"
            elif [ "$(( rc & 4 ))" -ne 0 ]; then
              changed=1
              verdict="additive change"
            else
              verdict="no change"
            fi

            echo "$lib: $verdict"
            echo "### $lib - $verdict" >> "$GITHUB_STEP_SUMMARY"
            if [ "$rc" -ne 0 ]; then
              echo "$out"
              {
                echo "$fence"
                echo "$out"
                echo "$fence"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          if [ "$errors" -ne 0 ]; then
            echo "::error title=ABI gate::abidiff failed to run - that is a broken check, not a finding about the code."
            exit 1
          fi
          if [ "$incompatible" -ne 0 ]; then
            if [ "$ABI_ENFORCE" = "true" ]; then
              echo "::error title=ABI gate::Incompatible ABI change vs $BASE_LABEL."
              exit 1
            fi
            echo "::notice title=ABI gate::Incompatible ABI change vs $BASE_LABEL - advisory pre-1.0, would fail once ABI_ENFORCE is true."
          elif [ "$changed" -ne 0 ]; then
            echo "::notice title=ABI gate::Additive ABI change vs $BASE_LABEL - passes even when enforcing."
          fi
          exit 0

      - name: Exported-symbol allowlist check
        # Independent of the abidiff step above (see this job's header
        # comment) - must run even when abidiff already reported a diff,
        # which pre-1.0 it does on plenty of PRs. Without this, GitHub
        # Actions' default success()-only condition means an abidiff failure
        # silently skips the one check here that catches a real regression.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          fence='```'
          libs=()
          while IFS= read -r found; do
            libs+=(--lib "$found")
          done < <(find build/config-linux-llvm-shared/src -name '*.so' | sort)
          if [ "${#libs[@]}" -eq 0 ]; then
            echo "::error title=ABI gate::No shared libraries were built - nothing to check."
            exit 1
          fi
          out="$(python3 tools/ci/check_abi_symbols.py \
                   --allowlist-dir tools/ci/abi-allowlist "${libs[@]}" 2>&1)" && rc=0 || rc=$?
          echo "$out"
          {
            echo "## Exported-symbol allowlist"
            echo
            echo "$fence"
            echo "$out"
            echo "$fence"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if [ "$ABI_ENFORCE" = "true" ]; then
            echo "::error title=ABI gate::Exported symbols no longer match the allowlist."
            exit 1
          fi
          echo "::notice title=ABI gate::Exported symbols no longer match the allowlist - advisory pre-1.0, would fail once ABI_ENFORCE is true. Regenerate with --update if the change is deliberate."
          exit 0

  # FFmpeg as an independent oracle (CONTRIBUTING.md's "Oracles" list, #2),
  # automated - previously a manual/developer-only practice. Builds ac3cli
  # only (linux-llvm preset; no GUI, and build-and-test already covers
  # ctest), then runs three layers against it, all against FFmpeg and all
  # already exiting non-zero on their own failure - this job's only new work
  # is wiring them up, pinning FFmpeg, and gating on the result. Answers a
  # different question from _build.yml's gold-reference gate (every leg,
  # one fixed sample, ac3cli's own decoder vs FFmpeg's - output *quality* and
  # cross-platform reproducibility): this leg checks that every layout,
  # Annex E tool token and metadata option in the encoder's surface produces
  # a structurally valid stream at all - output *correctness* across the
  # full option space, which one fixed sample can never exercise:
  #   - conformance: tools/ci/run_codec_matrix.sh's FFmpeg strict-decode
  #     additions, across the layout/tool/metadata matrix. Skips 7.1.4 and
  #     7.1.4+Annex-E-tool combinations on purpose - see the script's own
  #     header comment and README.md's Verification gaps table for why no
  #     oracle exists for either.
  #   - metadata: tools/checks/check_drc.py (dynrng/compr/downmix/dialnorm) and
  #     tools/checks/check_coupling.py + check_coupling_level.py (coupling envelope
  #     and absolute level), all discriminating checks that compare a decode
  #     which applies the metadata against one that doesn't.
  #   - fidelity: tools/ci/quality_race.py's `ci` mode, a numeric SNR/LSD floor
  #     per E-AC-3 tool variant (stereo and 5.1) plus AC-3, set well below
  #     today's measured numbers (README.md's own SNR table) so it trips on
  #     a genuine regression without chasing normal drift.
  #   - coverage: tools/checks/check_matrix_coverage.py, a different question from
  #     the three layers above - not "is the output correct" but "does
  #     anything exercise this at all". Reads the CLI's own canonical option
  #     lists (usage text, and the "unknown layout"/"unknown tool set" error
  #     messages a bad argument hits) and fails if a layout, Annex E tool
  #     token or command the CLI accepts today is never mentioned in
  #     run_codec_matrix.sh - so a new option landing in the library without
  #     a matching matrix entry fails CI instead of shipping unvalidated.
  #     Caught exactly this for real while this job was being built: E-AC-3
  #     VBR support landed with zero matrix coverage, on this same branch.
  # FFmpeg is pinned to the exact ubuntu:26.04 archive build so its behaviour
  # cannot silently drift out from under the codec-matrix decodes or the
  # fidelity floors above - the same discipline this project already applies
  # to the vcpkg commit and the LLVM/GCC versions.
  ffmpeg-validate:
    name: FFmpeg Validate
    needs: [changes, toolchain-versions, check-runner]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.check-runner.outputs.runner) }}
    container: ubuntu:26.04
    steps:
      - name: Bootstrap container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates cmake curl git gnupg lsb-release \
            ninja-build pkg-config python3-pip software-properties-common \
            tar unzip wget zip \
            ffmpeg=7:8.0.1-3ubuntu2

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install LLVM ${{ needs.toolchain-versions.outputs.llvm_version }}
        run: bash .github/toolchain/03-llvm-toolchain.sh

      - uses: ./.github/actions/setup-vcpkg
        with:
          vcpkg-commit: ${{ needs.toolchain-versions.outputs.vcpkg_commit }}

      # requirements/requirements-ffmpeg-validate.txt is a pip-compile --generate-hashes
      # lock (see its own header for how to regenerate) so this install is
      # hash-pinned.
      #
      # `visqol-python` (tools/ci/quality_race.py's perceptual_score(), see its
      # own docstring for why ViSQOL/why that package) IS installed here now.
      # It used to be held out on supply-chain grounds; what that bought was a
      # MOS column nobody could read - every one of the ~3,758 rows on the
      # quality-history branch carried "mos_lqo": null and every MOS cell in
      # docs/landscape.md and docs/tool-comparison-trend.md rendered n/a, so
      # the perceptual half of this project's own published comparison did not
      # exist. It is pinned by hash like everything else in that lock; see the
      # .in file's header for exactly which seven packages it added.
      #
      # It does NOT change what gates. The `ci` step below is still the hard
      # fidelity gate and still scores SNR/LSD only - perceptual_score() is
      # never called from race_ci(). Only the `trend` step (compute-only,
      # feeds quality-history) pays for MOS.
      #
      # What that costs, measured rather than estimated: a full `trend` run
      # took 10m48s with ViSQOL and 3m59s with it stubbed out, so the MOS
      # column is about seven minutes of it across the 62 distinct scorings
      # eight legs produce - and that is already WITH quality_race.py's
      # MOS_WINDOW_S cap, without which it would be far worse, since ViSQOL's
      # patch matching is super-linear (3.9 s to score 3 s of audio, 127.8 s
      # to score 30 s). Those figures are from a Windows DEBUG build, so the
      # encode/decode half will be faster here on config-linux-llvm; the
      # ViSQOL half is pure Python and will not be.
      #
      # Roughly doubling this job (~5 min today) is affordable because it is
      # nowhere near the critical path: the same run's longest job is Windows
      # LLVM at ~21 min, so the wall clock of a CI run does not move. If that
      # ever stops being true, the lever is MOS_WINDOW_S or scoring only the
      # `landscape` rows - not dropping the column again.
      #
      # --ignore-installed: matplotlib (added for render_spectrograms()) pulls
      # in `packaging` transitively, which ubuntu:26.04's base image already
      # has as an apt-installed package with no RECORD file - pip's own
      # in-place-upgrade path refuses to touch a package it can't prove the
      # contents of ("Cannot uninstall packaging ... no RECORD file was
      # found", confirmed for real in this job's own first CI run). This
      # flag tells pip to install fresh into site-packages over top of it
      # rather than trying to uninstall first - fine in a throwaway
      # container that gets discarded after the job either way.
      - name: Install numpy, matplotlib and visqol-python
        run: pip install --quiet --break-system-packages --ignore-installed --require-hashes -r requirements/requirements-ffmpeg-validate.txt

      - name: Report ffmpeg version
        run: ffmpeg -version | head -1

      - name: Configure
        run: cmake --preset config-linux-llvm

      - name: Build ac3cli
        run: cmake --build --preset build-linux-llvm --target ac3cli -- -k 0

      - name: Codec matrix against the FFmpeg oracle
        run: bash tools/ci/run_codec_matrix.sh build/config-linux-llvm/bin/ac3cli

      - name: Metadata checks against FFmpeg (dynrng, compr, downmix, dialnorm)
        run: python3 tools/checks/check_drc.py --cli build/config-linux-llvm/bin/ac3cli

      - name: Coupling checks against FFmpeg (envelope and absolute level)
        env:
          AC3CLI: build/config-linux-llvm/bin/ac3cli
        run: |
          python3 tools/checks/check_coupling.py
          python3 tools/checks/check_coupling_level.py

      - name: Fidelity gate against FFmpeg (SNR/LSD floors)
        env:
          AC3CLI: build/config-linux-llvm/bin/ac3cli
        run: python3 tools/ci/quality_race.py ci

      - name: Matrix coverage (every CLI option is exercised somewhere)
        run: python3 tools/checks/check_matrix_coverage.py --cli build/config-linux-llvm/bin/ac3cli

      # The generator half of this job's question. Everything above walks a
      # HAND-ENUMERATED set of command lines against one bootstrap tone: the
      # matrix says which options exist, the coverage check says each one is
      # named somewhere, and neither has any notion of option COMBINATIONS or
      # of the input material. tools/ci/fuzz_encoder_space.py draws random legal
      # configurations crossed with adversarial PCM whose character changes
      # part-way through a frame, and holds every resulting stream against
      # both decoders - see that file's own header for the encoder defect
      # (PR #186) that escaped every gate above and takes seconds to find
      # this way.
      #
      # The envelope check runs first and is cheap: it re-measures the
      # per-layout rate floors the generator draws from, so a run cannot pass
      # by drawing configurations the encoder was never going to accept.
      #
      # Bounded to ~2 minutes here, on top of a job that already runs several
      # minutes, so a pull request is not slowed noticeably. The deeper run is
      # fuzz.yml's nightly encoder-space job. Unseeded on purpose: a fixed
      # seed would walk the same few hundred configurations every run forever,
      # which is a regression test, not a search. Every failure prints the
      # exact seed that produced it and --replay reruns just that case, so a
      # random run is still fully reproducible after the fact.
      #
      # This half DOES gate: it is deterministic, it takes seconds, and a
      # failure means either the encoder now refuses configurations it used to
      # fit or the generator is drawing outside the accepted space - in which
      # case the search step below would come back "clean" having encoded
      # almost nothing.
      - name: Encoder acceptance envelope (the rate floors the search draws from)
        env:
          AC3CLI: build/config-linux-llvm/bin/ac3cli
        run: python3 tools/ci/fuzz_encoder_space.py --check-envelope

      # Every case seed that ever produced a wrong verdict - from the encoder
      # or from the harness itself - replayed exactly (REGRESSION_SEEDS in the
      # script). Deterministic and seconds-cheap, so it gates like the
      # envelope check does; the unseeded search below stays a search.
      - name: Encoder input-space regressions (recorded past failures)
        env:
          AC3CLI: build/config-linux-llvm/bin/ac3cli
        run: python3 tools/ci/fuzz_encoder_space.py --regressions

      - name: Encoder input-space fuzz (bounded, both decoders)
        env:
          AC3CLI: build/config-linux-llvm/bin/ac3cli
        run: python3 tools/ci/fuzz_encoder_space.py --seconds 120

      # The same question asked of the E-AC-3 encoder (roadmap VX1), which the
      # AC-3 harness above deliberately does not cover: Annex E tool tokens,
      # fscod2 half rates, VBR, the layouts that need dependent substreams,
      # and atmos-encode's object counts.
      #
      # It needs its own steps rather than a flag on the ones above because
      # its ORACLE is a different shape. FFmpeg reads AC-3 whole; it does not
      # read E-AC-3 whole - no second dependent substream (so no 7.1.4), no
      # model at all of enhanced coupling or transient pre-noise, and no
      # fscod2 decode - so the harness classifies each case first and holds
      # the cells FFmpeg cannot decode against ffprobe's syncframe walk
      # instead. --check-oracles is what keeps that classification honest: it
      # re-measures every entry against the ffmpeg pinned below, so a cell
      # wrongly listed as a gap cannot quietly stop being tested.
      - name: E-AC-3 encoder oracle model (what this FFmpeg can actually read)
        env:
          AC3CLI: build/config-linux-llvm/bin/ac3cli
        run: python3 tools/ci/fuzz_eac3_encoder_space.py --check-oracles

      # Same role as the AC-3 envelope check above - the rate floors the
      # search draws from, so a run cannot pass by drawing configurations the
      # encoder was never going to accept - plus §E2.3.1.3's 11-bit frmsiz
      # word ceiling, which at the Annex E half rates sits inside Table 5.18's
      # own rate list. That half is a regression gate on a real defect: the
      # refusal there used to be an assert() rather than a message.
      - name: E-AC-3 encoder acceptance envelope (rate floors + the frmsiz ceiling)
        env:
          AC3CLI: build/config-linux-llvm/bin/ac3cli
        run: python3 tools/ci/fuzz_eac3_encoder_space.py --check-envelope

      - name: E-AC-3 encoder input-space regressions (recorded past failures)
        env:
          AC3CLI: build/config-linux-llvm/bin/ac3cli
        run: python3 tools/ci/fuzz_eac3_encoder_space.py --regressions

      - name: E-AC-3 encoder input-space fuzz (bounded, both decoders)
        env:
          AC3CLI: build/config-linux-llvm/bin/ac3cli
        run: python3 tools/ci/fuzz_eac3_encoder_space.py --seconds 120

      - name: Upload failing encoder-space inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: encoder-space-artifacts
          path: |
            fuzz-encoder-artifacts/
            fuzz-eac3-encoder-artifacts/
          if-no-files-found: ignore

      # Compute-only: scores this build against the same three fixed legs
      # tools/generators/gen_external_baseline.py measures FFmpeg/DEE against, using
      # this project's own decoder throughout (see quality_race.py's
      # race_trend docstring) - neither FFmpeg's nor DEE's encoder ever
      # runs here. Not yet persisted to quality-history (a later phase);
      # this step only produces the artifact so the numbers are visible
      # per-run before that lands.
      #
      # --spectrogram-dir renders docs/landscape.md's visual supplement
      # (one PNG per leg: original/ac3forge/FFmpeg/DEE spectrograms stacked)
      # in the same invocation, straight off the encode/decode this step is
      # already doing - see render_spectrograms()'s own docstring for why
      # this is a second flag on this call, not a separate step that would
      # otherwise re-encode all three legs from scratch. It does still need
      # an `ffmpeg` binary (already installed above, for the codec-matrix
      # steps) to decode the committed external-baseline bitstreams - never
      # to encode.
      - name: External-encoder landscape trend (compute-only)
        env:
          AC3CLI: build/config-linux-llvm/bin/ac3cli
        run: python3 tools/ci/quality_race.py trend --json-out results/trend.json --spectrogram-dir results/spectrograms

      - name: Upload landscape trend
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-encoder-landscape-trend
          path: results/trend.json

      - name: Upload quality spectrograms
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-spectrograms
          path: results/spectrograms

      # Compute-only, same as the landscape trend above: encodes the
      # committed five-object scene (tests/golden/audio/reference_objects.wav
      # plus its .paths placements) with this build's `atmos-encode`, decodes
      # it back to per-object WAVs with this build's `decode`, and scores each
      # object against the channel it came from. No external tool is involved
      # at any point and none could be - there is no external oracle for
      # object decode at all (FFmpeg implements no JOC reconstruction, and
      # Dolby's own decoder needs a key this project does not ship), which is
      # exactly the gap this leg exists to close: before it, the object layer
      # was measured once anywhere in the tree, in a unit test with a 10 dB
      # floor against 18-35 dB measured. See race_objects() in
      # tools/ci/quality_race.py and docs/object-quality-trend.md.
      #
      # It lives on this job rather than a job of its own because it needs
      # exactly what this one already has built and installed - ac3cli and
      # numpy - and takes a couple of seconds on top of a job that already
      # runs several minutes.
      - name: Object-reconstruction quality (compute-only)
        env:
          AC3CLI: build/config-linux-llvm/bin/ac3cli
        run: python3 tools/ci/quality_race.py objects --json-out results/objects.json

      - name: Upload object-reconstruction quality
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: object-reconstruction-quality
          path: results/objects.json

  # Persists ffmpeg-validate's landscape-trend numbers (see that job's own
  # comment) to the quality-history branch, same mechanism as
  # persist-performance-trend beside it - one job downstream of a single
  # producer job rather than a per-leg matrix, so this is one commit per CI
  # run, not a race between several. Needs neither a container nor a build:
  # tools/ci/append_external_comparison_history.py is stdlib-only, and
  # tests/golden/external-baseline/manifest.json (the FFmpeg/DEE numbers to
  # diff against) is a committed file the checkout below already has.
  persist-external-comparison-trend:
    name: Publish external-encoder landscape trend
    needs: ffmpeg-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # persist-credentials: false - same reasoning as persist-performance-
      # trend's identical checkout: this working tree is only ever read from
      # (the append script, `git show` on this commit); the "Prepare
      # quality-history checkout" step below pushes through its own
      # explicitly-scoped remote instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download landscape trend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: external-encoder-landscape-trend
          path: results

      # Only actually persisted below on `main` (see "Copy quality
      # spectrograms into history" below), but downloaded unconditionally -
      # harmless on a non-main run, and keeps this step identical regardless
      # of branch rather than adding an `if` two different ways to the same
      # artifact.
      - name: Download quality spectrograms
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quality-spectrograms
          path: results/spectrograms

      # Same mechanic as persist-performance-trend's identical step: plain
      # git over an HTTPS remote carrying the token, not actions/checkout,
      # which fails outright if quality-history does not exist yet.
      - name: Prepare quality-history checkout
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          mkdir -p history
          cd history
          if git ls-remote --exit-code --heads "$remote" quality-history >/dev/null 2>&1; then
            git init -q
            git remote add origin "$remote"
            git fetch -q origin quality-history
            git checkout -q quality-history
          else
            git init -q -b quality-history
            git remote add origin "$remote"
            git commit -q --allow-empty -m "Initialize quality-history branch"
          fi

      - name: Append external-comparison history
        id: append
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          commit_date="$(git show -s --format=%cI "$COMMIT_SHA")"
          python3 tools/ci/append_external_comparison_history.py \
            --trend-json results/trend.json \
            --manifest-json tests/golden/external-baseline/manifest.json \
            --history-dir history \
            --branch "$BRANCH" \
            --commit "$COMMIT_SHA" \
            --commit-date "$commit_date"

      # main-only: main only ever advances on a release promotion in this
      # repo's GitFlow model, so this is already release cadence, not an
      # extra gate - see docs/landscape.md's own release-by-release framing.
      # Unlike the JSONL append above, a fresh PNG every push doesn't
      # delta-compress the way small JSON text does, so this deliberately
      # does NOT run on every main push the way the numbers do; the
      # numbers' own cadence is untouched. Overwrites the same three files
      # in place each time (no per-commit accumulation) - there's no
      # per-release image history, only "latest", which is what
      # docs/landscape.md's img tags read.
      - name: Copy quality spectrograms into history
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p history/spectrograms
          cp results/spectrograms/*.png history/spectrograms/

      - name: Commit and push external-comparison-history update
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd history
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -q -m "External-comparison trend: ${BRANCH}@${COMMIT_SHA}"
            # Four trend publishers (quality, performance,
            # external-comparison, object-quality) share this one branch and
            # routinely finish within seconds of each other, so losing the
            # push race is an expected outcome rather than an error - it is
            # what "! [rejected] (fetch first)" on main means. Each writes its
            # own data file, so rebasing onto whichever sibling won is
            # conflict-free; only a genuine conflict stops the retry.
            pushed=""
            for attempt in 1 2 3 4 5; do
              if git push -q origin quality-history 2>/dev/null; then
                pushed=yes
                break
              fi
              echo "push rejected (attempt ${attempt}); rebasing onto origin/quality-history"
              git fetch -q origin quality-history
              git rebase -q origin/quality-history
              sleep $(( (RANDOM % 5) + 1 ))
            done
            if [ -z "${pushed}" ]; then
              echo "::error::could not push quality-history after 5 attempts"
              exit 1
            fi
          fi

      # Deliberately after the push above, not instead of the append step
      # failing outright - same reasoning as persist-performance-trend's and
      # append_quality_history.py's identical hard-regression step.
      - name: Fail on hard external-comparison regression
        if: steps.append.outputs.hard_regression == 'true'
        shell: bash
        run: |
          echo "::error::A leg/variant's SNR dropped at least 10 dB below its trailing average - see the job log above."
          exit 1

  # Persists ffmpeg-validate's object-reconstruction numbers to the same
  # quality-history branch, a different file again
  # (object-quality-<branch>.jsonl, read by docs/object-quality-trend.md).
  # A separate job from persist-external-comparison-trend beside it rather
  # than a second step inside it: the two write different files with
  # different regression thresholds and either can fail on its own, and
  # keeping them apart means an object regression fails a job named for
  # object quality. Both push to the same branch, so both take the same
  # fetch-checkout-commit-push shape and a concurrent push from the other is
  # handled the same way it already is between this job and
  # persist-performance-trend: one CI run, one commit each, sequenced by the
  # remote.
  #
  # No manifest argument, unlike the external-comparison job: there is no
  # external baseline for object decode and there cannot be one - see
  # tools/ci/append_object_quality_history.py's own header.
  persist-object-quality-trend:
    name: Publish object-reconstruction quality trend
    needs: ffmpeg-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # persist-credentials: false - same reasoning as every other persist-*
      # job's identical checkout: this working tree is only read from (the
      # append script, `git show` on this commit); the "Prepare
      # quality-history checkout" step below pushes through its own
      # explicitly-scoped remote instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download object-reconstruction quality
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: object-reconstruction-quality
          path: results

      # Same mechanic as the other persist-* jobs' identical step: plain git
      # over an HTTPS remote carrying the token, not actions/checkout, which
      # fails outright if quality-history does not exist yet.
      - name: Prepare quality-history checkout
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          mkdir -p history
          cd history
          if git ls-remote --exit-code --heads "$remote" quality-history >/dev/null 2>&1; then
            git init -q
            git remote add origin "$remote"
            git fetch -q origin quality-history
            git checkout -q quality-history
          else
            git init -q -b quality-history
            git remote add origin "$remote"
            git commit -q --allow-empty -m "Initialize quality-history branch"
          fi

      - name: Append object-quality history
        id: append
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          commit_date="$(git show -s --format=%cI "$COMMIT_SHA")"
          python3 tools/ci/append_object_quality_history.py \
            --objects-json results/objects.json \
            --history-dir history \
            --branch "$BRANCH" \
            --commit "$COMMIT_SHA" \
            --commit-date "$commit_date"

      - name: Commit and push object-quality-history update
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd history
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -q -m "Object-quality trend: ${BRANCH}@${COMMIT_SHA}"
            # Four trend publishers (quality, performance,
            # external-comparison, object-quality) share this one branch and
            # routinely finish within seconds of each other, so losing the
            # push race is an expected outcome rather than an error - it is
            # what "! [rejected] (fetch first)" on main means. Each writes its
            # own data file, so rebasing onto whichever sibling won is
            # conflict-free; only a genuine conflict stops the retry.
            pushed=""
            for attempt in 1 2 3 4 5; do
              if git push -q origin quality-history 2>/dev/null; then
                pushed=yes
                break
              fi
              echo "push rejected (attempt ${attempt}); rebasing onto origin/quality-history"
              git fetch -q origin quality-history
              git rebase -q origin/quality-history
              sleep $(( (RANDOM % 5) + 1 ))
            done
            if [ -z "${pushed}" ]; then
              echo "::error::could not push quality-history after 5 attempts"
              exit 1
            fi
          fi

      # Deliberately after the push above, not instead of the append step
      # failing outright - same reasoning as every other persist-* job's
      # identical hard-regression step.
      - name: Fail on hard object-quality regression
        if: steps.append.outputs.hard_regression == 'true'
        shell: bash
        run: |
          echo "::error::An object's SNR dropped at least 5 dB below its trailing average - see the job log above."
          exit 1

  # Branch protection points at this one check rather than at each matrix leg,
  # so adding or renaming a leg does not need the protection rule updated.
  # Experimental legs cannot reach it: continue-on-error means the reusable
  # workflow reports success even when one of them fails.
  ci-status:
    name: CI Status
    if: always()
    needs: [ branch-name, no-quarantine, changes, platform-macros, packaging-consistency, fixture-corpus, script-lint, static-analysis, coverage, adm-validate, build-and-test, ffmpeg-validate, performance-gate, persist-performance-trend, persist-external-comparison-trend, persist-object-quality-trend ]
    # Control-plane job, same vars.CONTROL_RUNNER_JSON routing and kill
    # switch as check-runner above. This is the required check every PR
    # waits on LAST - when the hosted pool is saturated, a run whose every
    # real job passed still reported nothing for hours because this
    # seconds-long aggregator was queued behind build legs (PR #447,
    # 2026-08-28). No checkout, no untrusted code - the fork guard is
    # consistency, not necessity.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && fromJSON('["ubuntu-latest"]') || fromJSON(vars.CONTROL_RUNNER_JSON || '["ubuntu-latest"]') }}
    steps:
      - name: Gate on required job results
        shell: bash
        env:
          # 'skipped' on a push (no PR head to name), which is a pass.
          R_BRANCH: ${{ needs.branch-name.result }}
          R_QUARANTINE: ${{ needs.no-quarantine.result }}
          R_CHANGES: ${{ needs.changes.result }}
          R_MACROS: ${{ needs.platform-macros.result }}
          R_PACKAGING: ${{ needs.packaging-consistency.result }}
          R_CORPUS: ${{ needs.fixture-corpus.result }}
          R_SCRIPTLINT: ${{ needs.script-lint.result }}
          # 'skipped' on a docs-only change, which is a pass, not a failure.
          R_TIDY: ${{ needs.static-analysis.result }}
          R_COVERAGE: ${{ needs.coverage.result }}
          R_ADM: ${{ needs.adm-validate.result }}
          R_BUILD: ${{ needs.build-and-test.result }}
          R_FFMPEG: ${{ needs.ffmpeg-validate.result }}
          # 'skipped' on a push and on a docs-only PR (performance-compare
          # itself is gated on `changes`), which is a pass.
          R_PERF_GATE: ${{ needs.performance-gate.result }}
          # 'skipped' on every PR and every push off main (its own
          # `if`) - a pass, not a failure, same as R_TIDY/R_COVERAGE above.
          R_PERF_TREND: ${{ needs.persist-performance-trend.result }}
          R_EXT_TREND: ${{ needs.persist-external-comparison-trend.result }}
          R_OBJ_TREND: ${{ needs.persist-object-quality-trend.result }}
        run: |
          set -euo pipefail
          fail=0
          for pair in "branch-name:$R_BRANCH" "no-quarantine:$R_QUARANTINE" \
                      "changes:$R_CHANGES" "platform-macros:$R_MACROS" \
                      "packaging-consistency:$R_PACKAGING" \
                      "fixture-corpus:$R_CORPUS" \
                      "script-lint:$R_SCRIPTLINT" \
                      "static-analysis:$R_TIDY" "coverage:$R_COVERAGE" \
                      "adm-validate:$R_ADM" \
                      "build-and-test:$R_BUILD" "ffmpeg-validate:$R_FFMPEG" \
                      "performance-gate:$R_PERF_GATE" \
                      "persist-performance-trend:$R_PERF_TREND" \
                      "persist-external-comparison-trend:$R_EXT_TREND" \
                      "persist-object-quality-trend:$R_OBJ_TREND"; do
            job="${pair%%:*}"; result="${pair#*:}"
            echo "  $job: $result"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::$job reported '$result'."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "CI failed - see the failing job(s) above."
            exit 1
          fi
          echo "All required CI jobs passed or were skipped."
