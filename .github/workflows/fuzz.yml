# ac3forge fuzzing. Six jobs. Five of them share the libFuzzer harnesses in
# fuzz/, and all but fuzz-adm-nightly mutate an ALREADY-ENCODED bitstream -
# they ask whether the DECODER survives corrupt input. The sixth
# (encoder-space-nightly) asks the opposite question, about the ENCODER, and
# shares none of that machinery; see its own comment below.
#
#   fuzz-regress       Replays fuzz/seeds/ and fuzz/regressions/ with -runs=0
#                      (no mutation) - a correctness gate: every regression
#                      corpus entry must still not crash. Seconds, not
#                      minutes; runs on every push/PR to main and is
#                      NOT experimental - a regression here means a fixed bug
#                      came back.
#   fuzz-short         A bounded mutation budget (60s/target, ~8 minutes
#                      total), push only, so pull requests are not slowed by
#                      it. Required, not experimental (roadmap VX13) - see
#                      that item for the track record this rests on.
#   fuzz-differential  Same mutation approach, over the two differential
#                      harnesses only (fuzz_differential_ac3_decode,
#                      fuzz_differential_eac3_decode - roadmap G3): decodes
#                      each mutated frame with BOTH ac3forge's own decoder
#                      and FFmpeg, and diffs the PCM, instead of only
#                      checking for a crash. Push only, its own 60s/target
#                      budget - see fuzz/differential_oracle.hpp for what
#                      counts as a reportable divergence versus expected
#                      disagreement on a malformed frame, and why this job is
#                      separate rather than folded into fuzz-short (it needs
#                      ffmpeg on PATH and is much slower per-exec, a real
#                      FFmpeg process per comparable input). Required, not
#                      experimental (roadmap VX13).
#   fuzz-nightly       A longer bounded mutation budget (10 min/target by
#                      default) on a daily schedule, plus workflow_dispatch
#                      for an on-demand deeper run with a custom budget. Since
#                      roadmap VX13 this ALSO runs the two differential
#                      harnesses at the same deeper budget (they stay out of
#                      the base BASE_TARGETS list run.sh drives here, same as
#                      fuzz-differential above, so they get their own ffmpeg
#                      install and regression replay). fuzz/corpus/ persists
#                      across runs via actions/cache instead of restarting
#                      from the seed corpus every night - see the job's own
#                      cache step for the growing-key pattern this needs
#                      (cache entries are immutable, so there is no such thing
#                      as "update the existing one").
#   fuzz-adm-nightly   fuzz_adm_parse on its own, same daily schedule. Its own
#                      job because it is the only harness here that is not
#                      built by default: ac3adm needs vcpkg's "adm" feature
#                      for libadm's Boost headers plus network access for the
#                      FetchContent pulls of libbw64 and libadm, none of which
#                      the four jobs above touch at all. Folding it into
#                      fuzz-short would put a vcpkg restore and two source
#                      fetches in front of every push's crash-only run for one
#                      opt-in harness.
#   encoder-space-     The ENCODER's input space rather than the decoder's:
#   nightly            random legal encoder configurations crossed with
#                      adversarial PCM, every resulting stream held against
#                      both this project's decoder and FFmpeg's strict decode.
#                      Both encoders: tools/ci/fuzz_encoder_space.py for AC-3
#                      and tools/ci/fuzz_eac3_encoder_space.py for E-AC-3
#                      (roadmap VX1 - Annex E tool tokens, fscod2 half rates,
#                      VBR, the layouts needing dependent substreams, Atmos
#                      object counts). They share a PCM generator and nothing
#                      else; the E-AC-3 half additionally classifies each case
#                      by what FFmpeg can read, since it cannot read a second
#                      dependent substream, enhanced coupling, transient
#                      pre-noise or fscod2 audio, and holds those cells
#                      against ffprobe's syncframe walk instead.
#                      Not a libFuzzer target and not part of fuzz/run.sh - it
#                      drives the real ac3cli, so it builds the CLI the way
#                      ci.yml's ffmpeg-validate job does rather than the
#                      sanitizer/libFuzzer toolchain the other four need. The
#                      short per-PR counterpart is a step in that same
#                      ffmpeg-validate job, not a job here, because everything
#                      it needs is already built and pinned there.
#                      See tools/ci/fuzz_encoder_space.py for why this exists:
#                      an encoder defect (PR #186) that produced streams BOTH
#                      decoders reject, and that every other gate in this repo
#                      missed because reaching it needs a specific input SHAPE
#                      no hand-written matrix would enumerate.
#
# This is a bounded, time-boxed run, not continuous (OSS-Fuzz-style) fuzzing
# infrastructure - see fuzz/README.md.
#
# fuzz-regress, fuzz-short and fuzz-nightly cover every harness in
# fuzz/run.sh's default list, which as of roadmap UX4 is ten: the four
# original entry points, fuzz_iec61937_unwrap (roadmap IO3),
# fuzz_emdf_parse, fuzz_oamd_parse, fuzz_joc_parse, fuzz_signing_verify over
# the object and metadata layer, and fuzz_osc_parse over the live
# object-position listener's OSC 1.0 parser - this project's first
# network-facing input rather than a bitstream one (docs/threat-model.md).
# They need no per-job wiring - run.sh owns the list, and a new entry there
# is picked up by all three at once.
#
# All five run in the same ubuntu:26.04 + LLVM 22 container ci.yml's
# linux-llvm leg uses. The harnesses build under the same strict `ac3::warnings`
# set (-Werror included) as every other target - the fuzz build used to be the
# one exception, on the assumption it carried a sign-conversion/double-promotion
# debt, but a recount found zero such sites and the exemption was removed.
# fuzz-nightly and fuzz-adm-nightly stay marked experimental on their own
# merits: neither has multiple clean fuzzing runs behind it yet, which is a
# question of track record rather than of anything the compiler can check.
# fuzz-short and fuzz-differential were promoted (roadmap VX13, 2026-08-25):
# fuzz-differential's job history had zero failures across every push run
# since 2026-08-09, the bar this project's own roadmap set for it.
# fuzz-short's history over the same window was NOT clean - five real
# UndefinedBehaviorSanitizer reports in fuzz_mp4_demux, all the same root
# cause (a box using ISOBMFF's 64-bit largesize escape could make
# mp4::Reader's parse position wrap past its sliding window, underflowing the
# next offset computation) - fixed in the same PR that promoted this job,
# with the crash minimised into fuzz/regressions/fuzz_mp4_demux/. Promote a
# job again the same way: delete its `continue-on-error: true` line.
#
# fuzz-differential additionally installs `ffmpeg` - the same package the
# gold_reference/sanitizer legs of .github/workflows/_build.yml already
# install on Linux, and for the same reason (an independent decode oracle).
# fuzz-adm-nightly additionally sets up vcpkg. The other three jobs have no
# such dependency: their harnesses only ever call into ac3::forge and
# ac3::signing, both of which are in-tree and dependency-free.
#
# VCPKG_ROOT: fuzz/run.sh reads it directly to place the toolchain file (see
# its configure_and_build), rather than going through a CMake preset the way
# encoder-space-nightly does - setup-vcpkg exports it, so nothing extra is
# needed here beyond that action.
#
# Deliberately its own workflow rather than folded into ci.yml's build-and-test
# matrix or its ci-status gate: fuzz-regress is cheap enough to make required
# in branch protection once it has proven itself, but that is a repository
# setting, not something this file can declare on its own.
name: Fuzz

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # 03:17 UTC - an off-the-hour time so a future second scheduled workflow
    # does not contend with this one for the same runner-queue instant.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seconds_per_target:
        description: "Mutation budget per harness, in seconds"
        type: number
        default: 600
      encoder_space_seconds:
        description: "AC-3 encoder input-space budget, in seconds"
        type: number
        default: 900
      eac3_encoder_space_seconds:
        description: "E-AC-3 encoder input-space budget, in seconds"
        type: number
        default: 900

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Single source of truth for encoder-space-nightly's vcpkg pin below - see
  # docs/ci-self-hosted-runners.md and _toolchain-versions.yml's own header.
  toolchain-versions:
    uses: ./.github/workflows/_toolchain-versions.yml
    permissions:
      contents: read
      actions: read
    secrets:
      ORG_RUNNERS_TOKEN: ${{ secrets.ORG_RUNNERS_TOKEN }}

  fuzz-regress:
    name: Fuzz Regress (seeds + regression corpus, no mutation)
    runs-on: ubuntu-latest
    # vars.PAUSE_NONESSENTIAL_CI: a temporary, reversible-by-variable pause on
    # non-required PR-time checks during a merge-queue drain, freeing hosted
    # runner concurrency for the checks that actually gate merging (see
    # .github/branch-protection.md's required list, which this is not on).
    # push:main/schedule runs are untouched. Clear/remove the variable to
    # revert - no code change needed.
    if: github.event_name != 'pull_request' || vars.PAUSE_NONESSENTIAL_CI != 'true'
    container: ubuntu:26.04
    steps:
      - name: Bootstrap container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates cmake curl git gnupg lsb-release \
            ninja-build pkg-config software-properties-common tar unzip wget zip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Also installs libclang-rt-${LLVM_VERSION}-dev (ASan/UBSan/libFuzzer's
      # static runtime archives) unconditionally - see that package's own
      # comment in the script - so fuzzing needs no separate install step for
      # it.
      - name: Install LLVM 22
        run: bash .github/toolchain/03-llvm-toolchain.sh

      - name: Replay seeds + regression corpus (no mutation)
        run: bash fuzz/run.sh regress

  fuzz-short:
    name: Fuzz Short (bounded mutation, push only)
    if: github.event_name == 'push'
    needs: fuzz-regress
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      AC3FORGE_FUZZ_SECONDS: 60
    steps:
      - name: Bootstrap container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates cmake curl git gnupg lsb-release \
            ninja-build pkg-config software-properties-common tar unzip wget zip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install LLVM 22
        run: bash .github/toolchain/03-llvm-toolchain.sh

      - name: Fuzz (bounded mutation budget)
        run: bash fuzz/run.sh run

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-short-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  fuzz-differential:
    name: Fuzz Differential (ac3forge vs FFmpeg PCM diff, bounded mutation, push only)
    if: github.event_name == 'push'
    needs: fuzz-regress
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      AC3FORGE_FUZZ_SECONDS: 60
    steps:
      - name: Bootstrap container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates cmake curl git gnupg lsb-release \
            ninja-build pkg-config software-properties-common tar unzip wget zip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install LLVM 22
        run: bash .github/toolchain/03-llvm-toolchain.sh

      # The differential harnesses' own oracle (fuzz/differential_oracle.hpp
      # shells out to it at run time) - the same package
      # .github/workflows/_build.yml's gold_reference/sanitizer legs already
      # install on Linux, for the same reason.
      - name: Install ffmpeg
        run: apt-get install -y -qq --no-install-recommends ffmpeg

      # Cheap correctness gate first, same shape as fuzz-regress above: any
      # divergence a past run minimized into fuzz/regressions/ must still
      # not reproduce before spending the mutation budget below.
      - name: Replay differential regression corpus (no mutation)
        run: bash fuzz/run.sh regress fuzz_differential_ac3_decode fuzz_differential_eac3_decode

      - name: Fuzz differential (bounded mutation budget)
        run: bash fuzz/run.sh run fuzz_differential_ac3_decode fuzz_differential_eac3_decode

      - name: Upload divergent/crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-differential-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  fuzz-nightly:
    name: Fuzz Nightly (deeper bounded mutation)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    continue-on-error: true  # experimental - see the header comment
    env:
      AC3FORGE_FUZZ_SECONDS: ${{ github.event.inputs.seconds_per_target || 600 }}
    steps:
      - name: Bootstrap container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates cmake curl git gnupg lsb-release \
            ninja-build pkg-config software-properties-common tar unzip wget zip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install LLVM 22
        run: bash .github/toolchain/03-llvm-toolchain.sh

      # The differential harnesses' own oracle - see fuzz-differential above
      # for why this is a separate install rather than part of the container
      # bootstrap every job here pays for.
      - name: Install ffmpeg
        run: apt-get install -y -qq --no-install-recommends ffmpeg

      # fuzz/corpus/ is gitignored and, without this, starts empty on every
      # run - roadmap VX13: a cache entry is immutable once written, so
      # there is no "update the existing one", only "restore the newest
      # prior one, then always write a new one keyed by this run". The
      # restore-keys prefix match picks up last night's entry (or the newest
      # one still within the repo's cache eviction window) even though
      # today's key has never been seen before.
      - name: Restore grown fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-nightly-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-nightly-

      - name: Fuzz (deeper bounded mutation budget)
        run: bash fuzz/run.sh run

      # Its own regression replay first, same shape as fuzz-differential -
      # not part of BASE_TARGETS, so fuzz-regress above never covers it.
      - name: Replay differential regression corpus (no mutation)
        run: bash fuzz/run.sh regress fuzz_differential_ac3_decode fuzz_differential_eac3_decode

      - name: Fuzz differential (deeper bounded mutation budget)
        run: bash fuzz/run.sh run fuzz_differential_ac3_decode fuzz_differential_eac3_decode

      # Runs whether or not a target crashed above - a night that found a
      # crash still grew the corpus for every OTHER target, and losing that
      # growth would make the next run repeat tonight's work.
      - name: Save grown fuzz corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-nightly-${{ github.run_id }}

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-nightly-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # fuzz_adm_parse on its own - see this file's header for why it is not
  # folded into fuzz-short/fuzz-nightly. Toolchain-wise it is those jobs plus
  # vcpkg: the same ubuntu:26.04 + LLVM 22 + sanitizer runtime archives, with
  # the vcpkg pin encoder-space-nightly already uses added so libadm's Boost
  # headers resolve. AC3FORGE_FUZZ_ADM makes fuzz/run.sh turn
  # AC3FORGE_BUILD_ADM and -DVCPKG_MANIFEST_FEATURES=adm on and append the
  # harness to its default list; naming the harness explicitly here as well
  # keeps this job to that one target regardless.
  #
  # Scheduled/dispatch only, not on push: a vcpkg restore plus the
  # FetchContent pulls of libbw64 and libadm cost more than the mutation
  # budget itself, and unlike the other harnesses most of what this one
  # reaches is third-party code (see fuzz/README.md's "The ADM harness is
  # opt-in").
  fuzz-adm-nightly:
    name: Fuzz ADM Nightly (BW64 container + ADM XML)
    needs: toolchain-versions
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    continue-on-error: true  # experimental - see the header comment
    env:
      AC3FORGE_FUZZ_ADM: 1
      AC3FORGE_FUZZ_SECONDS: ${{ github.event.inputs.seconds_per_target || 600 }}
    steps:
      - name: Bootstrap container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates cmake curl git gnupg lsb-release \
            ninja-build pkg-config software-properties-common tar unzip wget zip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install LLVM 22
        run: bash .github/toolchain/03-llvm-toolchain.sh

      - uses: ./.github/actions/setup-vcpkg
        with:
          vcpkg-commit: ${{ needs.toolchain-versions.outputs.vcpkg_commit }}

      # Cheap correctness gate first, same shape as fuzz-regress: the seed and
      # regression corpora must replay clean before any budget is spent.
      - name: Replay ADM seeds + regression corpus (no mutation)
        run: bash fuzz/run.sh regress fuzz_adm_parse

      - name: Fuzz ADM (bounded mutation budget)
        run: bash fuzz/run.sh run fuzz_adm_parse

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-adm-nightly-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # The deeper half of the encoder input-space search - see this file's header
  # for what it is and why it shares nothing with the four jobs above. Its
  # bounded per-PR counterpart is a step in ci.yml's ffmpeg-validate job.
  #
  # Toolchain-wise this is ffmpeg-validate, not a fuzzing job: LLVM plus vcpkg
  # plus a pinned ffmpeg, building the plain linux-llvm preset. No sanitizer
  # runtime archives, no libFuzzer, no fuzz/run.sh - the search happens in
  # Python, against the real CLI, and the failure signal is a decoder refusing
  # a stream rather than a sanitizer report.
  #
  # ffmpeg is pinned to the same exact ubuntu:26.04 archive build ffmpeg-
  # validate pins, and for the same reason: an oracle whose behaviour drifts
  # under the gate it backs is not an oracle.
  encoder-space-nightly:
    name: Encoder Space Nightly (random legal configs x adversarial audio)
    needs: toolchain-versions
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      AC3CLI: build/config-linux-llvm/bin/ac3cli
      ENCODER_SPACE_SECONDS: ${{ github.event.inputs.encoder_space_seconds || 900 }}
      EAC3_ENCODER_SPACE_SECONDS: ${{ github.event.inputs.eac3_encoder_space_seconds || 900 }}
    steps:
      - name: Bootstrap container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates cmake curl git gnupg lsb-release \
            ninja-build pkg-config python3 software-properties-common \
            tar unzip wget zip \
            ffmpeg=7:8.0.1-3ubuntu2

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install LLVM ${{ needs.toolchain-versions.outputs.llvm_version }}
        run: bash .github/toolchain/03-llvm-toolchain.sh

      - uses: ./.github/actions/setup-vcpkg
        with:
          vcpkg-commit: ${{ needs.toolchain-versions.outputs.vcpkg_commit }}

      - name: Report ffmpeg version
        run: ffmpeg -version | head -1

      - name: Configure
        run: cmake --preset config-linux-llvm

      - name: Build ac3cli
        run: cmake --build --preset build-linux-llvm --target ac3cli -- -k 0

      # First, because a run that draws configurations the encoder was never
      # going to accept would come back green having encoded almost nothing.
      - name: Acceptance envelope (the rate floors the generator draws from)
        run: python3 tools/ci/fuzz_encoder_space.py --check-envelope

      - name: Encoder input-space fuzz (deeper budget, both decoders)
        run: python3 tools/ci/fuzz_encoder_space.py --seconds "$ENCODER_SPACE_SECONDS"

      # The E-AC-3 half (roadmap VX1). Its own envelope first, for the same
      # reason the AC-3 one runs first, plus the oracle model: the gap table
      # decides which cells get an FFmpeg decode and which get the framing
      # oracle instead, so a stale entry silently narrows what the deeper run
      # below actually checks.
      - name: E-AC-3 encoder oracle model (what this FFmpeg can actually read)
        run: python3 tools/ci/fuzz_eac3_encoder_space.py --check-oracles

      - name: E-AC-3 encoder acceptance envelope (rate floors + the frmsiz ceiling)
        run: python3 tools/ci/fuzz_eac3_encoder_space.py --check-envelope

      - name: E-AC-3 encoder input-space fuzz (deeper budget, both decoders)
        run: >
          python3 tools/ci/fuzz_eac3_encoder_space.py
          --seconds "$EAC3_ENCODER_SPACE_SECONDS"

      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: encoder-space-nightly-artifacts
          path: |
            fuzz-encoder-artifacts/
            fuzz-eac3-encoder-artifacts/
          if-no-files-found: ignore
