version: 2
updates:
  # GitHub Actions used by ci.yml/_build.yml/release.yml + the composite
  # actions under .github/actions/. Dependabot has no vcpkg ecosystem, so the
  # C++ dependencies (vcpkg.json, plus the {fmt} pins in cmake/Fmt.cmake and
  # packaging/conan/conanfile.py) are NOT tracked here, and osv-scanner.yml
  # does not cover them either: it reads no vcpkg, CMake or Conan file.
  - package-ecosystem: "github-actions"
    directory: "/"
    # Trunk-based: every topic branch, Dependabot's included, targets main
    # directly - there is no separate integration branch to point at.
    target-branch: "main"
    schedule:
      interval: "weekly"
    # Wait a week after a new action version is published before opening a PR
    # for it - gives the community time to catch a compromised release before
    # this repo auto-updates to it.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # main's branch protection is strict (requires the PR branch to be
    # up to date before merging - see .github/branch-protection.md), and
    # dependabot-auto-merge.yml relies on Dependabot itself to rebase this
    # PR whenever main moves ahead so the auto-merge it enables can
    # actually land. "auto" is the default, made explicit here since
    # correctness of the auto-merge workflow depends on it.
    rebase-strategy: "auto"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # CI/docs/lint Python locks under requirements/ (pip-compile --generate-hashes).
  - package-ecosystem: "pip"
    directory: "/requirements"
    target-branch: "main"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    commit-message:
      prefix: "build"

  # Sendspin Python reference/test harness (aiosendspin + its transitive deps).
  # Not caught by the /requirements entry above - different directory - which
  # is how aiohttp/idna drifted to CVE-laden versions unnoticed; osv-scanner.yml
  # is what actually surfaced it (see code-scanning alert history, 2026-09).
  - package-ecosystem: "pip"
    directory: "/tools/sendspin"
    target-branch: "main"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    commit-message:
      prefix: "build"

  # WASM demo TypeScript toolchain (js/) and browser test deps (apps/wasm/tests/).
  - package-ecosystem: "npm"
    directory: "/js"
    target-branch: "main"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    commit-message:
      prefix: "build"

  - package-ecosystem: "npm"
    directory: "/apps/wasm/tests"
    target-branch: "main"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    commit-message:
      prefix: "build"

  # Rust bindings build tooling (bindgen, etc.) - not a shipped artifact.
  - package-ecosystem: "cargo"
    directory: "/rust"
    target-branch: "main"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    commit-message:
      prefix: "build"

  # Shield Android app. Previously untracked by Dependabot entirely - the
  # gap that let apps/android/app/gradle.lockfile carry a CVE-flagged
  # protobuf-kotlin unnoticed (osv-scanner.yml is what actually caught it).
  - package-ecosystem: "gradle"
    directory: "/apps/android"
    target-branch: "main"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    commit-message:
      prefix: "build"
