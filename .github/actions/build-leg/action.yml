name: Build leg
description: >-
  Toolchain assert, vcpkg setup, and the configure/build/test sequence every
  _build.yml matrix leg runs - extracted ahead of the CI lane partitions plan
  (docs/ci-lanes.md) so splitting _build.yml into one reusable workflow per
  platform does not duplicate this ~170-line sequence into each of them.
  Composite action steps execute in the calling job's own runner and
  workspace, not a sandboxed one, so build/config-<preset> lands on disk
  exactly as it did as inline steps and every step _build.yml still runs
  after this one - the Crucible checks, the gold-reference gate, the GUI
  smoke test - keeps reading it the same way.

inputs:
  preset:
    description: "matrix.preset - the toolchain-preset suffix (config-/build-/test-<preset>)."
    required: true
  gui:
    description: "matrix.gui, as GitHub Actions renders an unset matrix field ('' or 'true'). Adds -DAC3FORGE_BUILD_GUI=ON to Configure."
    default: ""
  crucible:
    description: "matrix.crucible, same shape as gui. Adds -DAC3FORGE_BUILD_CRUCIBLE=ON to Configure, on Windows/macOS only."
    default: ""
  version-tag:
    description: "The reusable workflow's own version_tag input, threaded into Configure as DERIVED_VERSION_OVERRIDE."
    default: ""
  gcc-version:
    description: "needs.toolchain-versions.outputs.gcc_version, for the toolchain assert."
    required: true
  llvm-version:
    description: "needs.toolchain-versions.outputs.llvm_version, for the toolchain assert."
    required: true
  msvc-toolset:
    description: "needs.toolchain-versions.outputs.msvc_toolset, for the toolchain assert."
    required: true
  cmake-min:
    description: "needs.toolchain-versions.outputs.cmake_min, for the toolchain assert."
    required: true
  vcpkg-commit:
    description: "needs.toolchain-versions.outputs.vcpkg_commit, forwarded to ./.github/actions/setup-vcpkg."
    required: true
  ccache:
    description: >-
      'true' routes every C and C++ compile through ccache and restores its
      cache from GitHub's cache service, where a main-branch run saved it (see
      ccache-save). Off by default, so a leg that has not asked for it builds
      exactly as it always did. Nothing in this repository turned ccache on
      before this input existed, and every Linux leg builds in a fresh
      container, so each job compiled the whole tree from scratch.
    default: "false"
  ccache-save:
    description: >-
      'true' saves the ccache directory after the leg when this run added
      objects to it. Only main-branch runs should set it. Pull-request and
      queue runs restore and never save: cache entries are immutable and
      evicted least-recently-used against a 10 GB repository budget, so a burst
      of pushes that each saved a copy would push out the one entry every other
      run restores from.
    default: "false"
  ccache-size:
    description: "ccache's own size cap for the leg (CCACHE_MAXSIZE). The saved entry is the compressed directory."
    default: "2G"
  ccache-save-min-misses:
    description: >-
      A saving run uploads the cache only when it compiled at least this many
      objects the restored cache did not have. A push that changed two files is
      not worth a gigabyte upload, and the next run restoring the older entry
      just compiles those two again. The drift accumulates: once enough changes
      have piled up, the run that compiles them all saves.
    default: "25"
  ctest-jobs:
    description: >-
      Empty (the default) runs ctest serially, exactly as before. A number, or
      'auto' for the runner's CPU count, runs the Catch2 cases in parallel. The
      Qt Quick suites (`_qml_tests_`) then run one at a time, as a precaution
      (they are timing-sensitive UI tests), and the throughput guards (label
      Performance) run alone after that, because a real-time assertion measured
      beside eight other tests measures the neighbours. A failing test is retried
      once (`--repeat until-pass:2`) and the run says so, so a collision between
      tests cannot block a merge unseen. Failures are summarised on the run's
      summary page with the command that reproduces each.
    default: ""

runs:
  using: composite
  steps:
    # CMakePresets.json declares the project's real minimum (cmakeMinimumRequired);
    # this asserts the RUNNER actually meets it rather than letting a stale image
    # fail later with a confusing "unknown preset field" error. gcc/llvm/msvc are
    # asserted the same way, all against the pins toolchain-versions resolved -
    # see docs/ci-self-hosted-runners.md.
    - name: Report and assert toolchain versions
      shell: bash
      env:
        GCC_VERSION: ${{ inputs.gcc-version }}
        LLVM_VERSION: ${{ inputs.llvm-version }}
        MSVC_TOOLSET: ${{ inputs.msvc-toolset }}
        CMAKE_MIN: ${{ inputs.cmake-min }}
        LEG_PRESET: ${{ inputs.preset }}
      run: |
        set -euo pipefail
        cmake --version
        ninja --version
        # Let CMake do its own version comparison rather than parsing it in sh.
        # Unquoted heredoc so $CMAKE_MIN expands - \$CMAKE_VERSION stays escaped
        # so it's still CMake's own variable, not a (unset) shell one.
        cat > "${RUNNER_TEMP}/assert-cmake-version.cmake" <<EOF
        if(CMAKE_VERSION VERSION_LESS ${CMAKE_MIN})
          message(FATAL_ERROR "CMake \${CMAKE_VERSION} is too old; ac3forge needs >= ${CMAKE_MIN}")
        endif()
        EOF
        cmake -P "${RUNNER_TEMP}/assert-cmake-version.cmake"
        case "$LEG_PRESET" in
          linux-gcc|linux-gcc-arm64)
                        g++ --version | head -1
                        g++ --version | head -1 | grep -q " ${GCC_VERSION}\." || { echo "::error::expected g++ ${GCC_VERSION}"; exit 1; } ;;
          linux-llvm|linux-llvm-arm64|linux-llvm-asan-ubsan)
                        clang++ --version | head -1
                        clang++ --version | head -1 | grep -qE "version ${LLVM_VERSION}\." || { echo "::error::expected clang ${LLVM_VERSION}"; exit 1; } ;;
          windows-llvm) clang-cl --version | head -1
                        clang-cl --version | head -1 | grep -qE "version ${LLVM_VERSION}\." || { echo "::error::expected clang-cl ${LLVM_VERSION}"; exit 1; } ;;
          windows-msvc)
                        echo "MSVC toolset: ${VCToolsVersion:-unknown}"
                        case "${VCToolsVersion:-}" in
                          ${MSVC_TOOLSET}*) ;;
                          *) echo "::error::expected an MSVC ${MSVC_TOOLSET}x toolset, got '${VCToolsVersion:-unset}'"; exit 1 ;;
                        esac ;;
          # Report-only, unlike windows-msvc above - confirmed empirically on
          # a real windows-11-arm run (2026-08-26): the hosted ARM64 image
          # ships an older VS Build Tools generation (14.44.35207, VS2022
          # ~17.14) than windows-latest's x64 image (14.5x, "VS 2026"/18.x),
          # so the ${MSVC_TOOLSET} pin - resolved against the x64 image - does
          # not hold here. The two runner images are maintained on separate
          # GitHub-side update cadences; asserting they stay in lockstep
          # isn't realistic yet. Same shape as macos-llvm's own case arm
          # below, and the same reasoning: report whatever toolset this
          # runner actually has rather than failing a leg still proving out
          # its own baseline. Revisit once GitHub's ARM64 image catches up -
          # or drops far enough behind to need its own pin.
          windows-msvc-arm64)
                        echo "MSVC toolset: ${VCToolsVersion:-unknown}" ;;
          # No hard version assert here unlike the other LLVM legs: Homebrew's
          # llvm formula has no versioned pin to check against (see the
          # install step's own comment), so this reports whatever it finds
          # rather than failing a leg that's still proving out its baseline.
          # Same for macos-llvm-x64 - identical toolchain install step, just
          # a different CPU architecture underneath.
          macos-llvm|macos-llvm-x64) c++ --version | head -1 ;;
        esac

    # ccache, when the caller asks for it. The settings that make a hit possible
    # across jobs are the non-default ones:
    #   - compiler_check=content: the default (mtime and size) keys on the
    #     compiler binary's file time, and every Linux job installs a fresh copy
    #     of the compiler into a fresh container, so the default would miss on
    #     every single compile of every job.
    #   - base_dir + no hash_dir: the checkout path is part of a compile's
    #     command line and debug info, and the workspace root differs between a
    #     hosted runner, a fleet runner and a container.
    #   - compression on: what gets saved is the compressed directory, and the
    #     10 GB repository cache budget is shared with vcpkg and every other leg.
    # The install is a no-op on the fleet images, which ship ccache.
    - name: Install and configure ccache
      if: inputs.ccache == 'true'
      shell: bash
      env:
        CCACHE_SIZE: ${{ inputs.ccache-size }}
      run: | # zizmor: ignore[github-env] CCACHE_DIR/CCACHE_BASEDIR are $HOME- and workspace-derived, not attacker-influenced
        set -euo pipefail
        if ! command -v ccache >/dev/null 2>&1; then
          case "$RUNNER_OS" in
            Linux)
              export DEBIAN_FRONTEND=noninteractive
              if command -v sudo >/dev/null 2>&1; then
                sudo apt-get install -y -qq --no-install-recommends ccache
              else
                apt-get install -y -qq --no-install-recommends ccache
              fi ;;
            macOS)   brew install ccache ;;
            Windows) choco install ccache -y --no-progress --requirechecksums ;;
          esac
        fi
        ccache --version | head -1
        cache_dir="$HOME/.cache/ccache"
        mkdir -p "$cache_dir"
        if command -v cygpath >/dev/null 2>&1; then
          cache_dir="$(cygpath -w "$cache_dir")"
        fi
        {
          echo "CCACHE_DIR=$cache_dir"
          echo "CCACHE_MAXSIZE=$CCACHE_SIZE"
          echo "CCACHE_COMPRESS=1"
          echo "CCACHE_COMPILERCHECK=content"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          echo "CCACHE_NOHASHDIR=1"
        } >> "$GITHUB_ENV"

    # Keyed by leg, OS and architecture only. What is inside is content-addressed
    # by ccache itself, so a different compiler or flag set simply misses; it
    # never returns a wrong object. The commit is in the key because entries are
    # immutable: a later save needs a new name, and `restore-keys` then finds the
    # newest one.
    - name: Restore the ccache cache
      if: inputs.ccache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-${{ inputs.preset }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ inputs.preset }}-${{ runner.os }}-${{ runner.arch }}-

    - name: Zero the ccache counters
      if: inputs.ccache == 'true'
      shell: bash
      run: ccache --zero-stats

    # Every build-leg caller installs the same set now: vcpkg's "hearth" feature is selected by
    # default via CMakePresets.json's "core" fragment, so there is no smaller/larger split among
    # these legs left to key apart. See setup-vcpkg's own cache-key-suffix description for why a
    # distinct key still matters for a job whose install set genuinely differs from this one -
    # adm-validate and hearth-validate (_ci-core.yml) each still pass their own.
    - uses: ./.github/actions/setup-vcpkg
      with:
        vcpkg-commit: ${{ inputs.vcpkg-commit }}

    # The presets carry everything: generator, compiler, Release, and
    # AC3FORGE_BUILD_GUI=OFF. The toolchain-preset system splits each leg into
    # config-/build-/test-<leg> (the bare <leg> is a hidden fragment), so the
    # matrix value is the suffix and each step names its own prefix. Running
    # `cmake --preset config-<leg>` locally reproduces CI exactly - EXCEPT
    # for two overrides bolted on here:
    #   - -DCMAKE_PREFIX_PATH wherever install-qt-action ran (every Windows
    #     leg except windows-msvc-arm64, and both macOS legs): it installs
    #     into a runner-specific path (QT_ROOT_DIR) that cmake/FindQt6.cmake's
    #     local search roots do not cover, so it has to be passed in
    #     explicitly rather than relying on auto-detection the way a local
    #     build does.
    #   - -DAC3FORGE_BUILD_GUI=ON on the `gui: true` Linux and macOS legs,
    #     which default the GUI off (see CMakePresets.json) so a machine
    #     that hasn't installed Qt still builds everything else.
    - name: Configure
      shell: bash
      # VERSION_TAG_INPUT goes through env:, not straight into the script
      # text, for the same reason release.yml's resolve-version job does -
      # a caller's version-tag is attacker-reachable via workflow_dispatch and
      # substituted directly it would be shell CODE, not data (zizmor:
      # template-injection). Empty by default (ordinary CI): GitVersionDerivation.cmake
      # then falls through to `git describe`, which finds nothing on this
      # leg's shallow checkout and stamps 0.0.0-dev - expected, see
      # _build.yml's `fetch_depth` input description.
      env:
        VERSION_TAG_INPUT: ${{ inputs.version-tag }}
        LEG_PRESET: ${{ inputs.preset }}
        LEG_GUI: ${{ inputs.gui }}
        LEG_CRUCIBLE: ${{ inputs.crucible }}
        LEG_CCACHE: ${{ inputs.ccache }}
      run: |
        set -euo pipefail
        extra_args=()
        # Through the launcher variables rather than a compiler wrapper on PATH,
        # so the preset's own compiler choice (gcc, clang, cl, clang-cl) is left
        # exactly as it is and ccache only ever sits in front of it.
        if [ "$LEG_CCACHE" = "true" ]; then
          extra_args+=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
        fi
        # QT_ROOT_DIR is only set when the caller's "Install Qt (prebuilt)" step
        # ran - every Windows leg except windows-msvc-arm64 (no Qt kit to point
        # at), and both macOS legs (gui: true). Guarded on the variable itself
        # rather than a RUNNER_OS check, because referencing an unset variable
        # under this script's `set -u` would otherwise fail the Configure step
        # outright on every leg that has no Qt kit at all (linux-gcc and
        # friends, windows-msvc-arm64).
        if [ -n "${QT_ROOT_DIR:-}" ]; then
          extra_args+=(-DCMAKE_PREFIX_PATH="$QT_ROOT_DIR")
        fi
        if [ "$LEG_GUI" = "true" ]; then
          extra_args+=(-DAC3FORGE_BUILD_GUI=ON)
        fi
        # OFF by default in CMakeLists.txt, so the legs that want it ask
        # here - on Windows and macOS, and not on Linux. On Linux this tree
        # selects the ALSA backend, which has no per-application concept at
        # all, and apps/crucible/CMakeLists.txt refuses that combination by
        # design rather than building a window that can list applications
        # and never capture one. Crucible's Linux build is the dedicated
        # pass further down in _build.yml, which installs the PipeWire
        # headers and configures its own tree with -DAC3FORGE_WITH_ALSA=OFF.
        #
        # macOS joins on 2026-09-06, and building is the whole point of it
        # there. The macOS platform half exists and has never been
        # compiled: no Mac took part in writing it, and these two legs are
        # the first compiler to see the Objective-C++, the Core Audio
        # selectors and the OBJCXX CMake. Nothing about it can be RUN in
        # CI - a hosted runner has no audio device, no desktop session and
        # no way to grant the tap's consent prompt - so what these legs
        # establish is that it compiles and links, which is exactly what
        # docs/crucible/design/promotion.md's Phase 5 sets as the exit condition
        # and exactly as far as its "What cannot be verified" table lets
        # anyone claim.
        if [ "$LEG_CRUCIBLE" = "true" ] && { [ "$RUNNER_OS" = "Windows" ] || [ "$RUNNER_OS" = "macOS" ]; }; then
          extra_args+=(-DAC3FORGE_BUILD_CRUCIBLE=ON)
        fi
        if [ -n "$VERSION_TAG_INPUT" ]; then
          extra_args+=(-DDERIVED_VERSION_OVERRIDE="$VERSION_TAG_INPUT")
        fi
        # Not "${extra_args[@]}" unguarded: macOS's /bin/bash is stuck on
        # 3.2 (GPLv2 was the last version Apple could ship), and 3.2's
        # `set -u` treats expanding a zero-element array as an unbound
        # variable - fixed upstream in bash 4.4, but not on this runner.
        # ${#extra_args[@]} (a length, not an element expansion) does not
        # trip the same bug on either version.
        if [ ${#extra_args[@]} -eq 0 ]; then
          cmake --preset "config-$LEG_PRESET"
        else
          cmake --preset "config-$LEG_PRESET" "${extra_args[@]}"
        fi

    # -k 0 so a first-time port sees every diagnostic in one run rather than
    # one-per-push. Warnings are errors on every compiler
    # (cmake/CompilerWarnings.cmake) and CI does not relax that.
    - name: Build
      shell: bash
      env:
        LEG_PRESET: ${{ inputs.preset }}
        CTEST_JOBS: ${{ inputs.ctest-jobs }}
      run: |
        set -euo pipefail
        if [ -z "$CTEST_JOBS" ]; then
          cmake --build --preset "build-$LEG_PRESET" -- -k 0
          exit 0
        fi
        # The gate keeps the output as well as printing it, so a failed build can
        # be summarised (see "Summarise the failure" below) instead of leaving an
        # agent to find the one compiler error in a thousand lines of ninja.
        cmake --build --preset "build-$LEG_PRESET" -- -k 0 2>&1 | tee "${RUNNER_TEMP}/build.log"

    # What the cache bought this run, on the run's summary page, and the miss
    # count the save step below keys off: a run that compiled nothing new has
    # nothing worth uploading.
    - name: ccache statistics
      id: ccache_stats
      if: ${{ !cancelled() && inputs.ccache == 'true' }}
      shell: bash
      env:
        SAVE_MIN_MISSES: ${{ inputs.ccache-save-min-misses }}
      run: |
        set -euo pipefail
        ccache --show-stats
        stats="$(ccache --print-stats)"
        ccstat() { printf '%s\n' "$stats" | awk -F'\t' -v k="$1" '$1 == k { print $2; found = 1 } END { if (!found) print 0 }'; }
        hits=$(( $(ccstat direct_cache_hit) + $(ccstat preprocessed_cache_hit) ))
        misses="$(ccstat cache_miss)"
        total=$(( hits + misses ))
        rate=0
        if [ "$total" -gt 0 ]; then rate=$(( 100 * hits / total )); fi
        save=false
        if [ "$misses" -ge "$SAVE_MIN_MISSES" ]; then save=true; fi
        {
          echo "misses=$misses"
          echo "worth_saving=$save"
        } >> "$GITHUB_OUTPUT"
        {
          echo "### ccache"
          echo
          echo "${hits} hits, ${misses} misses of ${total} cacheable compiles (${rate}% hit rate)."
        } >> "$GITHUB_STEP_SUMMARY"

    # AC3FORGE_REQUIRE_AVX2 turns tests/core/test_simd_kernels.cpp's [avx2]
    # probe case from a loud skip into a hard failure - only safe to set on
    # a leg pinned to `runner: '["ubuntu-latest"]'` in _build.yml's matrix
    # rather than the dynamic self-hosted/GitHub-hosted `matrix.runner` most
    # legs use, since self-hosted CPU features aren't documented anywhere in
    # this repo (see src/forge/src/internal/cpu/cpu_features.hpp) but
    # GitHub's own hosted Linux runners are AVX2-capable. This guarantees at
    # least one leg per PR where "the AVX2 path actually ran and passed" is
    # asserted, not just possible.
    - name: Test
      shell: bash
      env:
        LEG_PRESET: ${{ inputs.preset }}
        CTEST_JOBS: ${{ inputs.ctest-jobs }}
        AC3FORGE_REQUIRE_AVX2: ${{ inputs.preset == 'linux-llvm-asan-ubsan' && '1' || '' }}
      run: |
        set -euo pipefail
        if [ -z "$CTEST_JOBS" ]; then
          ctest --preset "test-$LEG_PRESET"
          exit 0
        fi
        # Three phases. The suite is 3,000+ cases, 96% of them under a second, and
        # ran serially for ten minutes.
        #
        # 1. Parallel, for the Catch2 cases. Every writing test folds its process
        #    id into its scratch directory (f85aff2cb), which is what makes
        #    running them side by side safe. A failing case is retried once and
        #    the retry is reported, so a collision that slipped through shows up
        #    as a warning instead of an unexplained red.
        # 2. One at a time, for the Qt Quick suites (ac3gui_, ac3hearth_ and
        #    ac3crucible_qml_tests_*), as a precaution. They drive a
        #    software-rendered window with mouse clicks and 5 to 10 second
        #    tryVerify windows, and a suite's own comments say a click can be
        #    lost while a delegate is rebuilt. Nothing has shown that running
        #    them beside other tests breaks them: the two Hearth suites that
        #    failed in this gate's first runs (settings_page and network_pairing)
        #    fail the same way on the fleet with serial ctest, on main itself.
        #    If a later run shows they are safe in parallel, drop this phase.
        # 3. Alone, for the throughput guards: a real-time assertion measured
        #    beside seven other tests measures them.
        jobs="$CTEST_JOBS"
        if [ "$jobs" = "auto" ]; then
          jobs="$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "${NUMBER_OF_PROCESSORS:-2}")"
        fi
        log="${RUNNER_TEMP}/ctest.log"
        : > "$log"
        rc=0
        ctest --preset "test-$LEG_PRESET" -j "$jobs" --repeat until-pass:2 -LE Performance -E '_qml_tests_' 2>&1 \
          | tee -a "$log" || rc=$?
        # --no-tests=ignore on the other two, since a preset may build no Qt
        # (the sanitizer legs) or no ac3perf target.
        ctest --preset "test-$LEG_PRESET" --repeat until-pass:2 -R '_qml_tests_' --no-tests=ignore 2>&1 \
          | tee -a "$log" || rc=$?
        ctest --preset "test-$LEG_PRESET" -L Performance --no-tests=ignore 2>&1 \
          | tee -a "$log" || rc=$?
        retried="$(grep -c '\*\*\*Failed' "$log" || true)"
        if [ "$rc" -eq 0 ] && [ "$retried" -gt 0 ]; then
          echo "::warning title=ctest::${retried} test attempt(s) failed and then passed on retry. Under -j$jobs that can be two tests sharing a resource; the ctest output above shows which."
        fi
        exit "$rc"

    # For an agent reading a red run: what failed and the command that reproduces
    # it, at the top of the run's summary page instead of somewhere in a
    # thousand-line log. A failed build (the compiler diagnostics and ninja's
    # FAILED: lines) or the failing test names, whichever this run has.
    - name: Summarise the failure
      if: ${{ failure() && inputs.ctest-jobs != '' }}
      shell: bash
      env:
        LEG_PRESET: ${{ inputs.preset }}
      run: |
        set -euo pipefail
        build_log="${RUNNER_TEMP}/build.log"
        test_log="${RUNNER_TEMP}/ctest.log"
        if [ -f "$build_log" ] && grep -q -E 'FAILED:|: error[ :]|error C[0-9]+|error LNK[0-9]+|undefined reference|ld returned' "$build_log"; then
          {
            echo "### Build errors"
            echo
            echo '```'
            grep -E 'FAILED:|: error[ :]|error C[0-9]+|error LNK[0-9]+|undefined reference|ld returned' "$build_log" | head -40
            echo '```'
            echo
            echo "Reproduce: \`cmake --preset config-${LEG_PRESET} && cmake --build --preset build-${LEG_PRESET}\`"
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ -f "$test_log" ] && grep -q 'The following tests FAILED:' "$test_log"; then
          {
            echo "### Failed tests"
            echo
            echo '```'
            sed -n '/The following tests FAILED:/,/^Errors while running CTest/p' "$test_log" | head -60
            echo '```'
            echo
            echo "Reproduce one: \`ctest --preset test-${LEG_PRESET} -R '<name>' --output-on-failure\`"
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    # Only when this run compiled enough the cache did not have (see
    # ccache-save-min-misses), and only when the caller says this is a
    # main-branch run (see ccache-save above). `!cancelled()` rather than
    # success(): a red Test step still leaves a valid cache, and the objects are
    # the expensive part.
    - name: Save the ccache cache
      if: ${{ !cancelled() && inputs.ccache == 'true' && inputs.ccache-save == 'true' && steps.ccache_stats.outputs.worth_saving == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-${{ inputs.preset }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
