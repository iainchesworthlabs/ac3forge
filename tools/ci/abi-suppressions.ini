# libabigail suppression specification for the abi-gate job's abidiff step
# (.github/workflows/ci.yml), the counterpart to check_abi_symbols.py's
# _STDLIB_MANGLED_PREFIXES.
#
# Why this exists. Every library here builds with CXX_VISIBILITY_PRESET
# hidden, but that does not extend to templates instantiated from system
# headers: a std::vector<ac3::Thing> or a unique_ptr<Impl> pulls a swarm of
# libstdc++ inline instantiations into the dynamic symbol table, and *which*
# ones land there shifts with the compiler, the libstdc++ version, and the
# inlining decisions of the day - none of it anything AC3FORGE_EXPORT
# controls or a consumer of this project's ABI can observe. Left unfiltered
# they swamp the report: on the 2026-08-27 run of PR #449 (a CI/docs-only
# change) abidiff emitted roughly 1050 entries across the six libraries, of
# which about 900 were std::/__gnu_cxx:: instantiations and 9 were real.
#
# PR #425 established exactly this filter for the allowlist step and the same
# reasoning applies here; this file is the abidiff half of that fix.
#
# Both matching properties are used on purpose:
#   - symbol_name_regexp matches the raw mangled ELF symbol. That is the
#     unambiguous form - a demangled function template shows its return type
#     ahead of its qualified name ("long std::__lg<long>(long)"), so a check
#     on demangled text would both miss those and wrongly exclude a real
#     project export whose signature merely mentions a std:: type (see
#     check_abi_symbols.py's own note on mp4::fragment).
#   - name_regexp matches libabigail's qualified name, which catches the
#     entities abidiff reports from debug info with no ELF symbol of their
#     own, and the vtable/typeinfo entries whose mangling (_ZTVNSt...) the
#     prefix list above does not cover.
#
# Scoped to std::/__gnu_cxx::/__cxxabiv1:: only. A project symbol whose
# signature merely *mentions* a std:: type is still reported, because the
# match is on the entity's own qualified name, not on its signature text -
# verified against a purpose-built pair of libraries before this landed
# (a removed ac3::joc::quantize and an added oba::joc::quantize both survive
# the filter while 27 std:: instantiations around them are dropped).

[suppress_function]
  name_regexp = ^(std|__gnu_cxx|__cxxabiv1)::

[suppress_variable]
  name_regexp = ^(std|__gnu_cxx|__cxxabiv1)::

[suppress_type]
  name_regexp = ^(std|__gnu_cxx|__cxxabiv1)::

[suppress_function]
  symbol_name_regexp = ^_Z(St|NSt|NKSt|N9__gnu_cxx|NK9__gnu_cxx|N11__cxxabiv1|TVN?S|TIN?S|TSN?S|GVN?S)

[suppress_variable]
  symbol_name_regexp = ^_Z(St|NSt|NKSt|N9__gnu_cxx|N11__cxxabiv1|TVN?S|TIN?S|TSN?S|GVN?S)
