# SonarCloud (SonarQube Cloud) project configuration, used by the nightly scan
# in .github/workflows/sonarcloud.yml. Organisation and project key as the
# project was actually onboarded (confirmed against SonarCloud's own API);
# note this org is NOT the one the sibling aqualink-automate repo analyses
# under, which is `iainchesworth` - the two are separate SonarCloud orgs.
sonar.organization=iainchesworthlabs
sonar.projectKey=iainchesworthlabs_ac3forge
sonar.projectName=ac3forge
sonar.sourceEncoding=UTF-8

# C and C++ files are analysed ONLY when they appear in the compile database
# the workflow passes via sonar.cfamily.compile-commands (the Linux
# config-linux-gcc-coverage build). The Kotlin, TypeScript/JS and Python trees
# need no build, so listing them here is enough.
sonar.sources=src,apps,examples,js,python,tools
sonar.tests=tests

# Trees that never enter a Linux compile database, so the C/C++ analyser would
# skip them with a warning anyway: the Qt GUI, the Windows-only demo app and
# ACX driver, and the NDK / Emscripten / bare-metal C++. Excluded explicitly to
# keep the scan log readable rather than to hide anything - each is built and
# tested by its own CI leg. Kotlin under apps/android IS analysed (it needs no
# compile database), which is why only that tree's cpp/ subdirectory is listed.
#
# docs/assets/wasm-decode-demo/ is a published copy of apps/wasm's demo, byte
# identical to its source - the same reasoning .github/codeql/codeql-config.yml
# gives for ignoring it there.
sonar.exclusions=\
  apps/gui/**,\
  apps/windows/**,\
  apps/android/app/src/main/cpp/**,\
  apps/wasm/**/*.cpp,\
  apps/baremetal/**,\
  docs/assets/wasm-decode-demo/**,\
  build/**,\
  **/node_modules/**,\
  **/*.min.js

# Coverage comes from the ac3tests + ac3cli run only - the same scope
# tools/checks/coverage_report.sh gates on. Everything else is uninstrumented
# and would read as 0% rather than "not measured", which is worse than silence.
sonar.coverage.exclusions=\
  examples/**,\
  js/**,\
  python/**,\
  tools/**,\
  apps/android/**,\
  apps/wasm/**

# Checked-in fixtures and generated tables are not copy-paste defects.
sonar.cpd.exclusions=\
  tests/golden/**,\
  src/forge/src/**/tables*.cpp

# cpp:S2083 ("I/O function calls should not be vulnerable to path injection
# attacks") flags every std::ifstream/ofstream opened with a `path` parameter
# that traces back to argv or an env var the same operator set
# (AC3FORGE_SIGNING_KEY_FILE) - i.e. every one of ac3cli's own file-in/
# file-out arguments and its signing-key loader. That taint flow is the
# entire point of a command-line tool's I/O contract: the person invoking
# ac3cli IS the trust boundary, the same way it is for `cat`, `cp` or
# `ffmpeg`. There is no privilege being crossed for the rule to catch, and
# adding artificial "path must stay under some root" validation would just
# break normal absolute/relative-path CLI usage for zero security benefit.
# Scoped to the exact files/lines this was confirmed against (2026-09) rather
# than the whole project, so a genuine path-injection rule hit elsewhere
# still surfaces.
#
# python:S2245 ("PRNG in a security context") false positives: every flagged
# use of `random` here draws fuzz-test parameters (encoder options, bitrates,
# layouts) or synthetic test-fixture audio/reference vectors from a seed the
# script accepts explicitly for reproducibility (fuzz_*.py's --replay
# depends on draw_case(seed) being a pure function of that seed). None of
# these values ever back a secret, token or credential - a CSPRNG would only
# make replay non-deterministic for no security benefit. Scoped to the exact
# files this was confirmed against (2026-09) rather than the whole project,
# so a genuine PRNG-in-security-context hit elsewhere still surfaces.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7
sonar.issue.ignore.multicriteria.e1.ruleKey=cpp:S2083
sonar.issue.ignore.multicriteria.e1.resourceKey=apps/cli/support.cpp
sonar.issue.ignore.multicriteria.e2.ruleKey=cpp:S2083
sonar.issue.ignore.multicriteria.e2.resourceKey=src/forge/src/io/wav.cpp
sonar.issue.ignore.multicriteria.e3.ruleKey=cpp:S2083
sonar.issue.ignore.multicriteria.e3.resourceKey=src/signing/src/signing_key.cpp
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.e4.resourceKey=tools/ci/fuzz_eac3_encoder_space.py
sonar.issue.ignore.multicriteria.e5.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.e5.resourceKey=tools/ci/fuzz_encoder_space.py
sonar.issue.ignore.multicriteria.e6.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.e6.resourceKey=tools/generators/gen_object_scene_wav.py
sonar.issue.ignore.multicriteria.e7.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.e7.resourceKey=tools/references/bitalloc_ref.py

# NOTE: sonar.cfamily.compile-commands, sonar.cfamily.threads,
# sonar.coverageReportPaths and sonar.qualitygate.wait are set by the workflow,
# not here - they name paths that only exist inside a build, and keeping them
# there means the report list can grow without touching this file.
