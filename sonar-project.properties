# SonarCloud (SonarQube Cloud) project configuration, used by the nightly scan
# in .github/workflows/sonarcloud.yml. Organisation and project key as the
# project was actually onboarded (confirmed against SonarCloud's own API);
# note this org is NOT the one the sibling aqualink-automate repo analyses
# under, which is `iainchesworth` - the two are separate SonarCloud orgs.
sonar.organization=iainchesworthlabs
sonar.projectKey=iainchesworthlabs_ac3forge
sonar.projectName=ac3forge
sonar.sourceEncoding=UTF-8

# C and C++ files are analysed ONLY when they appear in the compile database
# the workflow passes via sonar.cfamily.compile-commands (the Linux
# config-linux-gcc-coverage build). The Kotlin, TypeScript/JS and Python trees
# need no build, so listing them here is enough.
sonar.sources=src,apps,examples,js,python,tools
sonar.tests=tests

# Trees that never enter a Linux compile database, so the C/C++ analyser would
# skip them with a warning anyway: the Qt GUI, the Windows-only demo app and
# ACX driver, and the NDK / Emscripten / bare-metal C++. Excluded explicitly to
# keep the scan log readable rather than to hide anything - each is built and
# tested by its own CI leg. Kotlin under apps/android IS analysed (it needs no
# compile database), which is why only that tree's cpp/ subdirectory is listed.
#
# docs/assets/wasm-decode-demo/ is a published copy of apps/wasm's demo, byte
# identical to its source - the same reasoning .github/codeql/codeql-config.yml
# gives for ignoring it there.
sonar.exclusions=\
  apps/gui/**,\
  apps/windows/**,\
  apps/android/app/src/main/cpp/**,\
  apps/wasm/**/*.cpp,\
  apps/baremetal/**,\
  docs/assets/wasm-decode-demo/**,\
  build/**,\
  **/node_modules/**,\
  **/*.min.js

# Coverage comes from the ac3tests + ac3cli run only - the same scope
# tools/checks/coverage_report.sh gates on. Everything else is uninstrumented
# and would read as 0% rather than "not measured", which is worse than silence.
sonar.coverage.exclusions=\
  examples/**,\
  js/**,\
  python/**,\
  tools/**,\
  apps/android/**,\
  apps/wasm/**

# Checked-in fixtures and generated tables are not copy-paste defects.
sonar.cpd.exclusions=\
  tests/golden/**,\
  src/forge/src/**/tables*.cpp

# cpp:S3624 ("classes should have regular copy and move semantics") false
# positives: every one of these classes already declares ALL FIVE special
# members explicitly (destructor, copy ctor, copy assignment, move ctor,
# move assignment - deleted or defaulted as appropriate), following this
# project's one deliberate Pimpl convention throughout (see FrameDecoder's
# own header comment: the moves are declared and defined out-of-line, in
# the .cpp where the forward-declared Impl is complete, rather than
# defaulted inline in the header, because a dllexport class generates
# every implicit special member regardless and the unique_ptr member
# already deletes the implicit copy). Confirmed individually for all 15
# files below by reading each class's actual declarations, not assumed
# from the first hit - this rule's C++ analyser appears not to resolve
# special members whose bodies live in a separate translation unit from
# their declaration, which is exactly this project's one Pimpl idiom used
# consistently in dozens of OTHER classes that this rule does not flag at
# all. apps/crucible/engine/engine.cpp's one hit was NOT this pattern (a
# local RAII guard with an implicit, un-declared copy constructor) and got
# a real code fix instead - not listed here.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15
sonar.issue.ignore.multicriteria.e1.ruleKey=cpp:S3624
sonar.issue.ignore.multicriteria.e1.resourceKey=src/forge/include/ac3/decoder/decoder.hpp
sonar.issue.ignore.multicriteria.e2.ruleKey=cpp:S3624
sonar.issue.ignore.multicriteria.e2.resourceKey=src/forge/include/ac3/encoder/eac3_frame.hpp
