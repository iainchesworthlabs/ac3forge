# SonarCloud (SonarQube Cloud) project configuration, used by the nightly scan
# in .github/workflows/sonarcloud.yml. Organisation and project key as the
# project was actually onboarded (confirmed against SonarCloud's own API);
# note this org is NOT the one the sibling aqualink-automate repo analyses
# under, which is `iainchesworth` - the two are separate SonarCloud orgs.
sonar.organization=iainchesworthlabs
sonar.projectKey=iainchesworthlabs_ac3forge
sonar.projectName=ac3forge
sonar.sourceEncoding=UTF-8

# C and C++ files are analysed ONLY when they appear in the compile database
# the workflow passes via sonar.cfamily.compile-commands (the Linux
# config-linux-gcc-coverage build). The Kotlin, TypeScript/JS and Python trees
# need no build, so listing them here is enough.
sonar.sources=src,apps,examples,js,python,tools
sonar.tests=tests

# Trees that never enter a Linux compile database, so the C/C++ analyser would
# skip them with a warning anyway: the Qt GUI, the Windows-only demo app and
# ACX driver, and the NDK / Emscripten / bare-metal C++. Excluded explicitly to
# keep the scan log readable rather than to hide anything - each is built and
# tested by its own CI leg. Kotlin under apps/android IS analysed (it needs no
# compile database), which is why only that tree's cpp/ subdirectory is listed.
#
# docs/assets/wasm-decode-demo/ is a published copy of apps/wasm's demo, byte
# identical to its source - the same reasoning .github/codeql/codeql-config.yml
# gives for ignoring it there.
sonar.exclusions=\
  apps/gui/**,\
  apps/windows/**,\
  apps/android/app/src/main/cpp/**,\
  apps/wasm/**/*.cpp,\
  apps/baremetal/**,\
  docs/assets/wasm-decode-demo/**,\
  build/**,\
  **/node_modules/**,\
  **/*.min.js

# Coverage comes from the ac3tests + ac3cli run only - the same scope
# tools/checks/coverage_report.sh gates on. Everything else is uninstrumented
# and would read as 0% rather than "not measured", which is worse than silence.
sonar.coverage.exclusions=\
  examples/**,\
  js/**,\
  python/**,\
  tools/**,\
  apps/android/**,\
  apps/wasm/**

# Checked-in fixtures and generated tables are not copy-paste defects.
sonar.cpd.exclusions=\
  tests/golden/**,\
  src/forge/src/**/tables*.cpp

# cpp:S2083 ("I/O function calls should not be vulnerable to path injection
# attacks") flags every std::ifstream/ofstream opened with a `path` parameter
# that traces back to argv or an env var the same operator set
# (AC3FORGE_SIGNING_KEY_FILE) - i.e. every one of ac3cli's own file-in/
# file-out arguments and its signing-key loader. That taint flow is the
# entire point of a command-line tool's I/O contract: the person invoking
# ac3cli IS the trust boundary, the same way it is for `cat`, `cp` or
# `ffmpeg`. There is no privilege being crossed for the rule to catch, and
# adding artificial "path must stay under some root" validation would just
# break normal absolute/relative-path CLI usage for zero security benefit.
# Scoped to the exact files/lines this was confirmed against (2026-09) rather
# than the whole project, so a genuine path-injection rule hit elsewhere
# still surfaces.
#
# Misc code-smell false positives, one rule/file pair per entry, each
# confirmed individually rather than assumed from the first hit:
#
# cpp:S5213 ("replace std::function with a template parameter"): each site
# is either a public std::function-typed API on a MPEGTS_EXPORT/MATROSKA_
# EXPORT/MP4_EXPORT/AC3FORGE_EXPORT class (a template cannot cross that
# boundary - the whole point of the per-platform-backend .cpp selection
# this project's audio layer uses) or an internal helper that receives an
# already-type-erased std::function from one, so templating it would erase
# nothing.
# cpp:S8379 ("make mutable field private"): both mutex fields are members
# of an opaque, forward-declared Impl struct reachable only from the
# owning class's own .cpp - there is no external caller for "private" to
# protect against.
# cpp:S936 ("add a parameter list or & to this function use"): every site
# is a bare function name passed as a non-type template argument
# (Owned<T, snd_pcm_hw_params_malloc, snd_pcm_hw_params_free>) - the
# function-to-pointer decay is implicit and required here; adding & or ()
# would not compile.
# python:S1244 (float equality): the buffer-untouched check compares
# against a value that was never written (exactly 0.0 by construction, no
# rounding possible), and the two DRC self-checks compare against unity
# gain at inputs chosen specifically because the arithmetic (ratios and
# products of powers of two) is exact under IEEE 754, not incidentally
# close.
# python:S3516 ("method always returns the same value"): eight are the
# `def main() -> int: ... return 0` CI-script idiom used throughout
# tools/ci/append_*.py and friends - each documents in its own module
# docstring why real failures are reported through a separate
# hard_regression GITHUB_OUTPUT rather than main()'s own return value
# ("commit first, fail the job after"). The ninth
# (parse_bed_dyn_obj_assignment) returns the same-named `objects` list at
# every return statement, but the list's CONTENTS differ per branch - the
# check only sees the repeated variable name.
# pythonsecurity:S2083 (path from user-controlled data):
# append_quality_history.py's path comes from --history-dir/--branch, the
# same CLI-is-the-trust-boundary pattern already resolved for its sibling
# append_*.py scripts elsewhere in this file.
# typescript:S2819 (verify postMessage origin): decoder-worker.ts's
# listener is a dedicated Worker's own `self` message target, not a
# Window - a Worker has no cross-origin postMessage exposure at all
# (only same-origin code holding the Worker reference can ever post to
# it), so there is no origin to usefully check.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17,e18,e19,e20,e21,e22,e23,e24
