# SonarCloud (SonarQube Cloud) project configuration, used by the nightly scan
# in .github/workflows/sonarcloud.yml. Organisation and project key as the
# project was actually onboarded (confirmed against SonarCloud's own API);
# note this org is NOT the one the sibling aqualink-automate repo analyses
# under, which is `iainchesworth` - the two are separate SonarCloud orgs.
sonar.organization=iainchesworthlabs
sonar.projectKey=iainchesworthlabs_ac3forge
sonar.projectName=ac3forge
sonar.sourceEncoding=UTF-8

# C and C++ files are analysed ONLY when they appear in the compile database
# the workflow passes via sonar.cfamily.compile-commands (the Linux
# config-linux-gcc-coverage build). The Kotlin, TypeScript/JS and Python trees
# need no build, so listing them here is enough.
sonar.sources=src,apps,examples,js,python,tools
sonar.tests=tests

# Trees that never enter a Linux compile database, so the C/C++ analyser would
# skip them with a warning anyway: the Qt GUI, the Windows-only demo app and
# ACX driver, and the NDK / Emscripten / bare-metal C++. Excluded explicitly to
# keep the scan log readable rather than to hide anything - each is built and
# tested by its own CI leg. Kotlin under apps/android IS analysed (it needs no
# compile database), which is why only that tree's cpp/ subdirectory is listed.
#
# docs/assets/wasm-decode-demo/ is a published copy of apps/wasm's demo, byte
# identical to its source - the same reasoning .github/codeql/codeql-config.yml
# gives for ignoring it there.
sonar.exclusions=\
  apps/gui/**,\
  apps/windows/**,\
  apps/android/app/src/main/cpp/**,\
  apps/wasm/**/*.cpp,\
  apps/baremetal/**,\
  docs/assets/wasm-decode-demo/**,\
  build/**,\
  **/node_modules/**,\
  **/*.min.js

# Coverage comes from the ac3tests + ac3cli run only - the same scope
# tools/checks/coverage_report.sh gates on. Everything else is uninstrumented
# and would read as 0% rather than "not measured", which is worse than silence.
sonar.coverage.exclusions=\
  examples/**,\
  js/**,\
  python/**,\
  tools/**,\
  apps/android/**,\
  apps/wasm/**

# Checked-in fixtures and generated tables are not copy-paste defects.
sonar.cpd.exclusions=\
  tests/golden/**,\
  src/forge/src/**/tables*.cpp

# cpp:S5025 ("replace new/delete with RAII") false positives: src/capi/**
# is this project's stable C ABI (extern "C", opaque handle types other
# languages bind against - see the Rust/Python bindings work) and every
# flagged new/delete here is one half of a _create()/_destroy() pair that
# hands a plain pointer across that boundary. A C caller cannot hold a
# std::unique_ptr, so this is the only correct shape for the API, not an
# oversight - RAII does not cross an extern "C" boundary.
# apps/crucible/engine/diagnostics.cpp's one hit is a deliberate Meyers-
# singleton leak (see the code comment there and its existing clang-tidy
# NOLINT, which SonarCloud does not honour) - a message logged during
# static destruction must never reach an already-destroyed log, so this
# object is intentionally never freed.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9
sonar.issue.ignore.multicriteria.e1.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.e1.resourceKey=src/capi/src/eac3.cpp
sonar.issue.ignore.multicriteria.e2.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.e2.resourceKey=src/capi/src/eac3_encoder.cpp
sonar.issue.ignore.multicriteria.e3.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.e3.resourceKey=src/capi/src/decoder.cpp
sonar.issue.ignore.multicriteria.e4.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.e4.resourceKey=src/capi/src/encoder.cpp
sonar.issue.ignore.multicriteria.e5.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.e5.resourceKey=src/capi/src/atmos.cpp
sonar.issue.ignore.multicriteria.e6.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.e6.resourceKey=src/capi/src/levels.cpp
sonar.issue.ignore.multicriteria.e7.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.e7.resourceKey=src/capi/src/loudness.cpp
sonar.issue.ignore.multicriteria.e8.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.e8.resourceKey=src/capi/src/scan.cpp
sonar.issue.ignore.multicriteria.e9.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.e9.resourceKey=apps/crucible/engine/diagnostics.cpp

# NOTE: sonar.cfamily.compile-commands, sonar.cfamily.threads,
# sonar.coverageReportPaths and sonar.qualitygate.wait are set by the workflow,
# not here - they name paths that only exist inside a build, and keeping them
# there means the report list can grow without touching this file.
